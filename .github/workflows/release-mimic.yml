name: Release Mimic (Electron)

# Builds the Raid Mimic (formerly Wolf Pack Mimic) desktop installer on a real Windows runner and
# attaches the .exe + latest.yml (electron-updater manifest for the stable
# `latest` channel) to a GitHub release. The release tag is auto-derived from
# apps/mimic/package.json's version field.
#
# FILE NAMES (the guild lead, 2026-10-21 rename): this build's installer is Raid-Mimic-Setup-<ver>.exe
# (apps/mimic/package.json build.nsis.artifactName). Releases cut before the rename keep their
# Wolf-Pack-Mimic-Setup-<ver>.exe names, and everything that FINDS a release by its installer
# (the bot announcer, /mimic, /mimic/beta, /admin/agents, /mimic/linux) accepts both. The globs
# below name only the new files because the build produces only those.
#
# TAG FORMAT — plain semver `v<version>` (e.g. v1.0.0, v1.1.0, or
# v1.1.0-rc.1 for prereleases). electron-updater on the stable channel picks
# up tags whose semver has no prerelease suffix. Older prerelease lines (e.g.
# the retired v0.x.y-mimic-beta.N) used the `mimic-beta` channel and a
# matching prerelease identifier on the version; that bridge was removed at
# 1.0.0 — beta installs won't auto-update across the channel switch.
#
# TRIGGERS:
#   1. Push to main that changes apps/mimic/package.json AND bumps the
#      version field → workflow runs, builds, and softprops creates a fresh
#      release tagged v<new_version> at the merge commit. Tag, release, and
#      assets all materialize in one pass — no human clicks.
#   2. Push to beta touching Mimic or the bundled agent → prerelease build.
#      The tag (and built app version) is v<version>-beta.N where N
#      AUTO-INCREMENTS across existing tags for that version (2026-07-08:
#      previously hardcoded beta.1, which forced a patch bump per iteration —
#      v1.6.3-beta.1, v1.6.4-beta.1… — instead of v1.6.x-beta.2/3/4). Keep
#      the version PLAIN on beta and parked at the line's target (e.g. 1.7.0
#      for the whole 1.7 beta cycle); every beta push then ships the next
#      -beta.N on the `beta` channel (beta.yml). Stable installs (latest.yml)
#      never see it. Graduation to stable = file-checkout to main where the
#      same plain version builds the plain tag.
#   3. Manual workflow_dispatch with a tag input — for retrying a failed
#      build, or rebuilding from a tag that was created some other way.
#   4. Push to alpha touching Mimic or the agent → the Mimic 3.0 ALPHA (the
#      guild lead, 2026-09-29: "can we make an alpha channel for 3.0 testing as
#      well?"). The built version is <park>-alpha.<run number> (park the
#      alpha branch at 3.0.0), and every build REPLACES the files of ONE
#      rolling release, tag `mimic-alpha`. Alpha installs read its alpha.yml
#      from that fixed address (apps/mimic/main.js _ALPHA_FEED), never from the
#      release feed: the feed lists only the newest 10 releases and a day of
#      beta pushes would scroll an alpha out of it (the 2026-07-30 Linux
#      lesson). One release, replaced in place, also never crowds the feed.
on:
  push:
    branches: [main, beta, alpha]
    # Mimic bundles the agent, so agent-only fixes must also cut a beta
    # build. On main, pushes that don't change the version still no-op in
    # the resolve step below.
    paths:    ['apps/mimic/**', 'packages/wolfpack-logsync/**', 'web/local/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0, or v1.0.0-beta.1 for prerelease)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    # Alpha builds replace one release's files, so two must never interleave;
    # every other run keeps its own group (unchanged behaviour).
    concurrency: ${{ github.ref_name == 'alpha' && 'release-mimic-alpha' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Need previous commit so we can diff the package.json version and
          # decide whether this is a real bump vs an unrelated change.
          fetch-depth: 2

      - name: Resolve tag (auto-bump or manual)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # A dispatch on the alpha branch (sync-alpha.yml starts one when beta brought
          # Mimic or agent changes) takes the alpha path below, whatever the tag input says.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "alpha" ]; then
            tag="${{ inputs.tag }}"
            echo "Manual dispatch: tag=$tag"
            echo "name=$tag"  >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto-bump path. Compare versions HEAD~1 vs HEAD; only build if
          # the version actually changed (skips dependency-only edits etc).
          new_version=$(jq -r .version apps/mimic/package.json)
          prev_version=$(git show HEAD~1:apps/mimic/package.json 2>/dev/null \
                          | jq -r .version 2>/dev/null || echo "")
          # ALPHA BRANCH (trigger 4): <park>-alpha.<run number>, published to
          # the rolling `mimic-alpha` release by the alpha steps below.
          if [ "${{ github.ref_name }}" = "alpha" ]; then
            v="${new_version%%-*}-alpha.${{ github.run_number }}"
            echo "Alpha branch → v$v on the rolling mimic-alpha release"
            echo "name=v$v"   >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "alpha=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Plain semver tag (v-prefixed) so electron-updater can parse the
          # prerelease channel. NOT `mimic-v…` — that breaks the updater.
          tag="v$new_version"
          # BETA BRANCH GUARD (2026-07-06): a push to `beta` must NEVER cut a
          # stable release. The whole 1.4.0–1.4.9 line was meant to be beta but
          # shipped stable — plain versions produced plain tags, prerelease was
          # derived from the tag's `-` suffix, so every stable install
          # auto-updated to beta builds via latest.yml. If the version in
          # package.json carries no prerelease suffix, force one here so
          # electron-builder emits beta.yml (beta channel) and the GitHub
          # release is flagged prerelease. Keep versions PLAIN on the beta
          # branch — graduation to stable is then just a file-checkout to main,
          # where the same version builds the plain stable tag.
          #
          # beta.N AUTO-INCREMENT (2026-07-08): the suffix used to be a
          # hardcoded beta.1, which forced a patch bump for every beta
          # iteration. Now: find the highest existing v<version>-beta.N tag
          # and use N+1, so iterating on one version ships beta.2, beta.3, …
          if [ "${{ github.ref_name }}" = "beta" ] && [[ "$new_version" != *-* ]]; then
            last=$(git ls-remote --tags origin "refs/tags/v${new_version}-beta.*" \
                     | grep -v '\^{}' \
                     | sed -E 's/.*-beta\.([0-9]+)$/\1/' \
                     | grep -E '^[0-9]+$' \
                     | sort -n | tail -1 || true)
            next=$(( ${last:-0} + 1 ))
            tag="v${new_version}-beta.${next}"
            echo "Beta branch → prerelease tag: $tag (previous beta.N: ${last:-none})"
          fi
          echo "Detected: new=$new_version prev=$prev_version tag=$tag"

          if [ -z "$new_version" ] || [ "$new_version" = "null" ]; then
            echo "No version in package.json — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # NOTE (2026-08-19): a "version unchanged vs HEAD~1 → skip" check
          # lived here and silently no-opped the smoOOTH SCAlers stable cut:
          # the graduation push carried TWO commits (version bump + docs), so
          # HEAD~1 vs HEAD both read the new version and the run "succeeded"
          # without releasing anything. The tag-existence guard below is the
          # real idempotency — version already tagged → skip; version without
          # a tag → build, no matter which commit of the push bumped it.
          # Idempotency: if the tag already exists on the remote, the
          # release was already cut. Don't rebuild on top.
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists on remote — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "name=$tag"  >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

      # Pin the built version to the tag (minus the leading `v`) whenever they
      # differ — covers BOTH manual dispatch with an explicit tag AND the beta
      # branch guard above (which suffixes the tag without touching the
      # committed package.json). electron-builder derives the update channel
      # from the version's prerelease identifier, so pinning 1.5.0-beta.1 is
      # what makes it emit beta.yml instead of latest.yml.
      - name: Pin built version to tag (beta/manual builds)
        if: steps.tag.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.tag.outputs.name }}"; v="${v#v}"
          cur=$(jq -r .version apps/mimic/package.json)
          if [ "$v" = "$cur" ]; then
            echo "Version already matches tag ($v) — no pin needed."
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg v "$v" '.version=$v' apps/mimic/package.json > "$tmp"
          mv "$tmp" apps/mimic/package.json
          echo "Pinned apps/mimic/package.json version $cur → $v"

      - uses: actions/setup-node@v5
        if: steps.tag.outputs.build == 'true'
        with:
          node-version: 20

      - name: Install + stage agent
        if: steps.tag.outputs.build == 'true'
        working-directory: apps/mimic
        run: npm install
        # postinstall (scripts/stage-agent.js) copies the agent into
        # apps/mimic/staged-agent so electron-builder's extraResources bundles it.

      # The local site (the guild lead, 2026-10-21): the website's own pages, exported static from web/local and
      # bundled as resources/local-site (apps/mimic extraResources reads web/local/out). It is built HERE, before
      # electron-builder, and the check below fails the release if the export is missing: electron-builder
      # only warns about an extraResources source that does not exist, and a Mimic with a dead "On this PC"
      # rail item is worse than a red build. web/ itself is not installed in this job, which web/local's
      # next.config.js and tsconfig are written for.
      - name: Build the local site (web/local)
        if: steps.tag.outputs.build == 'true'
        working-directory: web/local
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx next build
          test -f out/inventory/index.html || { echo "::error::web/local did not export out/inventory/index.html"; exit 1; }
          test -f out/replay/index.html || { echo "::error::web/local did not export out/replay/index.html"; exit 1; }
          test -f out/parses/index.html || { echo "::error::web/local did not export out/parses/index.html"; exit 1; }

      # ── Code signing (Azure Artifact Signing) — OFF until the account exists ──
      # docs/code-signing.md "Turning it on". The signing itself happens INSIDE the build:
      # apps/mimic/package.json build.win.sign points at scripts/azure-sign.cjs, which electron-builder
      # calls for the app exe, the installer and the uninstaller, and which does nothing unless all six
      # AZURE_* settings are present. Because electron-builder signs first and only then hashes the
      # installer for latest.yml / beta.yml and the blockmap, the update manifests already match the
      # SIGNED file (the verify step below checks it); the old patch-latest-yml.js repair is not needed.
      # Secrets absent -> `configured` is false -> every signing step below is skipped and the build is
      # the unsigned build it has always been. Secrets present -> a build that cannot sign FAILS.
      - name: Detect signing configuration
        id: sign
        if: steps.tag.outputs.build == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT:  ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE:     ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          set -euo pipefail
          set_count=0; total=0
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            total=$((total + 1))
            if [ -n "${!v:-}" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq "$total" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Code signing: configured — this build will be signed and verified."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$set_count" -gt 0 ]; then
              echo "::warning::Code signing is only partly configured ($set_count of $total AZURE_* settings) — building UNSIGNED. See docs/code-signing.md."
            else
              echo "Code signing: not configured — unsigned build."
            fi
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.tag.outputs.build == 'true' && steps.sign.outputs.configured == 'true'
        with:
          dotnet-version: 8.0.x

      # SignTool + the Artifact Signing dlib, as Microsoft documents them
      # (https://learn.microsoft.com/en-us/azure/artifact-signing/how-to-signing-integrations):
      # SDK Build Tools (SignTool >= 10.0.2261.755) and Microsoft.ArtifactSigning.Client from NuGet.
      - name: Install signing tools
        if: steps.tag.outputs.build == 'true' && steps.sign.outputs.configured == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'azsign'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile .\nuget.exe
          .\nuget.exe install Microsoft.Windows.SDK.BuildTools -x -NonInteractive
          .\nuget.exe install Microsoft.ArtifactSigning.Client -x -NonInteractive
          Pop-Location
          $signtool = Get-ChildItem -Path (Join-Path $dir 'Microsoft.Windows.SDK.BuildTools') -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Select-Object -First 1
          $dlib = Get-ChildItem -Path (Join-Path $dir 'Microsoft.ArtifactSigning.Client') -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\Azure\.CodeSigning\.Dlib\.dll$' } | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe not found in Microsoft.Windows.SDK.BuildTools' }
          if (-not $dlib)     { throw 'x64 Azure.CodeSigning.Dlib.dll not found in Microsoft.ArtifactSigning.Client' }
          "AZURE_SIGNTOOL_PATH=$($signtool.FullName)"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_SIGNING_DLIB_PATH=$($dlib.FullName)"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "dlib:     $($dlib.FullName)"

      - name: Build Windows installer
        if: steps.tag.outputs.build == 'true'
        working-directory: apps/mimic
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Handed to the build ONLY when signing is fully configured; otherwise empty, and
          # scripts/azure-sign.cjs treats empty as "not configured".
          AZURE_TENANT_ID:        ${{ steps.sign.outputs.configured == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID:        ${{ steps.sign.outputs.configured == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET:    ${{ steps.sign.outputs.configured == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ steps.sign.outputs.configured == 'true' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT:  ${{ steps.sign.outputs.configured == 'true' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE:     ${{ steps.sign.outputs.configured == 'true' && vars.AZURE_CERT_PROFILE || '' }}

      # Runs ONLY when signing was configured: a configured-but-unsigned installer fails the build
      # (so nothing unsigned is published by mistake), and the update manifests are checked against
      # the SIGNED installer's hash. Also exposes the signer's name for the release body.
      - name: Verify Authenticode signature + update manifests
        id: verify
        if: steps.tag.outputs.build == 'true' && steps.sign.outputs.configured == 'true'
        shell: pwsh
        working-directory: apps/mimic/dist
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Filter 'Raid-Mimic-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "expected exactly one Raid-Mimic-Setup-*.exe in dist, found $($installers.Count)" }
          $installer = $installers[0]
          $targets = @($installer.FullName)
          $appExe = Join-Path 'win-unpacked' 'Raid Mimic.exe'
          if (Test-Path -LiteralPath $appExe) { $targets += (Resolve-Path -LiteralPath $appExe).Path }
          $publisher = ''
          foreach ($t in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $t
            if ($sig.Status -ne 'Valid') {
              throw "Code signing was configured but $([IO.Path]::GetFileName($t)) is not validly signed (status: $($sig.Status))"
            }
            $publisher = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            Write-Host "$([IO.Path]::GetFileName($t)): Valid, signed by $publisher"
          }
          # electron-updater rejects an update whose hash differs from the manifest's.
          $b64 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($installer.FullName)))
          $ymls = @(Get-ChildItem -Filter '*.yml')
          if ($ymls.Count -eq 0) { throw 'no update manifest (*.yml) in dist' }
          foreach ($y in $ymls) {
            $m = Select-String -LiteralPath $y.FullName -Pattern '^sha512:\s*(\S+)\s*$' | Select-Object -First 1
            if (-not $m) { continue }
            if ($m.Matches[0].Groups[1].Value -ne $b64) {
              throw "$($y.Name) sha512 does not match the signed installer - auto-update would reject it"
            }
            Write-Host "$($y.Name): sha512 matches the signed installer"
          }
          "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Release notes = WHAT CHANGED, not boilerplate. The release commit's
      # message already describes the change (stable graduations list the
      # highlights; a beta push names its one fix), so we lead with that, strip
      # git trailers, and demote the install/SmartScreen note below a rule. This
      # is what the #mimic-releases announcer surfaces (it shows the part above
      # the ---), so a raider sees "finishing-blow fix, Set up for me, …" instead
      # of "Electron desktop client, bundles Node runtime" (a member, 2026-07-14).
      - name: Build release notes
        id: notes
        if: steps.tag.outputs.build == 'true'
        shell: bash
        env:
          # "signed by" only when the verify step ran and passed; the name goes through env, never
          # interpolated into the script.
          SIGNED_BY: ${{ steps.sign.outputs.configured == 'true' && steps.verify.outputs.publisher || '' }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s HEAD)
          fullbody=$(git log -1 --pretty=%b HEAD)
          # PLAYER-FACING NOTES FIRST. Raiders read these — they want gameplay
          # impact, not engineering. If the version-bump commit provides a plain-
          # language block between <!--player-notes--> and <!--/player-notes-->
          # markers, use ONLY that as the release body. Otherwise fall back to the
          # technical commit body (older/beta commits, or any that forget the
          # block, still get notes). The #mimic-releases announcer shows the part
          # above the --- either way.
          notes=$(printf '%s\n' "$fullbody" | sed -n '/<!--[[:space:]]*player-notes[[:space:]]*-->/,/<!--[[:space:]]*\/player-notes[[:space:]]*-->/p' | sed '1d;$d')
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            header=''
            body="$notes"
          else
            # Body minus git trailers (Co-Authored-By / Claude-Session / Signed-off-by).
            header="**$subject**"
            body=$(printf '%s\n' "$fullbody" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' || true)
          fi
          # Trim leading + trailing blank lines (pure awk — no `tac`, which the
          # Windows runner's Git Bash may not ship).
          body=$(printf '%s\n' "$body" | awk '
            { lines[NR]=$0 }
            END {
              s=1; while (s<=NR && lines[s] ~ /^[[:space:]]*$/) s++
              e=NR; while (e>=s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i=s;i<=e;i++) print lines[i]
            }')
          {
            if [ -n "$header" ]; then printf '%s\n' "$header"; fi
            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              if [ -n "$header" ]; then printf '\n'; fi
              printf '%s\n' "$body"
            fi
            printf '\n---\n'
            if [ -n "$SIGNED_BY" ]; then
              printf 'Windows installer — code-signed by %s. Bundles its own Node runtime; auto-updates in place via electron-updater, no re-download.\n' "$SIGNED_BY"
            else
              printf 'Windows installer — not code-signed (SmartScreen → More info → Run anyway). Bundles its own Node runtime; auto-updates in place via electron-updater, no re-download.\n'
            fi
          } > "$GITHUB_WORKSPACE/release-notes.md"
          echo "----- release-notes.md -----"; cat "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish release with installer
        if: steps.tag.outputs.build == 'true' && steps.tag.outputs.alpha != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ steps.tag.outputs.name }}
          name:             ${{ steps.tag.outputs.name }}
          # Flag the release as prerelease IFF the tag carries a prerelease
          # suffix (e.g. v1.1.0-beta.3). Plain semver (v1.0.0, v1.1.0) ships
          # as stable. Mimic graduated out of beta at 1.0.0; older betas used
          # the v0.x.y-mimic-beta.N channel which no longer auto-updates.
          prerelease:       ${{ contains(steps.tag.outputs.name, '-') }}
          # softprops creates the tag at this commit if it doesn't exist —
          # that's how the auto-bump path materializes the tag without us
          # needing tag-push permissions in the sandbox.
          target_commitish: ${{ github.sha }}
          body_path:        ${{ github.workspace }}/release-notes.md
          files: |
            apps/mimic/dist/Raid-Mimic-Setup-*.exe
            apps/mimic/dist/Raid-Mimic-*.zip
            apps/mimic/dist/*.yml
            apps/mimic/dist/*.blockmap

      # ── Alpha (trigger 4): replace the rolling release's files in place ──
      # New files go up FIRST and the previous build's are removed only after
      # (the last step). It used to be the other way round: on 2026-10-08 the
      # tag push below hit a network reset after the old files were deleted,
      # the job stopped, and the release was left with no alpha.yml, so every
      # alpha install failed with "Cannot find channel alpha.yml" (the guild
      # lead: "it looks like joining alpha is broken"). The tag push now
      # retries; whatever fails, the previous build stays downloadable.
      # The tag moves to this build's commit so the release page says what it is.
      - name: Alpha — move the tag
        if: steps.tag.outputs.build == 'true' && steps.tag.outputs.alpha == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag -f mimic-alpha "${{ github.sha }}"
          ok=0
          for wait in 2 4 8 16 0; do
            if git push -f origin refs/tags/mimic-alpha; then ok=1; break; fi
            [ "$wait" -gt 0 ] && { echo "tag push failed, retrying in ${wait}s"; sleep "$wait"; }
          done
          [ "$ok" = 1 ] || { echo "tag push failed 5 times"; exit 1; }
          # electron-builder writes only latest.yml under the github publish
          # provider, whatever the version says (the beta releases carry only
          # latest.yml too; beta installs fall back to it). An alpha install
          # reads alpha.yml from a fixed address with no fallback, so name it.
          cp apps/mimic/dist/latest.yml apps/mimic/dist/alpha.yml

      - name: Alpha — publish to the rolling release
        if: steps.tag.outputs.build == 'true' && steps.tag.outputs.alpha == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   mimic-alpha
          name:       Mimic 3.0 alpha — ${{ steps.tag.outputs.name }}
          # Prerelease, and not semver: stable installs (/releases/latest) and
          # beta installs (which skip tags that are not semver) never see it,
          # and the bot and site only count -beta.N tags as the beta.
          prerelease: true
          body_path:  ${{ github.workspace }}/release-notes.md
          files: |
            apps/mimic/dist/Raid-Mimic-Setup-*.exe
            apps/mimic/dist/alpha.yml
            apps/mimic/dist/*.blockmap

      # Only now that this build's files are up: drop every file that is not one
      # of them (the previous build's installer and blockmap). alpha.yml has the
      # same name each build, so the upload above already replaced it.
      - name: Alpha — drop the previous build's files
        if: steps.tag.outputs.build == 'true' && steps.tag.outputs.alpha == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep=" $( (cd apps/mimic/dist && ls -1 Raid-Mimic-Setup-*.exe alpha.yml *.blockmap 2>/dev/null || true) | tr "\n" " ") "
          echo "keeping:$keep"
          # Never empty the release: without this build's alpha.yml in hand, delete nothing.
          case "$keep" in *" alpha.yml "*) ;; *) echo "alpha.yml not found locally; leaving every file in place"; exit 0;; esac
          for a in $(gh release view mimic-alpha --json assets --jq '.assets[].name'); do
            case "$keep" in *" $a "*) ;; *) gh release delete-asset mimic-alpha "$a" -y || echo "could not delete $a (left in place)";; esac
          done
