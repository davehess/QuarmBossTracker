name: Sync beta from main

# RULE (Hitya, 2026-08-10): when main gets something, beta gets it too.
#
# Why this is a workflow and not a habit. `beta` is supposed to be `main` + the
# Mimic park, but nothing ever pushed main→beta, so beta only ever aged. It
# reached 79,199 lines behind once. Re-syncing by hand at each graduation does
# NOT fix that — a re-sync is a snapshot, not a link: the 2026-08-09 re-sync
# landed at 02:05 UTC and main took 50 more commits over the next day and a half
# (main runs 12-42 commits/day, because bot, web and docs all land there). By the
# next graduation beta was already 7,714 deletions behind, including three test
# files and a whole /about page. That drift is what makes a beta→main branch
# merge permanently unsafe and forces every graduation to be a hand-picked file
# list — and picking wrong is silent.
#
# So: every push to main is merged into beta automatically, within a minute.
#
# ⚠ This file must live on `main` — GitHub runs the workflow from the branch
# being pushed, and a workflow that merely DECLARES a branch is not a workflow
# that runs on it (that gap cost a P0 on 2026-08-04).
#
# ⚠ The push below uses GITHUB_TOKEN, and pushes made with it deliberately do
# NOT trigger `on: push` workflows. Two consequences, both currently what we
# want: no spurious `-beta.N` prerelease when a graduation syncs the agent/Mimic
# paths back to beta (the release feed is capped at 10 entries and filling it
# once broke beta updates fleet-wide), and no duplicate CI for content that
# already went green on main. The next REAL beta push runs the full suite.
# If anyone swaps this for a PAT to get CI on beta, add a `[sync]` guard to
# release-mimic.yml at the same time or every sync will cut a prerelease.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise: two main pushes in quick succession must not race to update beta.
concurrency:
  group: sync-beta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge main into beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main beta
          git checkout -B beta origin/beta

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "beta already contains main — nothing to do."
            exit 0
          fi

          # These two are DELIBERATELY ahead on beta and must never be pulled
          # backwards by the sync:
          #   apps/mimic/package.json          — the beta park, one patch above
          #     the current stable. A park at or below stable would tag
          #     prereleases that semver-sort BELOW it and the updater would stop
          #     offering betas entirely.
          #   packages/wolfpack-logsync/...    — the in-flight agent version.
          PARK_FILES="apps/mimic/package.json packages/wolfpack-logsync/package.json"

          if git merge --no-edit -m "sync: main -> beta [sync]" origin/main; then
            echo "clean merge"
          else
            # Only the park files may conflict. Anything else means main and beta
            # genuinely diverged on shared code, which a human has to look at —
            # silently resolving that is how you lose work.
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "conflicts:"; echo "$conflicts"
            for f in $conflicts; do
              case " $PARK_FILES " in
                *" $f "*) ;;
                *)
                  echo "::error::Unexpected conflict in $f — main and beta have diverged on shared code. Resolve by hand; not auto-merging."
                  git merge --abort
                  exit 1
                  ;;
              esac
            done
            # Every conflict was a park file: keep BETA's side.
            for f in $conflicts; do
              git checkout --ours -- "$f"
              git add -- "$f"
              echo "kept beta's $f"
            done
            git commit --no-edit -m "sync: main -> beta [sync] (kept beta's park)"
          fi

          git push origin beta
          echo "beta synced to $(git rev-parse --short origin/main)"
