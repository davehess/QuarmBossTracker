<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>buffqueue</title>
<style>
  /* Buff Queue overlay — same data the web /raid page shows in its two-column
     queue (buff queue + debuff/cure queue), pinned in-game so a buffer can
     work the list without alt-tabbing. Polls localhost:<port>/api/buff-queue
     which the agent proxies from the bot with a 3s TTL. */
  /* --bg-alpha: card-surface alpha, driven by slider via main → preload
     'bg-alpha' IPC. 1.0 = opaque (EQ hidden); text stays bright at every value. */
  :root{ --bg-alpha:0.55; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;user-select:none;}
  /* Long queues: the window height clamps to the work area (auto-height),
     so anything beyond scrolls inside the overlay instead of clipping.
     Thin scrollbar so it doesn't read as a browser widget. */
  #wrap{padding:6px 8px;max-height:100vh;overflow-y:auto;overflow-x:hidden;}
  #wrap::-webkit-scrollbar{width:6px}
  #wrap::-webkit-scrollbar-thumb{background:rgba(110,118,129,0.5);border-radius:3px}
  .title{display:flex;align-items:center;gap:6px;
    font-size:12px;color:#79c0ff;text-shadow:0 1px 2px #000;margin-bottom:5px;}
  .title .conn{font-size:11px}
  .conn.ok{color:#56d364} .conn.bad{color:#8b949e}
  /* margin-right reserves a gutter so the class picker doesn't sit UNDER the
     ✕ hide button (top:6/right:6, 18px wide) — selecting a class from the
     dropdown lands the cursor right next to ✕, and one stray click hides
     the whole overlay. 30px = X width + breathing room. */
  .clsPick{margin-left:auto;margin-right:30px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;
    border-radius:3px;font-size:10px;padding:1px 4px;font-family:inherit;cursor:pointer;}
  .clsPick:focus{outline:1px solid #58a6ff}
  /* By buff | By group switch (the guild lead, 2026-10-04: "we should be grouping people for
     buffs ... treat that like the buff queue as well"). Its own row under the title: the title
     row is already full at the default 330px width. The right margin keeps it clear of the ✕
     gutter like the picker above. Selected state is the same blue as the picker's focus ring. */
  .vsw{display:flex;gap:3px;margin:0 30px 4px 0}
  .vbtn{background:#0d1117;color:#8b949e;border:1px solid #30363d;border-radius:3px;
    font-size:10px;line-height:1.2;padding:1px 6px;font-family:inherit;cursor:pointer}
  .vbtn:hover{color:#c9d1d9}
  .vbtn:focus-visible{outline:1px solid #58a6ff}
  .vbtn.on{background:rgba(88,166,255,0.15);border-color:#58a6ff;color:#79c0ff}
  /* Two stacked sections — buff queue on top, debuff queue below. Each section
     has its own header chip and row list. */
  .sec{margin-bottom:6px}
  .sec .hdr{font-size:9px;color:#8b949e;letter-spacing:0.06em;text-transform:uppercase;
    margin-bottom:2px;display:flex;align-items:baseline;gap:5px}
  .sec.buffs .hdr .lab{color:#7ee787}
  .sec.debuffs .hdr .lab{color:#f87171}
  .sec.burst .hdr .lab{color:#f0b429}
  /* Burst queue (Feral Avatar / Savagery) — amber/gold border on each row so
     it reads as "the burst-buff target list" without colliding with buff
     severity tiers. */
  .row.burst{border-left-color:#f0b429;background:rgb(40 28 8 / var(--bg-alpha))}
  .row.burst .miss{color:#fde68a;font-variant-numeric:tabular-nums}
  .sec .hdr .ct{color:#6e7681;font-variant-numeric:tabular-nums}
  .sec .hdr .hint{color:#6e7681;font-size:9px;text-transform:none;letter-spacing:0;font-style:italic}
  .row{position:relative;display:flex;align-items:baseline;gap:5px;padding:2px 5px;
    background:rgb(8 5 16 / var(--bg-alpha));border-radius:3px;border-left:3px solid #58a6ff;
    text-shadow:0 1px 2px #000;font-size:10px;margin-bottom:2px}
  .row.r{border-left-color:#f85149}
  .row.o{border-left-color:#f0883e}
  .row.y{border-left-color:#d4a72c}
  .row.d{border-left-color:#f87171;background:rgb(40 12 12 / var(--bg-alpha))}
  .row .nm{color:#e6edf3;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .row .grp{color:#6e7681;font-variant-numeric:tabular-nums}
  .row .cls{color:#9aa4ad;font-size:9px}
  /* State chips that ride between class and the right column — inferred,
     Avatar active, Celestial Tranquility, SK T. of Hate Recourse. Compact;
     tooltip carries the detail. */
  .row .chip{display:inline-flex;align-items:center;justify-content:center;
    height:14px;min-width:14px;padding:0 3px;border-radius:3px;font-size:10px;
    line-height:1;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#c9d1d9;cursor:help}
  .row .chip.inferred{background:rgba(88,166,255,0.15);border-color:rgba(88,166,255,0.4);color:#79c0ff}
  .row .chip.avatar  {background:rgba(240,180,41,0.18);border-color:rgba(240,180,41,0.5);color:#f0b429}
  .row .chip.ct      {background:rgba(126,231,135,0.15);border-color:rgba(126,231,135,0.4);color:#7ee787}
  .row .chip.rec     {background:rgba(248,113,113,0.18);border-color:rgba(248,113,113,0.5);color:#fca5a5}
  .row .chip.oor     {background:rgba(158,164,173,0.14);border-color:rgba(158,164,173,0.4);color:#9aa4ad}
  /* "Likely out of range" (#117): same-zone raider >~200u from the buffer.
     Dimmed, never removed — position is advisory (stale up to heartbeat). */
  .row.oor{opacity:0.5}
  /* "✓ cured" — manual raid-wide clear for INFERRED debuff chips (neither
     party on Mimic → nothing can observe the cure; the button is the human
     fallback). Subtle until hover so the chip stays readable. */
  .ch .chClear{background:none;border:1px solid rgba(126,231,135,0.4);color:#7ee787;
    border-radius:3px;font-size:9px;line-height:1;padding:0 3px;margin-left:3px;
    cursor:pointer;opacity:0.55;vertical-align:middle}
  .ch .chClear:hover{opacity:1;background:rgba(126,231,135,0.18)}
  /* Inferred rows dim slightly to differentiate from authoritative Mimic data. */
  /* Inferred rows scale to ~73% of the main surface alpha so they read as faded. */
  .row.inferred{background:rgb(8 5 16 / calc(var(--bg-alpha) * 0.73))}
  .row.inferred .nm{color:#c9d1d9}
  .row .miss{margin-left:auto;color:#c9d1d9;font-size:9px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:160px;text-align:right}
  .row.r .miss{color:#fca5a5}
  .row.o .miss{color:#fed7aa}
  .row.y .miss{color:#fde68a}
  /* Curse chip on debuff rows — name + remaining time. Red border so it reads
     as "needs cure". */
  .row .curse{margin-left:auto;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:170px}
  .row .curse .ch{padding:0 4px;border-radius:3px;border:1px solid rgba(248,113,113,0.45);
    background:rgba(248,113,113,0.15);color:#fca5a5;font-size:9px;line-height:1.4}
  .row .curse .ch .t{color:#fed7aa;font-variant-numeric:tabular-nums;margin-left:3px}
  /* "Carol casting Aego 2s" inline — sits underneath the row when a buffer is
     in-flight on that target, so a second cleric sees the queue is already
     covered and skips it. */
  .casting{font-size:9px;color:#79c0ff;padding:0 5px 1px;line-height:1.3;
    display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}
  .casting .who{color:#79c0ff;font-weight:600}
  .casting .sp{color:#c9d1d9}
  .casting .t{color:#6e7681;font-variant-numeric:tabular-nums}
  /* Raid groups. A group buff lands on the CASTER'S OWN group in this era, so a line reads
     "Haste ×4 → <caster in that group>: <spell>"; green = someone in the group can cast it,
     orange = nobody in the group can, so single-target it or move a caster. Static colours,
     no motion. .gline doubles as the cluster header inside a By-buff bucket. */
  .gblk{margin:3px 0 4px}
  .ghdr{display:flex;align-items:baseline;gap:5px;padding:2px 4px;font-size:10px;
    background:rgba(88,166,255,0.07);border-radius:3px;margin-bottom:2px}
  .ghdr .gl{color:#79c0ff;font-weight:600}
  .ghdr .gct{color:#6e7681;font-variant-numeric:tabular-nums}
  .ghdr .gme{color:#7ee787;font-size:9px}
  .gline{font-size:9px;color:#c9d1d9;padding:0 5px 1px;line-height:1.35;text-shadow:0 1px 2px #000}
  .gline .gl{color:#79c0ff;font-weight:600}
  .gline .gb{color:#e6edf3;font-weight:600}
  .gline .gcast{color:#7ee787}
  .gline .gno{color:#ffa657}
  .gmore{cursor:pointer;color:#6e7681;font-size:9px;padding:1px 5px}
  .gmore:hover{color:#c9d1d9}
  #empty{color:rgba(255,255,255,0.5);font-size:11px;text-shadow:0 1px 2px #000;padding:6px 4px;font-style:italic}
  /* Two or more raids at once: which one these queues are for. */
  .raids-note{font-size:10px;color:#8b949e;padding:1px 4px 3px;text-shadow:0 1px 2px #000}
  .raids-note .n{color:#ffa657}
  /* drag/lock/setup chrome — same pattern as the other overlays. */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(88,166,255,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(88,166,255,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(88,166,255,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#58a6ff;border-color:#58a6ff}
  body.setup #move-btn{top:30px}
  /* "Buffs feel laggy" reporter — sits inside the title bar. Quiet by default
     so it doesn't compete with the live queue; pulses green for 60s after a
     click to confirm snappy mode kicked in. */
  #lag-btn{font-size:9px;line-height:1;padding:2px 5px;border-radius:3px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.4);
    cursor:pointer;opacity:0.6;transition:opacity .12s,color .12s,border-color .12s;
    white-space:nowrap}
  #lag-btn:hover{opacity:1;color:#fde68a;border-color:#fde68a}
  #lag-btn.active{opacity:1;color:#86efac;border-color:#86efac;
    background:rgba(34,197,94,0.12)}
  /* ▭ Mini — option B "Two-column ledger" (the guild vote, 2026-09-17). These
     classes only exist in the mini markup, so full mode is untouched. ✨ buffs
     hold the left column and 🩸 cures the right, fixed, so a category is
     always in the same place. The label row is as tall as the ✥/✕ corner
     buttons, so no chip ever sits under one. The title row (class picker,
     lag?) hides in mini: the picked class still filters, and changing it is
     a full-mode job. */
  .mledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 8px}
  .mcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
  .mlab{height:22px;line-height:22px;font-size:9px;color:#6e7681;letter-spacing:0.06em;text-transform:uppercase}
  .mcol.mb .mlab{padding-left:22px}
  .mchip{display:inline-flex;align-items:center;gap:4px;max-width:100%;box-sizing:border-box;padding:0 6px;
    border:1px solid #30363d;border-radius:3px;background:rgba(255,255,255,0.04);color:#c9d1d9;
    font-family:inherit;font-size:10px;line-height:16px;white-space:nowrap;cursor:pointer;text-shadow:0 1px 2px #000}
  .mchip b{color:#fff}
  .mchip.cure{border-color:rgba(248,81,73,0.5)}
  .mchip.cure b{color:#fca5a5}
  .mchip.on{border-color:#a371f7;background:#2a1d3d;color:#d2a8ff}
  .mnone{color:#6e7681;font-size:10px}
  .mexp{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;padding:2px 0 2px 6px;
    border-left:1px solid #a371f7;font-size:10px;text-shadow:0 1px 2px #000}
  .mexp .grp{color:#6e7681;font-variant-numeric:tabular-nums}
  /* The busiest group on a buff line ("Haste 5 · G3×3"). Rides the shared .wp-mini-num rule (never
     shrinks) so the category name gives way first and the chip is no wider than its column. */
  .mchip .mtop{color:#6e7681;font-variant-numeric:tabular-nums}
  body.wp-mini #empty{padding:4px 24px}
  /* On the Timers canvas (the guild lead, 2026-10-03: "the margins around the actual data is too large"): the
     panel owns ✥ and ✕ — the preload hides this page's — so the window's padding and the 30px kept clear of ✕
     go (the lag? button's is inline, hence !important). */
  body.wp-in-canvas #wrap{padding:2px 3px}
  body.wp-in-canvas .clsPick{margin-right:0}
  body.wp-in-canvas #lag-btn{margin-right:0 !important}
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay">✥</button>
  <button id="hide-btn" title="Hide the buff queue (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 Buff queue</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="wrap">
    <div class="title wp-mini-hide">
      <span id="conn" class="conn bad">○</span>
      <span>🛡 Buff queue</span>
      <select id="clsPick" class="clsPick" title="The class you're buffing as. Auto follows whichever character you're logged in as; pick a class to override.">
        <option value="">Auto (my class)</option>
        <option>Cleric</option><option>Druid</option><option>Shaman</option>
        <option>Enchanter</option><option>Bard</option><option>Paladin</option>
        <option>Ranger</option><option>Beastlord</option><option>Magician</option>
      </select>
      <button id="lag-btn" style="margin-right:30px" title="Buff queue feeling stale? Click to log it AND switch to fast refresh for 60s.">lag?</button>
    </div>
    <div class="vsw wp-mini-hide">
      <button id="viewBuff" type="button" class="vbtn on" title="One list per buff line, people clustered by raid group">By buff</button>
      <button id="viewGroup" type="button" class="vbtn" title="One block per raid group: what it is missing, who in the group can cast it">By group</button>
    </div>
    <div id="body"></div>
    <div id="empty">no raid roster yet — start any Mimic in raid and the queue fills in within seconds</div>
  </div>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    // Stray-click guard — the class dropdown's native popup dismisses with a
    // click that frequently lands on ✕ ("buff queue keeps disappearing even
    // though I have it enabled"). A deliberate hide hovers the button first;
    // a drive-by click arrives with ~0ms of hover. Require 250ms on-button
    // before the click counts; a blocked click flashes the ✕ as the cue.
    var _hideHoverAt = 0;
    hideBtn.addEventListener('mouseenter', function(){ _hideHoverAt = Date.now(); try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    hideBtn.addEventListener('mouseleave', function(){ _hideHoverAt = 0; try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    hideBtn.addEventListener('click', function(){
      if (!_hideHoverAt || (Date.now() - _hideHoverAt) < 250) {
        hideBtn.style.opacity = '1'; hideBtn.style.borderColor = '#f87171'; hideBtn.style.color = '#f87171';
        setTimeout(function(){ hideBtn.style.opacity = ''; hideBtn.style.borderColor = ''; hideBtn.style.color = ''; }, 600);
        return;
      }
      try { window.mimic.hideThisOverlay(); } catch (e) {}
    });
  }

  // Manual drag — same workaround as the other overlays.
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) { try { window.mimic.overlayHoverInteractive(false); } catch (e) {} } });
    moveBtn.addEventListener('mousedown', _beginDrag);
    // Right-click ✥ → shared chrome menu (resize presets + Setup THIS/ALL).
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} try{window.mimic.overlayHoverInteractive(false);}catch(e){} } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  // Setup mode + opacity slider. _setupScope tracks 'this' (right-click → Setup
  // THIS overlay) vs 'all' (tray → Setup mode — place all overlays) so the Done
  // button routes to the right IPC; without scope tracking, Done is a no-op in
  // single-overlay mode because it calls setSetupMode(false) which exits the
  // GLOBAL flag — never set in single-overlay mode.
  var _overlayKey = null;
  var _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){
      _overlayKey = p && p.overlayKey;
      if (p && p.scope) _setupScope = p.scope;
      else if (p && p.active) _setupScope = 'all';
      document.body.classList.toggle('setup', !!(p && p.active));
    });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener("click", function(){ try { document.body.classList.remove("setup"); } catch (e) {} try { if (_setupScope === "this") window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  // Buffer class — persists per-overlay in localStorage so a relog comes back to
  // the same setting. The agent uses this to filter the buff queue.
  var clsPick = document.getElementById('clsPick');
  var bufferClass = '';
  try { bufferClass = localStorage.getItem('wp:bufferClass') || ''; } catch (e) {}
  if (clsPick) { clsPick.value = bufferClass; }
  // Hover-interact handshake — when LOCKED, mouse events normally pass through
  // to EQ. Flip interactive while the cursor is over the picker so the click
  // lands. Same pattern Mob Info's tabs use.
  if (clsPick) {
    clsPick.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    clsPick.addEventListener('mouseleave', function(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    clsPick.addEventListener('change', function(){
      bufferClass = clsPick.value || '';
      try { localStorage.setItem('wp:bufferClass', bufferClass); } catch (e) {}
      tick();    // refresh immediately so the user sees the new queue
    });
  }

  // By buff | By group (the guild lead, 2026-10-04). A per-viewer convenience, so localStorage;
  // absent or unreadable = By buff, which is what this overlay always was. Mini ignores it.
  var _view = 'buff';
  try { _view = localStorage.getItem('wp:bq:view') === 'group' ? 'group' : 'buff'; } catch (e) {}
  var viewBtns = { buff: document.getElementById('viewBuff'), group: document.getElementById('viewGroup') };
  function _paintView(){ Object.keys(viewBtns).forEach(function(k){ if (viewBtns[k]) viewBtns[k].classList.toggle('on', k === _view); }); }
  function setView(v){
    _view = v === 'group' ? 'group' : 'buff';
    try { localStorage.setItem('wp:bq:view', _view); } catch (e) {}
    _paintView();
    if (_lastPayload) render(_lastPayload);   // now, not on the next poll
  }
  Object.keys(viewBtns).forEach(function(k){
    var b = viewBtns[k]; if (!b) return;
    b.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });

  _paintView();
  // The logged-in character, lowercase ('' = unknown), for "my group first". Learned from /api/state's
  // activeCharacter, the way the other overlays learn it; see tick().
  var _selfName = '', _selfAt = 0;

  // "Buffs feel laggy" button. POST to local agent → drops the agent's
  // BUFF_QUEUE_TTL into 500ms-snappy mode for 60s AND forwards the click to
  // the bot for audit. The overlay's own 1.5s tick is unchanged — the cache
  // dropping is what makes ticks fetch fresh data.
  // Delegated "✓ cured" handling — the rows container is rebuilt every poll,
  // so bind ONCE on #body. mouseover/out delegation keeps the click-through
  // handshake honest for buttons that didn't exist at bind time.
  (function(){
    var bodyEl = document.getElementById('body');
    if (!bodyEl) return;
    bodyEl.addEventListener('mouseover', function(e){
      if (e.target && e.target.classList && e.target.classList.contains('chClear')) {

      // the clear can't re-add this chip and flash it back out.

      // Surgical removal: drop ONLY this chip — and the row if it was that row's
      // last curse — instead of letting the next poll rewrite the whole #body
      // (which resets scroll/hover and flashes). Everything else stays put.
      var chip = btn.closest('.ch');
      var row  = btn.closest('.row');
      if (chip) chip.remove();
      if (row) {
        var left = row.querySelectorAll('.curse .ch');
        if (!left.length) {
          var nextEl = row.nextElementSibling;
          if (nextEl && nextEl.classList && nextEl.classList.contains('casting')) nextEl.remove();

          }

      try {

      // this was already the last row, so no collapse-to-zero frame.
      _autoFit();
      // Preserve existing semantics — clear it raid-wide via the bot.
      fetch('http://127.0.0.1:'+PORT+'/api/debuff-clear', {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: target, spell_name: spell }),

    });
  })();

  var lagBtn = document.getElementById('lag-btn');
  if (lagBtn) {
    lagBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    lagBtn.addEventListener('mouseleave', function(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    var _lagActiveUntil = 0;
    lagBtn.addEventListener('click', function(){

        fetch('http://127.0.0.1:'+PORT+'/api/buff-lag-report', { method: 'POST', cache: 'no-store' })
          .catch(function(){});

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
  function fmtSecs(s){
    if (s == null || s < 0) return '?';
    if (s < 60) return Math.round(s) + 's';
    var m = Math.floor(s/60), r = Math.round(s%60);
    if (m < 60) return r ? m+'m'+r+'s' : m+'m';
    var h = Math.floor(m/60); m = m % 60;
    return m ? h+'h'+m+'m' : h+'h';
  }
  function tierClass(t){
    if (t === 'red')    return 'r';
    if (t === 'orange') return 'o';
    if (t === 'yellow') return 'y';
    return '';
  }
  // Casting tagline: "Carol · Aegolism · 2s" — uses ends_at_ms when present so
  // the countdown stays accurate without a re-fetch every second.
  function castingRow(casting){
    if (!casting || !casting.length) return '';
    var now = Date.now();
    var bits = [];
    for (var i = 0; i < casting.length; i++) {
      var c = casting[i]; if (!c || !c.caster || !c.spell) continue;
      var rem = (c.ends_at_ms != null) ? Math.max(0, (c.ends_at_ms - now) / 1000)
              : (c.remaining_secs != null ? c.remaining_secs : 0);
      bits.push('<span><span class="who">'+esc(c.caster)+'</span> <span class="sp">→ '+esc(c.spell)+'</span> <span class="t">'+fmtSecs(rem)+'</span></span>');
    }
    if (!bits.length) return '';
    return '<div class="casting"><span style="color:#6e7681">🔮</span>'+bits.join(' · ')+'</div>';
  }
  // Buff-state chips that ride on every row — gives the buffer info that
  // changes how they target:
  //   🔍 inferred   — buff state came from observed casts, not Zeal (no Mimic).
  //   🪶 Avatar     — already has Feral/Primal/proc Avatar (worn-atk hint).
  //   🦅 CT         — has Celestial Tranquility (+40 ATK; stacks with Avatar).
  //   ⚠ T.of Hate  — SK carrying T. of Hate Recourse (Savagery overwrites it).
  function stateChips(r){
    var bits = '';
    if (r.inferred)               bits += '<span class="chip inferred" title="Buffs inferred from observed casts — this raider isn\'t running Mimic">🔍</span>';
    if (r.out_of_range)           bits += '<span class="chip oor" title="Likely out of range — same zone but >~200 units away. Advisory only: position updates at heartbeat cadence, so move closer before relying on it.">📍</span>';
    if (r.avatar_buff)            bits += '<span class="chip avatar" title="'+esc(r.avatar_buff)+' is active">🪶</span>';
    if (r.celestial_tranquility)  bits += '<span class="chip ct" title="Celestial Tranquility (+40 ATK) is active — stacks with Avatar (not overwritten)">🦅</span>';
    if (r.sk_recourse)            bits += '<span class="chip rec" title="'+esc(r.sk_recourse)+' active — Savagery will overwrite">⚠</span>';
    if (r.skip_group_aego)        bits += '<span class="chip ct" title="'+esc(r.hp_a || 'POTG/POTC')+' fills HP slot A — single-target the Symbol, do NOT group-cast Aegolism over it">🌿</span>';
    return bits;
  }

  // Category → "spells you might have memmed" hint. recent_casts comes from
  // the agent's per-character rotation tracker; a spell cast this session is
  // almost certainly still on a gem. SLOT-AWARE — HP A only matches slot A
  // spells (Aego line + group HP+AC), HP B only matches the Symbol line,
  // HP C only matches the Shaman HP single-target line + Brell + Arch
  // Shielding. Without this, casting Symbol of Transal once made the queue
  // suggest it for HP A forever even after the user re-memmed Aegolism.
  // Specific labels (HP A/B/C) checked before the generic /^HP/ fallback.
  var CAT_HINTS = [
    [/^HP A$/, /aegolism|blessing of aegolism|ancient: gift of aegolism|temperance|protection of the (glades|cabbage)|talisman of wunshi|courage|center|daring|bravery|valor|resolution|heroism|heroic bond|fortitude|virtue|conviction/i],
    [/^HP B$/, /aegolism|blessing of aegolism|ancient: gift of aegolism|symbol of/i],
    [/^HP C$/, /khura|focus of spirit|talisman of (kragg|tnarg)|inner fire|brell|arch shielding/i],
    [/^HP$/,   /aegolism|temperance|symbol of|khura|focus of spirit|talisman of (kragg|tnarg|wunshi)|inner fire|protection of the (glades|cabbage)|brell|arch shielding|virtue|conviction|courage|daring|bravery|valor|resolution|heroism|heroic bond|fortitude/i],
    [/^HP Regen$/,      /regrowth|regenerat|chloroplast|replenish|elixir/i],
    [/^Mana$/,          /brilliance|iridescence/i],
    [/^Mana Regen$/,    /clarity|koadic|breeze|gift of (pure thought|insight)|clairvoyance/i],
    [/^Haste$/,         /haste|celerity|quickness|swift|alacrity|aanya|visions of grandeur|speed of/i],
    [/^Run Speed$/,     /spirit of (the )?wolf|flight of eagle|pack spirit|bihli/i],
    [/^Attack$/,        /avatar|ferocity|strength|might of|predator|bihli/i],
    [/^Dmg Shield$/,    /thorn|thistle|shield of|bramblecoat|legacy of/i],
    [/^Survival$/,      /divine aura|kazumi|bestowal of divinity|quivering veil/i],
    [/^Levitate$/,      /levitat|dead m[ae]n floating/i],
    [/^Resists$/,       /resist|endure|talisman of (epuration|jasinth|shadoo)|circle of seasons/i],
  ];
  function memmedHint(label, recentCasts){
    if (!recentCasts || !recentCasts.length) return null;
    for (var i = 0; i < CAT_HINTS.length; i++) {
      if (!CAT_HINTS[i][0].test(label)) continue;
      for (var j = 0; j < recentCasts.length; j++) {
        if (CAT_HINTS[i][1].test(recentCasts[j])) return recentCasts[j];
      }
    }
    return null;
  }

  // Collapsed category sections persist across polls + relaunches.
  var _collapsed = {};
  try { _collapsed = JSON.parse(localStorage.getItem('wp:bq:collapsed') || '{}') || {}; } catch (e) {}
  function _saveCollapsed(){ try { localStorage.setItem('wp:bq:collapsed', JSON.stringify(_collapsed)); } catch (e) {} }

  // Locally-dismissed debuff chips (#67) — keyed by "target|spell" (lowercased),
  // matching the /api/debuff-clear identity. Session-scoped, this client only.
  // Bridges the poll gap between the ✓ click and the bot processing the clear so
  // intermediate polls don't re-add-then-remove the chip (flash). Reconciled
  // against each payload: an id the server no longer reports is forgotten, so a
  // genuine re-land re-shows.
  var _dismissed = new Set();
  function _dkey(target, spell){ return (String(target || '') + '|' + String(spell || '')).toLowerCase(); }
  function reconcileDismissed(dq){
    if (!_dismissed.size) return;
    var present = new Set();
    for (var i = 0; i < dq.length; i++) {
      var cs = dq[i].curses || [];
      for (var j = 0; j < cs.length; j++) present.add(_dkey(dq[i].name, cs[j].name));
    }
    _dismissed.forEach(function(k){ if (!present.has(k)) _dismissed.delete(k); });
  }
  // Shallow row clone with the curse list narrowed to non-dismissed chips, so
  // renderRow stays untouched.
  function _rowVisibleCurses(r){
    var vis = (r.curses || []).filter(function(c){ return !_dismissed.has(_dkey(r.name, c.name)); });
    if (vis.length === (r.curses || []).length) return r;
    var o = {}; for (var k in r) o[k] = r[k]; o.curses = vis; return o;
  }

  // ── Raid groups (the guild lead, 2026-10-04: "we should be grouping people for buffs ... treat
  // that like the buff queue as well"). In this era a GROUP buff lands on the CASTER'S OWN group, so
  // the useful call-out is per group: who is missing a line, and who IN that group can cast it.
  // payload.groups comes from the bot (raid mode, a bot new enough to send it). An older bot sends
  // none, and the groups are derived from the queue rows instead: no casters, and no claim about them.
  // A raid group is 1-12; the roster's "no group" value is unverified, so null/0/negative/>12 all read
  // as ungrouped. Everything here is pure (the page's own state comes in as arguments) so a poll that
  // changed nothing renders the same bytes.
  function _grpNum(g){
    var n = (g == null || g === '') ? NaN : Number(g);
    return (n >= 1 && n <= 12 && n === Math.floor(n)) ? n : null;
  }
  function _grpLabel(g){ return g == null ? 'ungrouped' : 'G' + g; }
  // The buffer's own group first, then by number, ungrouped last.
  function _grpCmp(a, b, mine){
    var ra = a == null ? 2 : (a === mine ? 0 : 1), rb = b == null ? 2 : (b === mine ? 0 : 1);
    return (ra - rb) || ((a || 0) - (b || 0));
  }
  // The busiest numbered group among rows, for the mini chip ("Haste 5 · G3×3"); a tie goes to the
  // lower group. Ungrouped rows do not count.
  function _topGroup(rows){
    var n = {}, best = null;
    for (var i = 0; i < rows.length; i++) { var g = _grpNum(rows[i].group); if (g != null) n[g] = (n[g] || 0) + 1; }
    for (var k in n) {
      var g2 = Number(k);
      if (best == null || n[k] > best.n || (n[k] === best.n && g2 < best.group)) best = { group: g2, n: n[k] };
    }
    return best;
  }
  // Which class group-casts a line, mirrored from the bot's GROUP_SPELLS for the "no enchanter in G3"
  // text (a caster-less line carries no class of its own). Keys are the bot's line keys.
  var _GRP_CLS = { 'hp:A': 'cleric', 'hp:B': 'cleric', 'hp:C': 'shaman/paladin', haste: 'enchanter', manaRegen: 'enchanter',
                   runSpeed: 'druid/shaman', attack: 'ranger', ds: 'druid/magician', resists: 'druid/enchanter' };
  var _SEV = { red: 0, orange: 1, yellow: 2 };
  // A groups member carries name/class/missing/inferred; the queue row of the same raider adds the
  // severity tier, range flag and in-flight casts that renderRow draws.
  function _withQueueFields(m, q){
    var o = {}; for (var k in m) o[k] = m[k];
    if (q) { o.tier = q.tier; o.out_of_range = q.out_of_range; o.casting = q.casting; }
    return o;
  }
  // → { blocks: [{ group, size, rows, lines }], mine, derived }. `size` is the group's head count
  // (bot) or the people in the queue (derived); `rows` the people to draw; `lines` one per missing
  // buff line ({ key, label, missing: [names], casters: [{ name, class, spell }] } — no `casters`
  // when derived). `self` is the lowercase logged-in character or ''; `mine` is its group, or null.
  function _groupsFor(payload, self){
    var bq = (payload && payload.buff_queue) || [];
    var src = (payload && Array.isArray(payload.groups) && payload.groups.length) ? payload.groups : null;
    var blocks = [], mine = null, i, j;
    if (src) {
      // The bot names the requester's group itself (`self_group`, bot 3.1.195+); the name match below is
      // the fallback when it is missing.
      if (payload.self_group != null) mine = _grpNum(payload.self_group);
      var byName = {};
      for (i = 0; i < bq.length; i++) if (bq[i] && bq[i].name) byName[String(bq[i].name).toLowerCase()] = bq[i];
      for (i = 0; i < src.length; i++) {
        var g = src[i]; if (!g) continue;
        var gn = _grpNum(g.group), mem = g.members || [], rows = [];
        for (j = 0; j < mem.length; j++) {
          var m = mem[j]; if (!m || !m.name) continue;
          if (mine == null && self && String(m.name).toLowerCase() === self) mine = gn;
          if (m.missing && m.missing.length) rows.push(_withQueueFields(m, byName[String(m.name).toLowerCase()]));
        }
        rows.sort(function(a, b){ var x = _SEV[a.tier], y = _SEV[b.tier]; return (x == null ? 3 : x) - (y == null ? 3 : y); });
        var lines = g.lines || [];
        if (!rows.length && !lines.length) continue;       // nothing missing in this group
        blocks.push({ group: gn, size: mem.length, rows: rows, lines: lines });
      }
    } else {
      var ix = {}, lix = {};
      for (i = 0; i < bq.length; i++) {
        var r = bq[i]; if (!r || !r.name) continue;
        var rg = _grpNum(r.group), bk = rg == null ? 'n' : rg;
        var b = ix[bk];
        if (!b) { b = ix[bk] = { group: rg, size: 0, rows: [], lines: [] }; blocks.push(b); }
        b.size++; b.rows.push(r);
        if (self && String(r.name).toLowerCase() === self) mine = rg;
        var labels = (r.missing && r.missing.length) ? r.missing : ['Other'];
        for (j = 0; j < labels.length; j++) {
          var lk = bk + '|' + labels[j];
          var ln = lix[lk];
          if (!ln) { ln = lix[lk] = { label: labels[j], missing: [] }; b.lines.push(ln); }
          ln.missing.push(r.name);
        }
      }
      blocks.forEach(function(blk){ blk.lines.sort(function(a, b){ return b.missing.length - a.missing.length; }); });
    }
    blocks.sort(function(a, b){ return _grpCmp(a.group, b.group, mine); });
    return { blocks: blocks, mine: mine, derived: !src };
  }

  function renderRow(r, kind){
    var groupLbl = r.group != null ? ('G' + r.group) : '';
    var cls = kind === 'd' ? 'd' : kind === 'burst' ? 'burst' : tierClass(r.tier);
    if (r.inferred) cls += ' inferred';
    if (r.out_of_range) cls += ' oor';
    var line = '<div class="row '+cls+'">'
             +    '<span class="nm">'+esc(r.name)+'</span>'
             +    (groupLbl ? '<span class="grp">'+esc(groupLbl)+'</span>' : '')
             +    '<span class="cls">'+esc(r.class || '?')+'</span>'
             +    stateChips(r);
    if (kind === 'd') {
      var chips = '';
      for (var i = 0; i < r.curses.length; i++) {
        var c = r.curses[i];
        var t = (c.remaining_secs != null) ? '<span class="t">'+fmtSecs(c.remaining_secs)+'</span>' : '';
        // Zeal buff-window slot — slots 1-4 highlight green: a group member
        // can dispel without clipping many real buffs (matters most on
        // high-damage debuffs).
        var sl = '';
        if (c.slot != null) {
          sl = c.low_slot
            ? ' <span style="color:#7ee787" title="Buff slot '+c.slot+' — low slot; dispellable without clipping much">s'+c.slot+'✂</span>'
            : ' <span style="color:#8b949e" title="Buff slot '+c.slot+'">s'+c.slot+'</span>';
        }
        // Cure type from the catalog counters (bot v3.0.88+): tells the cure
        // caster WHICH cure to reach for. Counters ride in the tooltip.
        var cu = '';
        if (c.cure) {
          var cuCol = c.cure === 'poison' ? '#56d364' : c.cure === 'disease' ? '#d4a72c' : c.cure === 'blind' ? '#8b949e' : '#f0883e';
          cu = ' <span style="color:'+cuCol+'" title="Cure type: '+esc(c.cure)+(c.counters ? ' — '+c.counters+' counters' : '')+'">'+esc(c.cure)+'</span>';
        }
        // Being cured (bot v3.0.90+): a matching cure is in flight on this
        // target — show who + secs and dim/strike the chip so a second curer
        // skips it. The chip vanishes on its own the moment the cure lands.
        var cured = '';
        var chipStyle = '';
        if (c.being_cured) {
          chipStyle = 'opacity:0.5;text-decoration:line-through';
          cured = ' <span style="color:#7ee787;text-decoration:none" title="'+esc(c.cured_by||'someone')+' is curing this — skip it">✓ '+esc(c.cured_by||'curing')+(c.cure_secs ? ' '+c.cure_secs+'s' : '')+'</span>';
        }
        // Manual clear — only meaningful on 🔍 inferred rows (a Mimic-verified
        // player's own Zeal list governs; the bot ignores marks for them).
        var clearBtn = '';
        if (r.inferred && !c.being_cured) {
          clearBtn = '<button class="chClear" data-target="'+esc(r.name)+'" data-spell="'+esc(c.name)+'"'
                   + ' title="Mark cured — clears this chip from the WHOLE raid\'s queues (shown because '+esc(r.name)+' isn\'t on Mimic, so no agent can see the cure land). Comes back automatically if it lands again.">✓</button>';
        }
        chips += '<span class="ch" style="'+chipStyle+'">'+esc(c.name)+t+cu+sl+cured+clearBtn+'</span>';
      }
      line += '<span class="curse">'+chips+'</span>';
    } else if (kind === 'burst') {
      // Already carrying the burst buff → countdown instead of damage (the guild lead
      // 2026-08-19: "should have timers left on feral avatar targets") so the
      // shaman/BL times the recast instead of the row vanishing.
      if (r.carrying) {
        var ct2 = (r.remaining_secs != null) ? fmtSecs(r.remaining_secs) : 'on';
        line += '<span class="miss" title="'+esc(r.carrying)+' active — recast when it drops">⏳ '+ct2+'</span>';
      } else {
        var dmg = (r.damage || 0);
        var dmgTxt = dmg >= 1e6 ? (dmg/1e6).toFixed(1)+'M'
                  : dmg >= 1e3 ? (dmg/1e3).toFixed(0)+'k'
                  : dmg > 0    ? String(dmg)
                  :             'no data';
        line += '<span class="miss">'+esc(dmgTxt)+'</span>';
      }
    } else {
      line += '<span class="miss">'+esc((r.missing || []).join(' · '))+'</span>';
    }
    line += '</div>';
    line += castingRow(r.casting);
    return line;
  }
  // The "who can cast it" tail of a group line: "→ Corvale: Vallon's Quickening" when someone IN the
  // group can group-cast it; with `warn`, "→ no enchanter in G3" when nobody can (the line then has to
  // be single-targeted, or someone moved). Nothing when the bot sent no casters (derived), for the
  // ungrouped (no group to cast into) or for a line whose class we do not know.
  function _calloutHtml(ln, grp, warn){
    if (!ln || grp == null || !Array.isArray(ln.casters)) return '';
    if (ln.casters.length) {
      var bits = ln.casters.slice(0, 2).map(function(c){ return esc(c.name) + (c.spell ? ': ' + esc(c.spell) : ''); });
      return ' <span class="gcast">→ ' + bits.join(' · ') + (ln.casters.length > 2 ? ' +' + (ln.casters.length - 2) : '') + '</span>';
    }
    // Prefer the bot's own `classes` for the line (bot 3.1.195+); the local map is the fallback for older bots.
    var cls = warn ? ((Array.isArray(ln.classes) && ln.classes.length) ? ln.classes.join('/') : _GRP_CLS[ln.key]) : null;
    return cls ? ' <span class="gno">→ no ' + esc(cls) + ' in ' + esc(_grpLabel(grp)) + '</span>' : '';
  }
  function _lineFor(G, group, label){
    var want = String(label).toLowerCase();
    for (var i = 0; i < G.blocks.length; i++) {
      if (G.blocks[i].group !== group) continue;
      var ls = G.blocks[i].lines;
      for (var j = 0; j < ls.length; j++) if (String(ls[j].label).toLowerCase() === want) return ls[j];
    }
    return null;
  }
  // The rows inside ONE open By-buff bucket, clustered by raid group: a "G3 ×4 → Corvale: Vallon's
  // Quickening" line, then that group's rows (the rows keep their class, tier colour, in-flight casts
  // and range dimming, so a cleric still sees someone is already casting on a target). When no row has
  // a group at all (a party, no raid roster) it is the plain list, as it always was.
  function bucketRowsHtml(label, rows, G){
    var cl = [], ix = {}, any = false, i, h = '';
    for (i = 0; i < rows.length; i++) {
      var g = _grpNum(rows[i].group), k = g == null ? 'n' : g;
      if (!ix[k]) { ix[k] = { group: g, rows: [] }; cl.push(ix[k]); }
      ix[k].rows.push(rows[i]);
      if (g != null) any = true;
    }
    if (!any) { for (i = 0; i < rows.length; i++) h += renderRow(rows[i], 'b'); return h; }
    cl.sort(function(a, b){ return _grpCmp(a.group, b.group, G.mine); });
    for (i = 0; i < cl.length; i++) {
      var c = cl[i];
      h += '<div class="gline"><span class="gl">' + esc(_grpLabel(c.group)) + '</span> <span class="gb">×' + c.rows.length + '</span>'
         + _calloutHtml(_lineFor(G, c.group, label), c.group, false) + '</div>';
      for (var ri = 0; ri < c.rows.length; ri++) h += renderRow(c.rows[ri], 'b');
    }
    return h;
  }
  // The By-group view: one compact block per raid group. Header "G3 6" (head count), one line per
  // missing buff line, then the people with their gaps — the first GRP_ROWS, the rest behind a
  // "+N more" toggle that persists in the same wp:bq:collapsed store as the By-buff buckets (keys
  // "grp:<n>", which no buff label can collide with; collapsed unless explicitly false).
  var GRP_ROWS = 3;
  function groupBlocksHtml(G){
    var h = '';
    for (var bi = 0; bi < G.blocks.length; bi++) {
      var b = G.blocks[bi], key = 'grp:' + (b.group == null ? 'none' : b.group);
      h += '<div class="gblk"><div class="ghdr"><span class="gl">' + esc(_grpLabel(b.group)) + '</span><span class="gct">' + b.size + '</span>'
         + (G.mine != null && b.group === G.mine ? '<span class="gme">you</span>' : '') + '</div>';
      for (var li = 0; li < b.lines.length; li++) {
        var ln = b.lines[li];
        h += '<div class="gline"><span class="gb">' + esc(ln.label) + ' ×' + (ln.missing || []).length + '</span>' + _calloutHtml(ln, b.group, true) + '</div>';
      }
      var open = _collapsed[key] === false;
      var show = open ? b.rows : b.rows.slice(0, GRP_ROWS);
      for (var ri = 0; ri < show.length; ri++) h += renderRow(show[ri], 'b');
      // data-wp-interact: a <div> is not a control to the preload's hover handshake (see .cathdr below).
      if (b.rows.length > GRP_ROWS) h += '<div class="gmore" data-wp-interact data-cat="' + key + '">' + (open ? '▾ fewer' : '▸ +' + (b.rows.length - GRP_ROWS) + ' more') + '</div>';
      h += '</div>';
    }
    return h;
  }
  // Build the queue sections HTML from a payload. Split out from render() so the
  // surgical-dismiss handler (#67) can recompute the byte-stability cache without
  // touching the DOM. Dismissed debuff chips are suppressed here.
  function buildHtml(payload){
    var bq = (payload && payload.buff_queue) || [];
    var dq = (payload && payload.debuff_queue) || [];
    // Shaman → feral_queue, Beastlord → savagery_queue. burst_label drives the
    // section header so the bot can pick the right ability name.
    var burst = (payload && (payload.feral_queue || payload.savagery_queue)) || [];
    var burstLabel = (payload && payload.burst_label) || null;
    // Section filters from the dashboard's "Buff queue options" card (the guild lead
    // 2026-08-19: "debuff / feral only"). Absent field = show (older agent).
    var sec = (payload && payload.sections) || {};
    var html = '';
    // Debuff / cure queue FIRST (per user) — cures are time-critical and the
    // bot already orders them curse → blind → poison → disease. Locally
    // dismissed chips (#67) drop out; a row whose every chip is dismissed drops
    // entirely, and the count reflects only what's shown.
    var dqVis = [];
    for (var i0 = 0; i0 < dq.length; i0++) {
      var rv = _rowVisibleCurses(dq[i0]);
      if (!(rv.curses && rv.curses.length)) continue;
      dqVis.push(rv);
    }
    if (sec.debuffs !== false && dqVis.length) {
      html += '<div class="sec debuffs"><div class="hdr"><span class="lab">🩸 Debuff queue</span><span class="ct">'+dqVis.length+'</span><span class="hint">cures needed · curse → blind → poison → disease</span></div>';
      for (var di = 0; di < dqVis.length; di++) html += renderRow(dqVis[di], 'd');
      html += '</div>';
    }
    // By group (the guild lead, 2026-10-04): the same queue, one block per raid group. The By-buff
    // path below is the original, unchanged except for the group clusters in an open bucket.
    var gview = _view === 'group';
    var G = sec.buffs !== false ? _groupsFor(payload, _selfName) : null;
    if (sec.buffs !== false && gview && G.blocks.length) {
      var gPeople = 0;
      for (var gi = 0; gi < G.blocks.length; gi++) gPeople += G.blocks[gi].rows.length;
      html += '<div class="sec buffs"><div class="hdr"><span class="lab">🛡 Buff queue</span><span class="ct">'+gPeople+'</span><span class="hint">by group · caster = someone in that group</span></div>'
            + groupBlocksHtml(G) + '</div>';
    } else if (sec.buffs !== false && !gview && bq.length) {
      var hint = bufferClass ? ('severity-first · gaps a '+esc(bufferClass)+' can fix') : 'pick a class to filter';
      html += '<div class="sec buffs"><div class="hdr"><span class="lab">🛡 Buff queue</span><span class="ct">'+bq.length+'</span><span class="hint">'+hint+'</span></div>';
      // Group by buff line: a raider missing two categories appears under
      // both, so the buffer can work one spell line top to bottom. Each
      // section collapses (▸/▾ persists) and shows a 🔮 hint when a spell
      // matching the line was cast this session (likely still memmed).
      var recent = (payload && payload.recent_casts) || [];
      var byCat = {};
      var catOrder = [];
      for (var i = 0; i < bq.length; i++) {
        var labels = (bq[i].missing && bq[i].missing.length) ? bq[i].missing : ['Other'];
        for (var j = 0; j < labels.length; j++) {
          var L = labels[j];
          if (!byCat[L]) { byCat[L] = []; catOrder.push(L); }
          byCat[L].push(bq[i]);
        }
      }
      for (var ci = 0; ci < catOrder.length; ci++) {
        var label = catOrder[ci];
        var rowsC = byCat[label];
        // Collapsed by DEFAULT (the guild lead, 2026-08-19: "buff queue is off the page
        // - needs to collapse buff types down groups"): a mid-raid queue with
        // every section expanded is a wall. Absent = collapsed; an explicit
        // false (the user expanded it) persists their choice.
        var isCollapsed = _collapsed[label] !== false;
        var mem = memmedHint(label, recent);
        // Collapsed headers still tell the buffer WHO: first few names inline.
        var preview = '';
        if (isCollapsed && rowsC.length) {
          var nms = rowsC.slice(0, 3).map(function(r){ return r.name; }).join(', ');
          if (rowsC.length > 3) nms += ' +' + (rowsC.length - 3);
          preview = '<span style="color:#8b949e;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">'+esc(nms)+'</span>';
        }
        // data-wp-interact: a header is a <div>, which the preload's hover
        // handshake did not count as a control, so on a locked overlay the
        // click went to EQ and the cursor stayed hidden behind the panel
        // (the guild lead, 2026-10-02: "can't click it").
        html += '<div class="cat">'
              +   '<div class="cathdr" data-wp-interact data-cat="'+esc(label)+'" style="display:flex;align-items:baseline;gap:5px;cursor:pointer;padding:2px 4px;font-size:10px;color:#79c0ff;background:rgba(88,166,255,0.07);border-radius:3px;margin:3px 0 2px">'
              +     '<span style="font-size:9px">'+(isCollapsed ? '▸' : '▾')+'</span>'
              +     '<span style="font-weight:600">'+esc(label)+'</span>'
              +     '<span style="color:#6e7681;font-variant-numeric:tabular-nums">'+rowsC.length+'</span>'
              +     preview
              +     (mem ? '<span style="margin-left:auto;color:#7ee787;font-size:9px" title="You cast '+esc(mem)+' this session — likely still on a gem">🔮 '+esc(mem)+'</span>' : '')
              +   '</div>';
        if (!isCollapsed) html += bucketRowsHtml(label, rowsC, G);
        html += '</div>';
      }
      html += '</div>';
    }
    if (sec.burst !== false && burst.length && burstLabel) {
      html += '<div class="sec burst"><div class="hdr"><span class="lab">⚡ '+esc(burstLabel)+' queue</span><span class="ct">'+burst.length+'</span><span class="hint">damage descending · tonight\'s session</span></div>';
      for (var i = 0; i < burst.length; i++) html += renderRow(burst[i], 'burst');
      html += '</div>';
    }
    return html;
  }
  // ▭ Mini — option B "Two-column ledger" (the guild vote, 2026-09-17: "Too
  // much information to minimize. Instead show how many characters need each
  // buff type or cure; click a category to expand who needs it and which
  // group they are in"). Same payload as buildHtml, after the same #67
  // dismissals and section filters. Counts are CHARACTERS: two poisons on one
  // raider is one Poison; a raider missing Haste and HP counts once in each.
  // Buff categories keep the queue's own order (first appearance, as the full
  // view's sections do) and an empty `missing` is Other, as it is there. Cures
  // take the bot's priority, curse → blind → poison → disease; a cure the bot
  // did not name (older bots send none) is Other, last.
  var _miniOpen = null;      // 'b:<category>' | 'c:<cure>' — one open at a time
  var MINI_CURES = ['curse', 'blind', 'poison', 'disease'];
  function miniToggle(key){ _miniOpen = (_miniOpen === key) ? null : key; }
  function miniLedger(payload){
    var bq = (payload && payload.buff_queue) || [];
    var dq = (payload && payload.debuff_queue) || [];
    var sec = (payload && payload.sections) || {};
    var buffs = [], cures = [], byKey = {};
    function add(list, key, label, r){
      var c = byKey[key];
      if (!c) { c = byKey[key] = { key: key, label: label, who: [], seen: {} }; list.push(c); }
      var id = String(r.name).toLowerCase();
      if (!c.seen[id]) { c.seen[id] = true; c.who.push(r); }
    }
    if (sec.buffs !== false) {
      for (var i = 0; i < bq.length; i++) {
        var labels = (bq[i].missing && bq[i].missing.length) ? bq[i].missing : ['Other'];
        for (var j = 0; j < labels.length; j++) add(buffs, 'b:' + labels[j], labels[j], bq[i]);
      }
    }
    // The busiest group per buff line (the guild lead, 2026-10-04); cures have no group story.
    for (var t = 0; t < buffs.length; t++) buffs[t].top = _topGroup(buffs[t].who);
    if (sec.debuffs !== false) {
      for (var k = 0; k < dq.length; k++) {
        var rv = _rowVisibleCurses(dq[k]);
        var cs = rv.curses || [];
        for (var m = 0; m < cs.length; m++) {
          var fam = MINI_CURES.indexOf(cs[m].cure) >= 0 ? cs[m].cure : 'other';
          add(cures, 'c:' + fam, fam.charAt(0).toUpperCase() + fam.slice(1), rv);
        }
      }
      var cureRank = function(c){ var n = MINI_CURES.indexOf(c.key.slice(2)); return n < 0 ? 99 : n; };
      cures.sort(function(a, b){ return cureRank(a) - cureRank(b); });
    }
    return { buffs: buffs, cures: cures };
  }
  function buildMiniHtml(payload){
    var L = miniLedger(payload);
    if (!L.buffs.length && !L.cures.length) return '';
    var open = null;
    function col(cls, lab, list, cure){
      var h = '<div class="mcol ' + cls + '"><div class="mlab">' + lab + '</div>';
      if (!list.length) h += '<span class="mnone">—</span>';
      for (var i = 0; i < list.length; i++) {
        var c = list[i], on = c.key === _miniOpen;
        if (on) open = c;
        h += '<button type="button" class="mchip' + (cure ? ' cure' : '') + (on ? ' on' : '') + '" data-mcat="' + esc(c.key) + '">'
           +   '<span class="wp-mini-name">' + esc(c.label) + '</span> <b class="wp-mini-num">' + c.who.length + '</b>'
           +   (c.top ? ' <span class="wp-mini-num mtop">· G' + c.top.group + '×' + c.top.n + '</span>' : '') + '</button>';
      }
      return h + '</div>';
    }
    var html = '<div class="mledger">' + col('mb', '✨ buff', L.buffs, false) + col('mc', '🩸 cure', L.cures, true) + '</div>';
    if (open) {
      html += '<div class="mexp">' + open.who.map(function(r){
        return '<span>' + esc(r.name) + (r.group != null ? ' <span class="grp">G' + esc(r.group) + '</span>' : '') + '</span>';
      }).join('') + '</div>';
    }
    return html;
  }
  function _autoFit(){
    try { window.mimic && window.mimic.autoFitOverlay && window.mimic.autoFitOverlay(document.getElementById('wrap')); } catch (e) {}
  }
  function render(payload){
    var body = document.getElementById('body');
    var empty = document.getElementById('empty');
    var dq = (payload && payload.debuff_queue) || [];
    // group_mode = no active raid roster → caption switches from "raid" to
    // "group" and the empty-state hint changes.
    var groupMode = !!(payload && payload.group_mode);
    // Forget dismissed chips the server no longer reports (so a re-land re-shows)
    // before deciding what's visible.
    reconcileDismissed(dq);
    var html = document.body.classList.contains('wp-mini') ? buildMiniHtml(payload) : buildHtml(payload);
    // Two or more raids at once (the bot names them only then): the queues are your raid's; say
    // whose. Not in mini mode, which has no room for it.
    var raids = (payload && Array.isArray(payload.raids) && payload.raids.length > 1) ? payload.raids : null;
    if (html && raids && !document.body.classList.contains('wp-mini')) {
      var mine = null;
      for (var ri = 0; ri < raids.length; ri++) if (raids[ri] && raids[ri].mine) mine = raids[ri];
      html = '<div class="raids-note"><span class="n">⚔ ' + esc(raids.length) + ' raids at once</span>'
           + (mine ? ' · yours: 👑 ' + esc(mine.leader) + ' (' + esc(mine.size) + ')' : '') + '</div>' + html;
    }
    if (!html) {
      // Nothing to show — either no roster or everything is covered/dismissed.
      if (body.__wpHtml !== '') { body.innerHTML = ''; body.__wpHtml = ''; _autoFit(); }
      empty.style.display = '';
      var noun = groupMode ? 'group' : 'raid';
      empty.textContent = (payload && payload.local_only)
        ? 'guild feature: it needs your raid\'s Mimics, so sign in to use it'
        : bufferClass
        ? ('no gaps a '+bufferClass+' can fix right now — every '+(groupMode ? 'tracked groupmate' : 'Mimic-running raider')+' is covered')
        : ('no '+noun+' roster yet — start any Mimic in '+noun+' and the queue fills in within seconds');
      return;
    }
    empty.style.display = 'none';
    // Byte-stability guard (2026-07-07 review): identical HTML -> skip the
    // innerHTML re-layout and the auto-fit (window height only changes when
    // the content does). Delegated listeners on #body survive either way.
    if (body.__wpHtml !== html) {
      body.innerHTML = html;
      body.__wpHtml = html;
      _autoFit();
    }
  }
  // Collapse/expand a category section. Delegated once (render replaces the
  // body's innerHTML every poll); re-renders from the last payload so the
  // toggle is instant instead of waiting for the next tick.
  var _lastPayload = null;
  document.getElementById('body').addEventListener('click', function(ev){
    // .gmore is the By-group block's "+N more" toggle; it keeps its own data-cat ("grp:<n>").
    var hdr = ev.target && ev.target.closest ? ev.target.closest('.cathdr, .gmore') : null;
    if (!hdr) return;
    var label = hdr.getAttribute('data-cat');
    if (!label) return;
    // Effective state is "collapsed unless explicitly false" — flip against
    // THAT, not the raw stored value, or the first click on a default-
    // collapsed section stores true and changes nothing.
    _collapsed[label] = (_collapsed[label] !== false) ? false : true;
    _saveCollapsed();
    if (_lastPayload) render(_lastPayload);
  });
  // ▭ Mini chips: a click opens that category's names, or closes it if it is
  // the one open. The open key lives in _miniOpen, not the DOM, so each
  // repaint rebuilds it. Chips are rebuilt as counts move, so the hover
  // handshake is delegated, as the ✓ cured button's is.
  (function(){
    var bodyEl = document.getElementById('body');
    bodyEl.addEventListener('click', function(ev){
      var chip = ev.target && ev.target.closest ? ev.target.closest('.mchip') : null;
      if (!chip) return;
      miniToggle(chip.getAttribute('data-mcat'));
      if (_lastPayload) render(_lastPayload);
    });
    function hover(e, on){
      var chip = e.target && e.target.closest ? e.target.closest('.mchip') : null;
      // Crossing between a chip and its own label or count is not leaving it.
      if (!chip || (e.relatedTarget && chip.contains(e.relatedTarget))) return;
      try { window.mimic.overlayHoverInteractive(on); } catch (er) {}
    }
    bodyEl.addEventListener('mouseover', function(e){ hover(e, true); });
    bodyEl.addEventListener('mouseout', function(e){ hover(e, false); });
  })();
  // A mini flip repaints from the last payload now, not on the next poll.
  // render() fits when the HTML changes; the explicit fit covers a flip that
  // changes only the hidden title (an empty queue).
  window.addEventListener('wp-mini-change', function(){ if (_lastPayload) render(_lastPayload); _autoFit(); });

  // Who "I" am, for "my group first": /api/state names the active EQ character, the way the other
  // overlays learn it. It is the agent's whole state, so only when the bot sent groups (there is
  // nothing to order otherwise) and at most every ~6s; a failed read keeps the last name.
  async function _refreshSelf(){
    _selfAt = Date.now();
    try {
      var r = await fetch('http://127.0.0.1:'+PORT+'/api/state', { cache: 'no-store' });
      var st = await r.json();
      _selfName = (st && st.activeCharacter) ? String(st.activeCharacter).toLowerCase() : '';
    } catch (e) {}
  }
  async function tick(){
    try {
      var qs = bufferClass ? '?class=' + encodeURIComponent(bufferClass) : '';
      var r = await fetch('http://127.0.0.1:'+PORT+'/api/buff-queue'+qs, { cache: 'no-store' });
      var s = await r.json();
      if (s && Array.isArray(s.groups) && s.self_group == null && Date.now() - _selfAt > 6000) await _refreshSelf();
      document.getElementById('conn').className = 'conn ok';
      document.getElementById('conn').textContent = '●';
      // Auto mode: show which class it resolved to ("Auto (Druid)") so the
      // picker never reads as an unset blank.
      if (clsPick && !bufferClass && clsPick.options.length) {
        var autoLbl = s && s.auto_class ? 'Auto (' + s.auto_class + ')' : 'Auto (my class)';
        if (clsPick.options[0].textContent !== autoLbl) clsPick.options[0].textContent = autoLbl;
      }
      _lastPayload = s;
      render(s);
    } catch (e) {
      var c = document.getElementById('conn'); c.className = 'conn bad'; c.textContent = '○';
    }
  }
  tick(); setInterval(tick, 1500);
</script>
</body>
