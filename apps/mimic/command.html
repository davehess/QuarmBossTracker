<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>command center</title>
<style>
  /* Wolf Pack Command Center — the "one window" raid board (the guild lead
     2026-07-03: "put those into a tidy command center so if someone only
     wanted to have one window they could do that"). Combines the Tank
     overlay's boss/MT/rampage/enrage/Death Touch focus with two sections
     that only exist because raiders already broadcast them in raid chat —
     DA/invuln status and healer mana — plus Curse/Cure alerts pulled from
     the existing buff-queue debuff tracking (real observed debuffs, not
     re-parsed "please cure" macros). Deliberately compact — this is a
     glance board, not a replacement for the Tank/Buff-queue overlays'
     full detail. Reads /api/command-center.
     --bg-alpha: card-surface alpha, driven by slider via main → preload
     'bg-alpha' IPC. 1.0 = opaque (EQ hidden); text stays bright at every value. */
  :root{ --bg-alpha:0.55; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;user-select:none;}
  #wrap{padding:6px 8px;min-width:260px;}
  .title{display:flex;align-items:center;gap:8px;
    font-size:12px;color:#f8b87b;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000;margin-bottom:5px;}
  .title .who{font-size:11px;color:#9aa4ad;font-weight:normal}
  .card{background:rgb(0 0 0 / var(--bg-alpha));border-radius:5px;padding:5px 7px;margin-bottom:4px}
  .card .head{font-size:10px;color:#9aa4ad;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;
    text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000}
  .hpwrap{position:relative;height:14px;background:#222;border-radius:3px;overflow:hidden;
    border:1px solid rgba(255,255,255,0.06)}
  .hpbar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(to right,#56d364,#56d364);
    transition:width .25s ease, background .25s ease}
  .hpbar.low {background:linear-gradient(to right,#f0d264,#f0a52d)}
  .hpbar.crit{background:linear-gradient(to right,#f87171,#dc2626)}
  .hpbar.gold{background:linear-gradient(to right,#f0c419,#d4a017)}
  .hpbar.inv-soon{background:linear-gradient(to right,#56d364,#2ea043);box-shadow:0 0 8px rgba(86,211,100,0.9) inset}
  .hpwrap .val{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000;font-weight:600}
  .hpwrap .inv-tag{position:absolute;top:0;bottom:0;display:flex;align-items:center;
    font-size:9px;font-weight:800;letter-spacing:0.5px;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000;z-index:2}
  .hpwrap .inv-tag.l{left:4px}
  .hpwrap .inv-tag.r{right:4px}
  .enrage{display:flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(140,72,31,0.45);
    border:1px solid #f0a52d;border-radius:5px;margin-bottom:4px;font-size:11px}
  .enrage.crit{background:rgba(220,38,38,0.45);border-color:#f87171;animation:flash 0.6s linear infinite alternate}
  @keyframes flash{from{box-shadow:0 0 8px rgba(248,113,113,0.9)}to{box-shadow:0 0 16px rgba(248,113,113,0.4)}}
  .dt{display:flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(107,33,168,0.5);
    border:1px solid #c084fc;border-radius:5px;margin-bottom:4px;font-size:11px}
  .dt.crit{background:rgba(220,38,38,0.5);border-color:#f87171;animation:flash 0.6s linear infinite alternate}
  .dt .sec{font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  .relv{display:flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(180,83,9,0.5);
    border:1px solid #fb923c;border-radius:5px;margin-bottom:4px;font-size:11px}
  .relv .n{font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  .relv .sub{margin-left:auto;font-size:9px;color:#d0d7de}
  .ramp{display:flex;flex-direction:column;gap:4px;padding:4px 7px;background:rgba(180,32,32,0.55);
    border:1px solid #f87171;border-radius:5px;margin-bottom:4px;font-size:11px}
  .ramp .row{display:flex;align-items:center;gap:6px}
  .ramp .who{font-weight:700;color:#fff}
  /* DA/invuln raid broadcast list — one row per tank currently reporting
     status. Gold while up, green once ≤5s remain, red once fully down. */
  .list{display:flex;flex-direction:column;gap:2px;font-size:10px;line-height:1.5}
  .list .row{display:flex;align-items:center;gap:5px}
  .list .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6edf3}
  .list .row .cls{color:#6e7681;font-size:9px;flex-shrink:0}
  .da-chip{font-weight:700;font-size:9px;padding:0 5px;border-radius:3px;flex-shrink:0;
    font-variant-numeric:tabular-nums}
  .da-chip.up   {color:#1a1200;background:#f0c419}
  .da-chip.soon {color:#04270c;background:#56d364}
  .da-chip.down {color:#fff;background:#8b2222}
  .mana-bar{width:56px;height:8px;background:#222;border-radius:2px;overflow:hidden;flex-shrink:0;
    border:1px solid rgba(255,255,255,0.06)}
  .mana-bar .fill{height:100%;background:linear-gradient(to right,#5b8def,#3f6fd6)}
  .mana-bar .fill.low{background:linear-gradient(to right,#f0d264,#f0a52d)}
  .mana-bar .fill.crit{background:linear-gradient(to right,#f87171,#dc2626)}
  .mana-pct{width:2.6em;text-align:right;color:#9aa4ad;font-variant-numeric:tabular-nums;flex-shrink:0}
  .cure-chip{font-size:9px;padding:0 4px;border-radius:2px;background:rgba(220,38,38,0.35);
    color:#fff;flex-shrink:0}
  .cure-chip.being-cured{background:rgba(86,211,100,0.3);color:#c8f0cc}
  /* Divine Intervention (#50) compacted (#66) to chips beside the HEALER MANA
     header — "DI: Bellwick ✓ · Norbray 45s" — freeing the vertical block. */
  .head.mana-head{display:flex;align-items:center;gap:6px}
  .di-chips{margin-left:auto;font-size:9px;text-transform:none;letter-spacing:0.2px;
    display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .di-chips .di-lab{color:#9aa4ad;font-weight:600}
  .di-chips .up{color:#7ee787}
  .di-chips .cd{color:#f0b429;font-variant-numeric:tabular-nums}
  .di-chips .unk{color:#7d8590}
  .di-chips .sep{color:#6e7681}
  .di-chips.solo{outline:1px solid rgba(240,196,25,0.7);outline-offset:1px;border-radius:3px;padding:0 3px}
  /* Curse/Cure per-line dismiss + clear-all (#66). Extra right padding on the
     card keeps the ✕ / "clear all" clear of the fixed ✕-hide button gutter. */
  .card.cure-card{padding-right:28px}
  .head.cure-head{display:flex;align-items:center;gap:6px}
  .cureClearAll{margin-left:auto;cursor:pointer;color:#9aa4ad;font-size:9px;text-transform:none;
    letter-spacing:0;border:1px solid rgba(110,118,129,0.4);border-radius:3px;padding:0 4px;opacity:0.7}
  .cureClearAll:hover{opacity:1;color:#f87171;border-color:#f87171}
  .cure-row .cureDismiss{margin-left:6px;cursor:pointer;color:#8b949e;font-size:11px;line-height:1;
    flex-shrink:0;opacity:0.6}
  .cure-row .cureDismiss:hover{opacity:1;color:#f87171}
  /* 🎲 Rolls — per-set expand ("who else rolled") + local dismiss (the guild lead,
     2026-08-14). Same shape as the cure card above: the extra right padding
     keeps the controls clear of the fixed ✕-hide gutter, and BOTH controls are
     always drawn and merely dimmed. A hover-reveal would be invisible here —
     #content is rebuilt every poll, and an element created under a stationary
     cursor never picks up :hover (measured on chchain.html, 2026-08-14). */
  .card.rolls-card{padding-right:28px}
  .head.rolls-head{display:flex;align-items:center;gap:6px}
  .rollClearAll{margin-left:auto;cursor:pointer;color:#9aa4ad;font-size:9px;text-transform:none;
    letter-spacing:0;border:1px solid rgba(110,118,129,0.4);border-radius:3px;padding:0 4px;opacity:0.7}
  .rollClearAll:hover{opacity:1;color:#f87171;border-color:#f87171}
  /* 🎟 Guests (officers only): one row per guest Mimic link, with +1h / +3h. Same right gutter as the rolls card. */
  .card.guests-card{padding-right:28px}
  .guest-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6edf3}
  .guest-row .gwhen{flex-shrink:0;font-size:10px;color:#9aa4ad;font-variant-numeric:tabular-nums}
  .guest-row .gwhen.soon{color:#f0a52d}
  .guest-row .gwhen.out{color:#f87171}
  .guest-row .gn{flex-shrink:0;font-size:9px;color:#8b949e;font-variant-numeric:tabular-nums}
  .guest-row .guestExt{cursor:pointer;flex-shrink:0;color:#e6edf3;font-size:9px;border:1px solid rgba(110,118,129,0.5);
    border-radius:3px;padding:0 4px;opacity:0.85;user-select:none}
  .guest-row .guestExt:hover{opacity:1;color:#f0c419;border-color:#f0c419}
  .guest-row .gflash{flex-shrink:0;font-size:9px;color:#56d364}
  .guest-row .gflash.bad{color:#f87171}
  .roll-row .rollMore{cursor:pointer;color:#8b949e;font-size:9px;flex-shrink:0;opacity:0.8;user-select:none}
  .roll-row .rollMore:hover{opacity:1;color:#e6edf3}
  .roll-row .rollCopy{cursor:pointer;color:#8b949e;font-size:10px;flex-shrink:0;opacity:0.8;user-select:none;margin-right:4px}
  .roll-row .rollCopy:hover{opacity:1;color:#e6edf3}
  .roll-row .rollDismiss{margin-left:6px;cursor:pointer;color:#8b949e;font-size:11px;line-height:1;
    flex-shrink:0;opacity:0.6}
  .roll-row .rollDismiss:hover{opacity:1;color:#f87171}
  .roll-detail{display:flex;flex-direction:column;gap:1px;margin:1px 0 3px 10px;
    border-left:1px solid rgba(110,118,129,0.35);padding-left:6px}
  .roll-detail .d{display:flex;gap:6px;font-size:9px;color:#9aa4ad;line-height:1.5}
  .roll-detail .d .v{color:#e6edf3;font-variant-numeric:tabular-nums;margin-left:auto}
  .roll-detail .d.win .v{color:#f0c419;font-weight:700}
  .roll-detail .d.lose .v{color:#f85149;font-weight:700}
  .roll-detail .d .rng{opacity:.6;flex-shrink:0;font-variant-numeric:tabular-nums}
  /* A tie at the top of a set (the guild lead, 2026-10-14). Orange, bordered and spelled TIE so it reads
     without the colour; a tie lower down is only a dim "=". */
  .roll-row .tt,.roll-detail .tt{color:#ffa657;font-size:9px;font-weight:700;flex-shrink:0;border:1px solid rgba(255,166,87,0.6);
    border-radius:2px;padding:0 3px;line-height:1.3;align-self:center}
  .roll-detail .d.tie .v{color:#ffa657;font-weight:700}
  .roll-detail .d .eq{opacity:.55;flex-shrink:0}
  .roll-detail .d.tiebox{color:#ffa657;font-weight:700;font-size:10px;border-left:2px solid #ffa657;padding-left:5px;margin-bottom:2px}
  /* A re-roll never wins, so it has to be legible at a glance or the list looks
     like someone rolled twice and got robbed. #6e7681 on this backdrop was not. */
  .roll-detail .d .rr{color:#c9a227;font-size:8px;flex-shrink:0;border:1px solid rgba(201,162,39,0.45);
    border-radius:2px;padding:0 3px;line-height:1.3;align-self:center}
  /* Needs-rez board. A row someone is actively on GLOWS (the guild lead, 2026-08-20:
     "make that person's name glow brighter until it says 'rezzed' next to
     them"); a row nobody has spoken for sits quiet so the glow means
     something. prefers-reduced-motion keeps the brightness, drops the pulse. */
  .rez-row .nm { font-weight: 600; }
  .rez-row.needs .nm { color: #c9d1d9; }
  .rez-row.incoming .nm {
    color: #fff3c4; text-shadow: 0 0 6px rgba(255,214,64,.95), 0 0 14px rgba(255,214,64,.55);
    animation: rezGlow 1.4s ease-in-out infinite;
  }
  .rez-row.rezzed .nm { color: #7ee787; text-shadow: none; }
  .rez-tag { font-size: 10px; margin-left: 6px; opacity: .95; }
  .rez-row.incoming .rez-tag { color: #ffd640; }
  .rez-row.rezzed  .rez-tag { color: #7ee787; }
  .rez-row .rez-age { margin-left: auto; font-size: 10px; color: #8b949e; }
  .rez-row .rezDismiss { margin-left: 6px; cursor: pointer; color: #8b949e; font-size: 11px;
                         line-height: 1; opacity: .75; }
  .rez-row .rezDismiss:hover { opacity: 1; color: #f87171; }
  @keyframes rezGlow {
    0%, 100% { text-shadow: 0 0 5px rgba(255,214,64,.75), 0 0 12px rgba(255,214,64,.40); }
    50%      { text-shadow: 0 0 9px rgba(255,214,64,1),   0 0 20px rgba(255,214,64,.75); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rez-row.incoming .nm { animation: none; }
  }

  /* 💀 Last deaths — same shape as the cure card: extra right padding keeps "clear all" and the row ✕ clear of
     the fixed ✕-hide gutter. The NAME never shrinks (a flex:1 name with a long unshrinkable detail beside it was
     squeezed to zero width at a narrow overlay and the row read as nobody having died); the detail is what
     ellipsizes, with the full line on hover. */
  .card.death-card{padding-right:28px}
  .head.death-head{display:flex;align-items:center;gap:6px}
  .deathClearAll{margin-left:auto;cursor:pointer;color:#9aa4ad;font-size:9px;text-transform:none;
    letter-spacing:0;border:1px solid rgba(110,118,129,0.4);border-radius:3px;padding:0 4px;opacity:0.7}
  .deathClearAll:hover{opacity:1;color:#f87171;border-color:#f87171}
  .list .row.death-row .nm{flex:0 0 auto;max-width:55%;font-weight:600}
  .death-row .death-det{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9aa4ad}
  .death-row .deathDismiss{margin-left:6px;cursor:pointer;color:#8b949e;font-size:11px;line-height:1;
    flex-shrink:0;opacity:0.6}
  .death-row .deathDismiss:hover{opacity:1;color:#f87171}

  /* #153 collapsible sections — the caret+label in a section header is the
     click target that collapses/expands it. Collapse state lives in a JS store
     consulted at render time (localStorage-backed), NOT DOM state, so repaints
     never lose it. */
  .sec-toggle{cursor:pointer;user-select:none}
  .sec-toggle:hover{color:#e6edf3}
  #empty{color:rgba(255,255,255,0.5);font-size:11px;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000;padding:3px 0;text-align:center}
  /* Two or more raids at once: every raid's leader and player count, yours marked. */
  .raids-card .head{color:#ffa657}
  .raids-card .row .cnt{color:#e6edf3;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
  .raids-card .row .yours{color:#56d364;font-size:9px}
  .raids-card .row.mine .nm{color:#56d364}
  /* Hail board (the guild lead, 2026-10-05; option A): a PoP boss died and its flag NPC stands for 20
     minutes. Who still has to hail it is the top list, tappable; who has is green, tappable only when
     somebody marked them by hand (a tap on one of those undoes it). A tappable chip carries a visible
     edge and a brighter fill so it reads as a button, the way the amber chip reads as a warning. The clock
     is painted by script every second (data-end), so the card's own HTML stays byte-stable between polls. */
  .hail-head{display:flex;align-items:center;gap:6px}
  .hail-head .npc{text-transform:none;letter-spacing:0;color:#e6edf3}
  .hail-clock{margin-left:auto;text-transform:none;letter-spacing:0;font-size:10px;font-weight:700;
    color:#d29922;font-variant-numeric:tabular-nums}
  .hail-clock.soon{color:#ffa657}
  .hail-clock.crit{color:#f85149}
  /* The NPC's flag cap (the guild lead, 2026-10-07): "Flags: 23 / 72 used", amber and bold when the flags left
     do not cover the raiders still to hail. Drawn only when the bot sends a cap. */
  .hail-cap{font-size:9px;margin:3px 0 2px;color:#c9d1d9}
  .hail-cap b{font-weight:700;color:#e6edf3;font-variant-numeric:tabular-nums}
  .hail-cap .note{font-size:8px;color:#7d8590;margin-left:4px}
  .hail-cap.warn{color:#ffa657;font-weight:700}
  .hail-sub{display:flex;align-items:baseline;gap:4px;font-size:9px;margin:3px 0 2px;color:#c9d1d9}
  .hail-sub b{font-weight:700;color:#e6edf3;font-variant-numeric:tabular-nums}
  .hail-sub.todo{color:#e6edf3;font-weight:700}
  .hail-sub.done{color:#7ee787;font-weight:700}
  .hail-sub.done b{color:#7ee787}
  .hail-chips{display:flex;flex-wrap:wrap;gap:3px;font-size:10px;line-height:1.5}
  .hail-chip{padding:0 5px;border-radius:3px;border:1px solid transparent;white-space:nowrap;color:#e6edf3;
    background:rgba(255,255,255,0.06)}
  .hail-chip.tap{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.32);cursor:pointer}
  .hail-chip.tap:hover{background:rgba(255,255,255,0.20);border-color:rgba(255,255,255,0.6)}
  .hail-chip.flag, .hail-chip.flag:hover{background:rgba(140,72,31,0.45);border-color:#f0a52d}
  .hail-chip.flag:hover{background:rgba(140,72,31,0.7)}
  .hail-chip.me{font-weight:700;border-color:#f8b87b}
  .hail-chip .prior{font-size:8px;color:#f0b429;margin-left:4px;letter-spacing:0}
  .hail-chip.ok{background:rgba(86,211,100,0.28);color:#c8f0cc;border-color:transparent}
  .hail-chip.ok.undo{border:1px dashed rgba(200,240,204,0.55);cursor:pointer}
  .hail-chip.ok.undo:hover{background:rgba(86,211,100,0.42)}
  .hail-chip.pend{opacity:.45;cursor:default}
  .hail-more{font-size:9px;color:#8b949e;align-self:center;margin-left:2px;cursor:pointer;user-select:none}
  .hail-more:hover{color:#e6edf3}
  .hail-dim{font-size:9px;color:#7d8590;margin-top:4px}
  .hail-foot{font-size:8px;color:#6e7681;margin-top:3px;padding-top:2px;
    border-top:1px solid rgba(110,118,129,0.25)}
  /* drag/lock/setup chrome — shared pattern. */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(248,184,123,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(180,98,34,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(180,98,34,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  /* On the Canvas (Mimic 3.0 alpha; the guild lead, 2026-10-03: "the margins around the actual data is
     too large"): the panel owns the move and hide buttons, so the window padding and the gutter the cure
     and rolls cards keep clear of the hide button both go. */
  body.wp-in-canvas #wrap{padding:2px 3px;min-width:0}
  body.wp-in-canvas .card.cure-card, body.wp-in-canvas .card.rolls-card, body.wp-in-canvas .card.guests-card{padding-right:7px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#f8b87b;border-color:#f8b87b}
  body.setup #move-btn{top:30px}
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay">✥</button>
  <button id="hide-btn" title="Hide the Command Center overlay (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🎛 Command Center</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="wrap">
    <div class="title"><span aria-hidden>🎛</span><span data-wp-name>Command Center</span><span class="who" id="who"></span></div>
    <div id="content"></div>
  </div>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    hideBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    hideBtn.addEventListener('mouseleave', function(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    hideBtn.addEventListener('click', function(){ try { window.mimic.hideThisOverlay(); } catch (e) {} });
  }

  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) { try { window.mimic.overlayHoverInteractive(false); } catch (e) {} } });
    moveBtn.addEventListener('mousedown', _beginDrag);
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} try{window.mimic.overlayHoverInteractive(false);}catch(e){} } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null;
  var _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){ _overlayKey = p && p.overlayKey; if (p && p.scope) _setupScope = p.scope; else if (p && p.active) _setupScope = 'all'; document.body.classList.toggle('setup', !!(p && p.active)); });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener('click', function(){ try { document.body.classList.remove('setup'); } catch (e) {} try { if (_setupScope === 'this') window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fmtSec(s){ if (s == null) return '--'; if (s < 60) return Math.round(s)+'s'; var m = Math.floor(s/60), r = Math.round(s%60); return m+':'+(r<10?'0':'')+r; }

  function _requestAutoHeight(){
    if (!(window.mimic && window.mimic.overlayAutoHeight)) return;
    var w = document.getElementById('wrap'); if (!w) return;
    try { window.mimic.overlayAutoHeight(w.scrollHeight + 8); } catch (e) {}
  }

  var contentEl = document.getElementById('content');
  var whoEl     = document.getElementById('who');

  // Curse/Cure local dismiss (#66) — session-scoped, this client only. Keyed by
  // the agent-provided stable row id (name + sorted debuff-spell set). Reconciled
  // against each poll: an id that leaves the payload is forgotten so a genuine
  // re-land re-shows, while a still-present (stale/moot) row stays dismissed.
  var _dismissedCures = new Set();
  var _lastState = null;
  function _cureId(c){ return (c && c.id) ? c.id : (c && c.name ? String(c.name).toLowerCase() : null); }

  // 🎲 Rolls — which sets are expanded, and which have been dismissed (the guild lead,
  // 2026-08-14). Both LOCAL to this client and both in a JS store consulted at
  // render time, never DOM state: #content is rebuilt every 1.5s, so a native
  // <details> would snap shut mid-distribution (the wpKeep lesson). Session-
  // scoped rather than localStorage-backed — unlike a collapsed section, "I'm
  // done with this item" should not outlive the loot night.
  var _openRolls      = new Set();
  var _dismissedRolls = new Set();
  // Stable across polls: a set keeps its range and its first-roll timestamp for
  // the 15 minutes it stays in the payload.
  function _rollId(r){ return r ? (r.from + '-' + r.to + '@' + (r.started_at_ms || 0)) : null; }

  // 💀 Last deaths — local dismiss (the guild lead, 2026-10-21: "it can't be minimized or ignored"). Keyed by
  // WHO + WHEN (the recap's own timestamp), so a death stays gone on every later poll. The agent keeps one recap
  // per player per 5 s and may swap in the fuller one with a slightly different stamp, hence the tolerance.
  // Nothing is uploaded; localStorage keeps it across an overlay reload because the agent holds the recaps for
  // the whole session and a reload would otherwise bring them all back.
  var DEATH_SAME_MS = 5000, DEATH_DISMISS_KEEP = 100;
  var _dismissedDeaths = [];
  try { _dismissedDeaths = JSON.parse(localStorage.getItem('wp_cmd_dead_dismissed') || '[]'); } catch (e) { _dismissedDeaths = []; }
  if (!Array.isArray(_dismissedDeaths)) _dismissedDeaths = [];
  // Who died, always a name: the agent writes "You" when it did not know the character, so that (or nothing)
  // reads as the active character, else "You".
  function deathWho(rc, me){
    var n = rc && rc.name != null ? String(rc.name).trim() : '';
    if (n && !/^you$/i.test(n)) return n;
    return (me && String(me).trim()) || 'You';
  }
  function _deathMs(rc){ var t = Date.parse(rc && rc.ts); return isNaN(t) ? 0 : t; }
  function isDeathDismissed(rc, me){
    var who = deathWho(rc, me).toLowerCase(), t = _deathMs(rc);
    for (var i = 0; i < _dismissedDeaths.length; i++) {
      var d = _dismissedDeaths[i];
      if (d && d.n === who && Math.abs(d.t - t) <= DEATH_SAME_MS) return true;
    }
    return false;
  }
  function dismissDeath(rc, me){
    if (!rc || isDeathDismissed(rc, me)) return;
    _dismissedDeaths.push({ n: deathWho(rc, me).toLowerCase(), t: _deathMs(rc) });
    if (_dismissedDeaths.length > DEATH_DISMISS_KEEP) _dismissedDeaths = _dismissedDeaths.slice(-DEATH_DISMISS_KEEP);
    try { localStorage.setItem('wp_cmd_dead_dismissed', JSON.stringify(_dismissedDeaths)); } catch (e) {}
  }
  function dismissAllDeaths(list, me){
    for (var i = 0; list && i < list.length; i++) dismissDeath(list[i], me);
  }
  function deathDetail(rc){
    var dd = new Date(rc.ts), pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
    var when = isNaN(dd.getTime()) ? '' : (' ' + pad2(dd.getHours()) + ':' + pad2(dd.getMinutes()) + ':' + pad2(dd.getSeconds()));
    var bits = [];
    bits.push(rc.lastChOffMs != null ? ((rc.lastChOffMs / 1000).toFixed(1) + ' s after the last CH') : 'no CH in 20 s');
    if (rc.beatMs) bits.push('beat ' + Math.round(rc.beatMs / 1000) + ' s');
    bits.push('took ' + (rc.dmg6 >= 1000 ? (rc.dmg6 / 1000).toFixed(1) + 'k' : rc.dmg6) + ' in 6 s');
    if (rc.killer) bits.push('by ' + rc.killer);
    return 'died' + when + ' · ' + bits.join(' · ');
  }
  // The whole card ('' when every death is dismissed or there are none). The name is its own never-shrinking
  // cell and the detail is the part that gives way (ellipsis, full text on hover): at a narrow width the old
  // row gave the name zero width and read as "died 14:46:50 · ..." with nobody in front of it.
  function deathRecapsHtml(list, me){
    var vis = [];
    for (var i = 0; list && i < list.length; i++) if (!isDeathDismissed(list[i], me)) vis.push(list[i]);
    if (!vis.length) return '';
    var col = _isCollapsed('deathrecaps');
    var html = '<div class="card death-card"><div class="head death-head">' + secToggle('deathrecaps', '💀 Last deaths', vis.length)
             + (col ? '' : '<span class="deathClearAll" data-wp-interact title="Dismiss all of these deaths (this client)">clear all</span>')
             + '</div>';
    if (!col) {
      html += '<div class="list">';
      for (var j = 0; j < vis.length; j++) {
        var rc = vis[j], who = deathWho(rc, me), det = deathDetail(rc);
        html += '<div class="row death-row"><span class="nm" title="' + esc(who) + '">' + esc(who) + '</span>'
             +    '<span class="death-det" title="' + esc(who + ' ' + det) + '">' + esc(det) + '</span>'
             +    '<span class="deathDismiss" data-wp-interact data-death-who="' + esc(who) + '" data-death-ts="' + esc(rc.ts) + '" title="Dismiss this death (this client)">✕</span></div>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  // 📋 on a deathroll (the guild lead, 2026-09-29: "add in a copy button for deathrolls"): the whole
  // game as ONE chat line to paste in game, e.g. "Deathroll 32,000: A 26189 > B 24160 > ... > B 0.
  // B loses." Plain ASCII (EQ's chat font has no dash or arrow glyphs) and at most 250 characters:
  // past that the opening roll stays, the middle folds to "...", and as many of the last rolls as
  // fit follow. The agent never types into chat; the clipboard is the only legal path (the DPS
  // HUD's 📋 does the same).
  var DR_COPY_MAX = 250;
  function deathrollCopyLine(rs) {
    var g = (rs && rs.deathroll) || {};
    var steps = (g.steps || []).map(function(st){ return String(st.name) + ' ' + st.value; });
    var head = 'Deathroll ' + Number(rs && rs.to).toLocaleString('en-US') + ': ';
    var tail = g.done ? '. ' + g.loser + ' loses.'
      : (rs && rs.open && g.next ? '. ' + (g.next.name ? g.next.name + ' to roll' : 'Next roll') + ' 0-' + g.next.to + '.' : '.');
    var line = head + steps.join(' > ') + tail;
    if (line.length <= DR_COPY_MAX || steps.length < 3) return line.slice(0, DR_COPY_MAX);
    for (var keep = steps.length - 2; keep >= 1; keep--) {
      line = head + steps[0] + ' > ... > ' + steps.slice(steps.length - keep).join(' > ') + tail;
      if (line.length <= DR_COPY_MAX) return line;
    }
    return line.slice(0, DR_COPY_MAX);
  }
  // 🤝 A tie at the top of a set (the guild lead, 2026-10-14: "if two toons roll the same number on a roll
  // it should trigger a deathroll and highlight the tie"). The agent decides it once (rollSetTies) and
  // sends rs.tie / rs.lower_ties; these only draw it and word the line to copy. The deathroll starts at
  // the TIED number, because the deathroll detector chains a roll whose range is the last result.
  function rollTieWhoHtml(rs) {
    var t = rs && rs.tie;
    if (!t) return (rs && rs.winners || []).map(function(w){ return esc(w.name) + ' <b>' + w.value + '</b>'; }).join(', ');
    var chip = '<span class="tt">TIE ' + Number(t.value) + '</span> ';
    if (t.state === 'done') return chip + '<span style="color:#f0c419">' + (t.winners || []).map(esc).join(', ') + '</span> won the deathroll';
    return chip + '<span style="color:#ffa657">' + (t.names || []).map(esc).join(' · ') + '</span>';
  }
  function rollTiePromptText(rs) {
    var t = rs && rs.tie;
    if (!t) return '';
    if (t.state === 'done') return 'Deathroll over: ' + (t.winners || []).join(', ') + ' wins' + ((t.out || []).length ? ' · ' + t.out.join(', ') + ' hit 0' : '');
    if (t.state === 'live') return 'Deathroll going: ' + (t.next && t.next.name ? t.next.name + ' rolls' : 'next roll') + ' /random ' + (t.next ? t.next.to : t.value);
    return 'Tie → deathroll: ' + t.starter + ' starts with /random ' + t.value;
  }
  // The row for one roll inside an expanded set: top-tie rows carry a TIE chip and the orange number,
  // a lower tie only a dim "=". A re-roll is never part of a tie.
  function rollTieRowHtml(rs, d) {
    var t = rs && rs.tie;
    var top = !!(t && !d.reroll && d.value === t.value && (t.names || []).indexOf(d.name) !== -1);
    var low = !top && !d.reroll && (rs && rs.lower_ties || []).indexOf(d.value) !== -1;
    return { cls: top ? ' tie' : '', mark: top ? '<span class="tt">TIE</span>' : (low ? '<span class="eq" title="Same number as another roller">=</span>' : '') };
  }
  // 📋 for a tie: ONE raid-say line, never sent for you. The tied number is the deathroll's first range.
  function rollTieCopyLine(rs) {
    var t = (rs && rs.tie) || {};
    var item = rs && rs.item ? ' on ' + String(rs.item).slice(0, 40) : '';
    var names = (t.names || []);
    var line;
    if (t.state === 'done') line = '/rs Deathroll over' + item + ': ' + (t.winners || []).join(', ') + ' wins the ' + t.value + ' tie.';
    else if (t.state === 'live') line = '/rs TIE ' + t.value + item + ': ' + names.join(' vs ') + '. Deathroll live, '
      + (t.next && t.next.name ? t.next.name + ' rolls' : 'next roll') + ' /random ' + (t.next ? t.next.to : t.value) + '.';
    else line = '/rs TIE ' + t.value + item + ': ' + names.join(' vs ') + '. Deathroll! ' + t.starter + ' rolls /random ' + t.value
      + ', then each rolls what the last got. First to 0 ' + (names.length > 2 ? 'is out.' : 'loses.');
    // Plain ASCII only (no backslash in this file, so no escape class): drop anything outside space..tilde.
    return line.split('').filter(function(ch){ return ch >= ' ' && ch <= '~'; }).join('').slice(0, DR_COPY_MAX);
  }
  // Which deathroll was just copied, so its 📋 reads ✓ for two seconds across the 1.5s repaints.
  var _copiedRoll = null, _copiedUntil = 0;
  function _copyText(text, done) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
      var ta = document.createElement('textarea'); ta.value = text;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { void e; }
    done();
  }

  // #153 Collapsible sections — per-section collapse state persisted across
  // repaints AND restarts. It lives in this JS store (consulted by render()),
  // NOT in DOM open/closed state, which every innerHTML repaint would wipe (the
  // wpKeep lesson from the dashboard). localStorage carries it across agent /
  // Mimic restarts.
  var _collapsedSections = {};
  try { _collapsedSections = JSON.parse(localStorage.getItem('wp_cmd_collapsed') || '{}') || {}; } catch (e) { _collapsedSections = {}; }
  function _isCollapsed(key){ return !!_collapsedSections[key]; }
  function _toggleCollapsed(key){
    _collapsedSections[key] = !_collapsedSections[key];
    try { localStorage.setItem('wp_cmd_collapsed', JSON.stringify(_collapsedSections)); } catch (e) {}
  }
  // Section header caret+label — the click target that collapses/expands the
  // section. Collapsed it carries a compact count ("▸ Healer mana (3)");
  // expanded it shows the caret + label and the section's rows render below.
  function secToggle(key, label, count){
    var col = _isCollapsed(key);
    var cnt = (col && count != null) ? ' (' + count + ')' : '';
    return '<span class="sec-toggle" data-wp-interact data-collapse-key="' + esc(key) + '" title="'
         + (col ? 'Expand' : 'Collapse') + ' this section">'
         + (col ? '▸' : '▾') + ' ' + esc(label) + cnt + '</span>';
  }

  // Divine Intervention (#50) as compact chips beside the HEALER MANA header
  // (#66) — "DI: Bellwick ✓ · Norbray 45s". Same data as the old DI card, only
  // reshaped. Gold ring when exactly one cleric is up (save it for the tank).
  function diChips(di){
    if (!di || !di.clerics || !di.clerics.length) return '';
    var solo = di.up_count === 1 && di.clerics.length > 1;
    var parts = [];
    for (var i = 0; i < di.clerics.length; i++) {
      var dc = di.clerics[i];
      parts.push(dc.unknown
        ? '<span class="unk" title="No DI cast observed for this cleric — availability unknown, not confirmed ready">' + esc(dc.name) + ' ?</span>'
        : dc.up
        ? '<span class="up">' + esc(dc.name) + ' ✓</span>'
        : '<span class="cd">' + esc(dc.name) + ' ' + Math.max(1, dc.seconds || 1) + 's</span>');
    }
    return '<span class="di-chips' + (solo ? ' solo' : '') + '"><span class="di-lab">DI:</span>'
         + parts.join('<span class="sep">·</span>') + '</span>';
  }

  function hpClass(pct){ if (pct == null) return ''; if (pct <= 25) return 'crit'; if (pct <= 50) return 'low'; return ''; }
  function manaClass(pct){ if (pct == null) return ''; if (pct <= 15) return 'crit'; if (pct <= 35) return 'low'; return ''; }
  // HP bar label — raw "cur / max · pct%" when the local character's own Zeal
  // reported the numbers, else just the percentage.
  function hpValText(pct, cur, max){
    if (pct == null) return null;
    if (cur != null && max != null) return cur + ' / ' + max + ' · ' + pct + '%';
    return pct + '%';
  }
  // Two or more raids at once (the bot names them only then): one row per raid, its leader and
  // how many players it has, yours marked — the cures and the healer mana below are yours
  // (the guild lead, 2026-10-03: "raid leaders and player counts for when we have multiple
  // raids going"). Yours first, then the biggest.
  function raidsNoteHtml(raids){
    var list = raids.filter(function(r){ return !!r; }).slice().sort(function(a, b){
      if (!!a.mine !== !!b.mine) return a.mine ? -1 : 1;
      return (Number(b.size) || 0) - (Number(a.size) || 0);
    });
    var total = 0;
    for (var i = 0; i < list.length; i++) total += Number(list[i].size) || 0;
    var h = '<div class="card raids-card"><div class="head">' + secToggle('raids', '⚔ ' + list.length + ' raids · ' + total + ' players', null) + '</div>';
    if (!_isCollapsed('raids')) {
      h += '<div class="list">';
      for (var j = 0; j < list.length; j++) {
        var r = list[j];
        h += '<div class="row' + (r.mine ? ' mine' : '') + '">'
           +   '<span class="nm">👑 ' + esc(r.leader || '?') + '</span>'
           +   (r.mine ? '<span class="yours">yours</span>' : '')
           +   '<b class="cnt">' + esc(r.size) + '</b>'
           + '</div>';
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  // 🐺 Hail board (the guild lead, 2026-10-05; option A, one board the whole raid shares): a PoP boss
  // died and its flag NPC stands for 20 minutes. One card per open window: who still has to hail it
  // (tap a name to mark it hailed, for the whole raid), who has, and how many were flagged before it
  // opened. The agent hands this over in state.hail, already narrowed to this raid.
  var HAIL_STILL_CAP = 30;   // a 70-raider list at the open of a window must not outgrow the screen
  var HAIL_DONE_CAP  = 8;
  var _hailMore = new Set();   // 'windowId|still' / 'windowId|hailed' lists opened past their cap (this client)
  var _hailPend = new Set();   // 'windowId|name' taps sent and not answered yet; the chip dims meanwhile
  // "leaves in 17:52", then "gone". Painted by paintHailClocks() every second from the card's data-end and
  // never put in the card's HTML: a clock in the HTML would repaint the whole board each second, and a
  // repaint between a press and its release throws the tap away. The end is when the NPC's script depops it.
  // urgent = the last two minutes (red), soon = the last five (amber).
  function hailClockState(endMs, nowMs){
    var left = Math.round((endMs - nowMs) / 1000);
    if (!(left > 0)) return { text: 'gone', gone: true, urgent: true, soon: true };
    return { text: 'leaves in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'),
      gone: false, urgent: left <= 120, soon: left <= 300 };
  }
  function hailClockText(endMs, nowMs){ return hailClockState(endMs, nowMs).text; }
  // "Flags: 23 / 72 used", from the bot's flag_cap / flags_granted / flags_left. Nothing at all when the
  // bot sent no cap (an older bot, or an NPC whose script states none). The count is only the grants we
  // saw, so the note says so, and the warning fires when the flags left do not outnumber the raiders
  // still to hail.
  function hailCapHtml(w, stillCount){
    var cap = w.flag_cap == null ? NaN : Number(w.flag_cap);
    if (!(cap > 0)) return '';
    var used = Math.max(0, Number(w.flags_granted) || 0);
    var left = w.flags_left == null ? Math.max(0, cap - used) : Math.max(0, Number(w.flags_left) || 0);
    var tight = stillCount > 0 && left <= stillCount;
    return '<div class="hail-cap" title="Counts every raider we saw hail or get the flag. A hail we never saw, or by someone outside the raid, is not counted, so more may be gone.">'
         + 'Flags: <b>' + used + ' / ' + cap + '</b> used<span class="note">seen only</span></div>'
         + (tight ? '<div class="hail-cap warn">' + (left === 0 ? '⚠ No flags left, ' : '⚠ Only ' + left + ' flag' + (left === 1 ? '' : 's') + ' left, ')
         + stillCount + ' still to hail</div>' : '');
  }
  function hailMoreHtml(key, total, cap, open){
    if (total <= cap) return '';
    return '<span class="hail-more" data-wp-interact data-hail-more="' + esc(key) + '" title="'
         + (open ? 'Show fewer' : 'Show every name') + '">' + (open ? 'fewer ▴' : '+' + (total - cap) + ' more ▸') + '</span>';
  }
  function hailBoardHtml(windows, selfName){
    var me = String(selfName || '').toLowerCase();
    var wins = windows.slice().sort(function(a, b){ return (a.ms_left || 0) - (b.ms_left || 0); }).slice(0, 3);
    var h = '';
    for (var wi = 0; wi < wins.length; wi++) {
      var w = wins[wi], wid = String(w.id);
      var still = (w.still || []).slice(), hailed = w.hailed || [], flagged = w.already_flagged || [];
      var col = _isCollapsed('hail');
      var end = w.ends_at_ms != null ? w.ends_at_ms : Math.round((Date.now() + (w.ms_left || 0)) / 1000) * 1000;
      // You first, so the name you are looking for is where the eye lands.
      for (var mi = 0; mi < still.length; mi++) {
        if (String(still[mi].name).toLowerCase() === me) { still.unshift(still.splice(mi, 1)[0]); break; }
      }
      h += '<div class="card hail-card"><div class="head hail-head">'
         +   '<span class="sec-toggle" data-wp-interact data-collapse-key="hail" title="' + (col ? 'Expand' : 'Collapse') + ' this section">'
         +     (col ? '▸' : '▾') + ' Hail · <span class="npc">' + esc(w.npc_name || w.boss_name || '?') + '</span>'
         +     (col ? ' (' + still.length + ')' : '') + '</span>'
         +   '<span class="hail-clock" data-end="' + esc(end) + '"></span>'
         + '</div>';
      if (!col) {
        h += hailCapHtml(w, still.length);
        if (still.length) {
          var stillOpen = _hailMore.has(wid + '|still');
          var sMax = stillOpen ? still.length : Math.min(still.length, HAIL_STILL_CAP);
          h += '<div class="hail-sub todo">Still to hail <b>(' + still.length + ')</b></div><div class="hail-chips">';
          for (var si = 0; si < sMax; si++) {
            var sr = still[si], sLow = String(sr.name).toLowerCase();
            h += '<span class="hail-chip tap' + (sr.prior_missing ? ' flag' : '') + (sLow === me ? ' me' : '')
               +   (_hailPend.has(wid + '|' + sLow) ? ' pend' : '')
               +   '" data-wp-interact data-hail-act="mark" data-hail-win="' + esc(wid) + '" data-hail-name="' + esc(sr.name) + '" title="'
               +   esc(sr.prior_missing ? (sr.prior_note || 'Missing an earlier step, so a hail may not flag them. Tap to mark them hailed.') : 'Tap to mark ' + sr.name + ' as hailed') + '">'
               +   esc(sr.name) + (sr.prior_missing ? '<span class="prior">⚠ needs prior step</span>' : '') + '</span>';
          }
          h += hailMoreHtml(wid + '|still', still.length, HAIL_STILL_CAP, stillOpen) + '</div>';
        } else {
          h += '<div class="hail-sub done">Nobody left to hail ✓</div>';
        }
        if (hailed.length) {
          var doneOpen = _hailMore.has(wid + '|hailed');
          var dMax = doneOpen ? hailed.length : Math.min(hailed.length, HAIL_DONE_CAP);
          h += '<div class="hail-sub done">Hailed ✓ <b>(' + hailed.length + ')</b></div><div class="hail-chips">';
          for (var di = 0; di < dMax; di++) {
            var dr = hailed[di], undo = dr.how === 'marked';
            var how = dr.how === 'flag' ? 'Got the flag' : (undo ? 'Marked by ' + (dr.by || 'a raider') + ' - tap to undo' : 'Seen hailing');
            h += '<span class="hail-chip ok' + (undo ? ' undo' : '') + (_hailPend.has(wid + '|' + String(dr.name).toLowerCase()) ? ' pend' : '') + '"'
               +   (undo ? ' data-wp-interact data-hail-act="unmark" data-hail-win="' + esc(wid) + '" data-hail-name="' + esc(dr.name) + '"' : '')
               +   ' title="' + esc(how) + '">' + esc(dr.name) + '</span>';
          }
          h += hailMoreHtml(wid + '|hailed', hailed.length, HAIL_DONE_CAP, doneOpen) + '</div>';
        }
        if (flagged.length) h += '<div class="hail-dim" title="' + esc(flagged.slice(0, 40).join(', ')) + '">' + flagged.length + ' already flagged</div>';
        var seen = Number(w.seen_by) || 0;
        h += '<div class="hail-foot">' + (seen > 0 ? 'seen by ' + seen + ' Mimic' + (seen === 1 ? '' : 's') + ' · ' : '') + 'tap a name to mark it hailed</div>';
      }
      h += '</div>';
    }
    return h;
  }

  function rampHtml(r, multi){
    var rhp = r.hp_pct == null ? null : Math.max(0, Math.min(100, Math.round(r.hp_pct)));
    var rda = r.da || null;
    var barCls  = rda ? (rda.critical ? 'inv-soon' : 'gold') : hpClass(rhp);
    var barW    = rda ? 100 : (rhp == null ? 0 : rhp);
    var daTags  = rda ? '<span class="inv-tag l">INV</span><span class="inv-tag r">INV</span>' : '';
    var valText = rda ? ('INV ' + fmtSec(rda.seconds)) : (rhp == null ? 'HP not visible' : rhp + '%');
    var lead = multi ? ('💀 ' + esc(r.attacker || 'Boss') + ': rampage on ') : '💀 Rampage on ';
    return '<div class="ramp">'
         +    '<div class="row">' + lead + '<span class="who">' + esc(r.target) + '</span></div>'
         +    '<div class="hpwrap"><div class="hpbar ' + barCls + '" style="width:' + barW + '%"></div>'
         +      daTags
         +      '<div class="val">' + valText + '</div></div>'
         +  '</div>';
  }
  // Relv's event in Plane of Storms (the guild lead, 2026-10-30): mephits this client has seen die, of the 30.
  // The agent sends s.relv only while the event runs; the count is a floor (a far death line never prints here).
  function relvHtml(v){
    var left = Math.max(0, (Number(v.total) || 30) - (Number(v.mephits) || 0));
    var main = v.falto_slain ? 'Falto slain'
             : (v.falto_up ? 'Falto is up'
             : 'mephits <span class="n">' + (Number(v.mephits) || 0) + '/' + (Number(v.total) || 30) + '</span> · ' + left + ' left');
    return '<div class="relv"><span>🔥 Falto: ' + main + '</span>'
         +   '<span class="sub">mepheekas killed ' + (Number(v.mepheekas) || 0) + '</span></div>';
  }
  // 🎟 Guests (officers only; the guild lead, 2026-10-30: "add guests to the command center for officers/admins with an
  // extend button for +1/+3"). s.guests is the agent's copy of the bot's guest-link list, or null for anyone who is not
  // an officer, so the card simply is not there for a raider. A guest whose key ended more than 12 hours ago is left
  // off (the bot will not revive it; approve a new code on /admin/links), and a revoked one has nothing to extend.
  // The buttons act on the PRESS like the hail chips: the card repaints once a minute as the clock moves.
  var GUEST_REVIVE_MS = 12 * 3600000;
  var _guestPend  = {};   // session id -> true while its extend is in flight
  var _guestFlash = {};   // session id -> { txt, bad, until }: the answer, shown for a few seconds in place of the buttons
  function guestSpan(ms){
    var m = Math.floor(ms / 60000);
    if (m < 1) return 'under 1m';
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60), r = m % 60;
    return h + 'h' + (r < 10 ? '0' : '') + r + 'm';
  }
  function guestsHtml(list){
    var now = Date.now();
    var rows = [];
    for (var gi = 0; gi < list.length; gi++) {
      var g = list[gi];
      if (!g || g.revoked || !g.id) continue;
      var exp = Date.parse(g.expires_at);
      if (!isFinite(exp) || exp < now - GUEST_REVIVE_MS) continue;
      rows.push({ g: g, exp: exp });
    }
    if (!rows.length) return '';
    var col = _isCollapsed('guests');
    var h = '<div class="card guests-card"><div class="head">' + secToggle('guests', '🎟 Guests', rows.length) + '</div>';
    if (!col) {
      h += '<div class="list">';
      for (var ri = 0; ri < rows.length; ri++) {
        var gg = rows[ri].g, left = rows[ri].exp - now;
        var when = left > 0 ? 'expires in ' + guestSpan(left) : 'expired ' + guestSpan(-left) + ' ago';
        var cls = left <= 0 ? 'out' : (left < 600000 ? 'soon' : '');
        var n = Number(gg.fights) || 0;
        var fl = _guestFlash[gg.id];
        if (fl && fl.until <= now) { delete _guestFlash[gg.id]; fl = null; }
        var ctl;
        if (_guestPend[gg.id]) ctl = '<span class="gflash">…</span>';
        else if (fl) ctl = '<span class="gflash' + (fl.bad ? ' bad' : '') + '">' + esc(fl.txt) + '</span>';
        else ctl = '<span class="guestExt" data-wp-interact data-guest-id="' + esc(gg.id) + '" data-guest-h="1" title="Keep this guest link open one more hour">+1h</span>'
                 + '<span class="guestExt" data-wp-interact data-guest-id="' + esc(gg.id) + '" data-guest-h="3" title="Keep this guest link open three more hours">+3h</span>';
        h += '<div class="row guest-row"><span class="nm" title="' + esc((gg.label || 'Guest') + (gg.approved_by ? ' - approved by ' + gg.approved_by : '')) + '">' + esc(gg.label || 'Guest') + '</span>'
           +   '<span class="gwhen ' + cls + '">' + esc(when) + '</span>'
           +   '<span class="gn">' + n + (n === 1 ? ' fight' : ' fights') + '</span>'
           +   ctl + '</div>';
      }
      h += '</div>';
    }
    return h + '</div>';
  }
  function guestExtend(id, hours){
    if (!id || _guestPend[id] || (hours !== 1 && hours !== 3)) return;
    _guestPend[id] = true;
    if (_lastState) render(_lastState);
    var done = function(txt, bad){
      delete _guestPend[id];
      _guestFlash[id] = { txt: txt, bad: !!bad, until: Date.now() + 4000 };
      tick();
    };
    fetch('http://127.0.0.1:' + PORT + '/api/guest-extend', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, hours: hours }),
    }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok && j && j.ok, err: j && j.error }; }, function(){ return { ok: false, err: '' }; });
    }).then(function(res){
      done(res.ok ? '+' + hours + 'h ✓' : (res.err === 'revoked' ? 'revoked' : (res.err && res.err.indexOf('expired too long') === 0 ? 'too old' : 'failed')), !res.ok);
    }, function(){ done('failed', true); });
  }

  function render(s){
    if (!s || s.character == null) {
      contentEl.innerHTML = '<div id="empty">No focused character yet — launch EQ + Zeal and target a mob.</div>';
      whoEl.textContent = '';
      return;
    }
    whoEl.textContent = '· ' + ((s.mt && s.mt.name) ? 'MT ' + s.mt.name : s.character);

    var html = '';
    if (s.raids && s.raids.length > 1) html += raidsNoteHtml(s.raids);

    // Target HP + boss enrage warning (same data the Tank overlay shows).
    if (s.target && s.target.name) {
      var thp = s.target.hp_pct == null ? null : Math.max(0, Math.min(100, Math.round(s.target.hp_pct)));
      html += '<div class="card">'
           +    '<div class="head">Target — ' + esc(s.target.name) + '</div>'
           +    '<div class="hpwrap"><div class="hpbar ' + hpClass(100 - (thp || 0)) + '" style="width:' + (thp == null ? 0 : thp) + '%"></div>'
           +      '<div class="val">' + (thp == null ? '—' : thp + '%') + '</div></div>'
           +  '</div>';
      // Gone once its enrage has ended (the guild lead, 2026-10-02).
      if (s.enrage && s.enrage.enrages && !s.enrage.ended && thp != null && thp <= s.enrage.warn_pct) {
        var critEnrage = s.enrage.enraged || thp <= (s.enrage.threshold_pct + 2);
        html += '<div class="enrage ' + (critEnrage ? 'crit' : '') + '">'
             +    (s.enrage.enraged ? '⚠️ ENRAGED (currently ' + thp + '%)' : '⚠️ Enrage near — watch for ≤' + s.enrage.threshold_pct + '% (currently ' + thp + '%)')
             +  '</div>';
      }
    }

    // Death Touch countdown — mirrors any active "Death Touch"-named guild
    // trigger's timer, same as the Tank overlay.
    if (s.deathtouch && s.deathtouch.seconds != null) {
      var dtCrit = !!s.deathtouch.critical;
      html += '<div class="dt ' + (dtCrit ? 'crit' : '') + '">'
           +    '<span>☠️ Death Touch' + (s.deathtouch.target ? ' — ' + esc(s.deathtouch.target) : '') + '</span>'
           +    '<span class="sec">' + fmtSec(s.deathtouch.seconds) + '</span>'
           +  '</div>';
    }

    // Main Tank HP (compact — buffs/DS detail stays on the Tank overlay).
    if (s.mt && s.mt.name) {
      var mthp = s.mt.hp_pct == null ? null : Math.max(0, Math.min(100, Math.round(s.mt.hp_pct)));
      var mtVal = hpValText(mthp, s.mt.hp_cur, s.mt.hp_max);
      html += '<div class="card">'
           +    '<div class="head">Main Tank — ' + esc(s.mt.name) + (s.mt.is_self ? ' (you)' : '') + '</div>'
           +    '<div class="hpwrap"><div class="hpbar ' + hpClass(mthp) + '" style="width:' + (mthp == null ? 0 : mthp) + '%"></div>'
           +      '<div class="val">' + (mtVal == null ? 'HP not visible' : mtVal) + '</div></div>'
           +  '</div>';
    }

    // Rampage target + invuln (DA/Harmshield/etc) highlight — identical to
    // the Tank overlay's card.
    // Several bosses rampaging at once (rampages has 2+): one row per attacker. With 0-1 it is the single
    // card above, byte for byte, and an older agent that sends no rampages array lands here too.
    var rampRows = (s.rampages && s.rampages.length > 1) ? s.rampages : (s.rampage && s.rampage.target ? [s.rampage] : []);
    for (var ri = 0; ri < rampRows.length; ri++) html += rampHtml(rampRows[ri], rampRows.length > 1);
    if (s.relv) html += relvHtml(s.relv);

    // PoP hail board — straight under the fight cluster (target, enrage, Death Touch, Main Tank, rampage),
    // above the long lists: after a kill there is no fight to push it down, and a fight that starts while
    // a window is still open keeps its own cards on top. An open window is the one thing here with a
    // clock and a name to tap, so it should not sit under the roll and cure lists.
    if (s.hail && s.hail.length) {
      var _hailIds = {};
      for (var hq = 0; hq < s.hail.length; hq++) _hailIds[String(s.hail[hq].id)] = true;
      _hailMore.forEach(function(k){ if (!_hailIds[k.slice(0, k.lastIndexOf('|'))]) _hailMore.delete(k); });
      html += hailBoardHtml(s.hail, s.character);
    } else if (_hailMore.size) {
      _hailMore.clear();
    }

    // Raid-wide DA/invuln broadcasts — every tank currently reporting status
    // via their own raid-chat macro (a member's ">> DA up << 18 secs" etc),
    // not just whoever's the current Rampage target above.
    if (s.da_broadcasts && s.da_broadcasts.length) {
      var defCollapsed = _isCollapsed('defensives');
      html += '<div class="card"><div class="head">' + secToggle('defensives', 'Defensives', s.da_broadcasts.length)
           +    (defCollapsed ? '' : ' (active / recharging)') + '</div>';
      if (!defCollapsed) {
        html += '<div class="list">';
        for (var i = 0; i < s.da_broadcasts.length; i++) {
          var d = s.da_broadcasts[i];
          var chipCls, chipTxt;
          if (d.state === 'cooldown') {
            // Discipline used, now recharging — count DOWN until it's available.
            chipCls = 'down';
            chipTxt = 'DOWN · ' + fmtSec(d.cooldown_secs);
          } else if (d.seconds == null) {
            chipCls = 'up'; chipTxt = 'UP';                       // up, duration unknown
          } else {
            chipCls = d.seconds <= 5 ? 'soon' : 'up';
            chipTxt = fmtSec(d.seconds);                          // remaining ACTIVE time
          }
          html += '<div class="row"><span class="nm">' + esc(d.name) + '</span>'
               +    (d.kind ? '<span class="cls">' + esc(d.kind) + '</span>' : '')
               +    '<span class="da-chip ' + chipCls + '">' + chipTxt + '</span></div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    // YOUR discipline reuse timer (the guild lead, 2026-08-30: "discipline cooldowns
    // should be tracked on the command center for the user only"). Self only,
    // on purpose — EQ only ever states this timer for your own character, and
    // guessing someone else's from their activation emote would mean guessing
    // a reuse that differs per discipline. Absent = ready, or never observed:
    // the line only appears when you try a disc too early, so an empty card
    // is not a claim that you are ready, and the copy says so.
    if (s.discipline && s.discipline.seconds > 0) {
      html += '<div class="card"><div class="head">Your discipline</div>'
           +    '<div class="list"><div class="row">'
           +      '<span class="nm">' + esc(s.discipline.character || 'You') + '</span>'
           +      '<span class="cls">recharging</span>'
           +      '<span class="da-chip down">' + fmtSec(s.discipline.seconds) + '</span>'
           +    '</div></div></div>';
    }

    // Healer mana roster — self-reported "N% mana" call-outs, lowest first
    // so the group needing a mana break is easy to spot at a glance. Divine
    // Intervention readiness (#50) rides in the header as compact chips (#66);
    // the CH-chain overlay owns the "only <X> has DI" voice callout so nobody
    // hears it twice.
    var diChipsHtml = diChips(s.di);
    if (s.healer_mana && s.healer_mana.length) {
      var manaCollapsed = _isCollapsed('mana');
      html += '<div class="card"><div class="head mana-head">' + secToggle('mana', 'Healer mana', s.healer_mana.length) + diChipsHtml + '</div>';
      if (!manaCollapsed) {
        html += '<div class="list">';
        for (var j = 0; j < s.healer_mana.length; j++) {
          var h = s.healer_mana[j];
          html += '<div class="row"><span class="nm">' + esc(h.name) + '</span>'
               +    (h.class ? '<span class="cls">' + esc(h.class) + '</span>' : '')
               +    '<div class="mana-bar"><div class="fill ' + manaClass(h.pct) + '" style="width:' + h.pct + '%"></div></div>'
               +    '<span class="mana-pct">' + h.pct + '%</span></div>';
        }
        html += '</div>';
      }
      html += '</div>';
    } else if (diChipsHtml) {
      // DI available but no mana call-outs yet — show the chips on their own
      // compact line rather than losing them.
      html += '<div class="card"><div class="head mana-head">Healer mana' + diChipsHtml + '</div></div>';
    }

    // Live OpenDKP auctions, one row each, soonest first (the guild lead,
    // 2026-10-02: "add in loot auction timers on the control center ... as people
    // bid when it's low time left, it does extend it further out"). The agent
    // re-reads each end every poll, so a late bid moves the time and the row
    // says "extended".
    if (s.auctions && s.auctions.length) {
      html += '<div class="card"><div class="head">' + secToggle('auctions', '⚖ Auctions', s.auctions.length) + '</div>';
      if (!_isCollapsed('auctions')) {
        for (var ai = 0; ai < s.auctions.length && ai < 8; ai++) {
          var au = s.auctions[ai], aLeft = Math.max(0, Math.round((au.ms_left || 0) / 1000));
          var aTxt = Math.floor(aLeft / 60) + ':' + String(aLeft % 60).padStart(2, '0');
          var aCol = aLeft <= 15 ? '#f85149' : (aLeft <= 60 ? '#ffa657' : '#d29922');
          html += '<div class="row" style="display:flex;gap:6px;align-items:baseline">'
               +    '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(au.item) + '</span>'
               +    (au.extended ? '<span class="dim" style="font-size:10px" title="A late bid moved the end">extended</span>' : '')
               +    '<b style="color:' + aCol + ';font-variant-numeric:tabular-nums">' + aTxt + '</b>'
               +  '</div>';
        }
      }
      html += '</div>';
    }

    // /random roll sets (last 15 min) — "333 (Item name) — Winner names"
    // (the guild lead, 2026-07-10). Winners = top-(qty) first-rolls; the qty comes
    // from the loot link "Item (3)333". Full per-roll detail lives on the
    // agent dashboard's 🎲 Rolls card.
    // Each row expands to the FULL roll list (the guild lead, 2026-08-14: "a drop-down to
    // open up lower rolls ... and see who else rolled"), and carries a ✕ so a
    // resolved item leaves the card while the next one is still being rolled.
    if (s.rolls && s.rolls.length) {
      // Reconcile both local sets against the fresh payload, so ids that aged
      // out of the 15-minute window don't accumulate forever.
      var _rollIds = new Set();
      for (var q0 = 0; q0 < s.rolls.length; q0++) { var _rid0 = _rollId(s.rolls[q0]); if (_rid0) _rollIds.add(_rid0); }
      _dismissedRolls.forEach(function(id){ if (!_rollIds.has(id)) _dismissedRolls.delete(id); });
      _openRolls.forEach(function(id){ if (!_rollIds.has(id)) _openRolls.delete(id); });
      var visRolls = [];
      for (var q1 = 0; q1 < s.rolls.length; q1++) {
        var _ridv = _rollId(s.rolls[q1]);
        if (_ridv && _dismissedRolls.has(_ridv)) continue;
        visRolls.push(s.rolls[q1]);
      }
      if (visRolls.length) {
        var rollsCollapsed = _isCollapsed('rolls');
        html += '<div class="card rolls-card"><div class="head rolls-head">'
             +    secToggle('rolls', '🎲 Rolls', visRolls.length)
             +    (rollsCollapsed ? '' : '<span class="rollClearAll" data-wp-interact title="Dismiss every roll set (this client, until new ones land)">clear all</span>')
             +  '</div>';
        if (!rollsCollapsed) {
          html += '<div class="list">';
          // Six, then a "+N more" tail — matching the trigger overlay's cap. Four
          // was too few for a real loot session: the guild lead's Aug 11 night ran eight
          // sets and the card silently showed half of them, with nothing to say it
          // was truncating (2026-08-12).
          var rMax = Math.min(visRolls.length, 6);
          for (var ri = 0; ri < rMax; ri++) {
            var rs  = visRolls[ri];
            var rid = _rollId(rs);
            var expanded = !!(rid && _openRolls.has(rid));
            if (rs.kind === 'deathroll') {
              // ☠️ A deathroll is ONE row (the guild lead, 2026-09-23, option A), not
              // a dozen "1 roll" sets. Expand shows each step in order.
              var dg = rs.deathroll || {};
              var dn = (dg.players || []).map(esc);
              var dState = dg.done ? '<span style="color:#f85149">' + esc(dg.loser) + ' hit 0</span>'
                : (rs.open && dg.next ? '<span style="color:#f0c419">' + (dg.next.name ? esc(dg.next.name) + ' to roll' : 'next') + ' 0–' + dg.next.to + '</span>'
                : '<span style="opacity:.6">stopped</span>');
              html += '<div class="row roll-row"><span class="nm">☠️ <b>' + Number(rs.to).toLocaleString('en-US') + '</b> — '
                   +    (dn.length === 2 ? dn[0] + ' vs ' + dn[1] : dn.join(', ')) + ' · ' + dState + '</span>'
                   +    '<span class="rollCopy" data-wp-interact data-roll-id="' + esc(rid) + '" title="Copy this deathroll as one line to paste in game">'
                   +      (rid === _copiedRoll && Date.now() < _copiedUntil ? '✓' : '📋') + '</span>'
                   +    '<span class="rollMore" data-wp-interact data-roll-key="' + esc(rid) + '" title="'
                   +      (expanded ? 'Hide' : 'Show') + ' every roll in this deathroll">'
                   +      (expanded ? '▾' : '▸') + ' ' + (dg.steps || []).length + ' rolls</span>'
                   +    '<span class="cls">' + (rs.open ? 'live' : '') + '</span>'
                   +    '<span class="rollDismiss" data-wp-interact data-roll-id="' + esc(rid) + '" title="Dismiss this deathroll (this client)">✕</span></div>';
              if (expanded) {
                html += '<div class="roll-detail">';
                for (var dk = 0; dk < (dg.steps || []).length; dk++) {
                  var ds = dg.steps[dk];
                  html += '<div class="d' + (ds.value === 0 ? ' lose' : '') + '"><span>' + esc(ds.name) + '</span>'
                       +    '<span class="rng">0–' + ds.to + '</span><span class="v">' + ds.value + '</span></div>';
                }
                html += '</div>';
              }
              continue;
            }
            var winners = (rs.winners || []).map(function(w){ return esc(w.name) + ' <b>' + w.value + '</b>'; }).join(', ');
            // A range that does not start at 0 shows in full (the guild lead, 2026-10-12: a "999" set
            // that was really 999 to 999 read like an ordinary 0 to 999 roll).
            html += '<div class="row roll-row"><span class="nm"><b>' + (rs.from ? rs.from + '–' : '') + rs.to + '</b>'
                 +    (rs.item ? ' (' + esc(rs.item) + (rs.qty ? ' ×' + rs.qty : '') + ')' : '')
                 +    ' — ' + (rs.tie ? rollTieWhoHtml(rs) : '<span style="color:#f0c419">' + (winners || '—') + '</span>') + '</span>'
                 +    (rs.tie ? '<span class="rollCopy" data-wp-interact data-roll-id="' + esc(rid) + '" title="Copy a raid-say line announcing this tie and its deathroll">'
                 +      (rid === _copiedRoll && Date.now() < _copiedUntil ? '✓' : '📋') + '</span>' : '')
                 +    '<span class="rollMore" data-wp-interact data-roll-key="' + esc(rid) + '" title="'
                 +      (expanded ? 'Hide' : 'Show') + ' every roll in this set">'
                 +      (expanded ? '▾' : '▸') + ' ' + rs.players + ' roll' + (rs.players === 1 ? '' : 's') + '</span>'
                 +    '<span class="cls">' + (rs.open ? 'open' : '') + '</span>'
                 +    '<span class="rollDismiss" data-wp-interact data-roll-id="' + esc(rid) + '" title="Dismiss this roll set (this client)">✕</span></div>';
            if (expanded) {
              // Highest first, so the losing rolls read straight down from the
              // winner. Re-rolls are shown but flagged — they never win, and
              // hiding them would make the count disagree with the list.
              var all = (rs.rolls || []).slice().sort(function(a, b){ return b.value - a.value; });
              var winNames = {};
              for (var wj = 0; wj < (rs.winners || []).length; wj++) winNames[String(rs.winners[wj].name).toLowerCase()] = true;
              html += '<div class="roll-detail">';
              if (rs.tie) html += '<div class="d tiebox">' + esc(rollTiePromptText(rs)) + '</div>';
              for (var dj = 0; dj < all.length; dj++) {
                var d = all[dj];
                var isWin = !d.reroll && winNames[String(d.name).toLowerCase()] === true;
                var tieRow = rollTieRowHtml(rs, d);
                html += '<div class="d' + (isWin && !rs.tie ? ' win' : '') + tieRow.cls + '"><span>' + esc(d.name) + '</span>'
                     +    (d.reroll ? '<span class="rr">re-roll</span>' : '') + tieRow.mark
                     +    '<span class="v">' + d.value + '</span></div>';
              }
              if (rs.tie) {
                for (var tk = 0; tk < (rs.tie.steps || []).length; tk++) {
                  var ts = rs.tie.steps[tk];
                  html += '<div class="d' + (ts.value === 0 ? ' lose' : '') + '"><span>' + esc(ts.name) + '</span>'
                       +    '<span class="rng">0–' + ts.to + '</span><span class="v">' + ts.value + '</span></div>';
                }
              }
              if (!all.length) html += '<div class="d"><span>no per-roll detail captured</span></div>';
              html += '</div>';
            }
          }
          if (visRolls.length > rMax) {
            html += '<div class="row"><span class="nm" style="opacity:.6">+' + (visRolls.length - rMax)
                 +  ' more — see the 🎲 Rolls card on the dashboard</span></div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }

    // 🎟 Guests (officers only): s.guests is null for everyone else, and an empty list draws nothing.
    if (s.guests && s.guests.length) html += guestsHtml(s.guests);

    // Curse/Cure alerts — reuses the buff queue's real observed-debuff
    // tracking (not chat parsing) so it stays accurate even when nobody's
    // typed a "please cure" macro. Per-line ✕ + "clear all" dismiss (#66) are
    // LOCAL to this client: reconcile the dismissed set against the fresh
    // payload (forget ids no longer present so a re-land re-shows), then filter.
    if (s.cures && s.cures.length) {
      var _curIds = new Set();
      for (var ci0 = 0; ci0 < s.cures.length; ci0++) { var _id0 = _cureId(s.cures[ci0]); if (_id0) _curIds.add(_id0); }
      _dismissedCures.forEach(function(id){ if (!_curIds.has(id)) _dismissedCures.delete(id); });
      var visibleCures = [];
      for (var vk = 0; vk < s.cures.length; vk++) {
        var _idv = _cureId(s.cures[vk]);
        if (_idv && _dismissedCures.has(_idv)) continue;
        visibleCures.push(s.cures[vk]);
      }
      if (visibleCures.length) {
        var cureCollapsed = _isCollapsed('cures');
        html += '<div class="card cure-card"><div class="head cure-head">'
             +    secToggle('cures', 'Curse / Cure', visibleCures.length)
             +    (cureCollapsed ? '' : '<span class="cureClearAll" data-wp-interact title="Dismiss all cure/curse alerts (this client, until they change)">clear all</span>')
             +  '</div>';
        if (!cureCollapsed) {
          html += '<div class="list">';
          for (var k = 0; k < visibleCures.length; k++) {
            var c = visibleCures[k];
            var cId = _cureId(c);
            var curses = c.curses || [];
            var chips = curses.map(function(cc){
              return '<span class="cure-chip' + (cc.being_cured ? ' being-cured' : '') + '">' + esc(cc.cure) + (cc.counters ? ' ×' + cc.counters : '') + (cc.being_cured ? ' (curing)' : '') + '</span>';
            }).join(' ');
            html += '<div class="row cure-row"><span class="nm">' + esc(c.name) + '</span>' + chips
                 +    '<span class="cureDismiss" data-wp-interact data-cure-id="' + esc(cId) + '" title="Dismiss this alert (this client)">✕</span></div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }

    // ── Needs rez ─────────────────────────────────────────────────────────
    // Corpses first: this is the only section where somebody is waiting on a
    // human to act. Rows glow while a rezzer is on them, then say "rezzed".
    if (s.needs_rez && s.needs_rez.length) {
      var rezCollapsed = _isCollapsed('needsrez');
      var glowing = 0;
      for (var rq = 0; rq < s.needs_rez.length; rq++) if (s.needs_rez[rq].state === 'incoming') glowing++;
      html += '<div class="card"><div class="head">'
           +    secToggle('needsrez', '⚰ Needs rez', s.needs_rez.length)
           +    (rezCollapsed || !glowing ? '' : '<span class="rez-tag">' + glowing + ' being rezzed</span>')
           +  '</div>';
      if (!rezCollapsed) {
        html += '<div class="list">';
        for (var rr = 0; rr < s.needs_rez.length; rr++) {
          var r = s.needs_rez[rr];
          var tag = '';
          if (r.state === 'incoming') tag = r.rezzer ? ('rezzing — ' + esc(r.rezzer)) : 'rezzing…';
          else if (r.state === 'rezzed') tag = 'rezzed ✓';
          else if (r.requested && !r.dead_ms) tag = 'asked for a rez';
          var age = (r.dead_ms != null) ? (Math.floor(r.dead_ms / 60000) + 'm') : '';
          html += '<div class="row rez-row ' + esc(r.state) + '">'
               +    '<span class="nm">' + esc(r.name) + '</span>'
               +    (tag ? '<span class="rez-tag">' + tag + '</span>' : '')
               +    (age ? '<span class="rez-age">dead ' + age + '</span>' : '<span class="rez-age"></span>')
               +    '<span class="rezDismiss" data-wp-interact data-rez-name="' + esc(r.name) + '" title="Clear this row for the WHOLE raid — use when they are up and we missed it.">✕</span>'
               +  '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    // ── Last deaths (FB-84) ───────────────────────────────────────────────
    // One line per recent death from this machine's own log, next to the rez board it explains.
    // Local only: /api/command-center is this machine's agent; nothing here is uploaded.
    if (s.death_recaps && s.death_recaps.length) html += deathRecapsHtml(s.death_recaps, s.character);

    if (!html) html = '<div id="empty">Nothing to report — no active target, DA/mana call-outs, rolls, or curses seen yet.</div>';

    if (contentEl.__wpHtml !== html) {   // byte-stability guard (2026-07-07)
      contentEl.innerHTML = html;
      contentEl.__wpHtml = html;
      paintHailClocks();
      _requestAutoHeight();
    }
  }

  // The hail clocks tick on their own: each card carries its end (data-end, this machine's clock) and
  // the text is written here, once a second, so a clock never makes the card's HTML differ.
  function paintHailClocks(){
    var els = contentEl.querySelectorAll('.hail-clock'), now = Date.now();
    for (var i = 0; i < els.length; i++) {
      var st = hailClockState(Number(els[i].getAttribute('data-end')), now);
      var t = st.text, cls = 'hail-clock' + (st.urgent ? ' crit' : (st.soon ? ' soon' : ''));
      if (els[i].textContent !== t) els[i].textContent = t;
      if (els[i].className !== cls) els[i].className = cls;
    }
  }
  setInterval(paintHailClocks, 1000);

  // A tap on a name: mark it hailed (or take a hand-made mark back) for the whole raid. The agent relays
  // it to the bot and hands back the window, so the next poll already shows it; the chip dims until then.
  function hailTap(wid, name, hailed){
    var key = wid + '|' + String(name).toLowerCase();
    if (!wid || !name || _hailPend.has(key)) return;
    _hailPend.add(key);
    if (_lastState) render(_lastState);
    var done = function(){ _hailPend.delete(key); tick(); };
    fetch('http://127.0.0.1:' + PORT + '/api/hail-mark', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ window_id: wid, name: name, hailed: hailed }),
    }).then(done, done);
  }

  // Curse/Cure dismiss — delegated on #content (rebuilt every poll, so bind
  // once). Every clickable needs the hover-interact handshake: locked overlays
  // are click-through, so without flipping interactive on hover the click falls
  // through to EQ.
  if (contentEl) {
    contentEl.addEventListener('mouseover', function(e){
      var t = e.target;
      if (t && t.closest && (t.closest('.rezDismiss') || t.closest('.cureDismiss') || t.closest('.cureClearAll') || t.closest('.sec-toggle') || t.closest('.deathDismiss') || t.closest('.deathClearAll')
                             || t.closest('.rollMore') || t.closest('.rollDismiss') || t.closest('.rollClearAll') || t.closest('.rollCopy')
                             || t.closest('[data-wp-interact]'))) {
        try { window.mimic.overlayHoverInteractive(true); } catch (er) {}
      }
    });
    contentEl.addEventListener('mouseout', function(e){
      var t = e.target;
      if (t && t.closest && (t.closest('.rezDismiss') || t.closest('.cureDismiss') || t.closest('.cureClearAll') || t.closest('.sec-toggle') || t.closest('.deathDismiss') || t.closest('.deathClearAll')
                             || t.closest('.rollMore') || t.closest('.rollDismiss') || t.closest('.rollClearAll') || t.closest('.rollCopy')
                             || t.closest('[data-wp-interact]'))) {
        try { window.mimic.overlayHoverInteractive(false); } catch (er) {}
      }
    });
    // Hail chips act on the PRESS, not the click: the board repaints whenever somebody else hails, and a
    // repaint between press and release removes the chip the click would have landed on.
    contentEl.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      var chip = e.target && e.target.closest ? e.target.closest('.hail-chip[data-hail-act]') : null;
      if (!chip) return;
      e.preventDefault(); e.stopPropagation();
      hailTap(chip.getAttribute('data-hail-win'), chip.getAttribute('data-hail-name'), chip.getAttribute('data-hail-act') === 'mark');
    });
    // Guests card: +1h / +3h act on the press too (the card repaints as the clock moves).
    contentEl.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      var ext = e.target && e.target.closest ? e.target.closest('.guestExt') : null;
      if (!ext) return;
      e.preventDefault(); e.stopPropagation();
      guestExtend(ext.getAttribute('data-guest-id'), Number(ext.getAttribute('data-guest-h')));
    });
    contentEl.addEventListener('click', function(e){
      var hmore = e.target && e.target.closest ? e.target.closest('.hail-more') : null;
      if (hmore) {
        e.preventDefault(); e.stopPropagation();
        var hk = hmore.getAttribute('data-hail-more');
        if (hk) { if (_hailMore.has(hk)) _hailMore.delete(hk); else _hailMore.add(hk); if (_lastState) render(_lastState); }
        return;
      }
      // #153 section collapse toggle — flip the JS store + persist, then
      // re-render immediately from last state (next poll reads the same store).
      var tog = e.target && e.target.closest ? e.target.closest('.sec-toggle') : null;
      if (tog) {
        e.preventDefault(); e.stopPropagation();
        var key = tog.getAttribute('data-collapse-key');
        if (key) { _toggleCollapsed(key); if (_lastState) render(_lastState); }
        return;
      }
      // 🎲 Rolls — expand / dismiss one set / dismiss all. Same shape as the
      // cure controls below: flip the local store, then re-render from the last
      // state so the click lands instantly instead of waiting for the poll.
      var rcopy = e.target && e.target.closest ? e.target.closest('.rollCopy') : null;
      if (rcopy) {
        e.preventDefault(); e.stopPropagation();
        var rcid = rcopy.getAttribute('data-roll-id');
        var rset = null;
        for (var rc = 0; _lastState && _lastState.rolls && rc < _lastState.rolls.length; rc++) {
          if (_rollId(_lastState.rolls[rc]) === rcid) { rset = _lastState.rolls[rc]; break; }
        }
        if (rset) {
          _copyText(rset.kind === 'deathroll' ? deathrollCopyLine(rset) : rollTieCopyLine(rset), function(){
