            _copiedRoll = rcid; _copiedUntil = Date.now() + 2000;
            if (_lastState) render(_lastState);
            setTimeout(function(){ if (_lastState) render(_lastState); }, 2100);
          });
        }
        return;
      }
      var rmore = e.target && e.target.closest ? e.target.closest('.rollMore') : null;
      if (rmore) {
        e.preventDefault(); e.stopPropagation();
        var rk = rmore.getAttribute('data-roll-key');
        if (rk) { if (_openRolls.has(rk)) _openRolls.delete(rk); else _openRolls.add(rk); if (_lastState) render(_lastState); }
        return;
      }
      var rone = e.target && e.target.closest ? e.target.closest('.rollDismiss') : null;
      if (rone) {
        e.preventDefault(); e.stopPropagation();
        var rdid = rone.getAttribute('data-roll-id');
        if (rdid) { _dismissedRolls.add(rdid); _openRolls.delete(rdid); if (_lastState) render(_lastState); }
        return;
      }
      var rall = e.target && e.target.closest ? e.target.closest('.rollClearAll') : null;
      if (rall) {
        e.preventDefault(); e.stopPropagation();
        if (_lastState && _lastState.rolls) {
          for (var rj = 0; rj < _lastState.rolls.length; rj++) {
            var rid2 = _rollId(_lastState.rolls[rj]);
            if (rid2) { _dismissedRolls.add(rid2); _openRolls.delete(rid2); }
          }
          render(_lastState);
        }
        return;
      }
      // 💀 Last deaths — dismiss one / dismiss all. Local only: flip the store, re-render from the last state.
      var dthX = e.target && e.target.closest ? e.target.closest('.deathDismiss') : null;
      if (dthX) {
        e.preventDefault(); e.stopPropagation();
        dismissDeath({ name: dthX.getAttribute('data-death-who'), ts: dthX.getAttribute('data-death-ts') }, _lastState && _lastState.character);
        if (_lastState) render(_lastState);
        return;
      }
      var dthAll = e.target && e.target.closest ? e.target.closest('.deathClearAll') : null;
      if (dthAll) {
        e.preventDefault(); e.stopPropagation();
        if (_lastState) { dismissAllDeaths(_lastState.death_recaps, _lastState.character); render(_lastState); }
        return;
      }
      var rezX = e.target && e.target.closest ? e.target.closest('.rezDismiss') : null;
      if (rezX) {
        e.preventDefault(); e.stopPropagation();
        var rname = rezX.getAttribute('data-rez-name');
        if (rname) {
          // Clears the row for EVERYONE (the guild lead, 2026-08-20). The agent drops it
          // locally at once so the click feels instant, and relays it to the
          // rest of the raid through the bot; other Command Centers drop the
          // row on their next poll.
          rezX.textContent = '…';
          fetch('http://127.0.0.1:' + PORT + '/api/rez-dismiss', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: rname }),
          }).then(function(){ tick(); }).catch(function(){});
        }
        return;
      }
      var one = e.target && e.target.closest ? e.target.closest('.cureDismiss') : null;
      if (one) {
        e.preventDefault(); e.stopPropagation();
        var id = one.getAttribute('data-cure-id');
        if (id) { _dismissedCures.add(id); if (_lastState) render(_lastState); }
        return;
      }
      var all = e.target && e.target.closest ? e.target.closest('.cureClearAll') : null;
      if (all) {
        e.preventDefault(); e.stopPropagation();
        if (_lastState && _lastState.cures) {
          for (var i = 0; i < _lastState.cures.length; i++) { var cid = _cureId(_lastState.cures[i]); if (cid) _dismissedCures.add(cid); }
          render(_lastState);
        }
        return;
      }
    });
  }

  async function tick(){
    try {
      const r = await fetch('http://127.0.0.1:'+PORT+'/api/command-center', { cache: 'no-store' });
      const s = await r.json();
      _lastState = s;
      render(s);
    } catch (e) {
      // Quiet — agent might be restarting. Next tick will recover.
    }
  }
  tick(); setInterval(tick, 1500);
</script>
</body></html>
