<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>map</title>
<style>
  /* Spawn map overlay (Mimic 2.9, beta) - layout C, the tracker: the zone map on the left, the active respawn
     timers on the right. Reads the agent's /api/map-state once a second; click a spawn dot to mark it.
     DECISIONS 218 / 220 / 221, docs/DESIGN-mimic-2.9-spawn-map.md.
     --bg-alpha: card-surface alpha, driven by the setup slider via main -> preload 'bg-alpha'. */
  :root{ --bg-alpha:0.55; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;user-select:none;}
  #wrap{position:absolute;inset:0;display:flex;gap:6px}
  body.setup #wrap{top:26px}
  /* Background: colour and strength from ⚙ Map settings (--map-bg / --map-bg-a); unset = Mimic's own background slider. */
  #mapPane{position:relative;flex:1 1 auto;min-width:0;background:rgb(var(--map-bg, 19 26 38) / var(--map-bg-a, var(--bg-alpha)));border-radius:6px;overflow:hidden}
  /* ⚙ Map settings, like the HUD's builder (sticky head, groups, ↺ per row). It opens in the side column where the
     Timers list sits, so the whole map stays in view while you change it (the guild lead, 2026-10-13: "the
     customization should open up to a new section to the side where the timers would be so you can update the map at
     the same time"). Same width as the list, so it takes the list's slot; see setCfgOpen. */
  #cfg{flex:0 0 210px;box-sizing:border-box;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:6px;
    background:rgba(13,17,23,0.97);border:1px solid rgba(110,118,129,0.5);padding:0 8px 8px;font-size:10.5px;color:#c9d1d9;text-shadow:none}
  #cfg[hidden]{display:none}
  #wrap.cfgopen #side{display:none}
  #cfg::-webkit-scrollbar{width:10px}
  #cfg::-webkit-scrollbar-thumb{background:#484f58;border-radius:5px;border:2px solid rgba(13,17,23,0.95)}
  #cfg .chead{position:sticky;top:0;z-index:1;background:rgba(13,17,23,0.99);padding:7px 26px 5px 0;border-bottom:1px solid rgba(110,118,129,0.4);
    display:flex;align-items:center;gap:6px;font-size:12px}
  #cfg .chead .sp{flex:1}
  #cfg .grp{margin:9px 0 3px;color:#8b949e;text-transform:uppercase;font-size:9.5px;letter-spacing:.5px}
  #cfg .row{display:flex;align-items:center;gap:6px;padding:1.5px 0}
  #cfg .row .bl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #cfg label.row{cursor:pointer}
  #cfg input[type=checkbox]{margin:0;accent-color:#58a6ff;cursor:pointer}
  #cfg input[type=range]{width:86px;margin:0;accent-color:#58a6ff;cursor:ew-resize}
  #cfg input[type=color]{width:26px;height:16px;padding:0;border:1px solid rgba(110,118,129,0.6);border-radius:3px;background:none;cursor:pointer}
  #cfg select,#cfg button{background:rgba(22,27,34,.9);color:#c9d1d9;border:1px solid rgba(110,118,129,0.5);border-radius:4px;font:inherit;font-size:10px;padding:1px 6px;cursor:pointer}
  #cfg button:hover,#cfg select:hover{border-color:#58a6ff;color:#fff}
  #cfg .rs{flex:none;width:20px;padding:0;line-height:15px;color:#8b949e}
  #cfg .gl{width:20px;text-align:center;flex:none}
  #cfg .val{flex:none;min-width:58px;text-align:right;color:#8b949e}
  #cfg .foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;color:#6e7681;font-size:9.5px}
  #stage{position:absolute;inset:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hits{position:absolute;inset:0;pointer-events:none}
  body.dragging #hits{display:none}
  /* A spawn dot's click target: a real button, so the preload's hover handshake arms the click-through window. */
  .hit{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;padding:0;border:0;border-radius:50%;
    background:transparent;cursor:pointer;pointer-events:auto}
  .hit:hover,.hit:focus-visible{outline:1px solid rgba(255,255,255,0.7)}
  #tools{position:absolute;top:6px;left:30px;right:96px;display:flex;gap:4px;z-index:5;flex-wrap:wrap}
  /* The buttons move (the guild lead, 2026-10-13: "The buttons for the map should be draggable separate from the whole
     window and lock onto a part of the window, also have a vertical mode"): ⠿ drags them, an edge holds them (toolDock),
     the left and right edges stand them upright. */
  #tools.v{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  #tools .grip{cursor:grab;padding:0 4px;letter-spacing:-1px}
  #tools.moving{opacity:0.85}
  /* Where you are, how fast, and where the cursor is, in /loc order (the guild lead, 2026-10-13, Zeal's map as the model). */
  #locBar{position:absolute;top:28px;left:30px;z-index:4;font-size:10px;line-height:1.35;color:#e6edf3;pointer-events:none;
    text-shadow:0 0 3px #000,0 0 2px #000;font-variant-numeric:tabular-nums}
  #locBar .cur{color:#f2cc60}
  /* The timers list slides in and out (the guild lead, 2026-10-12: "slide the spawn timers in and out. So that it could
     take up less space if we weren't focused on that"): a top-right button on the map; slid in, the map takes the width. */
  #sideBtn{position:absolute;top:6px;right:6px;z-index:6}
  #wrap.noside #side{display:none}
  #wrap.noside:not(.cfgopen) #sideBtn{right:30px}   /* slid in, the map's top-right is the window's: keep clear of the ✕ */
  .tb{height:18px;padding:0 6px;border-radius:4px;background:rgba(14,17,22,0.7);color:#c9d1d9;
    border:1px solid rgba(110,118,129,0.45);font:inherit;font-size:10px;line-height:1;cursor:pointer}
  .tb:hover{color:#fff;border-color:#58a6ff}
  .tb.on{background:rgba(88,166,255,0.35);color:#fff;border-color:#58a6ff}
  /* Levels: how far above and below you (in z) the walls, spawn dots and routes stay bright. */
  .lv{height:18px;padding:0 6px;border-radius:4px;background:rgba(14,17,22,0.7);color:#c9d1d9;display:flex;align-items:center;gap:4px;
    border:1px solid rgba(110,118,129,0.45);font-size:10px;line-height:1;box-sizing:border-box}
  .lv input{width:64px;height:10px;margin:0;cursor:pointer}
  .lv span{min-width:64px}
  #msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    color:rgba(255,255,255,0.65);font-size:12px;text-shadow:0 1px 2px #000;padding:0 16px;pointer-events:none}
  #card,#menu{position:absolute;z-index:8;background:rgba(14,17,22,0.96);border:1px solid rgba(110,118,129,0.6);
    border-radius:5px;padding:5px 7px;font-size:10px;line-height:1.35;max-width:260px;display:none}
  #card{pointer-events:none}
  #card .h,#menu .h{font-weight:bold;font-size:11px;color:#e6edf3}
  #card .s{color:#8b949e}
  #card .n{display:flex;justify-content:space-between;gap:10px}
  #card .n b{color:#f2cc60} #card .n .r{color:#ff7b72}
  #card .t{margin-top:3px;color:#f0b429}
  #menu{display:none}
  #menu button{display:block;width:100%;text-align:left;margin-top:3px;padding:3px 6px;border-radius:4px;
    background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);color:#e6edf3;font:inherit;font-size:11px;cursor:pointer}
  #menu button:hover{border-color:#58a6ff;background:rgba(88,166,255,0.2)}
  #menu .x{color:#8b949e;margin-top:4px}
  #side{flex:0 0 210px;display:flex;flex-direction:column;min-height:0;background:rgb(var(--map-bg, 19 26 38) / var(--map-bg-a, var(--bg-alpha)));
    border-radius:6px;padding:6px 8px;text-shadow:0 1px 2px #000}
  #zone{font-size:12px;color:#79c0ff;padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #posage{font-size:9px;color:#6e7681;min-height:11px;white-space:nowrap}
  #wallsrc{font-size:9px;color:#6e7681;min-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #setupbar select{font:inherit;font-size:10px;max-width:90px}
  #tgt{font-size:10px;color:#f0883e;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lists{flex:1 1 auto;overflow:auto;min-height:0;margin-top:3px}
  .sec{font-size:9px;color:#6e7681;text-transform:uppercase;letter-spacing:.5px;margin:5px 0 2px}
  .trow{display:grid;grid-template-columns:1fr auto;column-gap:6px;padding:2px 4px;margin-bottom:2px;
    border-left:3px solid #6e7681;background:rgba(255,255,255,0.05);border-radius:3px;cursor:pointer;font-size:10px}
  .trow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6edf3}
  .trow .tm{font-variant-numeric:tabular-nums;text-align:right}
  .trow .src{grid-column:1 / span 2;color:#6e7681;font-size:9px}
  .trow.wait{border-left-color:#f85149} .trow.wait .tm{color:#f85149}
  .trow.window{border-left-color:#f0b429} .trow.window .tm{color:#f0b429}
  .trow.flash{border-left-color:#f0b429;background:rgba(240,180,41,0.22)} .trow.flash .tm{color:#ffd866;font-weight:bold}
  .trow.up{border-left-color:#56d364} .trow.up .tm{color:#56d364;font-weight:bold}
  .trow.q{border-left-color:#d2a8ff} .trow.q .tm{color:#d2a8ff}
  .trow.seen{border-left-color:#56d364;background:rgba(86,211,100,0.12)} .trow.seen .tm{color:#56d364}
  #empty{color:rgba(255,255,255,0.45);font-size:10px;padding:2px 4px}
  #foot{font-size:9px;color:#6e7681;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* drag/lock/setup - same pattern as the other overlays. */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(88,166,255,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(88,166,255,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(88,166,255,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#58a6ff;border-color:#58a6ff}
  body.setup #move-btn{top:30px}
  body.setup #tools,body.setup #sideBtn{top:32px}
  /* A narrow window (XS is 200 wide) keeps the map and drops the timer list. */
  @media (max-width:420px){ #side{display:none} }
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay (top-left corner - same on every overlay)">✥</button>
  <button id="hide-btn" title="Hide the Map (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 Map</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <span title="Where your position comes from. Direct is straight from the game; Agent is the slower route through the agent.">position</span>
    <select id="srcSel"><option value="direct">Direct</option><option value="agent">Agent</option></select>
    <span title="How much the dots are smoothed between position updates. More smoothing looks calmer and lags a little more.">smoothing</span>
    <select id="smoothSel"></select>
    <span title="Where the walls come from. Auto: Brewall's maps, the ones Zeal draws in game (fetched from Zeal's repo the first time you enter a zone and kept on this computer), then the map files in your own EverQuest folder, otherwise ours. Ours only: always draw the Wolf Pack walls. Map files are never sent anywhere.">walls</span>
    <select id="wallsSel"><option value="auto">Auto</option><option value="ours">Ours only</option></select>
    <span title="What the Timers button does. Widen window: the window grows to the side by the list's width, so the map keeps its size. Share space: the window stays put and the map shrinks to make room.">timers</span>
    <select id="sideModeSel"><option value="grow">Widen window</option><option value="share">Share space</option></select>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="wrap">
    <div id="mapPane">
      <div id="stage" data-map-stage>
        <canvas id="cv"></canvas>
        <div id="hits"></div>
        <div id="msg">waiting for the agent…</div>
        <div id="locBar"></div>
      </div>
      <div id="tools">
        <button class="tb grip" id="toolsGrip" type="button" title="Drag the buttons anywhere on the map; let go near an edge and they lock to it (on the left or right edge they stand upright).">⠿</button>
        <button class="tb on" id="followBtn" type="button" title="Keep the map centred on you. Dragging the map turns it off.">Follow me</button>
        <button class="tb" id="fitBtn" type="button" title="Fit the view. Click to cycle: zone, group, raid.">Fit zone</button>
        <button class="tb" id="panBtn" type="button" title="Over this button: the mouse wheel zooms, and dragging it pans the map, locked or not. A click switches Pan on, so the whole map drags and zooms; right-click centres on you.">✋ Pan / zoom</button>
        <button class="tb on" id="labelsBtn" type="button" title="Names on the map: boss names and room names. Switch off when it gets busy.">Labels: on</button>
        <button class="tb on" id="dotsBtn" type="button" title="Spawn points: show or hide the spawn dots (the same switch as ⚙ → Spawn points).">•</button>
        <button class="tb" id="aggroBtn" type="button" title="Aggro rings: how close you can get to each spawn before it aggros (its aggro radius). Red: KOS to you (from its faction, your race, class and deity, your con, or an illusion it does not see through). Yellow: not KOS to you, but KOS to some players. Green: KOS to nobody. Dashed: how far it comes to help a friend (social aggro). Your target carries its own rings. Points on a running respawn timer have no ring.">◯</button>
        <button class="tb" id="cfgBtn" type="button" title="Map settings: what is drawn, the height ranges, the ability icons, colours and the background">⚙</button>
      </div>
      <button class="tb" id="sideBtn" type="button" title="Slide the respawn timers list in or out. Slid in, the map takes the whole width.">Timers ▸</button>
      <div id="card"></div>
      <div id="menu"></div>
    </div>
      <!-- ⚙ Map settings (the guild lead, 2026-10-12: "a config section for the map that pops up similar to the hud's").
           Rows are built in JS from CFG_SHOW / CFG_GLYPHS / CFG_COLS; data-wp-interact arms the click-through window. -->
      <div id="cfg" hidden data-wp-interact>
        <div class="chead"><b>Map settings</b><span class="sp"></span><button id="cfgClose" type="button" title="Close">✕</button></div>
        <!-- Opacity first (the guild lead, 2026-10-13: "Own strength should say opacity in the options and should be right at the top"). -->
        <label class="row" title="How see-through the map's background is. Off: it follows Mimic's own background slider (setup bar)."><input type="checkbox" id="cfgBgOwn"><span class="bl">Opacity</span><input type="range" id="cfgBgA" min="0" max="1" step="0.05"></label>
        <div class="grp">Heights</div>
        <label class="row" title="Walls this far above or below you stay bright; the rest fade. Height is in game units: you are about 6 tall, one floor is roughly 30 to 60, so ±100 is about your floor and the ones next to it."><span class="bl" id="levelsVal">Levels</span><input id="levels" type="range" min="0" max="7" step="1"></label>
        <label class="row" title="Spawn points this far above or below you are shown; the rest are hidden. Same height units as Levels: ±25 is about your own floor, ±100 a floor or two either way."><span class="bl" id="spawnVal">Spawn height</span><input id="spawnLevels" type="range" min="0" max="7" step="1"></label>
        <div class="grp">Show</div>
        <div id="cfgShow"></div>
        <div class="grp">Ability icons on spawn points</div>
        <div id="cfgGlyphs"></div>
        <div class="grp">Colours</div>
        <div class="row"><span class="bl">Scheme</span><select id="cfgScheme"><option value="default">Default</option><option value="contrast">High contrast</option><option value="cb">Colour-blind safe</option><option value="custom">Custom</option></select></div>
        <label class="row" title="Brewall layers: your floor in the wall colour, the floors above and below you in Brewall's layer colours (orange, green, cyan up; pink, purple down), as eqmaps.info's mapping standard draws them. A Brewall map file keeps its own colours. Map's own: each line keeps the colour its map file gives it. One colour: every wall line in the colour below."><span class="bl">Wall colours</span><select id="cfgWallMode"><option value="layers">Brewall layers</option><option value="map">Map's own</option><option value="one">One colour</option></select></label>
        <div id="cfgCols"></div>
        <div class="grp">Background</div>
        <div class="row"><span class="bl">Colour</span><input type="color" id="cfgBg"><button class="rs" type="button" id="cfgBgRs" title="Back to the scheme's colour">↺</button></div>
        <div class="grp">Text</div>
        <label class="row"><span class="bl">Label size</span><input type="range" id="cfgText" min="0.7" max="1.8" step="0.1"><span class="val" id="cfgTextVal"></span></label>
        <div class="foot"><span>Saved on this computer.</span><button id="cfgReset" type="button">Reset to default</button></div>
      </div>
    <div id="side">
      <div id="zone">Map <span style="color:#6e7681">[beta]</span></div>
      <div id="posage" title="Age of the newest position when drawn, and where it came from."></div>
      <div id="wallsrc" title="Where the walls on the map come from."></div>
      <div id="tgt"></div>
      <div id="lists" data-wp-interact></div>
      <div id="foot"></div>
    </div>
  </div>
<script>
  let PORT = 7779;
  try { const q = new URLSearchParams(location.search).get('port'); if (q) PORT = parseInt(q, 10) || PORT; } catch (e) {}
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  // ── chrome: lock, hide, move, setup (same pattern as the other overlays) ──
  var _unlocked = false;
  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { _unlocked = !locked; document.body.classList.toggle('unlocked', !locked); syncInteract(); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });
  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    hideBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    hideBtn.addEventListener('mouseleave', function(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    hideBtn.addEventListener('click', function(){ try { window.mimic.hideThisOverlay(); } catch (e) {} });
  }
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) { try { window.mimic.overlayHoverInteractive(false); } catch (e) {} } });
    moveBtn.addEventListener('mousedown', _beginDrag);
    // Right-click ✥ → shared chrome menu (resize presets + Setup THIS/ALL).
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} try{window.mimic.overlayHoverInteractive(false);}catch(e){} } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null;
  var _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){ _overlayKey = p && p.overlayKey; if (p && p.scope) _setupScope = p.scope; else if (p && p.active) _setupScope = 'all'; document.body.classList.toggle('setup', !!(p && p.active)); resize(); });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });

  });
  document.addEventListener('mouseup', function () {
    if (S.drag) { S.panDragged = !!(S.drag.btn && S.drag.moved); S.drag = null; document.body.classList.remove('dragging'); renderMap(); }
  });
  // Zoom by a wheel step: around (mx, my) on the canvas, or the middle when there is no point (the button).
  function zoomBy(deltaY, mx, my) {
    var v = S.view, f = Math.exp(-deltaY * 0.0015), ns = Math.max(0.02, Math.min(20, v.scale * f));
    if (!S.follow && mx != null) {   // around the cursor; while following, around you
      var wx = (mx - S.w / 2) / v.scale + v.cx, wy = (my - S.h / 2) / v.scale + v.cy;
      v.cx = wx - (mx - S.w / 2) / ns; v.cy = wy - (my - S.h / 2) / ns;
    }
    v.scale = ns;
    try { localStorage.setItem('wp-map-scale', String(ns)); } catch (err) {}
    renderMap();
  }
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomBy(e.deltaY, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  // The Pan / zoom button itself (the guild lead, 2026-10-13: "if you mouse over pan /zoom you should be able to zoom in
  // and out, and if you click and drag on that button we should pan"): the wheel over it zooms, a drag from it pans,
  // both with the map still locked; a plain click still switches Pan mode.
  var panBtnEl = document.getElementById('panBtn');
  panBtnEl.addEventListener('wheel', function (e) { e.preventDefault(); zoomBy(e.deltaY, null, null); }, { passive: false });
  panBtnEl.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    closeMenu();
    S.drag = { x: e.clientX, y: e.clientY, cx: S.view.cx, cy: S.view.cy, moved: false, btn: true };
  });
  stage.addEventListener('contextmenu', function (e) {   // right-click: centre on you, once
    e.preventDefault();
    if (S.p && S.p.self) { var s = toScreen(S.p.self.x, S.p.self.y); S.view.cx = s.sx; S.view.cy = s.sy; renderMap(); }
  });

  window.addEventListener('resize', resize);
  try { new ResizeObserver(resize).observe(stage); } catch (e) {}
  syncInteract();
  resize();
  poll();
  setInterval(poll, POLL_MS);
</script>
</body></html>
