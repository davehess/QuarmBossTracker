<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>me</title>
<style>
  /* Me overlay (the guild lead, 2026-09-24): "a 'me' overlay. my target, my
     casting, my health, mana, XP detail. avg DPS per fight, total per
     day/night during raids, then the things that are important to classes
     with mana." Three layouts of the SAME /api/me data, picked in game with
     the A/B/C switch in the title bar, so the guild lead can choose one:
       A  Classic — a Nillipuss-style player window: every number, cur/max
          inside the bars, the % column on the right edge.
       B  HUD     — wraps the CENTRE of the screen (the guild lead, same day:
          "one of those me overlays should be a HUD style that goes around the
          players center of their screen … damage in/out shown clearly.
          resists and cast damage too with elements"). The window grows to a
          centred rectangle; the middle stays EMPTY so the character and the
          fight are never covered — everything sits on arcs and edges around it.
       C  Role    — the class's own numbers first (CHs left, mezzes left,
          Theft of Thought / Harvest timers), then group health.
     Colour is semantic, never decoration: green/orange/red = HP health,
     blue = mana and casting, gold = XP, purple = AA, red = danger. */
  :root{ --bg-alpha:0.55; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9;
         --dim:#6e7681; --blue:#58a6ff; --gold:#d29922; --green:#56d364; --red:#f85149;
         --orange:#ffa657; --purple:#a371f7; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Cascadia Code',ui-monospace,Consolas,monospace;color:var(--text);user-select:none;}
  #wrap{padding:4px 6px 6px}
  .card{background:rgb(13 17 23 / var(--bg-alpha));border:1px solid rgb(48 54 61 / 0.8);border-radius:6px;
    padding:6px 8px;text-shadow:0 1px 2px #000}
  .title{display:flex;align-items:center;gap:6px;font-size:12px;min-height:20px;padding-left:22px;padding-right:26px}
  .title .nm{color:var(--blue);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .cl{color:var(--dim);font-size:11px;white-space:nowrap}
  .title .sp{flex:1}
  .conn{font-size:10px} .conn.ok{color:var(--green)} .conn.bad{color:var(--dim)}
  #picker{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex:none}
  #picker button{background:rgba(22,27,34,0.85);color:var(--dim);border:0;border-left:1px solid var(--border);
    font:inherit;font-size:10px;padding:1px 6px;cursor:pointer;line-height:1.4}
  #picker button:first-child{border-left:0}
  #picker button.on{background:#1f6feb;color:#fff}
  #picker button:hover{color:var(--text)}
  .blind{margin:4px 0;padding:3px 6px;border:1px solid var(--red);color:var(--red);border-radius:4px;
    font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center}
  .dim{color:var(--dim)} .num{font-variant-numeric:tabular-nums}
  #empty{color:rgba(255,255,255,0.55);font-size:12px;padding:6px 2px;text-shadow:0 1px 2px #000}

  /* bars: cur/max centred inside, % in the right column (Nillipuss) */
  .brow{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:4px;margin-top:3px}
  .bar{position:relative;height:15px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .25s ease}
  .bar > span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;color:#fff;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .bar.thin{height:6px} .bar.thin > span{display:none}
  .pct{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
  .line{display:flex;gap:6px;align-items:baseline;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden}
  .line .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
  .kv{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;margin-top:3px}
  .kv b{color:#fff;font-weight:600}
  .gems{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:3px}
  .gem{font-size:10px;display:grid;grid-template-columns:1fr auto;gap:0 4px;align-items:center}
  .gem .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gem .gc{color:var(--blue);font-variant-numeric:tabular-nums}
  .gem .bar{grid-column:1 / -1;height:3px}
  .grp{display:grid;grid-template-columns:78px 1fr 30px;gap:3px;align-items:center;font-size:10px;margin-top:2px}
  .grp .gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* B — HUD around the screen centre. Elements are EverQuest's own resist
     colours (the subject's world), used only to label an element. */
  :root{ --fire:#ff7b45; --cold:#79c0ff; --magic:#d2a8ff; --poison:#7ee787; --disease:#e3b341; --melee:#e6edf3; }
  body.hud .card{background:transparent;border-color:transparent;padding:0}
  body.hud .blind{position:absolute;top:28px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(13,17,23,0.8);padding:3px 14px}
  body.hud .title{justify-content:center;padding-left:26px;padding-right:26px}
  #hud{position:relative;overflow:hidden}
  #hud .ab{position:absolute;text-shadow:0 0 3px #000,0 1px 2px #000,0 0 6px #000;white-space:nowrap}
  #hud .ctr{transform:translateX(-50%);text-align:center}
  #hud .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  #hud .sm{font-size:11px;font-variant-numeric:tabular-nums}
  #hud .xs{font-size:10px;color:#9aa4ad}
  #hud .panel{background:rgb(13 17 23 / calc(var(--bg-alpha) * 0.7));border-radius:5px;padding:3px 7px}
  #hud .el{display:inline-block;margin:1px 2px;padding:0 5px;border-radius:3px;font-size:10px;
    border:1px solid currentColor;background:rgba(13,17,23,0.55);font-variant-numeric:tabular-nums}
  #hud .feed{font-size:11px;line-height:1.35;font-variant-numeric:tabular-nums}
  #hud .res{display:grid;grid-template-columns:auto auto;gap:0 8px;font-size:11px;font-variant-numeric:tabular-nums}
  #hud .res b{font-weight:700}

  /* C — role card */
  .focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:4px;margin-top:2px}
  .fbox{border:1px solid var(--border);border-radius:5px;padding:3px 6px;background:rgba(22,27,34,0.65)}
  .fbox .fv{font-size:22px;font-weight:700;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
  .fbox .fl{font-size:10px;color:var(--dim);line-height:1.25;overflow-wrap:anywhere}
  .fbox .fl .fs{display:block;color:#8b949e}
  .fbox.low .fv{color:var(--orange)} .fbox.out .fv{color:var(--red)} .fbox.ready .fv{color:var(--green)}
  .vit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:5px}
  .vit .t{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}

  /* chrome — same pattern as the other overlays */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(88,166,255,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(88,166,255,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(88,166,255,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#58a6ff;border-color:#58a6ff}
  body.setup #move-btn{top:30px}
  @media (prefers-reduced-motion: reduce){ .bar > i{transition:none} }
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay (top-left corner — same on every overlay)">✥</button>
  <button id="hide-btn" title="Hide the Me overlay (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 Me</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="wrap">
    <div class="card">
      <div class="title">
        <span id="conn" class="conn bad">○</span>
        <span id="tname" class="nm">Me</span><span id="tclass" class="cl"></span>
        <span class="sp"></span>
        <span id="picker" title="Pick a layout — this is a beta test of three designs">
          <button data-v="a" title="A · Classic — every number, Nillipuss-style bars">A</button><button data-v="b" title="B · HUD — wraps the centre of your screen: health and mana arcs, damage in/out by element, resists">B</button><button data-v="c" title="C · Role — your class's numbers first, then your group">C</button>
        </span>
      </div>
      <div id="body"></div>
      <div id="empty" style="display:none">Log a character in with Zeal running and this fills in.</div>
    </div>
  </div>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  function hoverOn(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} }
  function hoverOff(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} }

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    hideBtn.addEventListener('mouseenter', hoverOn);
    hideBtn.addEventListener('mouseleave', hoverOff);
    hideBtn.addEventListener('click', function(){ try { window.mimic.hideThisOverlay(); } catch (e) {} });
  }

  // Manual drag (Chromium transparent-window workaround, same as the others).
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', hoverOn);
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) hoverOff(); });
    moveBtn.addEventListener('mousedown', _beginDrag);
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} hoverOff(); } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null, _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){ _overlayKey = p && p.overlayKey; if (p && p.scope) _setupScope = p.scope; else if (p && p.active) _setupScope = 'all'; document.body.classList.toggle('setup', !!(p && p.active)); });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener('click', function(){ try { document.body.classList.remove('setup'); } catch (e) {} try { if (_setupScope === 'this') window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  // ── the A/B/C picker (remembered on this machine) ────────────────────────
  var STYLE_KEY = 'wpMeStyle';
  var style = 'a';
  try { var saved = localStorage.getItem(STYLE_KEY); if (saved === 'a' || saved === 'b' || saved === 'c') style = saved; } catch (e) {}
  var picker = document.getElementById('picker');
  function paintPicker(){
    var bs = picker.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-v') === style);
  }
  picker.addEventListener('mouseenter', hoverOn);
  picker.addEventListener('mouseleave', hoverOff);
  // B wraps the screen centre, so switching to it grows the window into a
  // centred rectangle; switching back puts the card where it was.
  var CARD_KEY = 'wpMeCardBounds';
  function setBounds(b){ try { if (window.mimic && window.mimic.overlaySetBounds) window.mimic.overlaySetBounds(b); } catch (e) {} }
  picker.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-v]') : null;
    if (!b) return;
    var next = b.getAttribute('data-v');
    if (next === style) return;
    if (next === 'b') {
      try { localStorage.setItem(CARD_KEY, JSON.stringify({ x: window.screenX, y: window.screenY, width: window.outerWidth, height: window.outerHeight })); } catch (err) {}
      setBounds({ width: Math.round(screen.availWidth * 0.58), height: Math.round(screen.availHeight * 0.66), center: true });
    } else if (style === 'b') {
      var card = null;
      try { card = JSON.parse(localStorage.getItem(CARD_KEY) || 'null'); } catch (err) {}
      setBounds(card && card.width ? card : { width: 330, height: 320, center: true });
    }
    style = next;
    try { localStorage.setItem(STYLE_KEY, style); } catch (err) {}
    paintPicker(); _lastHtml = null; render(_last);
  });
  window.addEventListener('resize', function(){ if (style === 'b') { _lastHtml = null; render(_last); } });
  paintPicker();

  // ── helpers ──────────────────────────────────────────────────────────────
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function n0(v){ return v == null ? '—' : Math.round(v).toLocaleString('en-US'); }
  function pctOf(o){
    if (!o) return null;
    if (o.pct != null) return Math.max(0, Math.min(100, o.pct));
    if (o.cur != null && o.max) return Math.max(0, Math.min(100, o.cur * 100 / o.max));
    return null;
  }
  function hpColor(p){ return p == null ? 'var(--dim)' : (p > 50 ? 'var(--green)' : (p > 25 ? 'var(--orange)' : 'var(--red)')); }
  function mmss(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); var m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
  function big(n){ n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return Math.round(n).toLocaleString('en-US'); }
  function bar(p, color, text, cls){
    var w = p == null ? 0 : p;
    return '<div class="bar' + (cls ? ' ' + cls : '') + '"><i style="width:' + w.toFixed(1) + '%;background:' + color + '"></i><span>' + (text || '') + '</span></div>';
  }
  function brow(p, color, text){
    return '<div class="brow">' + bar(p, color, text) + '<div class="pct" style="color:' + color + '">' + (p == null ? '' : Math.round(p) + '%') + '</div></div>';
  }
  function curMax(o){ return (o && o.cur != null && o.max != null) ? n0(o.cur) + ' / ' + n0(o.max) : ''; }
  function rate(v, unit){ return v == null ? '<span class="dim">measuring…</span>' : v.toFixed(1) + '%' + unit; }
  // Time left on a cast, as a DEPLETING bar — countdowns run right to left
  // across the platform (the CH cast bar).
  function castHtml(c){
    if (!c) return '';
    var left = c.pct != null ? 100 - c.pct : null;
    var t = c.remaining_ms != null ? (c.remaining_ms / 1000).toFixed(1) + 's' : '';
    return '<div class="line"><span class="dim">✦</span><span class="grow" style="color:var(--blue)">' + esc(c.spell) + '</span><span class="num">' + t + '</span></div>'
         + (left != null ? bar(left, 'var(--blue)', '', 'thin') : '');
  }
  function targetHtml(t){
    if (!t) return '';
    return '<div class="line"><span class="dim">→</span><span class="grow">' + esc(t.name) + (t.id ? ' <span class="dim">#' + t.id + '</span>' : '') + '</span>'
         + '<span class="num" style="color:' + hpColor(t.hp_pct) + '">' + (t.hp_pct != null ? Math.round(t.hp_pct) + '%' : '') + '</span></div>'
         + (t.hp_pct != null ? bar(t.hp_pct, hpColor(t.hp_pct), '', 'thin') : '');
  }
  function focusValue(f){
    if (f.timer_ms != null) return f.timer_ms <= 0 ? 'ready' : mmss(f.timer_ms);
    return f.value == null ? '—' : String(f.value);
  }
  function focusTone(f){
    if (f.timer_ms != null) return f.timer_ms <= 0 ? 'ready' : '';
    if (f.value == null) return '';
    return f.value === 0 ? 'out' : (f.value <= 2 ? 'low' : '');
  }
  function dpsLine(d){
    if (!d) return '';
    var out = [];
    if (d.fight) out.push('fight <b>' + big(d.fight.dps) + '</b> <span class="dim">(' + d.fight.secs + 's)</span>');
    if (d.night) out.push('tonight avg <b>' + big(d.night.avg_dps) + '</b> · <b>' + big(d.night.dmg) + '</b> <span class="dim">over ' + d.night.fights + ' fight' + (d.night.fights === 1 ? '' : 's') + '</span>');
    return out.length ? '<div class="kv">' + out.join('<span class="dim">·</span>') + '</div>' : '';
  }
  function groupHtml(g){
    if (!g || !g.length) return '';
    var h = '';
    for (var i = 0; i < g.length; i++) {
      var m = g[i];
      h += '<div class="grp"><span class="gname">' + esc(m.name) + '</span>' + bar(m.hp_pct, hpColor(m.hp_pct), '', 'thin')
         + '<span class="pct" style="color:' + hpColor(m.hp_pct) + '">' + (m.hp_pct != null ? Math.round(m.hp_pct) + '%' : '') + '</span></div>';
    }
    return h;
  }
  function gemsHtml(gems){
    if (!gems || !gems.length) return '';
    var h = '<div class="gems">';
    for (var i = 0; i < gems.length; i++) {
      var g = gems[i];
      h += '<div class="gem" title="' + esc(g.name) + (g.mana ? ' · ' + g.mana + ' mana' : '') + '"><span class="gn">' + esc(g.name) + '</span>'
         + '<span class="gc">' + (g.casts_left != null ? '×' + g.casts_left : '') + '</span>'
         + (g.recast_pct != null ? bar(g.recast_pct, 'var(--dim)', '', 'thin') : '') + '</div>';
    }
    return h + '</div>';
  }

  // ── A · Classic ───────────────────────────────────────────────────────────
  function renderA(s){
    var hpP = pctOf(s.hp), mnP = pctOf(s.mana);
    var h = '';
    h += brow(hpP, hpColor(hpP), curMax(s.hp));
    if (mnP != null) h += brow(mnP, 'var(--blue)', curMax(s.mana));
    if (s.end && s.end.pct != null) h += brow(s.end.pct, 'var(--orange)', 'endurance');
    if (s.xp && s.xp.pct != null) h += brow(s.xp.pct, 'var(--gold)', 'XP/hr ' + (s.xp.per_hr == null ? '…' : s.xp.per_hr.toFixed(1) + '%'));
    if (s.aa && s.aa.pct != null) h += brow(s.aa.pct, 'var(--purple)', 'AA/hr ' + (s.aa.per_hr == null ? '…' : s.aa.per_hr.toFixed(1) + '%') + (s.aa.banked ? ' · ' + s.aa.banked + ' banked' : ''));
    var meta = [];
    if (s.level != null) meta.push('Level <b>' + s.level + '</b>');
    if (s.weight && s.weight.cur != null) meta.push('Wt <b>' + s.weight.cur + '</b>/' + (s.weight.max != null ? s.weight.max : '?'));
    if (s.pet) meta.push('🐾 ' + esc(s.pet.name) + ' <b style="color:' + hpColor(s.pet.hp_pct) + '">' + Math.round(s.pet.hp_pct || 0) + '%</b>');
    if (meta.length) h += '<div class="kv">' + meta.join('') + '</div>';
    h += castHtml(s.casting);
    h += targetHtml(s.target);
    if (s.focus && s.focus.length) {
      h += '<div class="kv">' + s.focus.map(function(f){ return esc(f.label) + ' <b>' + focusValue(f) + '</b>' + (f.sub ? ' <span class="dim">' + esc(f.sub) + '</span>' : ''); }).join('') + '</div>';
    }
    var d = dpsLine(s.dps); if (d) h += '<div class="lbl">damage</div>' + d;
    if (s.group && s.group.length) h += '<div class="lbl">group</div>' + groupHtml(s.group);
    if (s.gems && s.gems.length) h += '<div class="lbl">spells <span class="dim">(casts left at current mana)</span></div>' + gemsHtml(s.gems);
    return h;
  }

  // ── B · HUD ───────────────────────────────────────────────────────────────
  // Arcs and edges AROUND the centre; nothing is drawn inside the ring. Angles
  // run clockwise from 12 o'clock. HP fills the left arc from the bottom up,
  // mana the right arc; endurance and the cast sit on thin inner arcs.
  var EL_COLOR = { fire: 'var(--fire)', cold: 'var(--cold)', magic: 'var(--magic)', poison: 'var(--poison)', disease: 'var(--disease)', melee: 'var(--melee)', spell: '#8b949e' };
  var EL_LABEL = { fire: 'fire', cold: 'cold', magic: 'magic', poison: 'poison', disease: 'disease', melee: 'melee', spell: 'spell' };
  function polar(cx, cy, r, deg){ var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function arcPath(cx, cy, r, a0, a1){
    if (a1 - a0 <= 0.01) return '';
    var p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
    return 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + r.toFixed(1) + ' ' + r.toFixed(1) + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
  }
  function arcPair(cx, cy, r, from, span, frac, color, width, fromEnd){
    // Track, then the fill. fromEnd: the fill grows from the END of the span
    // (the right arc fills bottom-up by running backwards from 150°).
    var f = Math.max(0, Math.min(1, frac == null ? 0 : frac));
    var track = '<path d="' + arcPath(cx, cy, r, from, from + span) + '" stroke="rgba(255,255,255,0.12)" stroke-width="' + width + '" fill="none" stroke-linecap="round"/>';
    var d = fromEnd ? arcPath(cx, cy, r, from + span * (1 - f), from + span) : arcPath(cx, cy, r, from, from + span * f);
    return track + (d ? '<path d="' + d + '" stroke="' + color + '" stroke-width="' + width + '" fill="none" stroke-linecap="round"/>' : '');
  }
  function elChips(by){
    var keys = Object.keys(by || {}).sort(function(a, b){ return by[b] - by[a]; });
    return keys.map(function(k){ return '<span class="el" style="color:' + (EL_COLOR[k] || '#8b949e') + '">' + EL_LABEL[k] + ' ' + big(by[k]) + '</span>'; }).join('');
  }
  function renderHud(s){
    var W = Math.max(320, window.innerWidth), H = Math.max(260, window.innerHeight - 30);
    var cx = W / 2, cy = H / 2 - 10, R = Math.max(90, Math.min(W, H) * 0.25);
    var hpP = pctOf(s.hp), mnP = pctOf(s.mana), enP = s.end ? s.end.pct : null;
    var castLeft = (s.casting && s.casting.pct != null) ? (100 - s.casting.pct) / 100 : null;
    var svg = '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0">'
      + arcPair(cx, cy, R, 210, 120, hpP == null ? 0 : hpP / 100, hpColor(hpP), 7, false)
      + (enP != null ? arcPair(cx, cy, R - 11, 215, 110, enP / 100, 'var(--orange)', 3, false) : '')
      + (mnP != null ? arcPair(cx, cy, R, 30, 120, mnP / 100, 'var(--blue)', 7, true) : '')
      + (castLeft != null ? arcPair(cx, cy, R - 11, 35, 110, castLeft, 'var(--blue)', 3, true) : '')
      + '</svg>';
    var h = '<div id="hud" style="width:' + W + 'px;height:' + H + 'px">' + svg;
    function at(x, y, cls, inner, extra){ return '<div class="ab ' + (cls || '') + '" style="left:' + Math.round(x) + 'px;top:' + Math.round(y) + 'px;' + (extra || '') + '">' + inner + '</div>'; }
    // Left / right of the ring: HP and mana, big.
    h += at(cx - R - 18, cy - 18, '', '<div class="big" style="color:' + hpColor(hpP) + '">' + (hpP == null ? '—' : Math.round(hpP) + '%') + '</div>'
        + '<div class="sm">' + (s.hp && s.hp.cur != null ? n0(s.hp.cur) + ' / ' + n0(s.hp.max) : '') + '</div>'
        + (enP != null ? '<div class="xs">end ' + Math.round(enP) + '%</div>' : ''), 'transform:translateX(-100%);text-align:right');
    if (mnP != null) h += at(cx + R + 18, cy - 18, '', '<div class="big" style="color:var(--blue)">' + Math.round(mnP) + '%</div>'
        + '<div class="sm">' + (s.mana && s.mana.cur != null ? n0(s.mana.cur) + ' / ' + n0(s.mana.max) : '') + '</div>');
    // Above: target, then the cast.
    var top = cy - R - 14;
    if (s.casting) {
      h += at(cx, top - 16, 'ctr', '<span class="sm" style="color:var(--blue)">✦ ' + esc(s.casting.spell) + (s.casting.remaining_ms != null ? ' · ' + (s.casting.remaining_ms / 1000).toFixed(1) + 's' : '') + '</span>');
      top -= 18;
    }
    if (s.target) {
      h += at(cx, top - 36, 'ctr panel', '<div class="sm">' + esc(s.target.name) + (s.target.id ? ' <span class="xs">#' + s.target.id + '</span>' : '') + ' <b style="color:' + hpColor(s.target.hp_pct) + '">' + (s.target.hp_pct != null ? Math.round(s.target.hp_pct) + '%' : '') + '</b></div>'
        + '<div style="width:220px;margin-top:2px">' + bar(s.target.hp_pct, hpColor(s.target.hp_pct), '', 'thin') + '</div>');
    }
    // Below: damage OUT and IN, by element, then the last hits.
    var c = s.combat || null;
    var base = cy + R + 14;
    if (c) {
      var span = c.live ? 'this fight' : 'last 30s';
      h += at(cx - 16, base, '', '<div class="xs" style="text-align:right">OUT · ' + span + '</div><div class="big" style="text-align:right;color:var(--melee)">' + big(c.out.dps) + '<span class="xs"> dps</span></div>'
          + '<div class="xs" style="text-align:right">' + big(c.out.dmg) + ' dealt</div><div style="text-align:right;max-width:260px;white-space:normal">' + elChips(c.out.by) + '</div>', 'transform:translateX(-100%)');
      h += at(cx + 16, base, '', '<div class="xs">IN · ' + span + '</div><div class="big" style="color:var(--red)">' + big(c['in'].dps) + '<span class="xs"> dps</span></div>'
          + '<div class="xs">' + big(c['in'].dmg) + ' taken' + (c['in'].max ? ' · biggest ' + big(c['in'].max) : '') + '</div><div style="max-width:260px;white-space:normal">' + elChips(c['in'].by) + '</div>');
      if (c.feed && c.feed.length) {
        var fl = c.feed.slice(0, 5).map(function(f){
          var col = f.dir === 'in' ? (f.kind === 'melee' ? 'var(--red)' : (EL_COLOR[f.el] || 'var(--red)')) : (f.kind === 'melee' ? 'var(--melee)' : (EL_COLOR[f.el] || '#8b949e'));
          var op = Math.max(0.35, 1 - f.age_ms / 15000).toFixed(2);
          return '<div style="color:' + col + ';opacity:' + op + '">' + (f.dir === 'in' ? '▼ ' : '▲ ') + '<b>' + n0(f.amount) + '</b> ' + esc(f.name || (f.kind === 'melee' ? 'melee' : 'spell'))
            + (f.el ? ' <span class="xs">' + f.el + '</span>' : '') + (f.dir === 'in' && f.other ? ' <span class="xs">← ' + esc(f.other) + '</span>' : '') + '</div>';
        }).join('');
        h += at(cx, base + 80, 'ctr feed', fl);
      }
    }
    // Lower left: resists, in their element's colour.
    var r = s.resists || {};
    if (r.mr != null || r.fr != null) {
      var rows = [['MR', r.mr, 'magic'], ['FR', r.fr, 'fire'], ['CR', r.cr, 'cold'], ['PR', r.pr, 'poison'], ['DR', r.dr, 'disease']]
        .map(function(x){ return '<span style="color:' + EL_COLOR[x[2]] + '">' + x[0] + '</span><b style="color:' + EL_COLOR[x[2]] + '">' + (x[1] == null ? '—' : x[1]) + '</b>'; }).join('');
      h += at(cx - R - 18, cy + 34, 'panel', '<div class="res">' + rows + '</div>', 'transform:translateX(-100%)');
    }
    // Lower right: the class's numbers, then the groupmate who needs you.
    var fr = (s.focus || []).map(function(f){
      var tone = focusTone(f);
      var col = tone === 'out' ? 'var(--red)' : (tone === 'low' ? 'var(--orange)' : (tone === 'ready' ? 'var(--green)' : '#fff'));
      return '<div><span class="xs">' + esc(f.label) + '</span> <b class="big" style="font-size:16px;color:' + col + '">' + focusValue(f) + '</b></div>';
    }).join('');
    var low = (s.group || []).filter(function(m){ return m.hp_pct != null && m.hp_pct < 60; }).sort(function(a, b){ return a.hp_pct - b.hp_pct; })[0];
    if (low) fr += '<div style="color:var(--red)"><span class="xs">group</span> <b>' + esc(low.name) + ' ' + Math.round(low.hp_pct) + '%</b></div>';
    if (fr) h += at(cx + R + 18, cy + 34, 'panel', fr);
    // Top-left corner, out of the way: XP / AA rate.
    if (s.xp && s.xp.pct != null) {
      h += at(8, 4, 'xs', 'XP ' + s.xp.pct.toFixed(1) + '% ' + (s.xp.per_hr == null ? '' : '(' + s.xp.per_hr.toFixed(1) + '%/hr)')
          + (s.aa && s.aa.pct != null ? ' · AA ' + s.aa.pct.toFixed(1) + '% ' + (s.aa.per_hr == null ? '' : '(' + s.aa.per_hr.toFixed(1) + '%/hr)') : ''));
    }
    return h + '</div>';
  }

  // ── C · Role ──────────────────────────────────────────────────────────────
  function renderC(s){
    var h = '';
    if (s.focus && s.focus.length) {
      h += '<div class="focus">';
      s.focus.forEach(function(f){
        h += '<div class="fbox ' + focusTone(f) + '" title="' + esc(f.sub || f.label) + '"><div class="fv">' + focusValue(f) + '</div><div class="fl">' + esc(f.label) + (f.sub && f.timer_ms == null ? '<span class="fs">' + esc(f.sub) + '</span>' : '') + '</div></div>';
      });
      h += '</div>';
    }
    var hpP = pctOf(s.hp), mnP = pctOf(s.mana);
    h += '<div class="vit">';
    h += '<div><div class="t"><span>HP</span><span class="num" style="color:' + hpColor(hpP) + '">' + (hpP == null ? '—' : Math.round(hpP) + '%') + '</span></div>' + bar(hpP, hpColor(hpP), '', 'thin') + '</div>';
    h += '<div><div class="t"><span>Mana</span><span class="num" style="color:var(--blue)">' + (s.mana && s.mana.cur != null ? n0(s.mana.cur) : (mnP == null ? '—' : Math.round(mnP) + '%')) + '</span></div>' + bar(mnP, 'var(--blue)', '', 'thin') + '</div>';
    var eP = s.end ? s.end.pct : null;
    h += '<div><div class="t"><span>End</span><span class="num" style="color:var(--orange)">' + (eP == null ? '—' : Math.round(eP) + '%') + '</span></div>' + bar(eP, 'var(--orange)', '', 'thin') + '</div>';
    h += '</div>';
    h += castHtml(s.casting);
    h += targetHtml(s.target);
    if (s.group && s.group.length) h += '<div class="lbl">group</div>' + groupHtml(s.group);
    var d = dpsLine(s.dps); if (d) h += '<div class="lbl">damage</div>' + d;
    if (s.xp && s.xp.pct != null) {
      h += '<div class="kv"><span>XP <b>' + s.xp.pct.toFixed(1) + '%</b> ' + rate(s.xp.per_hr, '/hr') + '</span>'
         + (s.aa && s.aa.pct != null ? '<span>AA <b>' + s.aa.pct.toFixed(1) + '%</b> ' + rate(s.aa.per_hr, '/hr') + '</span>' : '') + '</div>';
    }
    return h;
  }

  var bodyEl = document.getElementById('body');
  var emptyEl = document.getElementById('empty');
  var _last = null, _lastHtml = null;
  function render(s){
    var html = '';
    if (s && s.character) {
      document.getElementById('tname').textContent = s.character;
      document.getElementById('tclass').textContent = (s.level != null ? s.level + ' ' : '') + (s.class || '');
      if (s.blind) html += '<div class="blind">👁 BLINDED — this panel still works</div>';
      html += style === 'b' ? renderHud(s) : (style === 'c' ? renderC(s) : renderA(s));
    }
    document.body.classList.toggle('hud', style === 'b');
    emptyEl.style.display = (s && s.character) ? 'none' : 'block';
    if (html !== _lastHtml) {   // byte-stability guard: no rewrite when nothing changed
      bodyEl.innerHTML = html;
      _lastHtml = html;
      // The HUD is sized to its window, not the other way round.
      if (style !== 'b') _requestAutoHeight();
    }
  }
  function _requestAutoHeight(){
    if (!(window.mimic && window.mimic.overlayAutoHeight)) return;
    var w = document.getElementById('wrap'); if (!w) return;
    try { window.mimic.overlayAutoHeight(w.scrollHeight + 8); } catch (e) {}
  }
  async function tick(){
    var c = document.getElementById('conn');
    try {
      const r = await fetch('http://127.0.0.1:' + PORT + '/api/me', { cache: 'no-store' });
      const s = await r.json();
      c.className = 'conn ok'; c.textContent = '●';
      _last = s; render(s);
    } catch (e) {
      c.className = 'conn bad'; c.textContent = '○';
    }
  }
  tick(); setInterval(tick, 500);
</script>
</body></html>
