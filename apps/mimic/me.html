<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>me</title>
<style>
  /* Me overlay (the guild lead, 2026-09-24): "a 'me' overlay. my target, my
     casting, my health, mana, XP detail. avg DPS per fight, total per
     day/night during raids, then the things that are important to classes
     with mana." Two layouts of the SAME /api/me data now, picked in game with
     the Box / HUD switch (the guild lead, 2026-09-24: "We can remove version C,
     default the HUD to version, rename A into Box"):
       Box (was A, Classic) — a Nillipuss-style player window: every number,
          cur/max inside the bars, the % column on the right edge.
       HUD 1/2/3 — a ring around the CENTRE of the screen (the guild lead, same day:
          "one of those me overlays should be a HUD style that goes around the
          players center of their screen … damage in/out shown clearly.
          resists and cast damage too with elements"). It was layout B; after a
          first night with it: "The Circle should be the bounds for the
          resizing with some light info on the inside of the circle" — so the
          window IS the ring's square and everything scales with it. The
          default for anyone who has not picked.
       (C, Role — the class's own numbers first — was retired the same day.)
     Colour is semantic, never decoration: green/orange/red = HP health,
     blue = mana and casting, gold = XP, purple = AA, red = danger. */
  :root{ --bg-alpha:0.55; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9;
         --dim:#6e7681; --blue:#58a6ff; --gold:#d29922; --green:#56d364; --red:#f85149;
         --orange:#ffa657; --purple:#a371f7; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Cascadia Code',ui-monospace,Consolas,monospace;color:var(--text);user-select:none;}
  #wrap{padding:4px 6px 6px}
  .card{background:rgb(13 17 23 / var(--bg-alpha));border:1px solid rgb(48 54 61 / 0.8);border-radius:6px;
    padding:6px 8px;text-shadow:0 1px 2px #000}
  .title{display:flex;align-items:center;gap:6px;font-size:12px;min-height:20px;padding-left:22px;padding-right:26px}
  .title .nm{color:var(--blue);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .cl{color:var(--dim);font-size:11px;white-space:nowrap}
  .title .sp{flex:1}
  .conn{font-size:10px} .conn.ok{color:var(--green)} .conn.bad{color:var(--dim)}
  #picker{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex:none}
  #picker button{background:rgba(22,27,34,0.85);color:var(--dim);border:0;border-left:1px solid var(--border);
    font:inherit;font-size:10px;padding:1px 6px;cursor:pointer;line-height:1.4}
  #picker button:first-child{border-left:0}
  #picker button.on{background:#1f6feb;color:#fff}
  #picker button:hover{color:var(--text)}
  .blind{margin:4px 0;padding:3px 6px;border:1px solid var(--red);color:var(--red);border-radius:4px;
    font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center}
  .dim{color:var(--dim)} .num{font-variant-numeric:tabular-nums}
  #empty{color:rgba(255,255,255,0.55);font-size:12px;padding:6px 2px;text-shadow:0 1px 2px #000}

  /* bars: cur/max centred inside, % in the right column (Nillipuss) */
  .brow{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:4px;margin-top:3px}
  .bar{position:relative;height:15px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .25s ease}
  .bar > span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;color:#fff;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .bar.thin{height:6px} .bar.thin > span{display:none}
  .pct{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
  .line{display:flex;gap:6px;align-items:baseline;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden}
  .line .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
  .kv{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;margin-top:3px}
  .kv b{color:#fff;font-weight:600}
  .gems{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:3px}
  .gem{font-size:10px;display:grid;grid-template-columns:1fr auto;gap:0 4px;align-items:center}
  .gem .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gem .gc{color:var(--blue);font-variant-numeric:tabular-nums}
  .gem .bar{grid-column:1 / -1;height:3px}
  .grp{display:grid;grid-template-columns:78px 1fr 30px;gap:3px;align-items:center;font-size:10px;margin-top:2px}
  .grp .gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* HUD 1/2/3 — one square SVG (viewBox 400×400) that fills the window, so
     resizing the window resizes the ring. Elements are EverQuest's own resist
     colours (the subject's world), used only to label an element. */
  :root{ --fire:#ff7b45; --cold:#79c0ff; --magic:#d2a8ff; --poison:#7ee787; --disease:#e3b341; --melee:#e6edf3; }
  body.hud #wrap{padding:0;height:100%}
  body.hud .card{background:transparent;border-color:transparent;padding:0;height:100%;position:relative}
  body.hud #body{position:absolute;inset:0}
  /* The picker drops out of the card into the bottom row under the ring
     (placed with ✥ and ✕ further down). */
  body.hud .title{position:fixed;left:4px;right:4px;bottom:3px;min-height:0;padding:0;font-size:10px;opacity:.4;z-index:30;transition:opacity .12s}
  body.hud .title:hover{opacity:1}
  #hudsvg{display:block;width:100%;height:100%;overflow:visible}
  /* The HUD builder (⚙) opens BESIDE the ring, not over it (the guild lead,
     round four: "The configuration section needs to pop up on the side and
     not over the overlay"): the window grows by --panel-w toward whichever
     side has room, the ring keeps its exact width and place (--ring-w), and
     closing puts the window back. */
  /* Round seven (the guild lead: "Config for hud should be able to scroll easily,
     and have a top level slider for all of the text as well as reset to
     defaults for each line"): wider, so rows stop wrapping to three lines;
     the header — name, close, the All-text slider — stays put while the
     list scrolls under it; a scrollbar you can see and grab. */
  :root{ --panel-w:300px; --ring-w:100%; }
  #build-btn{display:none}
  body.hud #build-btn{display:inline-block}
  #builder{position:fixed;right:0;top:0;bottom:0;width:calc(var(--panel-w) - 8px);box-sizing:border-box;z-index:80;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#484f58 transparent;
    background:rgba(13,17,23,0.95);border:1px solid var(--border);border-radius:8px;padding:0 12px 8px;
    font-size:11px;box-shadow:0 4px 18px rgba(0,0,0,.55)}
  #builder::-webkit-scrollbar{width:10px}
  #builder::-webkit-scrollbar-thumb{background:#484f58;border-radius:5px;border:2px solid rgba(13,17,23,0.95)}
  #builder::-webkit-scrollbar-thumb:hover{background:#6e7681}
  #builder .bsticky{position:sticky;top:0;z-index:1;background:rgba(13,17,23,0.98);padding:8px 0 6px;border-bottom:1px solid var(--border)}
  #builder .ball{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:10.5px}
  #builder .ball .bl{flex:1}
  #builder .brs{flex:none;width:20px;padding:0 !important;line-height:16px;color:var(--dim) !important}
  #builder .brs:hover{color:var(--text) !important;border-color:var(--blue) !important}
  body.build-left #builder{right:auto;left:0}
  body.building #wrap{width:var(--ring-w)}
  body.building.build-left #wrap{margin-left:auto}
  body.building #hide-btn{right:calc(var(--panel-w) + 6px)}
  body.building.build-left #move-btn{left:calc(var(--panel-w) + 6px)}
  #builder[hidden]{display:none}
  #builder .bhead{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:2px}
  #builder .bhead .sp{flex:1}
  #builder .grp{margin:8px 0 2px;color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  #builder label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
  #builder label .bl{flex:1;min-width:0}
  #builder .bsz{width:54px;flex:none;margin:0;accent-color:#58a6ff;cursor:ew-resize}
  #builder select,#builder button{background:rgba(22,27,34,.9);color:var(--text);border:1px solid var(--border);
    border-radius:4px;font:inherit;font-size:10px;padding:1px 6px;cursor:pointer}
  #builder .bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  #hudsvg text,#hudlanes text{font-family:inherit;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
  /* Line weight (⚙ → Line weight): the dark edge round the text, and the
     numbers' boldness. Arcs are scaled in the script. Consolas has only
     regular and bold, so 500 reads as regular there. */
  #hudsvg.w-thin text,#hudlanes.w-thin text{stroke-width:1.6px;stroke:rgba(0,0,0,.8)}
  #hudsvg.w-thin [font-weight="700"],#hudlanes.w-thin [font-weight="700"]{font-weight:500}
  #hudsvg.w-normal text,#hudlanes.w-normal text{stroke-width:2.3px}
  #hudsvg.w-normal [font-weight="700"],#hudlanes.w-normal [font-weight="700"]{font-weight:600}
  /* The hit columns: their own layer over the ring, so a line can slide
     (a new hit in from above; a finished round's hits onto its total). */
  #hudlanes{display:none;position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  body.hud #hudlanes{display:block}
  #hudlanes text{transition:transform .3s ease-out,opacity .3s ease-out}
  @media (prefers-reduced-motion: reduce){ #hudlanes text{transition:none} }

  /* Box (was A) — the guild lead, 2026-09-24: "Remove the background from the
     Box version. Give the numbers on health some drop shadow." · "Endurance
     can be small". No card behind it (the ⌨ backgrounds toggle still gives
     one to whoever wants it); the numbers inside the bars get a dark halo so
     they read over the green; endurance is a thin bar with its % beside it. */
  body:not(.hud) .card{background:transparent;border-color:transparent}
  .bar > span{text-shadow:0 0 2px #000,0 1px 2px #000,0 0 4px rgba(0,0,0,.85)}
  .brow.small{margin-top:2px}
  .brow.small .pct{font-size:10px}

  /* chrome — same pattern as the other overlays */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(88,166,255,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(88,166,255,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(88,166,255,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#58a6ff;border-color:#58a6ff}
  body.setup #move-btn{top:30px}
  /* HUD: one row at the bottom of the ring, centred — ✥ [Box|HUD|⚙] ✕ — below
     the tick and swing timers (the guild lead, 2026-09-24: "Put the Move icon
     and X at the bottom underneath the tick timer and the swing timer", then:
     "the character name doesn't need to be at the top left. The selection
     for Box/Hud should be in the middle horizontally, vertically below the
     bottom tick/swing timers, directly next to the movement and X buttons").
     At 6 o'clock the bars' labels do not reach (they are centred on 206° and
     154°), so the bottom 20px of the square are clear. The picker has a fixed
     width (--pk-w) so the buttons can sit flush beside it in plain CSS; the
     row is centred on the ring — the window, or --ring-w wide from --ring-x
     while the builder panel is open. No name here: the Box still shows it. */
  body.hud{--ring-x:0px;--pk-w:88px}
  body.hud.building.build-left{--ring-x:var(--panel-w)}
  body.hud .title,body.hud.building .title,body.hud.building.build-left .title{
    top:calc(var(--ring-w) - 20px);bottom:auto;right:auto;width:var(--pk-w);
    left:calc(var(--ring-x) + var(--ring-w) / 2 - var(--pk-w) / 2)}
  body.hud .title .conn,body.hud .title .nm,body.hud .title .cl,body.hud .title .sp{display:none}
  body.hud #picker{width:100%;box-sizing:border-box}
  body.hud #picker button{flex:1 1 0;padding:1px 0}
  body.hud #move-btn,body.hud.setup #move-btn,body.hud.building.build-left #move-btn{
    top:calc(var(--ring-w) - 21px);left:calc(var(--ring-x) + var(--ring-w) / 2 - var(--pk-w) / 2 - 22px)}
  body.hud #hide-btn,body.hud.setup #hide-btn,body.hud.building #hide-btn{
    top:calc(var(--ring-w) - 21px);right:auto;left:calc(var(--ring-x) + var(--ring-w) / 2 + var(--pk-w) / 2 + 4px)}
  /* The HUD's background is a SHADOW behind what it draws, never a square
     (the guild lead, 2026-09-24: "The HUD mode shouldn't include the background
     as a square, rather as a shadow behind the content"): the backgrounds
     toggle darkens round the arcs and the text, as strong as the Background
     slider says. */
  body.hud.wp-backdrop #wrap{background:transparent !important}
  body.hud.wp-backdrop #hudsvg,body.hud.wp-backdrop #hudlanes{
    filter:drop-shadow(0 0 2px rgb(0 0 0 / var(--bg-alpha,0.92))) drop-shadow(0 0 7px rgb(8 10 14 / var(--bg-alpha,0.92)))}
  @media (prefers-reduced-motion: reduce){ .bar > i{transition:none} }
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay (top-left corner — same on every overlay)">✥</button>
  <button id="hide-btn" title="Hide the HUD (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 HUD</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="builder" hidden>
    <div class="bsticky">
      <div class="bhead"><b>Build your HUD</b><span id="builder-for" class="dim"></span><span class="sp"></span><button id="builder-close" title="Close">✕</button></div>
      <div class="ball"><span class="bl">All text</span><input type="range" class="bsz" id="builder-all" data-size="all" min="0.7" max="1.6" step="0.1" value="1" title="Every label's size"><button type="button" class="brs" data-reset="all" title="Back to normal size">↺</button></div>
    </div>
    <div id="builder-list"></div>
    <div class="bfoot"><span class="dim">Saved for this character, on this computer. Sliders set text size.</span><button id="builder-reset">Reset to default</button></div>
  </div>
  <div id="wrap">
    <div class="card">
      <div class="title">
        <span id="conn" class="conn bad">○</span>
        <span id="tname" class="nm">HUD</span><span id="tclass" class="cl"></span>
        <span class="sp"></span>
        <span id="picker" title="Pick a layout">
          <button data-v="a" title="Box — every number, Nillipuss-style bars">Box</button><button data-v="hud" title="HUD — a ring around your character; pick its parts with ⚙">HUD</button><button id="build-btn" title="Build your HUD — pick which parts it shows">⚙</button>
        </span>
      </div>
      <div id="body"></div>
      <svg id="hudlanes" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <div id="empty" style="display:none">Log a character in with Zeal running and this fills in.</div>
    </div>
  </div>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  function hoverOn(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} }
  function hoverOff(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} }

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    hideBtn.addEventListener('mouseenter', hoverOn);
    hideBtn.addEventListener('mouseleave', hoverOff);
    hideBtn.addEventListener('click', function(){ try { window.mimic.hideThisOverlay(); } catch (e) {} });
  }

  // Manual drag (Chromium transparent-window workaround, same as the others).
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', hoverOn);
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) hoverOff(); });
    moveBtn.addEventListener('mousedown', _beginDrag);
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} hoverOff(); } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null, _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){ _overlayKey = p && p.overlayKey; if (p && p.scope) _setupScope = p.scope; else if (p && p.active) _setupScope = 'all'; document.body.classList.toggle('setup', !!(p && p.active)); });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener('click', function(){ try { document.body.classList.remove('setup'); } catch (e) {} try { if (_setupScope === 'this') window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  // ── the Box / HUD picker (remembered on this machine) ─────────────────────
  // The guild lead, 2026-09-24: "We can remove version C, default the HUD to
  // version, rename A into Box." A keeps its stored key ('a'), so a saved pick
  // survives the rename; the HUD is where anyone new starts.
  var STYLE_KEY = 'wpMeStyle';
  var style = 'hud', _firstRun = false;
  function isHud(v){ return v === 'hud'; }
  try {
    var saved = localStorage.getItem(STYLE_KEY);
    _firstRun = saved == null;
    // The first HUD was layout B, then H1/H2/H3 — all of them are the HUD now;
    // and C, retired, lands there too.
    if (saved === 'b' || saved === 'c' || saved === 'h1' || saved === 'h2' || saved === 'h3') saved = 'hud';
    if (saved === 'a' || isHud(saved)) style = saved;
  } catch (e) {}
  var picker = document.getElementById('picker');
  function paintPicker(){
    var bs = picker.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-v') === style);
  }
  picker.addEventListener('mouseenter', hoverOn);
  picker.addEventListener('mouseleave', hoverOff);
  // A HUD wraps the screen centre, so switching to one makes the window a
  // centred SQUARE — the ring's own bounds; resize it like any overlay and
  // the ring scales with it. Switching between HUDs keeps that square;
  // switching back to a card puts the card where it was.
  var CARD_KEY = 'wpMeCardBounds';
  function setBounds(b){ try { if (window.mimic && window.mimic.overlaySetBounds) window.mimic.overlaySetBounds(b); } catch (e) {} }
  picker.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-v]') : null;
    if (!b) return;
    var next = b.getAttribute('data-v');
    if (next === style) return;
    if (builderEl && !builderEl.hidden) closeBuilder(false);   // leaving the HUD: the card's bounds follow
    if (isHud(next) && !isHud(style)) {

  // the numbers off bold.

  // those shows up." So a round is ONE line, its hits side by side; a round

  function flushX(L, y, size, w){ var sp = laneSpan(L, y, size); return L.side === 'right' ? sp.outer - w : sp.outer; }
  function textW(s, size){ return String(s).length * 0.6 * size; }
  function hitW(h, size){ return textW(n0(h.f.amount), size) + (h.f.hand === 'OH' ? 3 * 0.6 * 6 : 0); }
  function layRound(L, hits, y, size, step){
    var lineW = function(fs){ return hits.reduce(function(a, h){ return a + hitW(h, fs); }, 0) + 0.6 * fs * (hits.length - 1); };

      if (!e.lr) {   // a round shown as its sum

        var txt = n0(sum), w = textW(txt, fs0), x = flushX(L, e.y, fs0, w), key = id + '|R|' + e.rd.at;
        sumPos[e.rd.at] = { x: x, y: e.y, w: w };
        items.push({ key: key, x: x, y: e.y, anchor: 'start', lane: id, merged: true, text: txt, color: L.color, op: e.rd.op, size: fs0 });

    if (p.hitsOut) add('hout', function(f){ return f.dir === 'out' && f.kind !== 'ds'; });

  }

  // ── HUD ────────────────────────────────────────────────────────────────────
  // One ring (r 172), fixed places:
  //   top      target arc, its name written along the ring; who it is hitting
  //            and its slow state just inside; the summon mark at 97%
  //   left     health · a column of hits ON YOU inside it (its own layer)
  //   right    mana or endurance · a column of YOUR hits inside it, and below
  //            it the damage-shield column with its per-hit button
  //   bottom   cooldowns on an inner arc, each labelled beneath it; under
  //            them, on the ring, the tick bar (left) and the swing bar
  //            (right — your cast takes it while you cast), each labelled
  //            beneath · resists inside the cooldowns
  // Nothing drawn inside r ≈ 100: the middle of the screen is the character's.
  // Round four (the guild lead, 2026-09-24): "Tick and swing timer should be
  // their own bars underneath abilities" · "Everything feels very bold" · "The
  // ENRAGES section should just make a red outline for the last 8% of the
  // healthbar".
  var ENRAGE_PCT = 8;   // Quarm bosses enrage at ~8% HP (same as the Tank overlay)
  var SUMMON_PCT = 97;  // the server's default: a summoner starts pulling below 97%
  function renderHud(s){
    var d = hudData(s), p = hudParts, h = '', R = 172;
    var W = HUD_WEIGHTS[p.weight] || HUD_WEIGHTS.thin;
    if (p.target && d.t) {
      // The enrage zone: a red outline round the last 8% of the health bar
      // (its low end — the bar empties toward the left), solid while it IS
      // enraged. The outline goes under the bar so the bar stays readable.
      if (p.status && d.t.enrage) h += stroke(arcD(R, -44, -44 + 88 * ENRAGE_PCT / 100), d.t.enraged ? 'var(--red)' : 'rgba(248,81,73,0.6)', 6 * W + 5);
      h += gauge(R, -44, 44, d.t.hp == null ? 0 : d.t.hp / 100, hpColor(d.t.hp), 6 * W);
      // A summoner: a marker across the bar at 97%, where it starts pulling
      // its target in (the guild lead, round five: "if a mob summons we should
      // get a marker next to the 97%"), with a pointer outside the ring.
      if (p.status && d.t.summon) {
        var sa = -44 + 88 * SUMMON_PCT / 100, s0 = P(R - 6, sa), s1 = P(R + 6, sa), sp = P(R + 9, sa), sl = P(R + 14, sa - 2.2), sr = P(R + 14, sa + 2.2);
        h += '<path d="M' + f1(s0[0]) + ' ' + f1(s0[1]) + ' L' + f1(s1[0]) + ' ' + f1(s1[1]) + '" stroke="var(--orange)" stroke-width="' + f1(1.2 * W + 0.6) + '" stroke-linecap="round"/>'
          + '<path d="M' + f1(sp[0]) + ' ' + f1(sp[1]) + ' L' + f1(sl[0]) + ' ' + f1(sl[1]) + ' L' + f1(sr[0]) + ' ' + f1(sr[1]) + ' Z" fill="var(--orange)"/>';
      }
      // Round eight (the guild lead, 2026-09-24): "Put the name of the mob on the
      // top of their healthbar. Put their resists below their name. and the
      // slowed/not slowed/unslowable next to that" · "L40-43 Necromancer should
      // also be curved to fit the top bar". From the outside in:
      //   → Corvale 78%            who it is hitting, with its own thin bar (round seven)
      //   A Greater Spire Spirit 66%   on top of its bar, fitted to the bar
      //   ════════ its health ════════
      //   L40–43 Necromancer        curved, just inside
      //   MR50 FR30 … · not slowed  its resists and slow state, curved
      // Every line is fitted to the bar's own span: smaller, then (the name)
      // cut with "…" — the health is never cut.
      var tname = String(d.t.name), label = tname + '  ' + pctTxt(d.t.hp);
      var nameR = R + 5;
      var nameSize = fitSize(13 * sz('target'), label.length, NAME_SPAN, nameR);
      var fitChars = Math.floor(NAME_SPAN * Math.PI / 180 * nameR * 0.96 / (0.6 * nameSize));
      if (label.length > fitChars) { tname = tname.slice(0, Math.max(3, fitChars - (label.length - tname.length) - 1)) + '…'; label = tname + '  ' + pctTxt(d.t.hp); }
      h += ringLabel('htn', nameR, -NAME_SPAN / 2, NAME_SPAN / 2, '<tspan fill="' + (d.t.enraged ? 'var(--red)' : (d.t.corpse ? '#8b949e' : '#e6edf3')) + '">' + esc(tname) + '</tspan>'
        + '<tspan fill="' + hpColor(d.t.hp) + '" font-weight="700">  ' + pctTxt(d.t.hp) + '</tspan>', nameSize);
      var nameTop = nameR + 0.72 * nameSize;
      // F / R in a fist, just left of the name (round six), bright for a few
      // seconds after it just did. The name is monospace (0.6 em a character),
      // centred on 12 o'clock.
      if (p.status && (d.t.flurry || d.t.rampage)) {
        var half = label.length * nameSize * 0.6 / 2 / nameR * 180 / Math.PI;
        var fr = nameR + nameSize * 0.35;
        var ba = Math.max(-58, -(half + 6));
        [['F', d.t.flurry, d.t.flurryLit], ['R', d.t.rampage, d.t.rampageLit]].forEach(function(b){
          if (!b[1]) return;
          var bp2 = P(fr, ba);
          h += fist(bp2[0], bp2[1], b[0], b[2], W, sz('status'));
          ba = Math.max(-58, ba - 20 * sz('status') / fr * 180 / Math.PI);
        });
      }
      // Its target, on top of the circle above the name (round seven): a thin
      // bar clear of the name's letters, its name + health along the outside.
      if (p.tot && d.t.tot) {
        var totBarR = Math.max(R + 18.5, nameTop + 2.5), totR = totBarR + 2.5;
        var totLabel = '→ ' + String(d.t.tot.name) + ' ' + pctTxt(d.t.tot.hp);
        var totSize = fitSize(8 * sz('tot'), totLabel.length, 60, totR);
        var totSpan = Math.min(60, totLabel.length * totSize * 0.6 / totR * 180 / Math.PI + 6);
        h += gauge(totBarR, -totSpan / 2, totSpan / 2, (d.t.tot.hp || 0) / 100, hpColor(d.t.tot.hp), 1.8 * W);
        h += ringLabel('htt', totR, -30, 30, '<tspan fill="#c9d1d9">→ ' + esc(d.t.tot.name) + ' </tspan><tspan fill="' + hpColor(d.t.tot.hp) + '">' + pctTxt(d.t.tot.hp) + '</tspan>', totSize);
      }
      // Inside the bar: level and class, curved to fit it.
      var inR = R - 5;
      var lvl = levelText(d.t);
      if (lvl && !d.t.corpse) {
        var ls = fitSize(9 * sz('target'), lvl.length, 80, inR - 7);
        inR -= 0.72 * ls;
        h += ringLabel('htl', inR, -40, 40, '<tspan fill="#8b949e">' + esc(lvl) + '</tspan>', ls);
        inR -= 3;
      }
      // Under that: its resists, and its slow state beside them.
      var showRes = p.tres && d.t.res, showSlow = p.status && d.t.slow;
      if (showRes || showSlow) {
        var rs = 8 * sz('tres'), ss = showSlow ? d.t.slow.size / 9.5 : 1;
        var plain = (showRes ? d.t.res.map(function(x){ return x[0] + (x[1] == null ? '—' : x[1]); }).join(' ') : '') + (showRes && showSlow ? ' · ' : '') + (showSlow ? d.t.slow.s : '');
        var fsR = fitSize(rs, plain.length, 80, inR - 6);
        inR -= 0.72 * fsR;
        h += ringLabel('htr', inR, -40, 40, (showRes ? resTspans(d.t.res) : '') + (showRes && showSlow ? '<tspan fill="#6e7681"> · </tspan>' : '')
          + (showSlow ? '<tspan font-size="' + f1(fsR * ss * sz('status')) + '" fill="' + d.t.slow.c + '">' + d.t.slow.s + '</tspan>' : ''), fsR);
        inR -= 3;
      }
      if (p.status && d.t.enraged) h += T(CX, 200 - inR + 13 * sz('status'), 'ENRAGED', 11 * sz('status'), 'var(--red)', 'middle', 700);
    }
    if (p.hp) {
      h += gauge(R, 236, 304, d.hp == null ? 0 : d.hp / 100, hpColor(d.hp), 6 * W);
      h += ringLabel('hhp', R + 10, 236, 304, hpLabel(d, p.dps), 11 * sz('hp'));
    }
    if (p.right && d.right.pct != null) {
      h += gauge(R, 56, 124, d.right.pct / 100, d.right.color, 6 * W, true);
      h += ringLabel('hrt', R + 10, 56, 124, rightLabel(d, p.dps, p.focus), 11 * sz('right'));
      if (!d.noMana && d.end != null) h += gauge(R - 10, 240, 300, d.end / 100, 'var(--orange)', 2 * W);
    }
    // Cooldowns: an inner arc across the bottom (at most 80°, centred on 6
    // o'clock), left to right, each labelled along the ring beneath it.
    var cds = cdItems(d, p).slice(0, 5);
    if (cds.length) {
      var gap = 2, seg = Math.min(20, (80 - gap * (cds.length - 1)) / cds.length);
      var c1 = 180 + (seg * cds.length + gap * (cds.length - 1)) / 2;
      cds.forEach(function(it, i){
        var c0 = c1 - seg;
        h += it.ready ? stroke(arcD(150, c0, c1), 'var(--green)', 4 * W) : gauge(150, c0, c1, it.frac, it.color, 4 * W);
        // Round seven (the guild lead: "on Large size for abilities we should just
        // show the name of the ability and a checkmark instead of ready"), and
        // round eight ("FD still shows ready instead of a checkmark" — it fit,
        // so it kept the word while its neighbours had ✓): ready is ALWAYS a
        // ✓, at every size. Anything still too long shrinks to fit instead of
        // being cut off ("ND rea").
        var cs = 8.5 * sz('cooldowns'), txt = it.ready ? it.label + ' ✓' : it.label + ' ' + it.value;
        h += ringLabel('hcd' + i, 165, c0, c1, '<tspan fill="' + it.color + '">' + txt + '</tspan>', fitSize(cs, txt.length, c1 - c0, 165), true);
        c1 = c0 - gap;
      });
    }
    // Under them, on the ring itself: the tick bar and the swing bar.
    var tk = tickItem(d, p), sw = swingItem(d, p);
    [[tk, 'htk', 184, 228, 'tick'], [sw, 'hsw', 132, 176, 'swing']].forEach(function(b){
      if (!b[0]) return;
      h += gauge(R, b[2], b[3], b[0].frac, b[0].color, 4 * W);
      var bt = b[0].label + ' ' + b[0].value;
      h += ringLabel(b[1], R + 15, b[2], b[3], '<tspan fill="' + b[0].color + '">' + bt + '</tspan>', fitSize(8.5 * sz(b[4]), bt.length, b[3] - b[2], R + 15), true);
    });
    // Hits are their own layer (hudLanes / paintLanes), so they can move; the
    // ring only carries the damage shield's per-hit button, left of its column.
    if (p.ds && d.ds) {
      var bp = [286, 272];
      h += '<circle cx="' + f1(bp[0]) + '" cy="' + f1(bp[1]) + '" r="13" fill="rgba(13,17,23,0.72)" stroke="var(--orange)" stroke-width="' + f1(1.2 * W + 0.3) + '"/>'
        + T(bp[0], bp[1] - 3.5, 'DS' + (d.ds.from_buffs ? '' : '~'), 6, 'var(--orange)')
        + T(bp[0], bp[1] + 7, d.ds.per_hit != null ? n0(d.ds.per_hit) : '—', 9.5 * Math.min(1.2, sz('ds')), 'var(--orange)', 'middle', 700);
    }
    if (p.resists && d.res) h += ringLabel('hrs', 136, 146, 214, resTspans(d.res), 8 * sz('resists'), true);
    return svgWrap(h + blindRing(s), HUD_WEIGHTS[p.weight] ? p.weight : 'thin');
  }


  var bodyEl = document.getElementById('body');
  var emptyEl = document.getElementById('empty');
  var _last = null, _lastHtml = null;

  // ── the hit columns' layer ─────────────────────────────────────────────────
  // Unlike the ring, these <text> lines are kept between repaints, keyed by
  // hit, so CSS can animate them: a line moves by changing its transform, and
  // a line that is going away fades where it is — or, for a finished round's
  // hits, slides onto the round's total first ("slide and smoosh together into
  // the new number"). Only what changed is written, so a still frame costs
  // nothing and a running transition is never restarted.
  var lanesEl = document.getElementById('hudlanes');
  var _laneEls = {};
  function lanePos(el, x, y, op){
    var tf = 'translate(' + f1(x) + 'px,' + f1(y) + 'px)', o = String(op);
    if (el._tf !== tf) { el.style.transform = tf; el._tf = tf; el._x = x; el._y = y; }
    if (el._op !== o) { el.style.opacity = o; el._op = o; }
  }
  function laneRetire(key, el, x, y){
    delete _laneEls[key];
    lanePos(el, x != null ? x : el._x, y != null ? y : el._y, 0);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  function paintLanes(L, weight){
    if (!lanesEl) return;
    var cls = 'w-' + (HUD_WEIGHTS[weight] ? weight : 'thin');
    if (lanesEl.getAttribute('class') !== cls) lanesEl.setAttribute('class', cls);
    var keep = {};
    (L ? L.items : []).forEach(function(it){
      keep[it.key] = 1;
      var el = _laneEls[it.key];
      if (!el) {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        el.setAttribute('text-anchor', it.anchor);
        lanesEl.appendChild(el);
        _laneEls[it.key] = el;
        // A new hit rises into place at the bottom of its column; a new total
        // appears where it is, under the hits about to slide up onto it.
        lanePos(el, it.x, it.merged ? it.y : it.y + 6, 0);
        el.getBoundingClientRect();   // commit the start so the move animates
      }
      var fs = f1(it.size || HIT_SIZE);
      if (el._fs !== fs) { el.setAttribute('font-size', fs); el._fs = fs; }
      if (el._bold !== !!it.total) { if (it.total) el.setAttribute('font-weight', '700'); else el.removeAttribute('font-weight'); el._bold = !!it.total; }
      var html = laneInner(it);
      if (el._html !== html) { el.innerHTML = html; el._html = html; }
      if (el._fill !== it.color) { el.setAttribute('fill', it.color); el._fill = it.color; }
      lanePos(el, it.x, it.y, it.op);
    });
    (L ? L.ghosts : []).forEach(function(g){
      var el = _laneEls[g.key];
      if (el && !keep[g.key]) { keep[g.key] = 1; laneRetire(g.key, el, g.x, g.y); }
    });
    Object.keys(_laneEls).forEach(function(k){ if (!keep[k]) laneRetire(k, _laneEls[k]); });
  }

  // ── the builder panel (⚙, HUD only) ───────────────────────────────────────
  // A checklist of the parts in HUD_PARTS, saved on this computer. Clickable on
  // a locked, click-through overlay through the same hover handshake as the
  // picker.
  var builderEl = document.getElementById('builder');
  var builderList = document.getElementById('builder-list');
  function renderBuilder(){
    var h = '';
    HUD_PARTS.forEach(function(g){
      h += '<div class="grp">' + esc(g[0]) + '</div>';
      g[1].forEach(function(it){
        if (it[2]) {
          h += '<label><span class="bl">' + esc(it[1]) + '</span><select data-part="' + it[0] + '">'
            + it[2].map(function(v){ return '<option value="' + v + '"' + (String(hudParts[it[0]]) === String(v) ? ' selected' : '') + '>' + v + '</option>'; }).join('')
            + '</select><button type="button" class="brs" data-reset="' + it[0] + '" title="Back to default">↺</button></label>';
        } else {
          // A part with text gets its own size slider beside it, and every row a
          // ↺ that puts that one line back to its default (round seven).
          var sized = HUD_SIZED.indexOf(it[0]) !== -1;
          var own = (hudParts.sizes && +hudParts.sizes[it[0]]) || 1;
          h += '<label><input type="checkbox" data-part="' + it[0] + '"' + (hudParts[it[0]] ? ' checked' : '') + '> <span class="bl">' + esc(it[1]) + '</span>'
            + (sized ? '<input type="range" class="bsz" data-size="' + it[0] + '" min="0.7" max="1.6" step="0.1" value="' + own + '" title="Text size">' : '')
            + '<button type="button" class="brs" data-reset="' + it[0] + '" title="Back to default">↺</button>'
            + '</label>';
        }
      });
    });
    builderList.innerHTML = h;
    var who = document.getElementById('builder-for');
    if (who) who.textContent = _hudPartsFor ? '· ' + _hudPartsFor : '';
    var all = document.getElementById('builder-all');
    if (all) all.value = String((hudParts.sizes && +hudParts.sizes.all) || 1);
  }
  // Saved for this character, and as the starting point for any character
  // that has none of its own yet.
  function saveParts(){
    try {
      var j = JSON.stringify(hudParts);
      if (_hudPartsFor) localStorage.setItem(HUD_PARTS_KEY + ':' + String(_hudPartsFor).toLowerCase(), j);
      localStorage.setItem(HUD_PARTS_KEY, j);
    } catch (e) {}
    _lastHtml = null; render(_last);
  }
  // A different character logged in: refill hudParts in place with theirs.
  function useCharacterParts(ch){
    if (!ch || ch === _hudPartsFor) return;
    _hudPartsFor = ch;
    var p = readParts(ch);
    Object.keys(hudParts).forEach(function(k){ delete hudParts[k]; });
    Object.assign(hudParts, p);
    if (!builderEl.hidden) renderBuilder();
  }
  builderList.addEventListener('change', function(e){
    var k = e.target && e.target.getAttribute('data-part');
    if (!k) return;
    var v = e.target.value;
    hudParts[k] = e.target.type === 'checkbox' ? (e.target.checked ? 1 : 0) : (/^\d+$/.test(v) ? parseInt(v, 10) : v);
    saveParts();
  });
  // Size sliders — each part's, and "All text" in the header — repaint as they
  // move and save when let go.
  builderEl.addEventListener('input', function(e){
    var k = e.target && e.target.getAttribute('data-size');
    if (!k) return;
    hudParts.sizes = Object.assign({}, hudParts.sizes, (function(o){ o[k] = Math.round(parseFloat(e.target.value) * 10) / 10; return o; })({}));
    _lastHtml = null; render(_last);
  });
  builderEl.addEventListener('change', function(e){ if (e.target && e.target.getAttribute('data-size')) saveParts(); });
  // ↺ puts one line back: on or off as it ships, and its own text size.
  builderEl.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('[data-reset]') : null;
    if (!b) return;
    e.preventDefault();   // inside a <label>: do not toggle its checkbox
    var k = b.getAttribute('data-reset');
    var sizes = Object.assign({}, hudParts.sizes);
    delete sizes[k];
    hudParts.sizes = sizes;
    if (k in HUD_DEFAULTS && k !== 'sizes') hudParts[k] = HUD_DEFAULTS[k];
    renderBuilder(); saveParts();
  });
  builderEl.addEventListener('mouseenter', hoverOn);
  builderEl.addEventListener('mouseleave', hoverOff);
  // Open beside the ring: grow the window by the panel's width to the right,
  // or to the left when the right edge of the screen is too close. The
  // bounds from before are kept on this computer until the panel closes, so
  // quitting with it open does not leave the ring off-centre next time.
  var PANEL_W = 300, BUILD_KEY = 'wpHudPreBuild';   // matches --panel-w
  function openBuilder(){
    var x = window.screenX, y = window.screenY, w = window.outerWidth, hgt = window.outerHeight;
    var sl = screen.availLeft || 0;
    var toLeft = x + w + PANEL_W > sl + screen.availWidth && x - PANEL_W >= sl;
    var pre = { x: x, y: y, width: w, height: hgt };
    try { localStorage.setItem(BUILD_KEY, JSON.stringify(pre)); } catch (e) {}
    document.documentElement.style.setProperty('--ring-w', w + 'px');
    document.body.classList.add('building');
    document.body.classList.toggle('build-left', toLeft);
    renderBuilder();
    builderEl.hidden = false;
    setBounds({ x: toLeft ? x - PANEL_W : x, y: y, width: w + PANEL_W, height: hgt });
  }
  function closeBuilder(restore){
    var pre = null;
    try { pre = JSON.parse(localStorage.getItem(BUILD_KEY) || 'null'); localStorage.removeItem(BUILD_KEY); } catch (e) {}
    builderEl.hidden = true;
    document.body.classList.remove('building', 'build-left');
    document.documentElement.style.removeProperty('--ring-w');
    if (restore !== false && pre && pre.width) setBounds(pre);
    hoverOff();
  }
  // Quit with the panel open → the window comes back at the ring's size.
  (function(){
    var pre = null;
    try { pre = JSON.parse(localStorage.getItem(BUILD_KEY) || 'null'); } catch (e) {}
    if (pre) closeBuilder(isHud(style));
  })();
  document.getElementById('build-btn').addEventListener('click', function(){
    if (builderEl.hidden) openBuilder(); else closeBuilder();
  });
  document.getElementById('builder-close').addEventListener('click', function(){ closeBuilder(); });
  document.getElementById('builder-reset').addEventListener('click', function(){
    Object.keys(hudParts).forEach(function(k){ delete hudParts[k]; });
    Object.assign(hudParts, HUD_DEFAULTS, { sizes: {} });
    renderBuilder(); saveParts();
  });
  function render(s){
    var html = '';
    if (s && s.character) useCharacterParts(s.character);
    if (s && s.character) {
      document.getElementById('tname').textContent = s.character;
      document.getElementById('tclass').textContent = (s.level != null ? s.level + ' ' : '') + (s.class || '');
      // The HUDs draw their own blind ring inside the SVG.
      if (s.blind && !isHud(style)) html += '<div class="blind">👁 BLINDED — this panel still works</div>';
      html += isHud(style) ? renderHud(s) : renderA(s);
    }
    document.body.classList.toggle('hud', isHud(style));
    // The hit columns repaint every frame; paintLanes writes only what moved.
    paintLanes(isHud(style) && s && s.character ? hudLanes(hudData(s), hudParts) : null, hudParts.weight);
    emptyEl.style.display = (s && s.character) ? 'none' : 'block';
    if (html !== _lastHtml) {   // byte-stability guard: no rewrite when nothing changed
      bodyEl.innerHTML = html;
      _lastHtml = html;
      // A HUD is sized to its window, not the other way round.
      if (!isHud(style)) _requestAutoHeight();
    }
  }
  function _requestAutoHeight(){
    if (!(window.mimic && window.mimic.overlayAutoHeight)) return;
    var w = document.getElementById('wrap'); if (!w) return;
    try { window.mimic.overlayAutoHeight(w.scrollHeight + 8); } catch (e) {}
  }
  async function tick(){
    var c = document.getElementById('conn');
    try {
      const r = await fetch('http://127.0.0.1:' + PORT + '/api/me', { cache: 'no-store' });
      const s = await r.json();
      c.className = 'conn ok'; c.textContent = '●';
      _last = s; _lastAt = Date.now(); render(s);
    } catch (e) {
      c.className = 'conn bad'; c.textContent = '○';
    }
  }
  tick(); setInterval(tick, 500);
  // HUD timers (tick, swing, cooldowns, cast) run between polls: repaint from
  // the last snapshot, aged to now. The byte guard in render() skips the DOM
  // write when nothing visible moved.
  setInterval(function(){ if (isHud(style) && _last && _last.character) render(_last); }, 100);
</script>
