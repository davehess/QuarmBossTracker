<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>me</title>
<style>
  /* Me overlay (the guild lead, 2026-09-24): "a 'me' overlay. my target, my
     casting, my health, mana, XP detail. avg DPS per fight, total per
     day/night during raids, then the things that are important to classes
     with mana." Three layouts of the SAME /api/me data, picked in game with
     the A/B/C switch in the title bar, so the guild lead can choose one:
       A  Classic — a Nillipuss-style player window: every number, cur/max
          inside the bars, the % column on the right edge.
       HUD 1/2/3 — a ring around the CENTRE of the screen (the guild lead, same day:
          "one of those me overlays should be a HUD style that goes around the
          players center of their screen … damage in/out shown clearly.
          resists and cast damage too with elements"). It was layout B; after a
          first night with it: "The Circle should be the bounds for the
          resizing with some light info on the inside of the circle" — so the
          window IS the ring's square and everything scales with it. Three
          takes on it to pick from (see the HUD section of the script).
       C  Role    — the class's own numbers first (CHs left, mezzes left,
          Theft of Thought / Harvest timers), then group health.
     Colour is semantic, never decoration: green/orange/red = HP health,
     blue = mana and casting, gold = XP, purple = AA, red = danger. */
  :root{ --bg-alpha:0.55; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9;
         --dim:#6e7681; --blue:#58a6ff; --gold:#d29922; --green:#56d364; --red:#f85149;
         --orange:#ffa657; --purple:#a371f7; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Cascadia Code',ui-monospace,Consolas,monospace;color:var(--text);user-select:none;}
  #wrap{padding:4px 6px 6px}
  .card{background:rgb(13 17 23 / var(--bg-alpha));border:1px solid rgb(48 54 61 / 0.8);border-radius:6px;
    padding:6px 8px;text-shadow:0 1px 2px #000}
  .title{display:flex;align-items:center;gap:6px;font-size:12px;min-height:20px;padding-left:22px;padding-right:26px}
  .title .nm{color:var(--blue);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .cl{color:var(--dim);font-size:11px;white-space:nowrap}
  .title .sp{flex:1}
  .conn{font-size:10px} .conn.ok{color:var(--green)} .conn.bad{color:var(--dim)}
  #picker{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex:none}
  #picker button{background:rgba(22,27,34,0.85);color:var(--dim);border:0;border-left:1px solid var(--border);
    font:inherit;font-size:10px;padding:1px 6px;cursor:pointer;line-height:1.4}
  #picker button:first-child{border-left:0}
  #picker button.on{background:#1f6feb;color:#fff}
  #picker button:hover{color:var(--text)}
  .blind{margin:4px 0;padding:3px 6px;border:1px solid var(--red);color:var(--red);border-radius:4px;
    font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center}
  .dim{color:var(--dim)} .num{font-variant-numeric:tabular-nums}
  #empty{color:rgba(255,255,255,0.55);font-size:12px;padding:6px 2px;text-shadow:0 1px 2px #000}

  /* bars: cur/max centred inside, % in the right column (Nillipuss) */
  .brow{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:4px;margin-top:3px}
  .bar{position:relative;height:15px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .25s ease}
  .bar > span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;color:#fff;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .bar.thin{height:6px} .bar.thin > span{display:none}
  .pct{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
  .line{display:flex;gap:6px;align-items:baseline;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden}
  .line .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
  .kv{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;margin-top:3px}
  .kv b{color:#fff;font-weight:600}
  .gems{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:3px}
  .gem{font-size:10px;display:grid;grid-template-columns:1fr auto;gap:0 4px;align-items:center}
  .gem .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gem .gc{color:var(--blue);font-variant-numeric:tabular-nums}
  .gem .bar{grid-column:1 / -1;height:3px}
  .grp{display:grid;grid-template-columns:78px 1fr 30px;gap:3px;align-items:center;font-size:10px;margin-top:2px}
  .grp .gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* HUD 1/2/3 — one square SVG (viewBox 400×400) that fills the window, so
     resizing the window resizes the ring. Elements are EverQuest's own resist
     colours (the subject's world), used only to label an element. */
  :root{ --fire:#ff7b45; --cold:#79c0ff; --magic:#d2a8ff; --poison:#7ee787; --disease:#e3b341; --melee:#e6edf3; }
  body.hud #wrap{padding:0;height:100%}
  body.hud .card{background:transparent;border-color:transparent;padding:0;height:100%;position:relative}
  body.hud #body{position:absolute;inset:0}
  /* The name + picker drop into the square's bottom corners — outside the ring. */
  body.hud .title{position:fixed;left:4px;right:4px;bottom:3px;min-height:0;padding:0;font-size:10px;opacity:.4;z-index:30;transition:opacity .12s}
  body.hud .title:hover{opacity:1}
  #hudsvg{display:block;width:100%;height:100%;overflow:visible}
  /* The HUD builder (⚙) opens BESIDE the ring, not over it (the guild lead,
     round four: "The configuration section needs to pop up on the side and
     not over the overlay"): the window grows by --panel-w toward whichever
     side has room, the ring keeps its exact width and place (--ring-w), and
     closing puts the window back. */
  :root{ --panel-w:240px; --ring-w:100%; }
  #build-btn{display:none}
  body.hud #build-btn{display:inline-block}
  #builder{position:fixed;right:0;top:0;bottom:0;width:calc(var(--panel-w) - 8px);box-sizing:border-box;z-index:80;overflow:auto;
    background:rgba(13,17,23,0.95);border:1px solid var(--border);border-radius:8px;padding:8px 12px;
    font-size:11px;box-shadow:0 4px 18px rgba(0,0,0,.55)}
  body.build-left #builder{right:auto;left:0}
  body.building #wrap{width:var(--ring-w)}
  body.building.build-left #wrap{margin-left:auto}
  body.building.hud .title{right:calc(var(--panel-w) + 4px)}
  body.building.build-left.hud .title{right:4px;left:calc(var(--panel-w) + 4px)}
  body.building #hide-btn{right:calc(var(--panel-w) + 6px)}
  body.building.build-left #move-btn{left:calc(var(--panel-w) + 6px)}
  #builder[hidden]{display:none}
  #builder .bhead{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:2px}
  #builder .bhead .sp{flex:1}
  #builder .grp{margin:8px 0 2px;color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  #builder label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
  #builder label .bl{flex:1;min-width:0}
  #builder .bsz{width:54px;flex:none;margin:0;accent-color:#58a6ff;cursor:ew-resize}
  #builder select,#builder button{background:rgba(22,27,34,.9);color:var(--text);border:1px solid var(--border);
    border-radius:4px;font:inherit;font-size:10px;padding:1px 6px;cursor:pointer}
  #builder .bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  #hudsvg text,#hudlanes text{font-family:inherit;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
  /* Line weight (⚙ → Line weight): the dark edge round the text, and the
     numbers' boldness. Arcs are scaled in the script. Consolas has only
     regular and bold, so 500 reads as regular there. */
  #hudsvg.w-thin text,#hudlanes.w-thin text{stroke-width:1.6px;stroke:rgba(0,0,0,.8)}
  #hudsvg.w-thin [font-weight="700"],#hudlanes.w-thin [font-weight="700"]{font-weight:500}
  #hudsvg.w-normal text,#hudlanes.w-normal text{stroke-width:2.3px}
  #hudsvg.w-normal [font-weight="700"],#hudlanes.w-normal [font-weight="700"]{font-weight:600}
  /* The hit columns: their own layer over the ring, so a line can slide
     (a new hit in from above; a finished round's hits onto its total). */
  #hudlanes{display:none;position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  body.hud #hudlanes{display:block}
  #hudlanes text{transition:transform .3s ease-out,opacity .3s ease-out}
  @media (prefers-reduced-motion: reduce){ #hudlanes text{transition:none} }

  /* C — role card */
  .focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:4px;margin-top:2px}
  .fbox{border:1px solid var(--border);border-radius:5px;padding:3px 6px;background:rgba(22,27,34,0.65)}
  .fbox .fv{font-size:22px;font-weight:700;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
  .fbox .fl{font-size:10px;color:var(--dim);line-height:1.25;overflow-wrap:anywhere}
  .fbox .fl .fs{display:block;color:#8b949e}
  .fbox.low .fv{color:var(--orange)} .fbox.out .fv{color:var(--red)} .fbox.ready .fv{color:var(--green)}
  .vit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:5px}
  .vit .t{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}

  /* chrome — same pattern as the other overlays */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(88,166,255,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(88,166,255,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(88,166,255,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:#58a6ff;border-color:#58a6ff}
  body.setup #move-btn{top:30px}
  @media (prefers-reduced-motion: reduce){ .bar > i{transition:none} }
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay (top-left corner — same on every overlay)">✥</button>
  <button id="hide-btn" title="Hide the HUD (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 HUD</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="builder" hidden>
    <div class="bhead"><b>Build your HUD</b><span id="builder-for" class="dim"></span><span class="sp"></span><button id="builder-close" title="Close">✕</button></div>
    <div id="builder-list"></div>
    <div class="bfoot"><span class="dim">Saved for this character, on this computer. Sliders set text size.</span><button id="builder-reset">Reset to default</button></div>
  </div>
  <div id="wrap">
    <div class="card">
      <div class="title">
        <span id="conn" class="conn bad">○</span>
        <span id="tname" class="nm">HUD</span><span id="tclass" class="cl"></span>
        <span class="sp"></span>
        <span id="picker" title="Pick a layout — this is a beta test of three designs">
          <button data-v="a" title="A · Classic — every number, Nillipuss-style bars">A</button><button data-v="hud" title="HUD — a ring around your character; pick its parts with ⚙">HUD</button><button data-v="c" title="C · Role — your class's numbers first, then your group">C</button><button id="build-btn" title="Build your HUD — pick which parts it shows">⚙</button>
        </span>
      </div>
      <div id="body"></div>
      <svg id="hudlanes" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <div id="empty" style="display:none">Log a character in with Zeal running and this fills in.</div>
    </div>
  </div>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  function hoverOn(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} }
  function hoverOff(){ try { window.mimic.overlayHoverInteractive(false); } catch (e) {} }

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    hideBtn.addEventListener('mouseenter', hoverOn);
    hideBtn.addEventListener('mouseleave', hoverOff);
    hideBtn.addEventListener('click', function(){ try { window.mimic.hideThisOverlay(); } catch (e) {} });
  }

  // Manual drag (Chromium transparent-window workaround, same as the others).
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', hoverOn);
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) hoverOff(); });
    moveBtn.addEventListener('mousedown', _beginDrag);
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} hoverOff(); } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null, _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){ _overlayKey = p && p.overlayKey; if (p && p.scope) _setupScope = p.scope; else if (p && p.active) _setupScope = 'all'; document.body.classList.toggle('setup', !!(p && p.active)); });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.55;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener('click', function(){ try { document.body.classList.remove('setup'); } catch (e) {} try { if (_setupScope === 'this') window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  // ── the A/B/C picker (remembered on this machine) ────────────────────────
  var STYLE_KEY = 'wpMeStyle';
  var style = 'a';
  function isHud(v){ return v === 'hud'; }
  try {
    var saved = localStorage.getItem(STYLE_KEY);
    // The first HUD was layout B, then H1/H2/H3 — all of them are the HUD now.
    if (saved === 'b' || saved === 'h1' || saved === 'h2' || saved === 'h3') saved = 'hud';
    if (saved === 'a' || saved === 'c' || isHud(saved)) style = saved;
  } catch (e) {}
  var picker = document.getElementById('picker');
  function paintPicker(){
    var bs = picker.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-v') === style);
  }
  picker.addEventListener('mouseenter', hoverOn);
  picker.addEventListener('mouseleave', hoverOff);
  // A HUD wraps the screen centre, so switching to one makes the window a
  // centred SQUARE — the ring's own bounds; resize it like any overlay and
  // the ring scales with it. Switching between HUDs keeps that square;
  // switching back to a card puts the card where it was.
  var CARD_KEY = 'wpMeCardBounds';
  function setBounds(b){ try { if (window.mimic && window.mimic.overlaySetBounds) window.mimic.overlaySetBounds(b); } catch (e) {} }
  picker.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-v]') : null;
    if (!b) return;
    var next = b.getAttribute('data-v');
    if (next === style) return;
    if (builderEl && !builderEl.hidden) closeBuilder(false);   // leaving the HUD: the card's bounds follow
    if (isHud(next) && !isHud(style)) {
      try { localStorage.setItem(CARD_KEY, JSON.stringify({ x: window.screenX, y: window.screenY, width: window.outerWidth, height: window.outerHeight })); } catch (err) {}
      var side = Math.round(Math.min(screen.availWidth, screen.availHeight) * 0.5);
      setBounds({ width: side, height: side, center: true });
    } else if (!isHud(next) && isHud(style)) {
      var card = null;
      try { card = JSON.parse(localStorage.getItem(CARD_KEY) || 'null'); } catch (err) {}
      setBounds(card && card.width ? card : { width: 330, height: 320, center: true });
    }
    style = next;
    try { localStorage.setItem(STYLE_KEY, style); } catch (err) {}
    paintPicker(); _lastHtml = null; render(_last);
  });
  paintPicker();

  // ── helpers ──────────────────────────────────────────────────────────────
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function n0(v){ return v == null ? '—' : Math.round(v).toLocaleString('en-US'); }
  function pctOf(o){
    if (!o) return null;
    if (o.pct != null) return Math.max(0, Math.min(100, o.pct));
    if (o.cur != null && o.max) return Math.max(0, Math.min(100, o.cur * 100 / o.max));
    return null;
  }
  function hpColor(p){ return p == null ? 'var(--dim)' : (p > 50 ? 'var(--green)' : (p > 25 ? 'var(--orange)' : 'var(--red)')); }
  function mmss(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); var m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
  function big(n){ n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return Math.round(n).toLocaleString('en-US'); }
  function bar(p, color, text, cls){
    var w = p == null ? 0 : p;
    return '<div class="bar' + (cls ? ' ' + cls : '') + '"><i style="width:' + w.toFixed(1) + '%;background:' + color + '"></i><span>' + (text || '') + '</span></div>';
  }
  function brow(p, color, text){
    return '<div class="brow">' + bar(p, color, text) + '<div class="pct" style="color:' + color + '">' + (p == null ? '' : Math.round(p) + '%') + '</div></div>';
  }
  function curMax(o){ return (o && o.cur != null && o.max != null) ? n0(o.cur) + ' / ' + n0(o.max) : ''; }
  function rate(v, unit){ return v == null ? '<span class="dim">measuring…</span>' : v.toFixed(1) + '%' + unit; }
  // Time left on a cast, as a DEPLETING bar — countdowns run right to left
  // across the platform (the CH cast bar).
  function castHtml(c){
    if (!c) return '';
    var left = c.pct != null ? 100 - c.pct : null;
    var t = c.remaining_ms != null ? (c.remaining_ms / 1000).toFixed(1) + 's' : '';
    return '<div class="line"><span class="dim">✦</span><span class="grow" style="color:var(--blue)">' + esc(c.spell) + '</span><span class="num">' + t + '</span></div>'
         + (left != null ? bar(left, 'var(--blue)', '', 'thin') : '');
  }
  function targetHtml(t){
    if (!t) return '';
    return '<div class="line"><span class="dim">→</span><span class="grow">' + esc(t.name) + (t.id ? ' <span class="dim">#' + t.id + '</span>' : '') + '</span>'
         + '<span class="num" style="color:' + hpColor(t.hp_pct) + '">' + (t.hp_pct != null ? Math.round(t.hp_pct) + '%' : '') + '</span></div>'
         + (t.hp_pct != null ? bar(t.hp_pct, hpColor(t.hp_pct), '', 'thin') : '');
  }
  function focusValue(f){
    if (f.timer_ms != null) return f.timer_ms <= 0 ? 'ready' : mmss(f.timer_ms);

  function focusTone(f){
    if (f.timer_ms != null) return f.timer_ms <= 0 ? 'ready' : '';

  function dpsLine(d){
    if (!d) return '';

    if (d.night) out.push('tonight avg <b>' + big(d.night.avg_dps) + '</b> · <b>' + big(d.night.dmg) + '</b> <span class="dim">over ' + d.night.fights + ' fight' + (d.night.fights === 1 ? '' : 's') + '</span>');
    return out.length ? '<div class="kv">' + out.join('<span class="dim">·</span>') + '</div>' : '';

  function groupHtml(g){

      var m = g[i];

         + '<span class="pct" style="color:' + hpColor(m.hp_pct) + '">' + (m.hp_pct != null ? Math.round(m.hp_pct) + '%' : '') + '</span></div>';

  function gemsHtml(gems){
    if (!gems || !gems.length) return '';

      var g = gems[i];
      h += '<div class="gem" title="' + esc(g.name) + (g.mana ? ' · ' + g.mana + ' mana' : '') + '"><span class="gn">' + esc(g.name) + '</span>'
         + '<span class="gc">' + (g.casts_left != null ? '×' + g.casts_left : '') + '</span>'
         + (g.recast_pct != null ? bar(g.recast_pct, 'var(--dim)', '', 'thin') : '') + '</div>';
    }
    return h + '</div>';
  }

  // ── A · Classic ───────────────────────────────────────────────────────────
  function renderA(s){
    var hpP = pctOf(s.hp), mnP = pctOf(s.mana);
    var h = '';
    h += brow(hpP, hpColor(hpP), curMax(s.hp));
    if (mnP != null) h += brow(mnP, 'var(--blue)', curMax(s.mana));
    if (s.end && s.end.pct != null) h += brow(s.end.pct, 'var(--orange)', 'endurance');
    if (s.xp && s.xp.pct != null) h += brow(s.xp.pct, 'var(--gold)', 'XP/hr ' + (s.xp.per_hr == null ? '…' : s.xp.per_hr.toFixed(1) + '%'));
    if (s.aa && s.aa.pct != null) h += brow(s.aa.pct, 'var(--purple)', 'AA/hr ' + (s.aa.per_hr == null ? '…' : s.aa.per_hr.toFixed(1) + '%') + (s.aa.banked ? ' · ' + s.aa.banked + ' banked' : ''));
    var meta = [];
    if (s.level != null) meta.push('Level <b>' + s.level + '</b>');
    if (s.weight && s.weight.cur != null) meta.push('Wt <b>' + s.weight.cur + '</b>/' + (s.weight.max != null ? s.weight.max : '?'));
    if (s.pet) meta.push('🐾 ' + esc(s.pet.name) + ' <b style="color:' + hpColor(s.pet.hp_pct) + '">' + Math.round(s.pet.hp_pct || 0) + '%</b>');
    if (meta.length) h += '<div class="kv">' + meta.join('') + '</div>';
    h += castHtml(s.casting);
    h += targetHtml(s.target);
    if (s.focus && s.focus.length) {
      h += '<div class="kv">' + s.focus.map(function(f){ return esc(f.label) + ' <b>' + focusValue(f) + '</b>' + (f.sub ? ' <span class="dim">' + esc(f.sub) + '</span>' : ''); }).join('') + '</div>';
    }
    var d = dpsLine(s.dps); if (d) h += '<div class="lbl">damage</div>' + d;
    if (s.group && s.group.length) h += '<div class="lbl">group</div>' + groupHtml(s.group);
    if (s.gems && s.gems.length) h += '<div class="lbl">spells <span class="dim">(casts left at current mana)</span></div>' + gemsHtml(s.gems);
    return h;
  }

  // ── HUD 1 · 2 · 3 — the ring IS the window ────────────────────────────────
  // The guild lead, 2026-09-24, after a night with the first HUD: "The circle looks
  // nice, but managing it is rough right now resizing is rough … It's so
  // spread out … The Circle should be the bounds for the resizing with some
  // light info on the inside of the circle." So every HUD draws into ONE
  // square SVG, viewBox 400×400, that fills the window: resize the window and
  // the ring resizes; nothing is placed in screen pixels. Three genuinely
  // different takes on the same data, to pick from in game:
  //   H1 Rings   — everything is an arc; the fewest words.
  //   H2 Dial    — an instrument cluster: numbers first, cooldowns as round
  //                buttons that wipe the way the game's own buttons do.
  //   H3 Reticle — a thin sight with straight bars inside it; only what is
  //                changing is drawn (a ready cooldown is one word).
  // All three: mana hidden for warriors, rogues and monks ("don't expose that
  // for them") — the right arc carries endurance instead; the target on top
  // with its target's HP, slow state, and a RED outline when it can enrage
  // (solid, with the word, while it IS enraged); server tick + swing timer;
  // combat-ability, Mend/Taunt and discipline cooldowns; hits inside the ring,
  // with MH/OH when the hands swing different verbs.
  // Timers are drawn from the snapshot's "time left" minus the time since it
  // arrived, repainted 10× a second, so they run smoothly between polls.
  // Angles run clockwise from 12 o'clock.
  var EL_COLOR = { fire: 'var(--fire)', cold: 'var(--cold)', magic: 'var(--magic)', poison: 'var(--poison)', disease: 'var(--disease)', melee: 'var(--melee)', spell: '#8b949e' };
  var CX = 200, CY = 200;
  var TRACK = 'rgba(255,255,255,0.12)';
  var _lastAt = Date.now();
  function f1(n){ return (Math.round(n * 10) / 10).toString(); }
  function P(r, deg){ var a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
  // Arc from a0 to a1 (degrees, a0 < a1). ccw draws it the other way round —
  // the direction a textPath needs to read left-to-right along the bottom.
  function arcD(r, a0, a1, ccw){
    if (a1 - a0 < 0.05) return '';
    var p0 = P(r, ccw ? a1 : a0), p1 = P(r, ccw ? a0 : a1);
    return 'M' + f1(p0[0]) + ' ' + f1(p0[1]) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' ' + (ccw ? 0 : 1) + ' ' + f1(p1[0]) + ' ' + f1(p1[1]);
  }
  function stroke(d, color, w){ return d ? '<path d="' + d + '" stroke="' + color + '" stroke-width="' + f1(w) + '" fill="none" stroke-linecap="round"/>' : ''; }
  // Track + fill. fromEnd: the fill grows from a1 back toward a0 (the right
  // arc fills from the bottom up by running backwards).
  function gauge(r, a0, a1, frac, color, w, fromEnd){
    var f = Math.max(0, Math.min(1, frac == null ? 0 : frac)), span = a1 - a0;
    return stroke(arcD(r, a0, a1), TRACK, w)
      + stroke(fromEnd ? arcD(r, a1 - span * f, a1) : arcD(r, a0, a0 + span * f), color, w);
  }
  function T(x, y, s, size, color, anchor, weight){
    return '<text x="' + f1(x) + '" y="' + f1(y) + '" font-size="' + size + '" fill="' + color + '" text-anchor="' + (anchor || 'middle') + '"'
      + (weight ? ' font-weight="' + weight + '"' : '') + '>' + s + '</text>';
  }
  function curved(id, r, a0, a1, inner, size, below){
    return '<path id="' + id + '" d="' + arcD(r, a0, a1, !!below) + '" fill="none" stroke="none"/>'
      + '<text font-size="' + size + '"><textPath href="#' + id + '" startOffset="50%" text-anchor="middle">' + inner + '</textPath></text>';
  }
  function pie(x, y, r, frac){   // clockwise wedge from 12 o'clock, frac of a full turn
    var f = Math.max(0, Math.min(0.9999, frac));
    if (f <= 0) return '';
    var a = (f * 360 - 90) * Math.PI / 180;
    return '<path d="M' + f1(x) + ' ' + f1(y) + ' L' + f1(x) + ' ' + f1(y - r) + ' A' + r + ' ' + r + ' 0 ' + (f > 0.5 ? 1 : 0) + ' 1 '
      + f1(x + r * Math.cos(a)) + ' ' + f1(y + r * Math.sin(a)) + ' Z" fill="rgba(201,209,217,0.3)"/>';
  }
  // A letter inside a fist outline, seen from the side: four knuckles along
  // the top, a thumb across the front. Red and faint for "can", solid red for
  // "just did". k scales it with the builder's size slider.
  function fist(x, y, letter, lit, W, k){
    var c = lit ? 'var(--red)' : 'rgba(248,81,73,0.7)', s = 1.25 * (k || 1);
    var q = function(px, py){ return f1(x + px * s) + ' ' + f1(y + py * s); };
    var d = 'M' + q(-6, 7) + ' L' + q(-6, -3)
      + ' A' + f1(1.5 * s) + ' ' + f1(1.5 * s) + ' 0 0 1 ' + q(-3, -3)
      + ' A' + f1(1.5 * s) + ' ' + f1(1.5 * s) + ' 0 0 1 ' + q(0, -3)
      + ' A' + f1(1.5 * s) + ' ' + f1(1.5 * s) + ' 0 0 1 ' + q(3, -3)
      + ' A' + f1(1.5 * s) + ' ' + f1(1.5 * s) + ' 0 0 1 ' + q(6, -3)
      + ' L' + q(6, 5) + ' Q' + q(6, 7) + ' ' + q(4, 7) + ' Z M' + q(-6, 1) + ' L' + q(1, 1);
    return '<path d="' + d + '" fill="' + (lit ? 'rgba(248,81,73,0.25)' : 'rgba(13,17,23,0.55)') + '" stroke="' + c + '" stroke-width="' + f1(0.9 * W + 0.5) + '" stroke-linejoin="round"/>'
      + T(x, y + 5.6 * s, letter, 6.5 * s, c, 'middle', 700);
  }
  function tfmt(ms){
    if (ms == null) return '';
    if (ms < 10000) return (ms / 1000).toFixed(1);
    if (ms < 60000) return Math.ceil(ms / 1000) + 's';
    return mmss(ms);
  }
  var CD_SHORT = { 'Flying Kick': 'FK', 'Round Kick': 'RK', 'Dragon Punch': 'DP', 'Eagle Strike': 'ES', 'Tiger Claw': 'TC',
    'Kick': 'KICK', 'Bash': 'BASH', 'Backstab': 'BS', 'Mend': 'MEND', 'Taunt': 'TNT', 'Harm Touch': 'HT',
    'Feign Death': 'FD', 'Lay on Hands': 'LOH' };
  function cdShort(c){ return c.key === 'disc' ? 'DISC' : (CD_SHORT[c.label] || String(c.label || '').slice(0, 4).toUpperCase()); }
  // A class cooldown not used yet this session is UNKNOWN — dim, never green:
  // we cannot tell ready from used-before-Mimic-started.
  function cdColor(c){ return !c.seen ? 'var(--dim)' : (c.left <= 0 ? 'var(--green)' : (c.key === 'disc' ? 'var(--purple)' : '#c9d1d9')); }
  function cdValue(c){ return !c.seen ? '—' : (c.left > 0 ? tfmt(c.left) : 'ready'); }
  // Round six (the guild lead, 2026-09-24): "Corpses shouldn't ever say 'not
  // slowed'" · "If a mob is unslowable it should say that in its place, but
  // also smaller text."
  function slowText(t){
    if (!t || t.corpse) return null;
    if (t.slow) return { s: 'slowed' + (t.slow.pct ? ' ' + t.slow.pct + '%' : '') + (t.slow.remaining_secs != null ? ' · ' + mmss(t.slow.remaining_secs * 1000) : ''), c: 'var(--green)', size: 9.5 };
    if (t.unslowable) return { s: 'unslowable', c: 'var(--dim)', size: 8 };
    if (t.enrage != null) return { s: 'not slowed', c: 'var(--orange)', size: 9.5 };   // a mob we have the catalog row for
    return null;
  }
  // "L60 Enchanter", "L52–55 Warrior": the line under the target's bar.
  function levelText(t){
    var lv = t.level != null ? 'L' + t.level + (t.level_max ? '–' + t.level_max : '') : '';
    var s = [lv, t.cls || ''].filter(Boolean).join(' ');
    return s ? s + (t.level_src === 'history' ? ' (last seen)' : '') : null;
  }
  // Everything the three HUDs draw, with every timer aged to "now".
  function hudData(s){
    var dt = Math.max(0, Date.now() - _lastAt);
    var noMana = s.no_mana === true || !!(s.mana && s.mana.max === 0);
    var enP = s.end && s.end.pct != null ? s.end.pct : null;
    var d = { s: s, hp: pctOf(s.hp), mana: noMana ? null : pctOf(s.mana), end: enP, noMana: noMana };
    // The right arc: mana, or endurance for a class with none.
    d.right = noMana ? { pct: enP, color: 'var(--orange)', label: 'end' } : { pct: d.mana, color: 'var(--blue)', label: 'mana' };
    if (s.casting) {
      var left = s.casting.remaining_ms != null ? Math.max(0, s.casting.remaining_ms - dt) : null;
      var f0 = s.casting.pct != null ? (100 - s.casting.pct) / 100 : null;
      var tot = (left != null && f0 && s.casting.remaining_ms) ? s.casting.remaining_ms / f0 : null;
      d.cast = { spell: s.casting.spell, left: left, frac: tot ? left / tot : f0 };
    }
    if (s.tick && s.tick.ms_left != null) { var tl = (((s.tick.ms_left - dt) % 6000) + 6000) % 6000; d.tick = { left: tl, frac: tl / 6000 }; }
    var sw = s.swing;
    if (sw) {
      if (sw.period_ms && sw.ms_left != null) { var sl = (((sw.ms_left - dt) % sw.period_ms) + sw.period_ms) % sw.period_ms; d.swing = { left: sl, frac: sl / sw.period_ms, est: sw.est }; }
      else if (sw.frac_left != null) d.swing = { left: null, frac: sw.frac_left, est: false };
      else if (sw.idle) d.swing = { idle: true, est: true };
    }
    d.cds = (s.cooldowns || []).map(function(c){
      var seen = c.seen !== false && c.ms_left != null;
      var l = seen ? Math.max(0, c.ms_left - dt) : null;
      return { key: c.key, label: c.label, left: l, frac: seen && c.total_ms ? l / c.total_ms : 0, est: c.est, seen: seen };
    });
    var t = s.target;
    if (t) {
      var corpse = t.corpse === true;
      d.t = { name: t.name, hp: t.hp_pct, corpse: corpse,
              tot: !corpse && t.tot && t.tot.name ? { name: t.tot.name, hp: t.tot.hp_pct } : null,
              slow: slowText(t), enrage: !corpse && t.enrage === true, enraged: !corpse && t.enraged === true,
              summon: !corpse && t.summon === true,
              level: t.level != null ? t.level : null, level_max: t.level_max || null, level_src: t.level_src || null, cls: t['class'] || null,
              flurry: !corpse && (t.flurry === true || t.flurry_lit === true), flurryLit: !corpse && t.flurry_lit === true,
              rampage: !corpse && (t.rampage === true || t.rampage_lit === true), rampageLit: !corpse && t.rampage_lit === true };
    }
    var c = s.combat || null;
    d.out = c ? c.out.dps : null; d.inn = c ? c['in'].dps : null;
    d.ds = c && c.ds ? c.ds : null;
    d.tallies = c && Array.isArray(c.tallies) ? c.tallies : [];
    d.feed = (c && c.feed ? c.feed : []).map(function(f){
      var col = f.kind === 'ds' ? 'var(--orange)'
        : f.dir === 'in' ? (f.kind === 'melee' ? 'var(--red)' : (EL_COLOR[f.el] || 'var(--red)')) : (f.kind === 'melee' ? 'var(--melee)' : (EL_COLOR[f.el] || '#8b949e'));
      // Names are cut to 12 characters so a hit line never reaches the middle.
      var nm = String(f.name || (f.kind === 'melee' ? 'melee' : 'spell'));
      if (nm.length > 12) nm = nm.slice(0, 11) + '…';
      return { dir: f.dir, kind: f.kind, amount: f.amount, hand: f.hand || null, other: f.other || null,
               at: f.at != null ? f.at : -(f.age_ms || 0),
               text: (f.dir === 'in' ? '▼ ' : '▲ ') + n0(f.amount) + ' ' + esc(nm) + (f.hand ? ' ' + f.hand : ''),
               color: col, op: Math.max(0.35, 1 - (f.age_ms || 0) / 15000).toFixed(2) };
    });
    d.focus = (s.focus || []).filter(function(f){ return f.timer_ms == null; }).slice(0, 1)
      .map(function(f){ return esc(f.label) + ' ' + focusValue(f); })[0] || null;
    var r = s.resists || {};
    d.res = (r.mr != null || r.fr != null) ? [['MR', r.mr, 'magic'], ['FR', r.fr, 'fire'], ['CR', r.cr, 'cold'], ['PR', r.pr, 'poison'], ['DR', r.dr, 'disease']] : null;
    return d;
  }
  function resTspans(res){
    return res.map(function(x, i){ return (i ? ' ' : '') + '<tspan fill="' + EL_COLOR[x[2]] + '">' + x[0] + '<tspan font-weight="700">' + (x[1] == null ? '—' : x[1]) + '</tspan></tspan>'; }).join('');
  }
  function pctTxt(p){ return p == null ? '—' : Math.round(p) + '%'; }
  function blindRing(s){
    return s.blind ? '<circle cx="200" cy="200" r="194" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="10 6"/>' + T(CX, 128, '👁 BLINDED', 11, 'var(--red)', 'middle', 700) : '';
  }
  function svgWrap(inner, weight){ return '<svg id="hudsvg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" class="w-' + (weight || 'thin') + '">' + inner + '</svg>'; }
  // Round two (the guild lead, 2026-09-24, after playing all three): "Bars are a
  // little too thick" · "The way the text wraps on H1 for the name up top is
  // the format I want to see for the other pieces. Ticks, swing, HP and
  // Endurance." · "There needs to be more open space in the middle." So:
  // thinner arcs everywhere, every arc's label written ALONG the ring the way
  // the target's name is, and nothing drawn inside r ≈ 110 of the centre —
  // the middle of the screen is the character's.
  // A label written along the ring OUTSIDE an arc. Sides and top read with
  // the letters' tops pointing out, like the target's name; the bottom reads
  // upright (below = true).
  function ringLabel(id, r, a0, a1, inner, size, below){ return curved(id, r, a0, a1, inner, size, below); }
  function lbl(name, value, color){ return '<tspan fill="#8b949e">' + name + ' </tspan><tspan fill="' + color + '" font-weight="700">' + value + '</tspan>'; }
  function hpLabel(d, withDps){ return lbl('HP', pctTxt(d.hp), hpColor(d.hp)) + (withDps && d.out != null ? '<tspan fill="#8b949e">  · out ' + big(d.out) + '</tspan>' : ''); }
  function rightLabel(d, withDps, withFocus){
    return lbl(d.noMana ? 'END' : 'MANA', pctTxt(d.right.pct), d.right.color)
      + (withDps && d.inn != null ? '<tspan fill="#8b949e">  · in ' + big(d.inn) + '</tspan>' : '')
      + (withFocus && d.focus ? '<tspan fill="#e6edf3">  · ' + d.focus + '</tspan>' : '');
  }
  // The two running timers, each its own bar under the cooldowns: the server
  // tick, and your swing — or your cast while you cast (the game pauses your
  // swing for it).
  function tickItem(d, p){
    return p.tick && d.tick ? { label: 'TICK', value: String(Math.ceil(d.tick.left / 1000)), frac: d.tick.frac, color: '#8b949e' } : null;
  }
  function swingItem(d, p){
    if (p.cast && d.cast) return { label: '✦ CAST', value: d.cast.left != null ? tfmt(d.cast.left) : '', frac: d.cast.frac, color: 'var(--blue)' };
    if (p.swing && d.swing && !d.swing.idle) return { label: (d.swing.est ? '~' : '') + 'SWING', value: d.swing.left != null ? tfmt(d.swing.left) : '', frac: d.swing.frac, color: 'var(--melee)' };
    return null;
  }
  function cdItems(d, p){
    return p.cooldowns ? d.cds.map(function(c){ return { label: cdShort(c), value: cdValue(c), frac: c.frac, color: cdColor(c), ready: c.seen && c.left <= 0 }; }) : [];
  }

  // ── The builder: which parts the HUD draws ─────────────────────────────────
  // The guild lead, 2026-09-24, after a night with H1/H2/H3: "I think we need an
  // overlay builder for this one in mimic - people will want to customize it,
  // and we can make subelements on this" · "The wrap mode on H1 is the way i
  // want things to be" · "H2's separation of hits against me vs hits out" ·
  // H3's hits "should be smaller and more - i sometimes hit 6 times in one
  // round" · "Damage shield hits … should be separate, and should have a
  // button with current DS amount per hit in it".
  // So the three became ONE HUD in H1's wrapped style, built from the parts
  // below; the ⚙ in its corner switches each on or off, saved on this
  // computer. Every part has a fixed place on the ring, so switching one off
  // leaves a gap rather than moving the others under the player's eye.
  var HUD_PARTS = [
    ['Target', [['target', 'Target name + health, level and class'], ['tot', 'Who it is hitting, with their health'], ['status', 'Slowed · F/R flurry and rampage · summons (mark at 97%) · enrage zone (last 8%) · ENRAGED']]],
    ['You', [['hp', 'Health'], ['right', 'Mana, or endurance'], ['dps', 'Damage per second (out · in)'], ['focus', 'Class number (CHs left…)']]],
    ['Timers', [['cooldowns', 'Cooldowns'], ['tick', 'Server tick (bar under them)'], ['swing', 'Swing timer (bar under them)'], ['cast', 'Cast bar (takes the swing bar while you cast)']]],
    ['Hits', [['hitsIn', 'Hits on you (left)'], ['hitsOut', 'Your hits (right)'], ['ds', 'Damage shield (button + its own column)'], ['rounds', 'Rounds of separate hits', [2, 3, 4, 5]]]],
    ['Other', [['resists', 'Resists'], ['weight', 'Line weight', ['thin', 'normal', 'bold']]]],
  ];
  // Line weight (the guild lead, round four: "Everything feels very bold, we
  // need to be able to make it thinner"): thin is the default; bold is the
  // round-three look. It scales every arc and the text's dark edge, and takes
  // the numbers off bold.

          // A part with text gets its own size slider beside it.
          var sized = HUD_SIZED.indexOf(it[0]) !== -1;
          h += '<label><input type="checkbox" data-part="' + it[0] + '"' + (hudParts[it[0]] ? ' checked' : '') + '> <span class="bl">' + esc(it[1]) + '</span>'
            + (sized ? '<input type="range" class="bsz" data-size="' + it[0] + '" min="0.7" max="1.6" step="0.1" value="' + sz(it[0]) + '" title="Text size">' : '')
            + '</label>';
        }
      });
    });
    builderList.innerHTML = h;
    var who = document.getElementById('builder-for');
    if (who) who.textContent = _hudPartsFor ? '· ' + _hudPartsFor : '';
  }
  // Saved for this character, and as the starting point for any character
  // that has none of its own yet.
  function saveParts(){
    try {
      var j = JSON.stringify(hudParts);
      if (_hudPartsFor) localStorage.setItem(HUD_PARTS_KEY + ':' + String(_hudPartsFor).toLowerCase(), j);
      localStorage.setItem(HUD_PARTS_KEY, j);
    } catch (e) {}
    _lastHtml = null; render(_last);
  }
  // A different character logged in: refill hudParts in place with theirs.
  function useCharacterParts(ch){
    if (!ch || ch === _hudPartsFor) return;
    _hudPartsFor = ch;
    var p = readParts(ch);
    Object.keys(hudParts).forEach(function(k){ delete hudParts[k]; });
    Object.assign(hudParts, p);
    if (!builderEl.hidden) renderBuilder();
  }
  builderList.addEventListener('change', function(e){
    var k = e.target && e.target.getAttribute('data-part');
    if (!k) return;
    var v = e.target.value;
    hudParts[k] = e.target.type === 'checkbox' ? (e.target.checked ? 1 : 0) : (/^\d+$/.test(v) ? parseInt(v, 10) : v);
    saveParts();
  });
  // Size sliders repaint as they move and save when let go.
  builderList.addEventListener('input', function(e){
    var k = e.target && e.target.getAttribute('data-size');
    if (!k) return;
    hudParts.sizes = Object.assign({}, hudParts.sizes, (function(o){ o[k] = Math.round(parseFloat(e.target.value) * 10) / 10; return o; })({}));
    _lastHtml = null; render(_last);
  });
  builderList.addEventListener('change', function(e){ if (e.target && e.target.getAttribute('data-size')) saveParts(); });
  builderEl.addEventListener('mouseenter', hoverOn);
  builderEl.addEventListener('mouseleave', hoverOff);
  // Open beside the ring: grow the window by the panel's width to the right,
  // or to the left when the right edge of the screen is too close. The
  // bounds from before are kept on this computer until the panel closes, so
  // quitting with it open does not leave the ring off-centre next time.
  var PANEL_W = 240, BUILD_KEY = 'wpHudPreBuild';
  function openBuilder(){
    var x = window.screenX, y = window.screenY, w = window.outerWidth, hgt = window.outerHeight;
    var sl = screen.availLeft || 0;
    var toLeft = x + w + PANEL_W > sl + screen.availWidth && x - PANEL_W >= sl;
    var pre = { x: x, y: y, width: w, height: hgt };
    try { localStorage.setItem(BUILD_KEY, JSON.stringify(pre)); } catch (e) {}
    document.documentElement.style.setProperty('--ring-w', w + 'px');
    document.body.classList.add('building');
    document.body.classList.toggle('build-left', toLeft);
    renderBuilder();
    builderEl.hidden = false;
    setBounds({ x: toLeft ? x - PANEL_W : x, y: y, width: w + PANEL_W, height: hgt });
  }
  function closeBuilder(restore){
    var pre = null;
    try { pre = JSON.parse(localStorage.getItem(BUILD_KEY) || 'null'); localStorage.removeItem(BUILD_KEY); } catch (e) {}
    builderEl.hidden = true;
    document.body.classList.remove('building', 'build-left');
    document.documentElement.style.removeProperty('--ring-w');
    if (restore !== false && pre && pre.width) setBounds(pre);
    hoverOff();
  }
  // Quit with the panel open → the window comes back at the ring's size.
  (function(){
    var pre = null;
    try { pre = JSON.parse(localStorage.getItem(BUILD_KEY) || 'null'); } catch (e) {}
    if (pre) closeBuilder(isHud(style));
  })();
  document.getElementById('build-btn').addEventListener('click', function(){
    if (builderEl.hidden) openBuilder(); else closeBuilder();
  });
  document.getElementById('builder-close').addEventListener('click', function(){ closeBuilder(); });
  document.getElementById('builder-reset').addEventListener('click', function(){
    Object.keys(hudParts).forEach(function(k){ delete hudParts[k]; });
    Object.assign(hudParts, HUD_DEFAULTS, { sizes: {} });
    renderBuilder(); saveParts();
  });
  function render(s){
    var html = '';
    if (s && s.character) useCharacterParts(s.character);
    if (s && s.character) {
      document.getElementById('tname').textContent = s.character;
      document.getElementById('tclass').textContent = (s.level != null ? s.level + ' ' : '') + (s.class || '');
      // The HUDs draw their own blind ring inside the SVG.
      if (s.blind && !isHud(style)) html += '<div class="blind">👁 BLINDED — this panel still works</div>';
      html += isHud(style) ? renderHud(s) : (style === 'c' ? renderC(s) : renderA(s));
    }
    document.body.classList.toggle('hud', isHud(style));
    // The hit columns repaint every frame; paintLanes writes only what moved.
    paintLanes(isHud(style) && s && s.character ? hudLanes(hudData(s), hudParts) : null, hudParts.weight);
    emptyEl.style.display = (s && s.character) ? 'none' : 'block';
    if (html !== _lastHtml) {   // byte-stability guard: no rewrite when nothing changed
      bodyEl.innerHTML = html;
      _lastHtml = html;
      // A HUD is sized to its window, not the other way round.
      if (!isHud(style)) _requestAutoHeight();
    }
  }
  function _requestAutoHeight(){
    if (!(window.mimic && window.mimic.overlayAutoHeight)) return;
    var w = document.getElementById('wrap'); if (!w) return;
    try { window.mimic.overlayAutoHeight(w.scrollHeight + 8); } catch (e) {}
  }
  async function tick(){
    var c = document.getElementById('conn');
    try {
      const r = await fetch('http://127.0.0.1:' + PORT + '/api/me', { cache: 'no-store' });
      const s = await r.json();
      c.className = 'conn ok'; c.textContent = '●';
      _last = s; _lastAt = Date.now(); render(s);
    } catch (e) {
      c.className = 'conn bad'; c.textContent = '○';
    }
  }
  tick(); setInterval(tick, 500);
  // HUD timers (tick, swing, cooldowns, cast) run between polls: repaint from
  // the last snapshot, aged to now. The byte guard in render() skips the DOM
  // write when nothing visible moved.
  setInterval(function(){ if (isHud(style) && _last && _last.character) render(_last); }, 100);
</script>
</body></html>
