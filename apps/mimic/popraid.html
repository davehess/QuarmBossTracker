      html += '</div>';
      // Tracker
      if (enc.tracker && enc.tracker.length) {
        html += '<div class="panel"><div class="ph">☑ Objectives <span class="ct">' + enc.tracker.length + '</span>'
              +   '<span class="syncNote" id="syncNote"></span>'
              +   '<span class="act"><button class="resetBtn" id="objReset" title="Clear every checkbox for this encounter (officers)">↺ reset</button></span>'
              + '</div><div id="trackerBody"></div></div>';
      }
      // Links + diagrams
      var diagrams = (enc.diagrams || []).concat(enc.pageImages || []);
      var hasLinks = enc.guide || enc.video || sec.video || sec.guide || diagrams.length || sec.overviewDiagram;
      if (hasLinks) {
        html += '<div class="panel"><div class="ph">🔗 Guide &amp; diagrams</div><div class="links">';
        if (enc.guide)  html += '<span class="lnk" data-url="' + esc(enc.guide) + '" data-wp-interact>📖 Guide page</span>';
        if (!enc.guide && sec.guide) html += '<span class="lnk" data-url="' + esc(sec.guide) + '" data-wp-interact>📖 Phase guide</span>';
        var vid = enc.video || sec.video;
        if (vid) html += '<span class="lnk vid" data-url="' + esc(vid) + '" data-wp-interact>🎬 Video</span>';
        html += '</div>';
        var dgs = diagrams.slice();
        if (sec.overviewDiagram) dgs.unshift(sec.overviewDiagram);
        if (dgs.length) {
          html += '<div class="diagrams">';
          dgs.forEach(function(d){
            var u = imgUrl(d);
            html += '<div class="dg" data-url="' + esc(u) + '" data-wp-interact title="Click to open full size">'
                  +   '<img src="' + esc(u) + '" loading="lazy" alt="" onerror="this.parentNode.style.display=\'none\'">'
                  +   '<div class="cap">' + esc(d.replace(/^.*\//, '')) + '</div>'
                  + '</div>';
          });
          html += '</div>';
          html += '<div class="credit">diagrams © EQProgression — loaded directly from their site; guide link above is the source</div>';
        }
        html += '</div>';
      }
    }
    // Quarm global notes (every slide — these apply across PoP)
    html += '<details class="sub panel" style="border-left-color:#d4a72c"><summary data-wp-interact>⚠ Quarm divergences (known)</summary>';
    (DB.quarmGlobalNotes || []).forEach(function(n){ html += '<div class="qnote">' + esc(n) + '</div>'; });
    html += '</details>';
    // ⚑ form
    html += '<div class="panel" id="flagForm"><div class="ph">⚑ Flag an anomaly</div>'
          +   '<textarea id="flagText" placeholder="What did Quarm do differently? (HP, missing mechanic, extra adds, timing…)"></textarea>'
          +   '<div class="fr"><button class="nbtn" id="flagSend">Send to QOL thread</button><span id="flagStatus"></span></div>'
          + '</div>';
    html += '</div>';

    var content = document.getElementById('content');
    content.innerHTML = html;

    // Wire per-render controls (content was just replaced).
    var reset = document.getElementById('objReset');
    if (reset) reset.addEventListener('click', function(){
      var enc2 = currentEnc(); if (!enc2) return;
      postObjective({ encounter_id: enc2.id, op: 'reset' }).then(function(r){
        if (r.status === 403) {
          reset.textContent = 'officer only'; setTimeout(function(){ reset.textContent = '↺ reset'; }, 1500);
        } else { delete _objByEnc[enc2.id]; renderTracker(); pollObjectives(); }
      }).catch(function(){});
    });
    var send = document.getElementById('flagSend');
    if (send) send.addEventListener('click', sendFlag);
    var loot = document.getElementById('lootBody');
    if (loot) {
      var det = loot.closest('details');
      if (det) det.addEventListener('toggle', function(){ if (det.open) loadLoot(); });
    }
    renderTracker();
    pollObjectives();
    _fit();
  }

  // Delegated clicks: objectives toggle + external links/diagrams.
  document.getElementById('content').addEventListener('click', function(e){
    var lnk = e.target && e.target.closest ? e.target.closest('.lnk, .dg') : null;
    if (lnk && lnk.getAttribute('data-url')) { openExt(lnk.getAttribute('data-url')); return; }
    var obj = e.target && e.target.closest ? e.target.closest('.obj') : null;
    if (obj) {
      var enc = currentEnc(); if (!enc) return;
      var objId = obj.getAttribute('data-obj');
      var st = _objByEnc[enc.id] || (_objByEnc[enc.id] = {});
      var was = !!(st[objId] && st[objId].c);
      // Optimistic flip; authoritative state arrives on the next poll.
      if (was) delete st[objId]; else st[objId] = { c: true, by: 'you', at: new Date().toISOString() };
      renderTracker();
      postObjective({ encounter_id: enc.id, objective_id: objId, checked: !was }).then(function(){ pollObjectives(); }).catch(function(){});
    }
  });

  // ── Quests mode: picker, the selected quest, copy chips, mode toggle ───────
  // Grouped as the web guide groups them: levels, then sections.
  var _questPickHtml = (function(){
    var html = '';
    (QDB.levels || []).forEach(function(lv){
      (lv.sections || []).forEach(function(sec){
        html += '<optgroup label="' + esc(qGroupLabel(lv, sec)) + '">';
        (sec.quests || []).forEach(function(q){ html += '<option value="' + esc(q.key) + '">' + esc(q.title) + '</option>'; });
        html += '</optgroup>';
      });
    });
    return html;
  })();

  QIDX = qBuildIndex(QDB, QUESTS);

  function renderQuest(){
    var content = document.getElementById('content');
    var e = QUESTS[qIdx];
    if (!e) { content.innerHTML = '<div class="empty">no quests loaded</div>'; _fit(); return; }
    var q = e.q;
    try { localStorage.setItem('wp:pop:quest', q.key); } catch (er) {}
    encPick.value = q.key;
    if (document.body.classList.contains('wp-mini')) {
      qScreen = 'card';   // mini is a two-line strip: no block screens
      content.innerHTML = questMiniHtml(QUESTS, qIdx, qStepIdx(QUESTS, QIDX, qIdx, 1, QUEST_PLANE_END));
      _fit();
      return;
    }
    var pl = qPlaneOf(QUESTS, QIDX, qIdx);
    // The block screens ▲ climbs to. The block that holds the selected step is marked on each.
    if (qScreen !== 'card') {
      if (qScreen === 'eras') content.innerHTML = qErasHtml(QIDX, pl ? pl.era : '');
      else if (qScreen === 'planes') content.innerHTML = qPlanesHtml(QIDX, qEra, pl ? pl.key : '');
      else content.innerHTML = flagsBackHtml(_back) + qListHtml(QIDX, QUESTS, qPlane, qIdx);
      _fit();
      return;
    }
    // data-step: the key the Flags links land on (popGoto rings it, or the row inside it that says the phrase).
    content.innerHTML = flagsBackHtml(_back) + '<div class="enc-hdr" data-step="' + esc(q.key) + '">'
      +   '<span class="pos">' + (pl ? pl.idxs.indexOf(qIdx) + 1 : qIdx + 1) + '/' + (pl ? pl.idxs.length : QUESTS.length) + '</span>'
      +   (pl ? qCrumb(QIDX, pl.era, pl.key) : '')
      +   '<div class="nm">' + esc(q.title) + '</div>'
      +   '<div class="zone">' + questTags(q) + '</div>'
      +   '<div class="sect">' + esc(qGroupLabel(e.level, e.sec)) + '</div>'
      + '</div>'
      + '<div id="panels">' + questHtml(q)
      +   (e.sec.blurb ? qDetails('sec|' + e.sec.key, 'About this section', '<div class="callout">' + esc(e.sec.blurb) + '</div>') : '')
      + '</div>';
    _fit();
    popRing();
  }

  // Copy for the /say, /sit and /map chips (the pattern mobinfo.html uses). Clipboard first, the
  // textarea route when the API is refused.
  function _copyText(text){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {} finally { ta.remove(); }
    }
    try { navigator.clipboard.writeText(text).catch(fallback); } catch (e) { fallback(); }
  }
  var _questBox = document.getElementById('content');
  _questBox.addEventListener('click', function(e){
    var t = (e.target && e.target.closest) ? e.target : null;
    if (!t) return;
    var chip = t.closest('.qcopy');
    if (chip) {
      _copyText(chip.getAttribute('data-copy') || '');
      chip.classList.add('ok');
      chip.textContent = '✓ copied';
      // Nothing repaints Quests mode on a timer, so the chip puts its own text back.
      setTimeout(function(){ chip.classList.remove('ok'); chip.textContent = chip.getAttribute('data-copy') || ''; }, 1200);
      return;
    }
    // Flags mode: a blue → button jumps into Quests (or back); Capture now reads the log.
    var go = t.closest('[data-go]');
    if (go) { popGoto(go.getAttribute('data-go'), fFrom(go)); return; }
    if (t.closest('#flagsCapture')) { flagsCapture(); return; }
    // A drill-down block: an era opens its planes, a plane its steps, a step its card.
    var blk = t.closest('.qblock');
    if (blk) {
      var nav = blk.getAttribute('data-nav'), key = blk.getAttribute('data-key');
      if (nav === 'era') { qEra = key; qScreen = 'planes'; }
      else if (nav === 'plane') { qPlane = key; qScreen = 'list'; }
      else if (nav === 'quest') {
        var qi = QUESTS.findIndex(function(x){ return x.q.key === key; });
        if (qi >= 0) { qIdx = qi; qScreen = 'card'; }
      }
      renderSlide();
      return;
    }
    if (t.closest('.qnext')) {
      var nx = qStepIdx(QUESTS, QIDX, qIdx, 1, QUEST_PLANE_END);
      if (nx >= 0) { qIdx = nx; renderSlide(); }
    }
  });
  // <details> do not bubble `toggle`; the capture phase sees it. Open state goes to _qOpen. A fold changes
  // the card's height, so fit mode re-measures (fixed height keeps its window and the card scrolls).
  _questBox.addEventListener('toggle', function(e){
    var d = e.target;
    var k = (d && d.getAttribute) ? d.getAttribute('data-dk') : null;
    if (k) _qOpen[k] = !!d.open;
    if (!_isFixed()) _fit();
  }, true);

  // ── Flags mode: the character you play, from the agent (GET /api/pop-status, the bot's `pop` stream) ──────────
  // The overlay asks the LOCAL agent every 3 s; that costs the bot nothing (the agent asks the bot every five minutes and
  // again ~2 s after its own flag upload lands). The page redraws only when the answer changed (its age is its own span),
  // so the card does not flicker or lose its scroll. test/pop-overlay-flags.test.js drives all of this on a fake page.
  var _flags = null;          // the last /api/pop-status body, or null (agent not answering / not asked yet)
  var _flagsKey = '';         // that body without its age: the change gate
  var _flagsAt = 0;           // when the agent last answered
  var _flagsPick = '';        // '' = whoever is being played
  try { _flagsPick = localStorage.getItem('wp:pop:flagchar') || ''; } catch (e) {}
  var _flagsAge = null;       // the body's age_ms at _flagsAt
  var _cap = { busy: false, note: '' };
  var _back = null;           // { from, character } while the step you are on was jumped to from Flags
  var _ring = '', _ringSay = '', _keepScreen = false;
  function flagsCtx(){ return { A: QDB.anchors || {}, Q: QBY, ageText: fAgo(_flagsAge), cap: _cap }; }
  function renderFlags(){
    var content = document.getElementById('content');
    var keep = content.scrollTop;
    var mini = document.body.classList.contains('wp-mini');
    content.innerHTML = mini ? flagsMiniHtml(_flags, flagsCtx()) : flagsHtml(_flags, flagsCtx());
    var pickHtml = flagsPickHtml(_flags, _flagsPick);
    if (encPick.innerHTML !== pickHtml) encPick.innerHTML = pickHtml;
    encPick.value = _flagsPick;
    content.scrollTop = keep;
    _fit();
  }
  function flagsApply(body){
    var gate = '';
    if (body) { var c = {}; Object.keys(body).forEach(function(k){ if (k !== 'age_ms') c[k] = body[k]; }); gate = JSON.stringify(c); }
    _flagsAt = Date.now(); _flagsAge = body ? body.age_ms : null;
    var age = document.getElementById('flagsAge');
    if (gate === _flagsKey && _flags !== null) { if (age) age.textContent = fAgo(_flagsAge); return; }
    _flags = body; _flagsKey = gate;
    if (popMode === 'flags') renderFlags();
  }
  async function pollFlags(){
    if (popMode !== 'flags') return;
    var conn = document.getElementById('conn');
    try {
      var r = await fetch('http://127.0.0.1:' + PORT + '/api/pop-status' + (_flagsPick ? '?character=' + encodeURIComponent(_flagsPick) : ''), { cache: 'no-store' });
      var s = await r.json();
      if (conn) { conn.className = 'conn ok'; conn.textContent = '●'; }
      flagsApply(s && typeof s === 'object' ? s : null);
    } catch (e) {
      if (conn) { conn.className = 'conn bad'; conn.textContent = '○'; }
      flagsApply(null);
    }
    if (_cap.busy) pollCapture();
  }
  // Capture now: the dashboard's own rescan of the log for this character (agent 4.0.26+). One at a time, the agent says
  // so (409). Progress is read back from its status route while it runs; the flags it finds reach the bot, which tells the
  // agent, which shows them here within a few seconds.
  function _capSay(note, busy){ _cap.note = note; _cap.busy = !!busy; var n = document.getElementById('flagsCapNote'), b = document.getElementById('flagsCapture'); if (n) n.textContent = note; if (b) b.disabled = !!busy; }
  async function flagsCapture(){
    var name = _flags && (_flags.character || _flags.active);
    if (!name || _cap.busy) return;
    _capSay('starting…', true);
    try {
      var r = await fetch('http://127.0.0.1:' + PORT + '/api/local/pop-rescan', {
        method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ character: name, days: 14 }),
      });
      var j = await r.json().catch(function(){ return {}; });
      if (r.status === 202 || (r.ok && j && j.started)) { _capSay('reading ' + name + '\'s log…', true); return; }
      _capSay((j && j.error) ? j.error : 'could not start', false);
    } catch (e) { _capSay('agent offline', false); }
  }
  async function pollCapture(){
    try {
      var r = await fetch('http://127.0.0.1:' + PORT + '/api/local/pop-rescan/status', { cache: 'no-store' });
      var j = await r.json();
      var run = j && j.run;
      if (j && j.running) { _capSay('reading ' + (run && run.character ? run.character + '\'s ' : '') + 'log…', true); return; }
      if (run && run.state === 'error') { _capSay('failed: ' + (run.error || 'could not read the log'), false); return; }
      _capSay('done: ' + ((run && run.found) || 0) + ' flag line(s) read; new flags show here in a moment', false);
    } catch (e) { _capSay('agent offline', false); }
  }
  // Where a jump started, for the "← My flags" chip ("came from Next · Brackwyn").
  function fFrom(el){
    var p = el && el.closest ? el.closest('.panel') : null, c = p && p.classList;
    if (c && c.contains('fpend')) return 'Pending memories';
    if (c && c.contains('ftiers')) return 'Flags by tier';
    if (c && c.contains('fdoors')) return 'Doors and keys';
    if (c && c.contains('fnext')) return 'Next';
    return 'Flags';
  }
  // The jump. go = 'step:KEY[|PHRASE]' (a quest's card; PHRASE = the row to ring), 'plane:KEY' (that plane's step list), or
  // 'flags' (back). A key the overlay does not know does nothing: a link is only drawn for one it knows.
  function popGoto(go, from){
    var s = String(go || ''), bar = s.indexOf('|'), phrase = bar >= 0 ? s.slice(bar + 1) : '';
    if (bar >= 0) s = s.slice(0, bar);
    var colon = s.indexOf(':'), kind = colon >= 0 ? s.slice(0, colon) : s, key = colon >= 0 ? s.slice(colon + 1) : '';
    if (kind === 'flags') { _back = null; popMode = 'flags'; applyMode(); return; }
    var char = _flags && (_flags.character || _flags.active) || '';
    if (kind === 'step') {
      var qi = QUESTS.findIndex(function(e){ return e.q.key === key; });
      if (qi < 0) return;
      qIdx = qi; qScreen = 'card'; _ring = key; _ringSay = phrase;
    } else if (kind === 'plane') {
      if (!QIDX.planes[key]) return;
      qPlane = key; qEra = QIDX.planes[key].era; qScreen = 'list'; _ring = ''; _ringSay = '';
    } else return;
    _back = { from: from || 'Flags', character: char };
    popMode = 'quests'; _keepScreen = true;
    applyMode();
  }
  // Rings the step you jumped to (the row that says the phrase, else the card's header) for two seconds and scrolls it
  // into view. No animation: an outline that appears and goes.
  function popRing(){
    var key = _ring, say = _ringSay;
    _ring = ''; _ringSay = '';
    if (!key) return;
    var box = document.getElementById('content'), el = null;
    try {
      if (say && box.querySelectorAll) {
        var chips = box.querySelectorAll('.qcopy.say');
        for (var i = 0; i < chips.length && !el; i++) {
          if (chips[i].getAttribute('data-copy') === '/say ' + say) el = chips[i].closest('.qs, .qstop');
        }
      }
      if (!el && box.querySelector) el = box.querySelector('[data-step="' + String(key).replace(/["\\]/g, '') + '"]');
    } catch (e) { el = null; }
    if (!el) return;
    try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
    el.classList.add('ringed');
    setTimeout(function(){ el.classList.remove('ringed'); }, 2000);
  }

  var modeSlidesBtn = document.getElementById('modeSlides');
  var modeQuestsBtn = document.getElementById('modeQuests');
  var modeFlagsBtn = document.getElementById('modeFlags');
  function applyMode(){
    var q = popMode === 'quests', f = popMode === 'flags';
    if (q && !_keepScreen) qScreen = 'card';   // Quests opens on the step you left, not on a block screen
    _keepScreen = false;
    if (!q && !f) { _back = null; _ring = ''; }
    modeSlidesBtn.classList.toggle('on', !q && !f);
    modeQuestsBtn.classList.toggle('on', q);
    modeFlagsBtn.classList.toggle('on', f);
    document.body.classList.toggle('quests', q);
    document.body.classList.toggle('flags', f);
    encPick.innerHTML = f ? flagsPickHtml(_flags, _flagsPick) : (q ? _questPickHtml : _slidePickHtml);
    if (f) encPick.value = _flagsPick;
    try { localStorage.setItem('wp:pop:mode', f ? 'flags' : (q ? 'quests' : 'slides')); } catch (e) {}
    renderSlide();
  }
  // (A "← My flags" chip belongs to a jump: Slides, which applyMode clears it for, is how it goes away; Flags is where it leads.)
  modeSlidesBtn.addEventListener('click', function(){ if (popMode !== 'slides') { popMode = 'slides'; applyMode(); } });
  modeQuestsBtn.addEventListener('click', function(){ if (popMode !== 'quests' && QUESTS.length) { popMode = 'quests'; applyMode(); } });
  modeFlagsBtn.addEventListener('click', function(){ if (popMode !== 'flags' && QUESTS.length) { popMode = 'flags'; applyMode(); } });
  if (!QUESTS.length) document.getElementById('modeSeg').style.display = 'none';

  applyFramed();
  applyMode();
  // Mini flipped: redraw the same slide in the other rendition; renderSlide
  // ends in _fit(), so the window re-measures after the new content is in.
  window.addEventListener('wp-mini-change', renderSlide);
  setInterval(pollObjectives, 3000);
  setInterval(pollFlags, 3000);
</script>
</body>
</html>
