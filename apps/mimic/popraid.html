<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>popraid</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* PoP Raid Slideshow overlay — encounter-by-encounter raid guide pinned
     in-game: callouts, guide stats vs live loot, shared raid-wide objective
     checkboxes (agent proxies the bot's raid-objectives board), hotlinked
     EQProgression diagrams, and the ⚑ flag-an-anomaly path to the QOL thread.
     Data module: pop-raids.js (same dir). */
  :root{ --bg-alpha:0.62; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;user-select:none;}
  #wrap{padding:6px 8px;}
  .title{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;
    font-size:12px;color:#e9d5ff;text-shadow:0 1px 2px #000;margin-bottom:5px;}
  .conn{font-size:11px}
  .conn.ok{color:var(--wp-green)} .conn.bad{color:#8b949e}
  /* 30px right gutter so the encounter picker's dropdown-dismiss click can't
     land on the fixed ✕ (same hazard the Buff queue class picker had). */
  .navbtns{margin-left:auto;margin-right:30px;display:flex;gap:3px;align-items:center}
  select.pick{background:var(--wp-bg);color:var(--wp-text);border:1px solid var(--wp-border);
    border-radius:3px;font-size:10px;padding:1px 3px;font-family:inherit;cursor:pointer;
    max-width:150px}
  select.pick:focus{outline:1px solid var(--wp-purple)}
  .nbtn{background:var(--wp-panel);color:var(--wp-text);border:1px solid var(--wp-border);border-radius:3px;
    font-size:10px;line-height:1;padding:3px 6px;cursor:pointer;font-family:inherit}
  .nbtn:hover{border-color:var(--wp-purple);color:#e9d5ff}
  .nbtn.on{background:rgba(163,113,247,0.25);border-color:var(--wp-purple);color:#e9d5ff}
  /* Encounter header */
  .enc-hdr{padding:4px 7px;background:rgb(20 10 34 / var(--bg-alpha));border-radius:6px;
    border:1px solid rgba(163,113,247,0.35);text-shadow:0 1px 2px #000;margin-bottom:5px}
  .enc-hdr .nm{font-size:13px;font-weight:bold;color:#e9d5ff}
  .enc-hdr .zone{font-size:10px;color:#79c0ff}
  .enc-hdr .sect{font-size:9px;color:#8b949e}
  .enc-hdr .pos{float:right;font-size:9px;color:var(--wp-dim);font-variant-numeric:tabular-nums}
  /* Panels. Single-column by default; body.framed lays the panels out as a
     multi-column "framed" row for ultrawide monitors. */
  #panels{display:flex;flex-direction:column;gap:5px}
  body.framed #panels{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));
    grid-auto-rows:min-content;align-items:start;gap:6px}
  .panel{background:rgb(8 5 16 / var(--bg-alpha));border-radius:5px;padding:4px 6px;
    text-shadow:0 1px 2px #000;border-left:3px solid var(--wp-purple)}
  .panel .ph{font-size:9px;color:#c4b5fd;letter-spacing:0.06em;text-transform:uppercase;
    margin-bottom:3px;display:flex;align-items:baseline;gap:5px}
  .panel .ph .ct{color:var(--wp-dim);font-variant-numeric:tabular-nums}
  .panel .ph .act{margin-left:auto}
  .callout{font-size:10px;color:#e6edf3;padding:2px 0 2px 10px;position:relative;line-height:1.35}
  .callout::before{content:'▸';position:absolute;left:0;color:var(--wp-purple);font-size:9px}
  /* Stats chips */
  .stats{display:flex;flex-wrap:wrap;gap:4px}
  .stat{padding:1px 5px;border-radius:3px;font-size:9px;line-height:1.5;
    border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--wp-text)}
  .stat b{color:#e6edf3;font-weight:600}
  .stat.hp{border-color:rgba(248,113,113,0.4);color:#fca5a5}
  .stat.slow{border-color:rgba(126,231,135,0.4);color:#7ee787}
  .stat.ramp{border-color:rgba(240,136,62,0.45);color:#fdba74}
  .stat.imm{border-color:rgba(139,148,158,0.5);color:var(--wp-text)}
  .abil{font-size:10px;padding:1px 0 1px 2px;line-height:1.35}
  .abil .an{color:#f0b429;font-weight:600}
  .abil .at{color:var(--wp-text)}
  /* Tracker — the raid-wide shared checkboxes */
  .obj{display:flex;align-items:baseline;gap:5px;padding:2px 4px;border-radius:3px;
    font-size:10px;cursor:pointer;line-height:1.4}
  .obj:hover{background:rgba(163,113,247,0.12)}
  .obj .bx{color:#8b949e;font-size:11px;width:12px;text-align:center}
  .obj.done .bx{color:var(--wp-green)}
  .obj .lb{color:#e6edf3}
  .obj.done .lb{color:#8b949e;text-decoration:line-through}
  .obj .by{margin-left:auto;font-size:9px;color:var(--wp-dim);white-space:nowrap}
  .obj.done .by{color:#7ee787}
  .resetBtn{background:none;border:1px solid rgba(248,113,113,0.4);color:#f87171;
    border-radius:3px;font-size:9px;line-height:1;padding:1px 4px;cursor:pointer;opacity:0.6}
  .resetBtn:hover{opacity:1;background:rgba(248,113,113,0.15)}
  .syncNote{font-size:8px;color:var(--wp-dim);font-style:italic}
  /* Links + diagrams */
  .links{display:flex;flex-wrap:wrap;gap:4px}
  .lnk{padding:2px 6px;border-radius:3px;font-size:10px;line-height:1.5;cursor:pointer;
    border:1px solid rgba(88,166,255,0.4);background:rgba(88,166,255,0.10);color:#79c0ff}
  .lnk:hover{background:rgba(88,166,255,0.22)}
  .lnk.vid{border-color:rgba(248,113,113,0.4);background:rgba(248,113,113,0.10);color:#fca5a5}
  .lnk.vid:hover{background:rgba(248,113,113,0.2)}
  /* ▭ Mini — "Checklist rows", the guild vote (closed 2026-09-17): one title
     line and the shared objective rows, nothing else. Only mini emits
     .mini-ttl. Gutters left and right so the fixed ✥/✕ never sit on the text
     or on ↗ (the ✕-on-a-link hazard the 30px .navbtns gutter exists for). */
  .mini-ttl{display:flex;align-items:baseline;gap:5px;padding:0 24px 2px 22px;font-size:9px;color:#c4b5fd;
    letter-spacing:0.06em;text-transform:uppercase;text-shadow:0 1px 2px #000}
  .mini-ttl .mini-go{margin-left:auto;border-color:transparent;background:transparent;padding:0 4px;
    font-size:11px;letter-spacing:0;line-height:1.2}
  .mini-ttl .mini-go:hover{background:rgba(88,166,255,0.22)}
  .diagrams{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .dg{cursor:pointer;border:1px solid rgba(163,113,247,0.35);border-radius:4px;
    max-width:100%;overflow:hidden;background:rgba(0,0,0,0.35)}
  .dg img{display:block;max-width:100%;max-height:170px;object-fit:contain}
  body.framed .dg img{max-height:300px}
  .dg .cap{font-size:8px;color:#8b949e;padding:1px 4px;text-align:center}
  .credit{font-size:8px;color:var(--wp-dim);font-style:italic;margin-top:3px}
  /* Loot (live drop table via agent's mob-info cache) */
  .loot-row{display:flex;align-items:baseline;gap:5px;padding:1px 4px;font-size:9px;
    background:rgba(255,255,255,0.03);border-radius:2px;border-left:2px solid #3b82f6;margin-bottom:1px}
  .loot-row.t100{border-left-color:var(--wp-green)}.loot-row.t5{border-left-color:#f0883e}
  .loot-row.t1{border-left-color:var(--wp-red)}.loot-row.t20{border-left-color:var(--wp-purple)}
  .loot-row .nm{color:#e6edf3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loot-row .pct{font-variant-numeric:tabular-nums;color:var(--wp-text)}
  details.sub{margin-top:2px}
  details.sub summary{font-size:9px;color:#79c0ff;cursor:pointer;list-style:none;padding:1px 0}
  details.sub summary::before{content:'▸ '}
  details.sub[open] summary::before{content:'▾ '}
  .empty{color:rgba(255,255,255,0.45);font-size:10px;font-style:italic;padding:3px 2px}
  /* Quarm-notes strip + pending sections */
  .qnote{font-size:9px;color:#fde68a;padding:1px 0 1px 12px;position:relative;line-height:1.35}
  .qnote::before{content:'⚠';position:absolute;left:0;font-size:8px}
  /* ⚑ anomaly form */
  #flagForm{display:none;background:rgb(40 24 8 / var(--bg-alpha));border-left-color:#f0883e}
  #flagForm.open{display:block}
  #flagForm textarea{width:100%;box-sizing:border-box;height:52px;background:var(--wp-bg);color:#e6edf3;
    border:1px solid var(--wp-border);border-radius:3px;font-size:10px;font-family:inherit;padding:3px 5px;resize:none}
  #flagForm textarea:focus{outline:1px solid #f0883e}
  #flagForm .fr{display:flex;gap:5px;margin-top:3px;align-items:center}
  #flagStatus{font-size:9px;color:#8b949e}
  #flagStatus.ok{color:var(--wp-green)} #flagStatus.err{color:#f87171}
  /* Quests mode (the guild lead, 2026-10-03: "the pop overlay should include the quests and a mode for
     selecting them and all of the things to say or do for any of the pop quests or flags so we can
     reference them"). Data module: pop-quests.js, generated from the website's PoP guide. */
  .title > span{white-space:nowrap}
  .navbtns{min-width:0} select.pick{min-width:0}   /* the picker gives way when the mode toggle crowds the bar */
  .seg{display:flex;flex:0 0 auto}
  .seg .nbtn{border-radius:0}
  .seg .nbtn:first-child{border-radius:3px 0 0 3px}
  .seg .nbtn:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
  body.quests #flagBtn{display:none}   /* ⚑ reports an encounter anomaly; a quest has none */
  .qtag{display:inline-block;padding:0 5px;margin-right:3px;border-radius:3px;font-size:9px;line-height:1.5;
    border:1px solid rgba(255,255,255,0.18);color:var(--wp-text)}
  .qtag.who-raid{border-color:rgba(248,113,113,0.5);color:#fca5a5}
  .qtag.who-group{border-color:rgba(240,180,41,0.5);color:#f0b429}
  .qtag.who-solo{border-color:rgba(126,231,135,0.45);color:#7ee787}
  .qtag.must{border-color:rgba(212,167,44,0.6);color:#e3b341}
  .callout b{color:#fde68a;font-weight:600}
  .qstop{padding:3px 0;border-top:1px solid rgba(255,255,255,0.06)}
  .ph + .qstop, summary + .qstop{border-top:0}
  .qrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px;font-size:10px}
  .qwho{color:#e6edf3;font-weight:600}
  .qzone{color:#79c0ff;font-size:9px}
  .qk{color:#8b949e;font-size:9px}
  .qnone{color:rgba(255,255,255,0.45);font-size:9px;font-style:italic}
  .qsit{color:#f0b429;font-size:9px}
  .qcopy{display:inline-block;max-width:100%;box-sizing:border-box;padding:1px 6px;border-radius:3px;font-size:10px;
    line-height:1.5;cursor:pointer;white-space:normal;word-break:break-word;
    border:1px solid rgba(163,113,247,0.45);background:rgba(163,113,247,0.12);color:#e9d5ff}
  .qcopy:hover{background:rgba(163,113,247,0.25)}
  .qcopy.map{border-color:rgba(88,166,255,0.4);background:rgba(88,166,255,0.10);color:#79c0ff}
  .qcopy.sit{border-color:rgba(240,180,41,0.45);background:rgba(240,180,41,0.10);color:#f0b429}
  .qcopy.ok{border-color:rgba(126,231,135,0.5);background:rgba(126,231,135,0.12);color:#7ee787}
  /* A step's seq: one numbered list (the guild lead, 2026-10-03: "the hand in items should be in order with
     the text we say to them"). The zone-in that flags you is gold; a note hangs under its row, unnumbered. */
  .qseq{list-style:none;margin:0;padding:0}
  .qs{display:flex;gap:4px;padding:3px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:10px;line-height:1.5}
  .ph + .qseq .qs:first-child{border-top:0}
  .qs.zone{border-left:2px solid rgba(240,180,41,0.7);background:rgba(240,180,41,0.06);padding-left:4px}
  .qn{flex:0 0 auto;min-width:14px;text-align:right;color:#8b949e;font-variant-numeric:tabular-nums}
  .qb{min-width:0;flex:1 1 auto;word-break:break-word}
  .qx{color:#f0b429;font-size:9px}
  .qnote{color:#8b949e;font-size:9px;margin-top:1px}
  .qnext{padding:1px 4px;font-size:10px;color:#8b949e;cursor:pointer;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
  .qnext:hover{color:#e9d5ff;background:rgba(163,113,247,0.12)}
  /* Drill-down blocks (the guild lead, 2026-10-04: "an era/continent/plane separation in an easy big block way
     up top ... drill down from top to bottom or up with the up button"; picked 2026-10-19): big tap blocks for
     era → plane → quest, ▲ to climb, ◀ ▶ to stay inside the plane. Quests mode only. */
  body:not(.quests) #upBtn{display:none}
  .nbtn:disabled{opacity:0.35;cursor:default;border-color:var(--wp-border);color:var(--wp-text)}
  .crumb{font-size:9px;color:#8b949e;letter-spacing:0.04em;margin-bottom:3px;text-shadow:0 1px 2px #000}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
  .qblock{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:46px;padding:5px 8px;
    text-align:left;font-family:inherit;color:#e6edf3;cursor:pointer;text-shadow:0 1px 2px #000;
    background:rgb(8 5 16 / var(--bg-alpha));border:1px solid rgba(163,113,247,0.30);border-left:4px solid var(--wp-purple);border-radius:5px}
  .qblock:hover{background:rgb(40 24 70 / var(--bg-alpha));border-color:var(--wp-purple)}
  .qblock.cur{outline:1px solid #f0b429;outline-offset:-1px}
  .qblock .qbt{font-size:12px;font-weight:600;line-height:1.25}
  .qblock .qbs{font-size:9px;color:#8b949e}
  .qblock.era{min-height:64px}
  .qblock.qq .qbt{font-size:11px;font-weight:500}
  /* Fixed height, the default (the guild lead, 2026-10-04: the overlay "jumps around when resizing"):
     the window keeps the height you gave it and #content scrolls, the same pattern as who.html. The
     grip at the bottom sets the height; double-click it to size to the content instead. Mini never
     takes it (its JS never sets body.fixed there). */
  body.fixed #wrap{height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
  body.fixed #content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
  #content::-webkit-scrollbar{width:6px}
  #content::-webkit-scrollbar-thumb{background:rgba(163,113,247,0.35);border-radius:3px}
  #content::-webkit-scrollbar-track{background:transparent}
  #grip{flex:0 0 auto;height:7px;margin-top:3px;border-radius:3px;cursor:ns-resize;opacity:0.3;
    background:repeating-linear-gradient(90deg,rgba(163,113,247,0.8) 0 6px,transparent 6px 10px)}
  #grip:hover,#grip.drag{opacity:1}
  body.wp-mini #grip{display:none}
  /* Text size: the Aa button opens this strip. The zoom lands on #content only, never #wrap, which
     is what the auto-fit measures. */
  #fspanel{display:none;align-items:center;gap:8px;margin:0 0 5px;padding:3px 7px;font-size:10px;color:#c4b5fd;
    background:rgb(8 5 16 / var(--bg-alpha));border-radius:5px;text-shadow:0 1px 2px #000}
  #fspanel.open{display:flex}
  #fspanel input[type=range]{flex:1;min-width:0;cursor:pointer}
  #fsVal{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
  /* Flags mode (the guild lead, 2026-10-27: "put the flags checklist per character into motion ... as a main addition
     to the pop overlay ... with deep linking to steps in the rest of that overlay"). The character you play: what to do
     next, the Seer's pending memories, every plane done / part / not started, the doors still shut. Blue → buttons jump
     into Quests; purple chips copy, as in Quests. Done is green, part is orange, not started is dim: colour only ever
     means that. No animation anywhere (the ring on a jumped-to step is a plain outline for two seconds). */
  body.flags #upBtn, body.flags #prevBtn, body.flags #nextBtn, body.flags #flagBtn{display:none}
  .fhead{display:flex;align-items:center;gap:8px;margin:0 0 5px;padding:0 24px 0 22px;text-shadow:0 1px 2px #000}
  .fname{font-size:14px;font-weight:bold;color:#e9d5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbar{flex:0 0 80px;height:5px;border-radius:3px;background:rgba(255,255,255,0.14);overflow:hidden}
  .fbar i{display:block;height:100%;background:var(--wp-green)}
  .fprog,.fage{font-size:10px;color:#8b949e;white-space:nowrap}
  .fnext{border-left-color:var(--wp-gold)}
  .fnext .ft{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;margin:1px 0 3px}
  .fpend{border-left-color:var(--wp-orange)}
  .fpend .fpi{padding:3px 0;border-top:1px solid rgba(255,255,255,0.06)}
  .fpend .ph + .fpi{border-top:0}
  .fpend .fpt{font-size:10px;color:#e6edf3;line-height:1.4}
  .fpend .fpt b{color:var(--wp-orange)}
  .ftiers{border-left-color:var(--wp-purple)}
  .fdoors{border-left-color:var(--wp-red)}
  .fdoors .fl{color:var(--wp-red);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em}
  .ftier{display:flex;gap:6px;align-items:flex-start;padding:2px 0;border-top:1px solid rgba(255,255,255,0.06)}
  .ph + .ftier{border-top:0}
  .ftn{flex:0 0 20px;font-size:9px;color:#8b949e;padding-top:4px}
  .fchips{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
  .fgo{display:inline-block;max-width:100%;box-sizing:border-box;padding:2px 6px;border-radius:3px;font:inherit;font-size:10px;line-height:1.5;
    cursor:pointer;text-align:left;border:1px solid rgba(88,166,255,0.4);background:rgba(88,166,255,0.10);color:#79c0ff}
  .fgo:hover{background:rgba(88,166,255,0.22)}
  .fgo.fchip{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.04);color:#8b949e}
  .fgo.fchip.st-done{border-color:rgba(86,211,100,0.5);background:rgba(86,211,100,0.08);color:var(--wp-green)}
  .fgo.fchip.st-part{border-color:rgba(255,166,87,0.55);background:rgba(255,166,87,0.08);color:var(--wp-orange)}
  .fgo.fchip.lock{opacity:0.7}
  .fgo.fchip:hover{background:rgba(163,113,247,0.2)}
  .fsr{font-size:9px;color:#8b949e;letter-spacing:0.04em}
  .fcap{padding:6px 10px;border-radius:4px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;line-height:1.3;
    border:1px solid rgba(86,211,100,0.6);background:rgba(86,211,100,0.18);color:#7ee787}
  .fcap:hover{background:rgba(86,211,100,0.3)}
  .fcap:disabled{opacity:0.45;cursor:default}
  .fcapr{display:flex;align-items:center;gap:8px}
  .fback{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 5px;font-size:9px;color:#8b949e}
  .fstate{font-size:11px;color:#e6edf3;line-height:1.45}
  .ringed{outline:2px solid #f0b429;outline-offset:1px;border-radius:3px}
  /* A step's parts (the six Justice trials): folds inside one panel. */
  .qparts > details.sub.panel{margin-top:3px;background:rgb(255 255 255 / 0.04)}
  /* drag/lock/setup chrome — same pattern as the other overlays. */
  #drag-controls{display:none;position:fixed;top:4px;left:4px;gap:4px;z-index:60}
  body.unlocked #drag-controls{display:flex}
  body.unlocked{outline:2px solid rgba(163,113,247,0.7);outline-offset:-2px}
  .drag-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(163,113,247,0.92);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:4px;font-size:13px;line-height:1;cursor:move;user-select:none}
  #lock-btn{cursor:pointer;font-size:11px}
  #setupbar{display:none;position:fixed;top:0;left:0;right:0;align-items:center;gap:8px;
    padding:4px 8px;background:rgba(163,113,247,0.92);color:#fff;font-size:10px;font-weight:600;z-index:50}
  body.setup #setupbar{display:flex}
  body.setup #drag-controls{top:28px}
  body.setup #wrap{margin-top:26px}
  #setupbar input[type=range]{flex:1;cursor:pointer}
  #hide-btn{position:fixed;top:6px;right:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s}
  #hide-btn:hover{opacity:1;color:#f87171;border-color:#f87171}
  body.setup #hide-btn{top:30px}
  #move-btn{position:fixed;top:6px;left:6px;z-index:65;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:rgba(14,17,22,0.6);color:#8b949e;border:1px solid rgba(110,118,129,0.3);
    font-size:11px;line-height:1;cursor:move;opacity:0.45;transition:opacity .12s}
  #move-btn:hover{opacity:1;color:var(--wp-purple);border-color:var(--wp-purple)}
  body.setup #move-btn{top:30px}
  /* On the Timers canvas (the guild lead, 2026-10-03: "the margins around the actual data is too large"): the
     panel owns ✥ and ✕ — the preload hides this page's — so the window's padding and the picker's gutter go. */
  body.wp-in-canvas #wrap{padding:2px 3px}
  body.wp-in-canvas .navbtns{margin-right:0}
</style></head>
<body>
  <button id="move-btn" title="Drag from this icon to move the overlay">✥</button>
  <button id="hide-btn" title="Hide the PoP raid overlay (turn back on from the tray → Overlays)">✕</button>
  <div id="drag-controls">
    <div id="move-handle" class="drag-btn" title="Drag to move">✥</div>
    <div id="lock-btn"   class="drag-btn" title="Lock in place">🔒</div>
  </div>
  <div id="setupbar">
    <span>🛠 PoP raids</span>
    <span>opacity</span><input id="opacitySlider" type="range" min="0.15" max="1" step="0.05" value="1" /><span id="opacityVal">100%</span>
    <button id="exitSetupBtn">Done</button>
  </div>
  <div id="wrap">
    <div class="title wp-mini-hide">
      <span id="conn" class="conn bad" title="agent connection">○</span>
      <span data-wp-name>⚔ PoP raids</span>
      <div class="navbtns">
        <span class="seg" id="modeSeg">
          <button id="modeSlides" class="nbtn on" title="Boss slideshow: one encounter at a time">Slides</button>
          <button id="modeQuests" class="nbtn" title="Quests and flags: who to talk to, what to say, where to go">Quests</button>
          <button id="modeFlags" class="nbtn" title="Your flags: what the character you play holds and what to do next">Flags</button>
        </span>
        <select id="encPick" class="pick" title="Jump to an encounter"></select>
        <button id="upBtn" class="nbtn" title="Up one level: the step's list, then the planes">▲</button>
        <button id="prevBtn" class="nbtn" title="Previous encounter">◀</button>
        <button id="nextBtn" class="nbtn" title="Next encounter">▶</button>
        <button id="frameBtn" class="nbtn" title="Framed multi-panel layout (ultrawide monitors)">🖥</button>
        <button id="fsBtn" class="nbtn" title="Text size">Aa</button>
        <button id="flagBtn" class="nbtn" title="Flag an anomaly — Quarm doesn't match the guide? Report it to the QOL thread with full encounter context.">⚑</button>
      </div>
    </div>
    <div id="fspanel" class="wp-mini-hide" data-wp-interact><span>Text size</span><input id="fsSlider" type="range" min="80" max="160" step="10" value="100" /><span id="fsVal">100%</span></div>
    <div id="content"></div>
    <div id="grip" data-wp-interact title="Drag to set the height (the card scrolls) · double-click to fit the content instead"></div>
  </div>
<script src="pop-raids.js"></script>
<script src="pop-quests.js"></script>
<script>
  let PORT = 7779;
  window.mimic && window.mimic.onAgentPort && window.mimic.onAgentPort(p => { PORT = p; });
  window.mimic && window.mimic.getAgentPort && window.mimic.getAgentPort().then(p => { if (p) PORT = p; });

  if (window.mimic && window.mimic.onOverlayLocked) {
    window.mimic.onOverlayLocked(locked => { document.body.classList.toggle('unlocked', !locked); });
  }
  var lockBtn = document.getElementById('lock-btn');
  if (lockBtn) lockBtn.addEventListener('click', function(){ try { window.mimic.setOverlaysLocked(true); } catch (e) {} });

  var hideBtn = document.getElementById('hide-btn');
  if (hideBtn) {
    // Stray-click guard (same as Buff queue): the pickers' native dropdowns
    // dismiss with a click that can land on ✕. Require 250ms of hover first.
    var _hideHoverAt = 0;
    hideBtn.addEventListener('mouseenter', function(){ _hideHoverAt = Date.now(); try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    hideBtn.addEventListener('mouseleave', function(){ _hideHoverAt = 0; try { window.mimic.overlayHoverInteractive(false); } catch (e) {} });
    hideBtn.addEventListener('click', function(){
      if (!_hideHoverAt || (Date.now() - _hideHoverAt) < 250) {
        hideBtn.style.opacity = '1'; hideBtn.style.borderColor = '#f87171'; hideBtn.style.color = '#f87171';
        setTimeout(function(){ hideBtn.style.opacity = ''; hideBtn.style.borderColor = ''; hideBtn.style.color = ''; }, 600);
        return;
      }
      try { window.mimic.hideThisOverlay(); } catch (e) {}
    });
  }

  // Manual drag — same workaround as the other overlays.
  var moveHandle = document.getElementById('move-handle');
  var moveBtn    = document.getElementById('move-btn');
  var _dragging = false;
  function _beginDrag(e){
    if (e.button !== 0) return; e.preventDefault(); _dragging = true;
    try { window.mimic.overlayDragStart(); } catch (err) {}
  }
  if (moveHandle) moveHandle.addEventListener('mousedown', _beginDrag);
  if (moveBtn) {
    moveBtn.addEventListener('mouseenter', function(){ try { window.mimic.overlayHoverInteractive(true); } catch (e) {} });
    moveBtn.addEventListener('mouseleave', function(){ if (!_dragging) { try { window.mimic.overlayHoverInteractive(false); } catch (e) {} } });
    moveBtn.addEventListener('mousedown', _beginDrag);
    try { window.mimic.attachOverlayMenu(moveBtn); } catch (e) {}
  }
  document.addEventListener('mouseup', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} try{window.mimic.overlayHoverInteractive(false);}catch(e){} } });
  window.addEventListener('blur', function(){ if (_dragging){ _dragging=false; try{window.mimic.overlayDragEnd();}catch(e){} } });

  var _overlayKey = null;
  var _setupScope = null;
  if (window.mimic && window.mimic.onSetupMode) {
    window.mimic.onSetupMode(function(p){
      _overlayKey = p && p.overlayKey;
      if (p && p.scope) _setupScope = p.scope;
      else if (p && p.active) _setupScope = 'all';
      document.body.classList.toggle('setup', !!(p && p.active));
    });
  }
  if (window.mimic && window.mimic.onBgAlpha) {
    window.mimic.onBgAlpha(function(v){
      var a = (typeof v === 'number' && v >= 0.15 && v <= 1.0) ? v : 0.62;
      try { document.documentElement.style.setProperty('--bg-alpha', String(a)); } catch (e) {}
    });
  }
  var slider = document.getElementById('opacitySlider'); var oVal = document.getElementById('opacityVal');
  if (slider) slider.addEventListener('input', function(){
    var v = parseFloat(slider.value || '1'); if (oVal) oVal.textContent = Math.round(v*100)+'%';
    if (_overlayKey && window.mimic && window.mimic.setOverlayOpacity) { try { window.mimic.setOverlayOpacity(_overlayKey, v); } catch (e) {} }
  });
  var doneBtn = document.getElementById('exitSetupBtn');
  if (doneBtn) doneBtn.addEventListener('click', function(){ try { document.body.classList.remove('setup'); } catch (e) {} try { if (_setupScope === 'this') window.mimic.setSetupModeThis(false); else window.mimic.setSetupMode(false); } catch (e) {} _setupScope = null; });

  // ── Hover-interact handshake, delegated ────────────────────────────────────
  // Locked overlays are click-through; every interactive control needs the
  // handshake or "the button does nothing". Content rerenders on slide change,
  // so delegate ONCE at document level for anything interactive.
  // Every clickable <div>/<span>/<summary> also carries data-wp-interact: the preload arms the window for
  // `button, a, input, select, textarea, [role=button], [data-wp-interact]` on its own, and a control that
  // only this list knew about lost the window to the preload's next mousemove after a hop from a button
  // (the guild lead, 2026-10-04: the overlay "doesn't like to always show the mouse over it").
  var _IA_SEL = 'button, select, input, textarea, a, .obj, .lnk, .dg, summary, .qcopy, .qnext';
  // The zone where the window takes the mouse: any control, the Aa strip, the height grip and, in fixed
  // height, the whole scrolling card, so the pointer shows over the text and the wheel scrolls it. One
  // owner for enter and leave: a leave that fired when the pointer moved from a control onto the card
  // switched the wheel off under it (who.html learned the same).
  function _zoneOf(el){
    if (!el || !el.closest) return null;
    return el.closest(_IA_SEL) || el.closest('#fspanel, #grip') || (_isFixed() ? el.closest('#content') : null);
  }
  var _gripDrag = null;
  document.addEventListener('mouseover', function(e){
    if (_zoneOf(e.target)) {
      try { window.mimic.overlayHoverInteractive(true); } catch (er) {}
    }
  });
  document.addEventListener('mouseout', function(e){
    if (_gripDrag) return;
    if (!_zoneOf(e.target) || _zoneOf(e.relatedTarget)) return;   // not on one, or still on one
    try { window.mimic.overlayHoverInteractive(false); } catch (er) {}
  });

  // ── Slideshow state ─────────────────────────────────────────────────────────
  var DB = window.POP_RAIDS || { sections: [], quarmGlobalNotes: [], imageBase: '' };
  // Flattened slide list: every encounter, plus one "section card" slide for
  // pending sections (P2/P3) so they're visible and explain themselves.
  var SLIDES = [];
  (DB.sections || []).forEach(function(sec){
    if (sec.pending) { SLIDES.push({ sec: sec, enc: null }); return; }
    (sec.encounters || []).forEach(function(enc){ SLIDES.push({ sec: sec, enc: enc }); });
  });
  var idx = 0;
  try {
    var savedId = localStorage.getItem('wp:pop:enc');
    if (savedId) { var f = SLIDES.findIndex(function(s){ return s.enc && s.enc.id === savedId; }); if (f >= 0) idx = f; }
  } catch (e) {}
  var framed = false;
  try { framed = localStorage.getItem('wp:pop:framed') === '1'; } catch (e) {}

  // Quests mode state: every quest the web guide has, flattened in guide order. The mode and the
  // selected quest persist like the slide does (wp:pop:enc). No quest data (a build without
  // pop-quests.js) leaves the overlay in Slides, with the toggle hidden.
  var QDB = window.POP_QUESTS || { levels: [] };
  var QUESTS = [];
  (QDB.levels || []).forEach(function(lv){
    (lv.sections || []).forEach(function(sec){
      (sec.quests || []).forEach(function(q){ QUESTS.push({ q: q, level: lv, sec: sec }); });
    });
  });
  // Quest by key: what a Flags link lands on. The Flags mode needs the quests (its links jump into them), so with no
  // quest data it is hidden like Quests is.
  var QBY = {};
  QUESTS.forEach(function(e){ QBY[e.q.key] = e.q; });
  // Slides, Quests, or Flags (the character you play: what it holds, what to do next; links jump into Quests).
  var popMode = 'slides';
  try {
    var _savedMode = localStorage.getItem('wp:pop:mode');
    if ((_savedMode === 'quests' || _savedMode === 'flags') && QUESTS.length) popMode = _savedMode;
  } catch (e) {}
  var qIdx = 0;
  try {
    var savedQ = localStorage.getItem('wp:pop:quest');
    if (savedQ) { var fq = QUESTS.findIndex(function(e){ return e.q.key === savedQ; }); if (fq >= 0) qIdx = fq; }
  } catch (e) {}
  // Drill-down: which screen Quests mode shows. 'card' is the selected step (where it opens, as ever); ▲ climbs
  // to 'list' (the steps of its plane), then 'planes' (the era's planes), then 'eras' (only if there are several).
  // qEra / qPlane are the era and plane the block screens are showing.
  var QIDX = null;      // built after qBuildIndex is defined, below
  var qScreen = 'card', qEra = '', qPlane = '';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
  function imgUrl(f){ return /^https?:/i.test(f) ? f : (DB.imageBase + f); }
  function openExt(url){
    try { if (window.mimic && window.mimic.openExternal) { window.mimic.openExternal(url); return; } } catch (e) {}
    try { window.open(url); } catch (e) {}
  }

  // Encounter picker — grouped by section.
  var encPick = document.getElementById('encPick');
  var _slidePickHtml = '';
  (function buildPicker(){
    var html = '';
    (DB.sections || []).forEach(function(sec){
      html += '<optgroup label="' + esc(sec.title) + '">';
      if (sec.pending) {
        html += '<option value="sec:' + esc(sec.id) + '">' + esc(sec.title) + ' (pending)</option>';
      } else {
        (sec.encounters || []).forEach(function(enc){
          html += '<option value="' + esc(enc.id) + '">' + esc(enc.name) + '</option>';
        });
      }
      html += '</optgroup>';
    });
    encPick.innerHTML = html;
    _slidePickHtml = html;
  })();
  encPick.addEventListener('change', function(){
    var v = encPick.value;
    if (popMode === 'flags') {   // the picker is the character here: '' follows the one being played
      _flagsPick = v;
      try { localStorage.setItem('wp:pop:flagchar', v); } catch (e) {}
      _flags = null; _flagsKey = '';
      renderFlags(); pollFlags();
      return;
    }
    if (popMode === 'quests') {
      var qi = QUESTS.findIndex(function(e){ return e.q.key === v; });
      if (qi >= 0) { qIdx = qi; qScreen = 'card'; renderSlide(); }
      return;
    }
    var f = SLIDES.findIndex(function(s){
      return v.indexOf('sec:') === 0 ? (!s.enc && s.sec.id === v.slice(4)) : (s.enc && s.enc.id === v);
    });
    if (f >= 0) { idx = f; renderSlide(); }
  });
  document.getElementById('prevBtn').addEventListener('click', function(){
    if (popMode === 'quests') { qStep(-1); return; }
    idx = (idx - 1 + SLIDES.length) % SLIDES.length; renderSlide();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if (popMode === 'quests') { qStep(1); return; }
    idx = (idx + 1) % SLIDES.length; renderSlide();
  });
  // ◀ ▶ in Quests mode: the step before or after, inside the plane (QUEST_PLANE_END says what the ends do).
  // They only work on a step's card; on a block screen they are greyed and the blocks are the way on.
  function qStep(dir){
    if (qScreen !== 'card') return;
    var to = qStepIdx(QUESTS, QIDX, qIdx, dir, QUEST_PLANE_END);
    if (to >= 0) { qIdx = to; renderSlide(); }
  }
  // ▲ climbs one level: the card → its plane's steps → the planes → the eras (skipped while there is only one).
  function qUpOk(){ return qScreen === 'card' || qScreen === 'list' || (qScreen === 'planes' && QIDX.eras.length > 1); }
  document.getElementById('upBtn').addEventListener('click', function(){
    if (popMode !== 'quests' || !qUpOk()) return;
    var pl = qPlaneOf(QUESTS, QIDX, qIdx);
    if (qScreen === 'card') { qScreen = 'list'; qPlane = pl ? pl.key : ''; qEra = pl ? pl.era : ''; }
    else if (qScreen === 'list') { qScreen = 'planes'; var lp = QIDX.planes[qPlane]; qEra = lp ? lp.era : qEra; }
    else qScreen = 'eras';
    renderSlide();
  });
  // Greys ◀ ▶ ▲ for where Quests mode is, and says why in the tooltip. Slides mode gets its plain buttons back.
  function paintNav(){
    var prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn'), up = document.getElementById('upBtn');
    if (popMode !== 'quests') {
      prev.disabled = false; next.disabled = false;
      prev.title = 'Previous encounter'; next.title = 'Next encounter';
      return;
    }
    var onCard = qScreen === 'card';
    var pl = qPlaneOf(QUESTS, QIDX, qIdx), name = pl ? pl.title : 'this plane';
    var pi = onCard ? qStepIdx(QUESTS, QIDX, qIdx, -1, QUEST_PLANE_END) : -1;
    var ni = onCard ? qStepIdx(QUESTS, QIDX, qIdx, 1, QUEST_PLANE_END) : -1;
    prev.disabled = pi < 0; next.disabled = ni < 0;
    prev.title = !onCard ? 'Open a step to use ◀ ▶' : pi < 0 ? 'This is the first step in ' + name + ' (▲ for the planes)' : 'Previous step in ' + name;
    next.title = !onCard ? 'Open a step to use ◀ ▶' : ni < 0 ? 'That was the last step in ' + name + ' (▲ for the planes)' : 'Next step in ' + name;
    up.disabled = !qUpOk();
    up.title = qScreen === 'card' ? 'Up: the steps of ' + name : qScreen === 'list' ? 'Up: the planes' : qUpOk() ? 'Up: the eras' : 'Already at the top';
  }

  var frameBtn = document.getElementById('frameBtn');
  function applyFramed(){
    document.body.classList.toggle('framed', framed);
    frameBtn.classList.toggle('on', framed);
    try { localStorage.setItem('wp:pop:framed', framed ? '1' : '0'); } catch (e) {}
    _fit();
  }
  frameBtn.addEventListener('click', function(){ framed = !framed; applyFramed(); });

  // ── Fixed height (the default) or fit-to-content, remembered in wp:pop:height ──────────────────────
  // The guild lead, 2026-10-04: the overlay "jumps around when resizing". Fit mode sized the window to
  // each step, so ◀ ▶ moved its bottom edge every time. Fixed mode keeps the height you gave it and the
  // card (#content) scrolls, as who.html does (the grip at the bottom sets it; double-click = fit).
  // 'fit' is the old behaviour. Mini is always fit: it is a two-line strip.
  var POP_DEFAULT_H = 480, POP_MIN_H = 140, POP_MAX_H = 2000;
  var _fixedH = POP_DEFAULT_H;
  try {
    var _savedH = localStorage.getItem('wp:pop:height');
    if (_savedH === 'fit') _fixedH = null;
    else if (_savedH && +_savedH >= POP_MIN_H) _fixedH = Math.min(POP_MAX_H, +_savedH);
  } catch (e) {}
  function _isFixed(){ return _fixedH != null && !document.body.classList.contains('wp-mini'); }
  // Fixed height puts body.fixed on (the scrolling layout) and data-wp-interact on the card: the preload
  // arms the window while the pointer is anywhere over it, so the pointer shows and the wheel scrolls.
  function applyFixed(){
    var f = _isFixed();
    var c = document.getElementById('content');
    document.body.classList.toggle('fixed', f);
    if (f) c.setAttribute('data-wp-interact', ''); else c.removeAttribute('data-wp-interact');
  }
  // Fixed sends its own height, so nothing about the step changes the window; fit measures #wrap. It goes
  // through overlayAutoHeight (the raw height, as who.html does), not autoFitOverlay, in fixed mode only.
  function _fit(){
    try {
      if (_isFixed()) { window.mimic && window.mimic.overlayAutoHeight && window.mimic.overlayAutoHeight(_fixedH); return; }
      window.mimic && window.mimic.autoFitOverlay && window.mimic.autoFitOverlay(document.getElementById('wrap'));
    } catch (e) {}
  }
  // The grip: drag to set the height (it stays and the card scrolls), double-click to fit the content
  // instead. Measured in screen px and converted by the window's own scale (who.html's maths).
  var gripEl = document.getElementById('grip');
  function _hoverNow(on){ try { window.mimic.overlayHoverInteractive(on); } catch (e) {} }
  gripEl.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    if (e.preventDefault) e.preventDefault();
    var z = (window.outerHeight && window.innerHeight) ? (window.outerHeight / window.innerHeight) : 1;
    _gripDrag = { y0: e.screenY, h0: _fixedH != null ? _fixedH : document.getElementById('wrap').scrollHeight + 8, z: z > 0 ? z : 1 };
    gripEl.classList.add('drag');
    try { gripEl.setPointerCapture(e.pointerId); } catch (err) {}
    _hoverNow(true);
  });
  gripEl.addEventListener('pointermove', function(e){
    if (!_gripDrag) return;
    var h = Math.round(_gripDrag.h0 + (e.screenY - _gripDrag.y0) / _gripDrag.z);
    _fixedH = Math.max(POP_MIN_H, Math.min(POP_MAX_H, h));
    applyFixed();
    _fit();
  });
  function _endGrip(e){
    if (!_gripDrag) return;
    _gripDrag = null;
    gripEl.classList.remove('drag');
    try { gripEl.releasePointerCapture(e.pointerId); } catch (err) {}
    try { localStorage.setItem('wp:pop:height', String(_fixedH)); } catch (err) {}
    var under = null;
    try { under = document.elementFromPoint(e.clientX, e.clientY); } catch (err) {}
    if (!_zoneOf(under)) _hoverNow(false);
  }
  gripEl.addEventListener('pointerup', _endGrip);
  gripEl.addEventListener('pointercancel', _endGrip);
  gripEl.addEventListener('dblclick', function(){
    _fixedH = null;
    applyFixed();
    try { localStorage.setItem('wp:pop:height', 'fit'); } catch (err) {}
    _fit();
  });

  // ── Text size: the Aa button opens a slider, 80–160% in steps of 10, remembered in wp:pop:fs ───────
  // The zoom goes on #content, never on #wrap: _fit() measures #wrap's scrollHeight, so the zoomed card
  // makes the window the right size by itself, and the title row and the grip stay one size. Mini keeps
  // its own density and ignores it.
  var FS_MIN = 80, FS_MAX = 160, FS_STEP = 10;
  var _fs = 100;
  try {
    var _savedFs = parseInt(localStorage.getItem('wp:pop:fs'), 10);
    if (_savedFs >= FS_MIN && _savedFs <= FS_MAX) _fs = Math.round(_savedFs / FS_STEP) * FS_STEP;
  } catch (e) {}
  var fsBtn = document.getElementById('fsBtn');
  var fsPanel = document.getElementById('fspanel');
  var fsSlider = document.getElementById('fsSlider');
  var fsVal = document.getElementById('fsVal');
  function applyFs(){
    var zoomed = _fs !== 100 && !document.body.classList.contains('wp-mini');
    document.getElementById('content').style.zoom = zoomed ? String(_fs / 100) : '';
    fsSlider.value = String(_fs);
    fsVal.textContent = _fs + '%';
  }
  fsBtn.addEventListener('click', function(){
    var open = !fsPanel.classList.contains('open');
    fsPanel.classList.toggle('open', open);
    fsBtn.classList.toggle('on', open);
    _fit();
  });
  fsSlider.addEventListener('input', function(){
    var v = Math.round((parseFloat(fsSlider.value) || 100) / FS_STEP) * FS_STEP;
    _fs = Math.max(FS_MIN, Math.min(FS_MAX, v));
    try { localStorage.setItem('wp:pop:fs', String(_fs)); } catch (e) {}
    applyFs();
    _fit();
  });

  // ── Shared objectives (raid-wide, via agent proxy of the bot board) ────────
  var _objRev = -1;
  var _objByEnc = {};       // encId → { objId: {c, by, at} }
  var _objSynced = false;
  function currentEnc(){ var s = SLIDES[idx]; return s && s.enc; }

  async function pollObjectives(){
    if (popMode !== 'slides') return;   // Quests and Flags have no shared checklist to poll
    var enc = currentEnc();
    if (!enc || !enc.tracker || !enc.tracker.length) return;
    try {
      var r = await fetch('http://127.0.0.1:'+PORT+'/api/pop-objectives?encounter_id='+encodeURIComponent(enc.id), { cache: 'no-store' });
      var s = await r.json();
      document.getElementById('conn').className = 'conn ok';
      document.getElementById('conn').textContent = '●';
      _objSynced = !(s && s.local_only);
      var note = document.getElementById('syncNote');
      if (note) note.textContent = _objSynced ? '' : 'not linked — checks stay local';
      // `loading` = the agent had no cache yet (first poll, or a toggle just
      // cleared it) — skip so we never wipe optimistic state with a stub.
      if (s && s.encounters && !s.loading) {
        var changed = (s.rev !== _objRev);
        _objRev = s.rev;
        Object.keys(s.encounters).forEach(function(k){ _objByEnc[k] = s.encounters[k] || {}; });
        if (changed) renderTracker();
      }
    } catch (e) {
      var c = document.getElementById('conn'); c.className = 'conn bad'; c.textContent = '○';
    }
  }
  function postObjective(body){
    return fetch('http://127.0.0.1:'+PORT+'/api/pop-objectives', {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  function renderTracker(){
    var enc = currentEnc();
    var box = document.getElementById('trackerBody');
    if (!enc || !box) return;
    var st = _objByEnc[enc.id] || {};
    var html = '';
    (enc.tracker || []).forEach(function(t){
      var o = st[t.id];
      var done = !!(o && o.c);
      html += '<div class="obj' + (done ? ' done' : '') + '" data-obj="' + esc(t.id) + '" data-wp-interact title="' + (done ? 'Un-check (raid-wide)' : 'Check off — the whole raid sees it') + '">'
            +   '<span class="bx">' + (done ? '☑' : '☐') + '</span>'
            +   '<span class="lb">' + esc(t.label) + '</span>'
            +   (done && o.by ? '<span class="by">✓ ' + esc(o.by) + '</span>' : '')
            + '</div>';
    });
    if (box.__wpHtml !== html) { box.innerHTML = html; box.__wpHtml = html; _fit(); }
  }

  // ── Loot (live drop table through the agent's mob-info cache) ──────────────
  var _lootLoadedFor = null;
  async function loadLoot(){
    var enc = currentEnc();
    var box = document.getElementById('lootBody');
    if (!enc || !enc.npcName || !box) return;
    if (_lootLoadedFor === enc.id) return;
    _lootLoadedFor = enc.id;
    box.innerHTML = '<div class="empty">loading drop table…</div>';
    try {
      var r = await fetch('http://127.0.0.1:'+PORT+'/api/pop-mob-info?name='+encodeURIComponent(enc.npcName), { cache: 'no-store' });
      var s = await r.json();
      var mob = s && s.mob;
      if (s && s.loading) {
        // fetch in flight on the agent — try again shortly
        _lootLoadedFor = null;
        setTimeout(function(){ var e2 = currentEnc(); if (e2 && e2.id === enc.id) loadLoot(); }, 2500);
        return;
      }
      if (!mob || !Array.isArray(mob.loot) || !mob.loot.length) {
        box.innerHTML = '<div class="empty">no published drop table for this NPC</div>'; _fit(); return;
      }
      var html = '';
      mob.loot.forEach(function(it){
        if (!it || !it.name) return;
        var pct = (it.pct != null) ? Number(it.pct) : null;
        var tier = pct == null ? '' : pct >= 99 ? 't100' : pct >= 50 ? 't50' : pct >= 20 ? 't20' : pct >= 5 ? 't5' : 't1';
        html += '<div class="loot-row ' + tier + '">'
              +   '<span class="nm">' + (it.unique_to_mob ? '⭐ ' : '') + esc(it.name) + (it.lore ? ' <span style="color:#d2a8ff;font-size:8px">LORE</span>' : '') + '</span>'
              +   (it.seen > 0 ? '<span style="color:var(--wp-purple);font-size:8px">' + it.seen + '× won</span>' : '')
              +   '<span class="pct">' + (pct != null ? (pct >= 1 ? Math.round(pct) + '%' : pct.toFixed(1) + '%') : '?') + '</span>'
              + '</div>';
      });
      box.innerHTML = html; _fit();
    } catch (e) {
      box.innerHTML = '<div class="empty">agent offline — loot lookup needs Mimic\'s agent running</div>'; _fit();
    }
  }

  // ── ⚑ anomaly flag ──────────────────────────────────────────────────────────
  var flagBtn = document.getElementById('flagBtn');
  flagBtn.addEventListener('click', function(){
    var f = document.getElementById('flagForm');
    if (f) { f.classList.toggle('open'); _fit(); var ta = document.getElementById('flagText'); if (f.classList.contains('open') && ta) ta.focus(); }
  });
  function guideBaseline(enc){
    if (!enc) return '';
    var bits = [];
    var st = enc.stats || {};
    if (st.hp)   bits.push('HP ' + st.hp);
    if (st.hits) bits.push('hits ' + st.hits);
    if (st.slow) bits.push(st.slow);
    if (st.ramp) bits.push(st.ramp);
    if (st.immune) bits.push('immune: ' + st.immune);
    (enc.abilities || []).forEach(function(a){ bits.push(a.name + (a.note ? ' (' + a.note + ')' : '')); });
    return bits.join(' · ');
  }
  async function sendFlag(){
    var enc = currentEnc(); var s = SLIDES[idx];
    var ta = document.getElementById('flagText');
    var stat = document.getElementById('flagStatus');
    var note = ta ? ta.value.trim() : '';
    if (!note) { if (stat) { stat.textContent = 'describe what you saw first'; stat.className = 'err'; } return; }
    if (stat) { stat.textContent = 'sending…'; stat.className = ''; }
    try {
      var r = await fetch('http://127.0.0.1:'+PORT+'/api/pop-anomaly', {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          encounter_id:   enc ? enc.id : (s && s.sec && s.sec.id),
          encounter_name: enc ? enc.name : (s && s.sec && s.sec.title),
          zone:           enc ? enc.zone : null,
          section:        s && s.sec ? s.sec.title : null,
          expected:       guideBaseline(enc),
          note:           note,
          quarm_notes:    DB.quarmGlobalNotes || [],
        }),
      });
      var j = await r.json().catch(function(){ return {}; });
      if (r.ok && j && j.ok !== false) {
        if (stat) { stat.textContent = '✓ flagged — lands in the QOL thread'; stat.className = 'ok'; }
        if (ta) ta.value = '';
        setTimeout(function(){ var f = document.getElementById('flagForm'); if (f) f.classList.remove('open'); if (stat) { stat.textContent = ''; } _fit(); }, 2500);
      } else {
        if (stat) { stat.textContent = (j && j.error) ? j.error : 'failed — is the agent linked?'; stat.className = 'err'; }
      }
    } catch (e) {
      if (stat) { stat.textContent = 'agent offline'; stat.className = 'err'; }
    }
  }

  // ── ▭ Mini — "Checklist rows" (the guild vote, closed 2026-09-17) ─────────
  // The raid-wide checkboxes and nothing else: no slide, notes, loot or picker.
  // It draws the slide the full overlay is on (idx), so the encounter follows
  // full mode both ways. The rows are renderTracker's own, inside the same
  // #content, so a click takes the same delegated path that checks it for the
  // whole raid; ↗ is a .lnk carrying the same URL the full slide's guide link
  // does, so it opens through the same handler. Both classes are already in
  // _IA_SEL, which gives them the hover-interact handshake.
  function popMiniHtml(slide){
    var sec = slide.sec, enc = slide.enc;
    // "Rallos Zek the Warlord (event, 4 phases)" → "Rallos Zek the Warlord":
    // the parenthetical is slide detail, and the line ellipsizes past that.
    var short = String(enc ? enc.name : sec.title).replace(/\s*\([^)]*\)\s*$/, '');
    var url = (enc && enc.guide) || sec.guide || '';
    return '<div class="mini-ttl"><span class="wp-mini-name">PoP · ' + esc(short) + '</span>'
      +   (url ? '<span class="lnk mini-go" data-url="' + esc(url) + '" data-wp-interact title="Open the guide page">↗</span>' : '')
      + '</div>'
      + ((enc && enc.tracker && enc.tracker.length)
          ? '<div id="trackerBody"></div>'
          : '<div class="empty">no shared checklist on this slide</div>');
  }

  // ── PoP quests — renderers ─────────────────────────────────────────────────
  // Pure string builders over one quest from pop-quests.js (test/pop-overlay-quests.test.js runs this
  // block as it stands). Three rules, all load-bearing:
  //  · The words are the guide's and nobody else's. A place with no recorded words says so (qNone);
  //    a phrase is never filled in.
  //  · Every chip is a clickable <span>: it carries data-wp-interact (a locked overlay is click-through
  //    and a span is not on the preload's own list) and its class is in _IA_SEL. So does every <summary>.
  //  · <details> open state lives in _qOpen, keyed per quest, never in the DOM: the panel is rewritten
  //    on every quest change and a bare <details> would snap shut (mobinfo.html's _qOpen, same reason).
  var _qOpen = {};
  var Q_WHO = { solo: 'Solo', group: 'Group', raid: 'Raid' };
  var Q_NONE = 'hail them — no words recorded';
  // "Aid Eino (PoK, optional)" and "Aid Eino" are one person: compare without a trailing parenthetical.
  function qNorm(s){ return String(s || '').replace(/\s*\([^)]*\)\s*$/, '').toLowerCase(); }
  function qChip(kind, text){
    return '<span class="qcopy ' + kind + '" data-wp-interact data-copy="' + esc(text) + '" title="Click to copy">' + esc(text) + '</span>';
  }
  function qMap(l){ return qChip('map', '/map ' + l.y + ' ' + l.x); }
  // One thing to say; "sit first" + a /sit chip ahead of it when the NPC only answers while you sit.
  function qSay(s){
    return (s.sit ? '<span class="qsit">sit first</span> ' + qChip('sit', '/sit') + ' ' : '') + qChip('say', '/say ' + s.text);
  }
  function qNone(){ return '<span class="qnone">' + Q_NONE + '</span>'; }
  function qWhere(l){
    return '<span class="qwho">' + esc(l.npc) + '</span> <span class="qzone">' + esc(l.zone) + (l.note ? ' · ' + esc(l.note) : '') + '</span> ' + qMap(l);
  }
  function qDetails(key, label, body){
    return '<details class="sub panel" data-dk="' + esc(key) + '"' + (_qOpen[key] ? ' open' : '') + '>'
      + '<summary data-wp-interact>' + esc(label) + '</summary>' + body + '</details>';
  }
  // "Before the planes — Start here" where a level holds several sections; the section's own title where
  // it is the level's only one (the tiers), as the web guide's sidebar groups them.
  function qGroupLabel(lv, sec){
    return (lv.sections && lv.sections.length > 1) ? lv.title + ' — ' + sec.title : sec.title;
  }
  function questTags(q){
    return '<span class="qtag who-' + esc(q.who) + '">' + esc(Q_WHO[q.who] || q.who) + '</span>'
      + (q.must ? '<span class="qtag must" title="Needed for the flags that follow">★ must</span>' : '')
      + (q.check ? '<span class="qtag" title="Classic detail, not yet confirmed on Quarm">verify at launch</span>' : '');
  }
  // Who to talk to, in the guide's order: each place with the words addressed to it, then words addressed
  // to someone the guide gives no place for (kept under their own name, no /map). A place with no words
  // is `quiet` only when every set of words found its place, so a name the guide spells two ways never
  // turns a real phrase into a false "no words recorded".
  function questStops(q){
    var says = q.says || [], where = q.where || [];
    var placed = {};
    where.forEach(function(w){ placed[qNorm(w.npc)] = true; });
    var stops = where.map(function(w){
      return { at: w, label: w.npc, says: says.filter(function(s){ return qNorm(s.to) === qNorm(w.npc); }), quiet: false };
    });
    var seen = {}, orphan = false;
    says.forEach(function(s){
      var k = qNorm(s.to);
      if (placed[k] || seen[k]) return;
      seen[k] = true; orphan = true;
      stops.push({ at: null, label: s.to, says: says.filter(function(t){ return qNorm(t.to) === k; }), quiet: false });
    });
    stops.forEach(function(s){ s.quiet = !!s.at && !s.says.length && !orphan; });
    return stops;
  }
  function qSayRow(says, quiet){
    if (says.length) return '<div class="qrow">' + says.map(qSay).join(' ') + '</div>';
    return quiet ? '<div class="qrow">' + qNone() + '</div>' : '';
  }
  function qStop(s){
    return '<div class="qstop"><div class="qrow">' + (s.at ? qWhere(s.at) : '<span class="qwho">' + esc(s.label) + '</span>') + '</div>'
      + qSayRow(s.says, s.quiet) + '</div>';
  }
  function qGiveGet(give, get){
    return '<div class="qrow">'
      + (give ? '<span class="qk">give</span> <span>' + esc(give) + '</span>' : '')
      + (get ? ' <span class="qk">→ get</span> <span>' + esc(get) + '</span>' : '')
      + '</div>';
  }
  // A step's seq (pop-quests.js): the whole step as ONE ordered list (the guild lead, 2026-10-03: "some of
  // the steps require you to hail after something else or say a line multiple times. the hand in items
  // should be in order with the text we say to them"). The same rows the website draws (web/lib/popGuide.ts
  // seqRows is the rule, this is its copy): every act is a numbered row except a `get`, which rides on the
  // row before it ("→ get …"), and a `note`, which hangs under its row (before any row it leads the list).
  // The words are the guide's: a hail is "/say Hail", a say is its text, nothing is filled in.
  function seqRows(seq){
    var lead = [], rows = [];
    (seq || []).forEach(function(a){
      var last = rows[rows.length - 1];
      if (a.kind === 'note') (last ? last.notes : lead).push(a);
      else if (a.kind === 'get' && last) last.gets.push(a);
      else rows.push({ n: rows.length + 1, act: a, gets: [], notes: [] });
    });
    return { lead: lead, rows: rows };
  }
  // Item names (the generator turned [[Name#id]] into Name). The same item twice reads "Name ×2".
  function qItems(items){
    var order = [], count = {};
    (items || []).forEach(function(t){ if (!count[t]) { count[t] = 0; order.push(t); } count[t]++; });
    return order.map(function(t){ return esc(t) + (count[t] > 1 ? ' ×' + count[t] : ''); }).join(', ');
  }
  function qGetBits(a){
    var has = a.items && a.items.length;
    return (has ? qItems(a.items) : '') + (a.text ? (has ? ' <span class="qk">(' + esc(a.text) + ')</span>' : esc(a.text)) : '');
  }
  function qActLine(a){
    var who = a.to ? '<span class="qwho">' + esc(a.to) + '</span>' : '';
    var aside = (a.text && a.kind !== 'say' && a.kind !== 'get') ? ' <span class="qk">(' + esc(a.text) + ')</span>' : '';
    switch (a.kind) {
      case 'hail': return '<span class="qk">Hail</span> ' + who + aside + ' ' + qChip('say', '/say Hail');
      case 'say': return '<span class="qk">Say to</span> ' + who + '<span class="qk">:</span> ' + qSay(a)
        + (a.times > 1 ? ' <span class="qx" title="Say it this many times in a row">×' + a.times + '</span>' : '')
        + (a.until ? ' <span class="qx">repeat until ' + esc(a.until) + '</span>' : '');
      case 'give': return '<span class="qk">Give</span> ' + who + '<span class="qk">:</span> ' + qItems(a.items) + aside;
      case 'get': return '<span class="qk">Get</span> ' + qGetBits(a);
      case 'kill': return '<span class="qk">Kill</span> ' + who + aside;
      case 'click': return '<span class="qk">Click</span> ' + who + (a.items && a.items.length ? '<span class="qk">:</span> ' + qItems(a.items) : '') + aside;
      case 'zone': return '<span class="qx">Zone in:</span> ' + who + '<div class="qnote">' + esc(a.text) + '</div>';
      case 'wait': return '<span class="qk">Wait for</span> ' + esc(a.text);
      default: return esc(a.text);
    }
  }
  function qSeqRow(r){
    var h = '<li class="qs' + (r.act.kind === 'zone' ? ' zone' : '') + '"><span class="qn">' + r.n + '.</span><div class="qb">' + qActLine(r.act);
    r.gets.forEach(function(g){ h += ' <span class="qx">→</span> <span class="qk">get</span> ' + qGetBits(g); });
    r.notes.forEach(function(n){ h += '<div class="qnote">' + esc(n.text) + (n.items && n.items.length ? ' ' + qItems(n.items) : '') + '</div>'; });
    return h + '</div></li>';
  }
  // `bare` is the list alone, with no panel and no "In order" header: a part draws it inside its own fold.
  function qSeqHtml(seq, bare){
    var s = seqRows(seq);
    var list = s.lead.map(function(n){ return '<div class="qnote">' + esc(n.text) + (n.items && n.items.length ? ' ' + qItems(n.items) : '') + '</div>'; }).join('')
      + '<ol class="qseq">' + s.rows.map(qSeqRow).join('') + '</ol>';
    return bare ? list : '<div class="panel"><div class="ph">🧭 In order <span class="ct">' + s.rows.length + '</span></div>' + list + '</div>';
  }
  // A step's parts (the six Justice trials, web/lib/popGuide.ts GuidePart): one fold each under the step's
  // "In order", folded until asked for, open state in _qOpen like every other fold. A part is where to go
  // (its /map chip) and then its own numbered list, drawn by the same row renderers the step uses.
  function qParts(q){
    return '<div class="panel qparts"><div class="ph">📑 Parts <span class="ct">' + q.parts.length + '</span></div>'
      + q.parts.map(function(p){
          return qDetails(q.key + '|part|' + p.key, p.title,
            (p.where || []).map(function(l){ return '<div class="qstop"><div class="qrow">' + qWhere(l) + '</div></div>'; }).join('')
            + qSeqHtml(p.seq, true));
        }).join('')
      + '</div>';
  }
  // A chain quest (Willamina's Needles): where to start and what to say, then the hand-ins in the order
  // you walk them and the optional story each NPC tells, both folded away until asked for. With a seq the
  // hand-ins are already in it, in order (skipHandins), so the folded copy is left out.
  function qChain(q, c, skipHandins){
    var h = '<div class="panel"><div class="ph">🔗 Start here</div>'
      + '<div class="callout">' + esc(c.first.text) + '</div>'
      + '<div class="qstop"><div class="qrow">' + qWhere(c.first.at) + '</div>'
      + qSayRow((c.first.say || []).map(function(t){ return { text: t }; }), true) + '</div>'
      + (c.first.fetch ? '<div class="qstop"><div class="qrow"><span class="qk">fetch from</span> ' + qWhere(c.first.fetch) + '</div></div>' : '')
      + '</div>';
    var hand = skipHandins ? '' : (c.handins || []).map(function(s, n){
      return '<div class="qstop"><div class="qrow"><span class="qk">' + (n + 1) + '.</span> ' + qWhere(s.at) + '</div>' + qGiveGet(s.give, s.get) + '</div>';
    }).join('');
    if (hand) h += qDetails(q.key + '|handins', 'Hand-ins, in order · ' + c.handins.length, hand);
    var talk = (c.talk || []).map(function(s, n){
      return '<div class="qstop"><div class="qrow"><span class="qk">' + (n + 1) + '.</span> ' + qWhere(s.at) + '</div>'
        + qSayRow((s.say || []).map(function(t){ return { text: t }; }), true)
        + (s.note ? '<div class="qrow"><span class="qk">' + esc(s.note) + '</span></div>' : '') + '</div>';
    }).join('');
    if (talk) h += qDetails(q.key + '|story', 'Optional: the story, from ' + c.talk[0].at.npc + ' · ' + c.talk.length, talk);
    return h;
  }
  function questHtml(q){
    var h = '';
    var what = (q.detail ? '<div class="callout">' + esc(q.detail) + '</div>' : '')
      + (q.expect ? '<div class="callout"><b>Expect</b> ' + esc(q.expect) + '</div>' : '');
    // A step with a brief (the guild lead, 2026-10-04: "The What to do is wordy") shows that first; the full
    // detail and Expect are folded under "More", never dropped. A step without one is drawn as before.
    if (q.brief) {
      h += '<div class="panel"><div class="ph">📝 What to do</div><div class="callout">' + esc(q.brief) + '</div></div>';
      if (what) h += qDetails(q.key + '|more', 'More', what);
    } else if (what) h += '<div class="panel"><div class="ph">📝 What to do</div>' + what + '</div>';
    var hasSeq = !!(q.seq && q.seq.length);
    var parts = (q.parts && q.parts.length) ? qParts(q) : '';
    if (q.chain) h += qChain(q, q.chain, hasSeq);
    if (hasSeq) {
      // The order is the seq's, so "Talk to" and "Turn in" (each half of it) give way to it; the places
      // stay, with their /map chips, since the seq says who and not where. Parts sit under the order.
      h += qSeqHtml(q.seq) + parts;
      if (q.where && q.where.length) {
        h += '<div class="panel"><div class="ph">📍 Where <span class="ct">' + q.where.length + '</span></div>'
          + q.where.map(function(l){ return '<div class="qstop"><div class="qrow">' + qWhere(l) + '</div></div>'; }).join('') + '</div>';
      }
    } else {
      var stops = questStops(q);
      if (stops.length) h += '<div class="panel"><div class="ph">🗣 Talk to <span class="ct">' + stops.length + '</span></div>' + stops.map(qStop).join('') + '</div>';
      h += parts;
    }
    if (!hasSeq && q.turnIn && q.turnIn.length) {
      h += '<div class="panel"><div class="ph">📦 Turn in</div>' + q.turnIn.map(function(t){
        return '<div class="qstop"><div class="qrow">' + qWhere(t.to) + '</div>' + qGiveGet(t.give, t.get)
          + (t.note ? '<div class="qrow"><span class="qk">' + esc(t.note) + '</span></div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    if (q.back && q.back.length) {
      h += '<div class="panel"><div class="ph">↩ Then go back to</div>'
        + q.back.map(function(l){ return '<div class="qstop"><div class="qrow">' + qWhere(l) + '</div></div>'; }).join('') + '</div>';
    }
    return h || '<div class="empty">Nothing more is recorded for this step.</div>';
  }
  // ── Quest navigation: era → plane → quest ──────────────────────────────────
  // Every step carries a hand-set `plane` (scripts/pop-quest-planes.js); the file carries `eras`, each with its
  // planes in block order. ◀ ▶ walk the steps of ONE plane in guide order; what they do at the end of it is
  // this one constant. 'stop' (picked as the default, Decision Desk 2026-10-19; the guild lead has not answered
  // the question): ▶ is disabled on the plane's last step and ◀ on its first. 'wrap' goes round to the other end
  // of the plane. 'hop' goes on into the next plane in block order (and stops at the last or first plane).
  var QUEST_PLANE_END = 'stop';
  var QB_WHO = { solo: 'Solo', group: 'Group', raid: 'Raid' };
  // The index of what the screens draw: eras → planes → the QUESTS indexes in each plane. A step whose plane the
  // file does not know (data from before planes) lands in an "Other steps" block of its own, so none is out of reach.
  function qBuildIndex(db, quests){
    var eras = [], planes = {}, order = [];
    (db.eras || []).forEach(function(e){
      var era = { key: e.key, title: e.title, planes: [] };
      (e.planes || []).forEach(function(p){
        planes[p.key] = { key: p.key, title: p.title, era: e.key, idxs: [], color: '' };
        era.planes.push(p.key); order.push(p.key);
      });
      eras.push(era);
    });
    var other = null;
    quests.forEach(function(e, i){
      var k = e.q.plane || '';
      if (!planes[k]) {
        if (!other) { other = { key: '', title: 'Other steps', planes: [] }; eras.push(other); }
        planes[k] = { key: k, title: k || 'Other steps', era: other.key, idxs: [], color: '' };
        other.planes.push(k); order.push(k);
      }
      planes[k].idxs.push(i);
      if (!planes[k].color && e.level && e.level.color) planes[k].color = e.level.color;
    });
    // A plane no step is in has nothing to draw: it is left out of the blocks.
    eras.forEach(function(era){ era.planes = era.planes.filter(function(k){ return planes[k].idxs.length; }); });
    return { eras: eras.filter(function(era){ return era.planes.length; }), planes: planes, order: order.filter(function(k){ return planes[k].idxs.length; }) };
  }
  // The QUESTS index ◀ (dir -1) or ▶ (dir 1) goes to from step i, or -1 when it cannot (the button is disabled).
  function qStepIdx(quests, idx, i, dir, rule){
    var e = quests[i];
    if (!e) return -1;
    var pl = idx.planes[e.q.plane || ''];
    if (!pl) return -1;
    var at = pl.idxs.indexOf(i), to = at + dir;
    if (to >= 0 && to < pl.idxs.length) return pl.idxs[to];
