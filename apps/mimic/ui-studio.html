  // ── Stage rendering ──────────────────────────────────────────────────────
  function renderStage(){
    // Compute canvas size to fit the stageWrap area while preserving aspect.
    var maxW = stageWrap.clientWidth  - 28;
    var maxH = stageWrap.clientHeight - 28;
    var rx = maxW / STATE.tgtW, ry = maxH / STATE.tgtH;
    STATE.sliceScale = Math.min(rx, ry, 1);
    var cw = Math.round(STATE.tgtW * STATE.sliceScale);
    var ch = Math.round(STATE.tgtH * STATE.sliceScale);
    stage.style.width  = cw + 'px';
    stage.style.height = ch + 'px';
    var html = '';
    var shown = 0;
    var items = [];
    for (var i = 0; i < STATE.windows.length; i++) {
      var w = STATE.windows[i];
      // Category filter — hidden groups are skipped on the canvas (Save still
      // writes them; this is view-only).
      if (!_catVisible(w.category)) continue;
      shown++;
      var sx = Math.round(w.x * STATE.sliceScale);
      var sy = Math.round(w.y * STATE.sliceScale);
      var sw = Math.max(8, Math.round(w.w * STATE.sliceScale));
      var sh = Math.max(8, Math.round(w.h * STATE.sliceScale));
      // Chat windows get a richer label: "WindowName (Chat #) · default ch X"
      // — the ChatManager-supplied name (when present) reads more naturally
      // than the position-section name ("Chat12" → "F THIS CHAT (Chat 12)").
      var lbl = w.label;
      if (w.kind === 'chat' && w.chatMeta) {
        var disp = w.chatMeta.name && w.chatMeta.name !== w.label ? w.chatMeta.name : w.label;
        var idx  = w.chatMeta.index;
        lbl = disp + (idx != null ? ' (Chat ' + idx + ')' : '');
      }
      items.push({ i: i, sx: sx, sy: sy, sw: sw, sh: sh, lbl: lbl, chars: lbl.length });
    }
    var dys = _labelDy(items);
    for (var k = 0; k < items.length; k++) {
      var it = items[k];
      i = it.i; w = STATE.windows[i];
      var sel = (STATE.selected === i) ? ' selected' : '';
      var kindCls = w.kind ? ' kind-' + w.kind : '';
      // A chat rectangle is a drop target for a routing chip unless it is a Tell
      // window (those route by sender — same rule as the cards).
      var cwin = _chatWinOfRect(STATE.windows, i);
      var dropCls = (cwin != null && w.chatMeta.defaultChannel !== 3) ? ' chat-drop' : '';
      html += '<div class="win' + sel + kindCls + dropCls + '" data-i="' + i + '"'
            + (cwin != null ? ' data-chat-win="' + cwin + '"' : '') + ' '
            + 'style="left:' + it.sx + 'px;top:' + it.sy + 'px;width:' + it.sw + 'px;height:' + it.sh + 'px;">'
            + '<span class="lbl"' + (dys[k] ? ' style="top:' + (2 + dys[k]) + 'px"' : '') + '>' + escapeHtml(it.lbl) + '</span>'
            + '<span class="sz">' + w.w + '×' + w.h + '</span>'
            + (STATE.selected === i && !w.fixedSize ? '<div class="grip se" data-grip="se"></div>' : '')
            + '</div>';
    }
    stage.innerHTML = html;
    updateSidePanel();
    _syncChatCardSelection();
  }
  window.addEventListener('resize', function(){ if (STATE.windows.length) renderStage(); });

  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  // ── Drag + resize ────────────────────────────────────────────────────────
  var DRAG = null;   // { i, mode, startX, startY, origX, origY, origW, origH }

  stage.addEventListener('mousedown', function(e){
    var el = e.target.closest('.win');
    if (!el) { STATE.selected = -1; renderStage(); return; }
    var i = parseInt(el.dataset.i, 10);
    STATE.selected = i;
    var grip = e.target.dataset.grip;
    var mode = grip ? 'resize-' + grip : 'move';
    DRAG = {
      i: i, mode: mode,
      startMx: e.clientX, startMy: e.clientY,
      origX: STATE.windows[i].x, origY: STATE.windows[i].y,
      origW: STATE.windows[i].w, origH: STATE.windows[i].h,
    };
    renderStage();
    e.preventDefault();
  });

  // A routing chip dragged from the Inspector can land on a chat rectangle. The
  // rectangles are rebuilt on every render, so listen on the stable #stage.
  var CHIP_MIME = 'application/x-wp-chatchip';
  function _dragIsChip(e) { return !!(e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, CHIP_MIME) >= 0); }
  function _clearChipHover() {
    var hot = stage.querySelectorAll('.chat-drop-hover');
    for (var i = 0; i < hot.length; i++) hot[i].classList.remove('chat-drop-hover');
  }
  stage.addEventListener('dragover', function(e){
    if (!_dragIsChip(e)) return;
    var el = e.target.closest('.win.chat-drop');
    _clearChipHover();
    if (!el) return;              // not a valid target (not chat, or a Tell window)
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('chat-drop-hover');
  });
  stage.addEventListener('dragleave', function(e){ if (e.target === stage) _clearChipHover(); });
  stage.addEventListener('drop', function(e){
    if (!_dragIsChip(e)) return;
    _clearChipHover();
    stage.classList.remove('chipDragging');
    var el = e.target.closest('.win.chat-drop');
    if (!el || !CHAT_ROUTER || !CHAT_ROUTER.live()) return;
    e.preventDefault();
    _dropChipOnWindow(e.dataTransfer.getData('text/plain'), parseInt(el.getAttribute('data-chat-win'), 10), CHAT_ROUTER.rowFor, CHAT_ROUTER.reroute);
  });
  document.addEventListener('dragend', function(){ _clearChipHover(); stage.classList.remove('chipDragging'); });
  // Esc clears the shared selection (not while a dialog owns Esc or a field has focus).
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (document.getElementById('displayPicker') || document.getElementById('snapPicker')) return;
    _clearSelection();
  });

  document.addEventListener('mousemove', function(e){
    if (!DRAG) return;
    var dx = (e.clientX - DRAG.startMx) / STATE.sliceScale;
    var dy = (e.clientY - DRAG.startMy) / STATE.sliceScale;
    var w = STATE.windows[DRAG.i];
    if (DRAG.mode === 'move') {
      w.x = Math.round(DRAG.origX + dx);
      w.y = Math.round(DRAG.origY + dy);
    } else if (DRAG.mode === 'resize-se') {
      w.w = Math.max(16, Math.round(DRAG.origW + dx));
      w.h = Math.max(16, Math.round(DRAG.origH + dy));
      w.sizeEdited = true;
    }
    // Snap-to-edges of other windows + screen edges (10px tolerance in
    // world coords). Only on move, not resize.
    if (STATE.snapOn && DRAG.mode === 'move') applySnap(w);
    // Clamp to screen bounds.
    if (w.x < 0) w.x = 0;
    if (w.y < 0) w.y = 0;
    if (w.x + w.w > STATE.tgtW) w.x = STATE.tgtW - w.w;
    if (w.y + w.h > STATE.tgtH) w.y = STATE.tgtH - w.h;
    renderStage();
  });

  document.addEventListener('mouseup', function(){ DRAG = null; });

  function applySnap(target) {
    var TOL = 10;  // world-pixel tolerance
    // Screen edges
    var edges = { x: [0, STATE.tgtW], y: [0, STATE.tgtH] };
    for (var i = 0; i < STATE.windows.length; i++) {
      if (i === DRAG.i) continue;
      var o = STATE.windows[i];
      edges.x.push(o.x, o.x + o.w);
      edges.y.push(o.y, o.y + o.h);
    }
    // Snap left edge and right edge to any candidate X.
    var bestL = TOL + 1, bestLval = null;
    var bestR = TOL + 1, bestRval = null;
    for (var k = 0; k < edges.x.length; k++) {
      var ex = edges.x[k];
      if (Math.abs(target.x - ex)               < bestL) { bestL = Math.abs(target.x - ex);               bestLval = ex; }
      if (Math.abs(target.x + target.w - ex)    < bestR) { bestR = Math.abs(target.x + target.w - ex);    bestRval = ex; }
    }
    if (bestL <= TOL) target.x = bestLval;
    else if (bestR <= TOL) target.x = bestRval - target.w;
    var bestT = TOL + 1, bestTval = null;
    var bestB = TOL + 1, bestBval = null;
    for (var k2 = 0; k2 < edges.y.length; k2++) {
      var ey = edges.y[k2];
      if (Math.abs(target.y - ey)               < bestT) { bestT = Math.abs(target.y - ey);               bestTval = ey; }
      if (Math.abs(target.y + target.h - ey)    < bestB) { bestB = Math.abs(target.y + target.h - ey);    bestBval = ey; }
    }
    if (bestT <= TOL) target.y = bestTval;
    else if (bestB <= TOL) target.y = bestBval - target.h;
  }

  // ── Side panel ───────────────────────────────────────────────────────────
  function updateSidePanel(){
    if (STATE.selected < 0) { side.className = ''; stageWrap.className = ''; return; }
    var w = STATE.windows[STATE.selected];
    side.className = 'on'; stageWrap.className = 'has-side';
    document.getElementById('sideTitle').textContent = w.label;
    document.getElementById('fX').value = w.x;
    document.getElementById('fY').value = w.y;
    document.getElementById('fW').value = w.w;
    document.getElementById('fH').value = w.h;
    // The assist bar's size is its text: nothing to type here.
    document.getElementById('fW').disabled = !!w.fixedSize;
    document.getElementById('fH').disabled = !!w.fixedSize;
    var meta = 'File: <b>' + escapeHtml(w.file) + '</b>'
             + '<br>Section: <b>' + escapeHtml(w.section) + '</b>'
             + '<br>Read from: <b>' + escapeHtml(w.zealBar ? 'Left/Top (Zeal screen pixels)' : (w.srcSuffix ? w.srcSuffix + ' block' : 'bare XPos/YPos')) + '</b>'
             + (w.hasWH ? '' : (w.sizeEdited
                  ? '<br><span style="color:#56d364">size pinned — Save writes Width/Height</span>'
                  : '<br><span style="color:#8b949e">auto-size (no Width/Height in the ini) — resize it here to pin one</span>'))
             + '<br>Original: ' + w.origX + ',' + w.origY + ' ' + w.origW + '×' + w.origH;
    if (w.contents && w.contents.length > 0) {
      meta += '<hr style="border:none;border-top:1px solid #30363d;margin:8px 0">'
            + '<div style="color:#7ee7c7;font-size:11px;margin-bottom:4px">Contains</div>';
      for (var ci = 0; ci < w.contents.length; ci++) {
        var c = w.contents[ci];
        meta += '<div style="margin-bottom:3px"><span style="color:#8b949e">' + escapeHtml(c.label) + ':</span> '
              + '<span style="color:#e6edf3;word-break:break-all">' + escapeHtml(c.value) + '</span></div>';
      }
    }
    document.getElementById('sideMeta').innerHTML = meta;
  }
  ['fX','fY','fW','fH'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      if (STATE.selected < 0) return;
      var w = STATE.windows[STATE.selected];
      var v = parseInt(this.value, 10) || 0;
      if (id === 'fX') w.x = v; else if (id === 'fY') w.y = v;
      else if (id === 'fW') { w.w = v; w.sizeEdited = true; } else if (id === 'fH') { w.h = v; w.sizeEdited = true; }
      renderStage();
      updateSidePanel();
    });
  });

  // ── Toolbar actions ──────────────────────────────────────────────────────
  document.getElementById('snapBtn').addEventListener('click', function(){
    STATE.snapOn = !STATE.snapOn;
    this.textContent = 'Snap: ' + (STATE.snapOn ? 'ON' : 'OFF');
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    for (var i = 0; i < STATE.windows.length; i++) {
      var w = STATE.windows[i];
      w.x = w.origX; w.y = w.origY; w.w = w.origW; w.h = w.origH;
      w.sizeEdited = false;
    }
    renderStage();
    setStatus('reset to last load', 'ok');
  });
  // What Save sends: KEY EDITS, [{ file, section, key, value }], not file texts
  // (the guild lead, 2026-10-05: "A for UI Studio"). Save used to rebuild whole
  // files from the copy read at Load, for every window, so positions EQ had
  // saved since — the ~50 bag windows the stage hides, a window moved in game —
  // were put back, and a save after logout overwrote EQ's own on-camp save.
  // Main now applies these to each file as it is on disk at write time (and as
  // EQ left it, for the deferred save), changing only the keys named.
  //
  // Default: only a window the user changed in this session — moved, or sized.
  // Two cases write EVERY window instead, because there the editor, not the
  // disk, is the layout (a window left out would have no place in the block):
  //   cloud   the bundle came from a cloud backup (📥 Restore), not this
  //           machine's files, so unchanged here is not unchanged on disk;
  //   rescale the block written (Target) is not the block the positions were
  //           read from (Source) — a layout rescaled to a new monitor must
  //           place every window.
  function _writeAllReason(tgtSuffix){
    if (STATE.fromCloud) return 'cloud';
    var srcSuffix = STATE.srcSuffix || (STATE.srcW + 'x' + STATE.srcH);
    if (srcSuffix !== tgtSuffix) return 'rescale';
    return '';
  }
  function _sizeChanged(w){
    return !!(w.sizeEdited || (w.hasWH && (w.w !== w.origW || w.h !== w.origH)));
  }
  function _windowChanged(w){
    return w.x !== w.origX || w.y !== w.origY || _sizeChanged(w);
  }
  // Writes into the TARGET resolution's suffix block (XPos<W>x<H>); main adds
  // the keys when absent and leaves other-resolution blocks alone.
  function _buildSaveEdits(){
    var tgtSuffix = STATE.tgtW + 'x' + STATE.tgtH;
    var all = _writeAllReason(tgtSuffix);
    var edits = [], files = {}, nWin = 0;
    for (var i = 0; i < STATE.windows.length; i++) {
      var w = STATE.windows[i];
      if (!all && !_windowChanged(w)) continue;
      var kv;
      if (w.zealBar) kv = _zealBarEdits(w);
      else {
        kv = {};
        kv['XPos' + tgtSuffix] = w.x;
        kv['YPos' + tgtSuffix] = w.y;
        // Never fabricate a size for a window the ini left auto-sizing — but a
        // window the user RESIZED here gets one, or the resize is a silent no-op:
        // A member + the guild lead, 2026-09-13, the Zeal item windows "defaulting to huge
        // tooltips" every time — their ini sections carried no Width/Height, so
        // every 100×200 set here was dropped on Save while the same edit on a
        // character whose ini had the keys stuck.
        // Changed-only mode writes a size only when the size changed; a window
        // that was merely moved keeps whatever size EQ has for it now.
        if (all ? (w.hasWH || w.sizeEdited) : _sizeChanged(w)) { kv.Width = w.w; kv.Height = w.h; }
      }
      for (var k in kv) edits.push({ file: w.file, section: w.section, key: k, value: kv[k] });
      files[w.file] = true;
      nWin++;
    }
    return { edits: edits, tgtSuffix: tgtSuffix, files: Object.keys(files), windows: nWin, all: all };
  }

  // Is this character currently logged in? We ask the agent's Zeal state — a
  // character with a live Zeal pipe is in-game right now.
  async function _isCharActiveInZeal(charLower){
    try {
      var r = await fetch('http://127.0.0.1:7779/api/state', { cache: 'no-store' });
      var s = await r.json();
      var clients = Array.isArray(s.zealClients) ? s.zealClients : [];
      return clients.some(function(c){ return c && String(c.character).toLowerCase() === charLower; });
    } catch (e) { return null; }   // null = unknown (agent not reachable)
  }

  async function _writeEdits(built, opts){
    var deferred = opts && opts.deferred;
    var tgtSuffix = built.tgtSuffix;
    var res = await window.mimic.uiStudioWriteEdits(STATE.eqDir, built.edits, deferred ? { backupTag: 'eq' } : null);
    if (!res || !res.ok) { setStatus('save failed: ' + (res && res.error ? res.error : 'unknown'), 'err'); return false; }
    var resWarn = '';
    try {
      var disp = await window.mimic.uiStudioListDisplays();
      if (disp && disp.primary && (disp.primary.w !== STATE.tgtW || disp.primary.h !== STATE.tgtH)) {
        resWarn = ' · ⚠ your monitor is ' + disp.primary.w + '×' + disp.primary.h +
          ' — set Target to that (🖥 Detect) or EQ reads a different block';
      }
    } catch (e2) {}
    // A file that is gone from the EQ folder is skipped, never re-created.
    var gone = (res.missing && res.missing.length) ? ' · ⚠ not found, skipped: ' + res.missing.join(', ') : '';
    var bad = resWarn || gone;
    var nFiles = (res.written || []).length;
    if (deferred) {
      setStatus('✅ applied ' + nFiles + ' file(s) now that ' + STATE.character +
        ' logged out — EQ\'s last copy backed up as .bak-eq. Log back in to see it.' + gone + resWarn, bad ? 'err' : 'ok');
    } else {
      setStatus('saved ' + nFiles + ' file(s) · ' + built.windows + ' window(s) · wrote ' + tgtSuffix +
        ' block · log the character in to apply (EQ reads positions at login)' + gone + resWarn, bad ? 'err' : 'ok');
    }
    return true;
  }

  // Deferred save: hold the edits and apply them automatically once the
  // character leaves the Zeal pipe (logged out) — at which point EQ has written
  // its final layout and won't clobber ours. The watcher runs in Mimic's
  // BACKGROUND process, so it works even after UI Studio is closed (and across
  // a Mimic restart). The renderer just queues/cancels and reflects status.
  async function _cancelDefer(silent){
    var cur = _deferTarget();
    try { if (cur) await window.mimic.uiStudioCancelDefer({ character: cur.character, eqDir: cur.eqDir }); } catch (e) {}
    var b = document.getElementById('deferBanner'); if (b) b.style.display = 'none';
    if (!silent) setStatus('scheduled save cancelled', 'ok');
    try { _layRefresh(); } catch (e2) {}
  }
  // The character the banner speaks for: the loaded one, else the one picked in the dropdown (a
  // queued layout switch needs no Load).
  function _deferTarget(){
    if (STATE.character && STATE.eqDir) return { character: STATE.character, eqDir: STATE.eqDir };
    return _selectedCharEqDir();
  }
  async function _queueDefer(built){
    // The queue holds the KEY EDITS, not file texts: they are merged into the
    // file as EQ leaves it on logout, so EQ's own save is never overwritten.
    var res = await window.mimic.uiStudioDeferSave({
      character: STATE.character, eqDir: STATE.eqDir, edits: built.edits, tgtSuffix: built.tgtSuffix,
    }).catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!res || !res.ok) { setStatus('could not schedule: ' + (res && res.error ? res.error : 'unknown'), 'err'); return; }
    _showDeferBanner();
    setStatus('scheduled — applies automatically when ' + STATE.character + ' logs out (you can close UI Studio)', 'ok');
  }
  // Reflect the background queue in the banner: show it if THIS character has a
  // pending save. Polled lightly + after actions so an applied/closed save
  // clears the banner.
  async function _showDeferBanner(){
    var b = document.getElementById('deferBanner'); if (!b) return;
    var list = [];
    try { list = await window.mimic.uiStudioPendingList(); } catch (e) {}
    var cur = _deferTarget();
    var mine = (list || []).filter(function(e){
      return cur && String(e.character).toLowerCase() === cur.character.toLowerCase() && e.eqDir === cur.eqDir;
    });
    var sw = mine.find(function(e){ return e.kind === 'layout'; });
    if (sw) {
      b.style.display = 'flex';
      b.querySelector('.txt').textContent = '⏳ Scheduled: the "' + (sw.layoutName || 'saved') + '" layout is put in place when ' +
        cur.character + ' logs out of EverQuest (the file it replaces is kept as .bak-eq). Background — safe to close UI Studio.';
    } else if (mine.length) {
      b.style.display = 'flex';
      b.querySelector('.txt').textContent = '⏳ Scheduled: your layout applies automatically when ' +
        cur.character + ' logs out of EverQuest. (Background — safe to close UI Studio.)';
    } else {
      b.style.display = 'none';
    }
  }
  setInterval(function(){ _showDeferBanner().catch(function(){}); }, 10000);

  // ── #187 Spell Sets bulk-swap ────────────────────────────────────────────
  // Replace one song/spell id with another across EVERY named set in the
  // character's *_spellsets.ini (loaded into STATE.bundle via the main.js glob).
  // Surgical, CRLF-preserving id-value replace — captures the trailing
  // whitespace as $2 so \r\n line endings survive; Save writes with a .bak.
  var _ssKey = null;      // the spellsets filename key in STATE.bundle
  var _ssNames = null;    // { id → name } from /api/spell-names.json
  var _ssNameId = null;   // { lowercasename → id } (inverse, resolves the "new" field)
  function _ssFindKey(){
    if (!STATE.bundle) return null;
    var ks = Object.keys(STATE.bundle);
    for (var i=0;i<ks.length;i++){ if (/spellsets.*\.ini$/i.test(ks[i])) return ks[i]; }
    return null;
  }
  async function _ssLoadNames(){
    if (_ssNames) return _ssNames;
    // /api/spell-names.json is id→name; /api/spells.json is name→id (wrong way
    // for showing the ids already in a set). Fetch the id→name and invert it.
    try { var r = await fetch('http://127.0.0.1:7779/api/spell-names.json', { cache:'no-store' });
      var map = r.ok ? await r.json() : null; _ssNames = (map && typeof map==='object') ? map : {}; }
    catch (e) { _ssNames = {}; }
    _ssNameId = {}; for (var _nid in _ssNames){ _ssNameId[String(_ssNames[_nid]).toLowerCase()] = _nid; }
    return _ssNames;
  }
  function _ssName(id){ return (_ssNames && _ssNames[id]) ? _ssNames[id] : ('spell '+id); }
  function _ssDistinctIds(text){
    var out={}, m, rx=/^\s*\d+\s*=\s*(\d+)\s*$/gm;
    while ((m=rx.exec(text))) out[m[1]] = (out[m[1]]||0)+1;
    return out;
  }
  function _ssReplace(text, oldId, newId){
    return text.replace(new RegExp('^(\\s*\\d+\\s*=\\s*)'+oldId+'(\\s*)$','gm'), '$1'+newId+'$2');
  }
  function _ssResolveNew(v){
    v = String(v||'').trim();
    var mid = v.match(/\(id\s+(\d+)\)/i); if (mid) return mid[1];   // "Name (id 1234)" from the datalist
    if (/^\d+$/.test(v)) return v;                                  // bare id
    if (_ssNameId){
      var lo=v.toLowerCase();
      if (_ssNameId[lo]) return _ssNameId[lo];                      // exact name
      for (var nm in _ssNameId){ if (nm.indexOf(lo)===0) return _ssNameId[nm]; }  // prefix match
    }
    return null;
  }
  function _ssAffected(text, oldId){
    var lines=text.split(/\r?\n/), slots=0, sets={}, cur=null;
    for (var i=0;i<lines.length;i++){
      var sm=lines[i].match(/^\s*\[(.+?)\]\s*$/); if (sm){ cur=sm[1]; continue; }
      var vm=lines[i].match(/^\s*\d+\s*=\s*(\d+)\s*$/);
      if (vm && vm[1]===String(oldId)){ slots++; if (cur) sets[cur]=1; }
    }
    return { slots:slots, sets:Object.keys(sets).length };
  }
  function _ssRefreshPreview(){
    var oldId=document.getElementById('ssOld').value;
    var newId=_ssResolveNew(document.getElementById('ssNew').value);
    var pv=document.getElementById('ssPreview');
    if (!oldId){ pv.textContent=''; return; }
    if (!newId){ pv.style.color='#f0883e'; pv.textContent='Type the new spell (name or id).'; return; }
    if (oldId===newId){ pv.style.color='#f0883e'; pv.textContent='Old and new are the same spell.'; return; }
    var a=_ssAffected(STATE.bundle[_ssKey], oldId);
    pv.style.color='#7ee7c7';
    pv.textContent='Replace '+_ssName(oldId)+' → '+_ssName(newId)+' in '+a.slots+' slot'+(a.slots===1?'':'s')+' across '+a.sets+' set'+(a.sets===1?'':'s')+'.';
  }
  async function _ssOpen(){
    // #187 — auto-load the picked character's bundle if the user hasn't clicked
    // Load + Rescale yet (they just want to swap spells, not rescale the UI).
    if (!STATE.bundle || !_ssFindKey()){
      var pick = document.getElementById('charSelect').value;
      if (pick && pick.indexOf('|') >= 0){
        var pp = pick.split('|');
        try { var b = await window.mimic.uiStudioReadBundle(pp[0], pp[1]);
          if (b && Object.keys(b).length){ STATE.character=pp[0]; STATE.eqDir=pp[1]; STATE.bundle=b; } } catch (e) {}
      }
    }
    _ssKey=_ssFindKey();
    if (!_ssKey){ setStatus('no *_spellsets.ini found — pick a character above first', 'err'); return; }
    await _ssLoadNames();
    var text=STATE.bundle[_ssKey], ids=_ssDistinctIds(text);
    var sel=document.getElementById('ssOld'); sel.innerHTML='';
    Object.keys(ids).map(function(id){ return { id:id, name:_ssName(id), count:ids[id] }; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); })
      .forEach(function(o){ var opt=document.createElement('option'); opt.value=o.id;
        opt.textContent=o.name+'  (id '+o.id+', '+o.count+' slot'+(o.count===1?'':'s')+')'; sel.appendChild(opt); });
    var dl=document.getElementById('ssCatalog'); dl.innerHTML='';
    if (_ssNames){ var cnt=0; for (var cid in _ssNames){ if (++cnt>5000) break; var o=document.createElement('option'); o.value=_ssNames[cid]+' (id '+cid+')'; dl.appendChild(o); } }
    document.getElementById('ssFileLine').textContent='Editing '+_ssKey+' — '+Object.keys(ids).length+' distinct spells across the sets.';
    document.getElementById('ssNew').value=''; document.getElementById('ssStatus').textContent='';
    _ssRefreshPreview();
    document.getElementById('ssModal').style.display='block';
  }
  async function _ssApply(){
    var oldId=document.getElementById('ssOld').value;
    var newId=_ssResolveNew(document.getElementById('ssNew').value);
    var st=document.getElementById('ssStatus');
    if (!oldId || !newId){ st.style.color='#f0883e'; st.textContent='Pick the old spell and a valid new spell.'; return; }
    if (oldId===newId){ st.style.color='#f0883e'; st.textContent='Old and new are the same spell.'; return; }
    var text=STATE.bundle[_ssKey], a=_ssAffected(text, oldId);
    if (a.slots===0){ st.style.color='#f0883e'; st.textContent='That spell is not in any set.'; return; }
    var out=_ssReplace(text, oldId, newId);
    STATE.bundle[_ssKey]=out;
    var one={}; one[_ssKey]=out;
    var res=await window.mimic.uiStudioWriteBundle(STATE.eqDir, one, null).catch(function(e){ return { ok:false, error:String(e) }; });
    if (res && res.ok){
      st.style.color='#7ee7c7';
      st.textContent='✅ '+_ssName(oldId)+' → '+_ssName(newId)+' in '+a.slots+' slot(s) across '+a.sets+' set(s). Saved '+_ssKey+' (.bak backup).';
      setStatus('spell sets updated', 'ok');
    } else {
      STATE.bundle[_ssKey]=text;   // revert in-memory on save failure
      st.style.color='#f85149'; st.textContent='Save failed: '+(res && res.error ? res.error : 'unknown');
    }
  }
  (function(){
    var b=document.getElementById('spellSetsBtn'); if (b) b.addEventListener('click', _ssOpen);
    var c=document.getElementById('ssClose'); if (c) c.addEventListener('click', function(){ document.getElementById('ssModal').style.display='none'; });
    var m=document.getElementById('ssModal'); if (m) m.addEventListener('click', function(ev){ if (ev.target===m) m.style.display='none'; });
    var ap=document.getElementById('ssApply'); if (ap) ap.addEventListener('click', _ssApply);
    var oo=document.getElementById('ssOld'); if (oo) oo.addEventListener('change', _ssRefreshPreview);
    var nn=document.getElementById('ssNew'); if (nn) nn.addEventListener('input', _ssRefreshPreview);
  })();

  // A cloud backup loaded into the editor (📥 Restore) is a deliberate restore, often onto a new PC
  // where the files may not exist yet: it keeps writing WHOLE files from the backup, rescaled, as
  // before. Only while the character is logged out — EQ would overwrite it on camp, and a restore
  // is not something to run unattended after logout, so there is no scheduling here.
  async function _saveCloudRestore(built){
    if (await _isCharActiveInZeal(STATE.character.toLowerCase())) {
      setStatus('log ' + STATE.character + ' out (or close EverQuest) first: restoring a backup replaces the files, and EQ would write over them when you camp', 'err');
      return;
    }
    var per = {};
    for (var i = 0; i < built.edits.length; i++) {
      var e = built.edits[i];
      ((per[e.file] = per[e.file] || {})[e.section] = per[e.file][e.section] || {})[e.key] = e.value;
    }
    var texts = {};
    for (var fname in per) {
      var parsed = STATE.bundle[fname + '__parsed'];
      if (parsed) texts[fname] = emitIni(parsed, per[fname]);
    }
    setStatus('restoring…');
    var res = await window.mimic.uiStudioWriteBundle(STATE.eqDir, texts, null).catch(function(err){ return { ok: false, error: String(err) }; });
    if (!res || !res.ok) { setStatus('restore failed: ' + (res && res.error ? res.error : 'unknown'), 'err'); return; }
    setStatus('restored ' + Object.keys(texts).length + ' file(s) from the backup · wrote ' + built.tgtSuffix +
      ' block · log the character in to apply (each replaced file was backed up as .bak)', 'ok');
  }

  document.getElementById('saveBtn').addEventListener('click', async function(){
    if (!STATE.character || !STATE.eqDir) { setStatus('nothing to save', 'err'); return; }
    var built = _buildSaveEdits();
    if (STATE.fromCloud) { try { await _saveCloudRestore(built); } catch (e) { setStatus('restore failed: ' + e.message, 'err'); } return; }
    if (!built.edits.length) { setStatus('nothing to save — no window was moved or resized since Load', 'ok'); return; }
    // Is the character logged in right now? If so, a plain Save won't apply
    // (EQ keeps the layout in memory, ignores it on a skin reload, and
    // overwrites the file on the next camp/zone/quit). Offer to schedule.
    var active = await _isCharActiveInZeal(STATE.character.toLowerCase());
    if (active) {
      var schedule = window.confirm(
        STATE.character + ' is logged into EverQuest right now.\n\n' +
        'EQ keeps the UI layout in memory while in-game and OVERWRITES this file\n' +
        'when the character camps / zones / quits — so saving now usually won\'t\n' +
        'stick, and a skin reload won\'t re-read it.\n\n' +
        'OK  = schedule it: apply automatically when ' + STATE.character + ' logs out\n' +
        '         (recommended — runs in the background; you can close UI Studio)\n' +
        'Cancel = save right now anyway');
      if (schedule) { _queueDefer(built); return; }
    }
    setStatus('saving…');
    try { await _writeEdits(built, { deferred: false }); }
    catch (e) { setStatus('save failed: ' + e.message, 'err'); }
  });
  document.getElementById('deferCancel').addEventListener('click', function(){ _cancelDefer(false); });

  // ── Named layouts (uiLayouts.js) ─────────────────────────────────────────
  // Several named screens per character. A layout is a saved copy of the character's UI_*.ini; the
  // main process keeps them, applies a switch (after logout when EQ is running) and uploads each
  // one to the cloud backups with its name in the label (Layout: <name>).
  var LAY = { items: [], cap: 10, hasCurrent: false };
  var LAY_PREFIX = 'Layout: ';
  function _layEl(id){ return document.getElementById(id); }
  function _layMsg(msg, cls){ var m = _layEl('layoutMsg'); m.textContent = msg || ''; m.className = cls || ''; }
  function _layPicked(){ var id = _layEl('layoutSelect').value; return LAY.items.find(function(i){ return i.id === id; }) || null; }
  function _layErr(r){ return r && r.error ? r.error : 'unknown error'; }
  function _layOptionText(i){
    var t = (i.live ? '● ' : '') + i.name;
    if (i.pending) t += '  ⏳ switch queued';
    else if (i.live) t += i.modified ? '  (live, changed since saved)' : '  (live)';
    else t += '  · saved ' + new Date(i.savedAt).toLocaleDateString();
    return t;
  }
  async function _layRefresh(keepId){
    var who = _selectedCharEqDir(), bar = _layEl('layoutBar');
    if (!who || !window.mimic || !window.mimic.uiStudioLayoutList) { bar.style.display = 'none'; return; }
    var r = await window.mimic.uiStudioLayoutList(who.character, who.eqDir).catch(function(e){ return { ok: false, error: e && e.message }; });
    bar.style.display = 'flex';
    var sel = _layEl('layoutSelect'), want = keepId || sel.value;
    sel.innerHTML = '';
    if (!r || !r.ok) { LAY.items = []; _layMsg('layouts unavailable: ' + _layErr(r), 'err'); _layEnable(); return; }
    LAY.items = r.layouts || []; LAY.cap = r.cap || 10; LAY.hasCurrent = !!r.hasCurrent;
    if (!LAY.items.length) {
      var none = document.createElement('option'); none.value = '';
      none.textContent = LAY.hasCurrent ? '— none yet: name one and Save current as… —' : '— no UI file for this character —';
      sel.appendChild(none);
    }
    LAY.items.forEach(function(i){
      var o = document.createElement('option'); o.value = i.id; o.textContent = _layOptionText(i); sel.appendChild(o);
    });
    var pick = LAY.items.find(function(i){ return i.id === want; }) || LAY.items.find(function(i){ return i.live; }) || LAY.items[0];
    if (pick) sel.value = pick.id;
    _layEnable();
  }
  function _layEnable(){
    var p = _layPicked();
    ['layoutSwitch', 'layoutUpdate', 'layoutBackup', 'layoutDelete', 'layoutRename'].forEach(function(id){ _layEl(id).disabled = !p; });
    _layEl('layoutSaveNew').disabled = !LAY.hasCurrent || LAY.items.length >= LAY.cap;
    _layEl('layoutSaveNew').title = LAY.items.length >= LAY.cap
      ? 'The most layouts per character is ' + LAY.cap + ' — delete one first'
      : 'Save the character\'s current UI files as a new named layout (also backs it up)';
  }
  async function _layBackup(id, quiet){
    var who = _selectedCharEqDir(); if (!who) return false;
    var r = await window.mimic.uiStudioCapture({ character: who.character, eqDir: who.eqDir, layoutId: id })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (r && r.ok) { if (!quiet) _layMsg('☁ backed up ' + r.file_count + ' file(s) to the cloud', 'ok'); return true; }
    if (!quiet) _layMsg('backup failed: ' + _layErr(r), 'err');
    return false;
  }
  _layEl('layoutSelect').addEventListener('change', _layEnable);
  document.getElementById('charSelect').addEventListener('change', function(){ _layEl('layoutName').value = ''; _layMsg(''); _layRefresh(); _showDeferBanner().catch(function(){}); });
  window.addEventListener('focus', function(){ _layRefresh().catch(function(){}); });

  _layEl('layoutSaveNew').addEventListener('click', async function(){
    var who = _selectedCharEqDir(); if (!who) return;
    var name = _layEl('layoutName').value;
    if (!name.trim()) { _layMsg('type a name for the layout first', 'err'); return; }
    var r = await window.mimic.uiStudioLayoutSave({ character: who.character, eqDir: who.eqDir, name: name })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg(_layErr(r), 'err'); return; }
    _layEl('layoutName').value = '';
    var up = await _layBackup(r.layout.id, true);
    await _layRefresh(r.layout.id);
    _layMsg('saved "' + r.layout.name + '" (' + r.layout.fileCount + ' file(s))' + (up ? ' · ☁ backed up' : ' · ⚠ cloud backup failed — use ☁ Back up'), up ? 'ok' : 'err');
  });
  _layEl('layoutUpdate').addEventListener('click', async function(){
    var who = _selectedCharEqDir(), p = _layPicked(); if (!who || !p) return;
    // The copy comes from the UI file on disk right now; say when EverQuest last wrote it.
    var info = await window.mimic.uiStudioLiveInfo(who.character, who.eqDir).catch(function(){ return null; });
    var when = _fileTimeText(info && info.ok && info.newestMs);
    if (!window.confirm('Replace the saved layout "' + p.name + '" with ' + who.character + '\'s current UI files?' +
        (when ? '\n\nThe UI file on disk was last written ' + when + '.' : ''))) return;
    var r = await window.mimic.uiStudioLayoutSave({ character: who.character, eqDir: who.eqDir, id: p.id })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg(_layErr(r), 'err'); return; }
    var up = await _layBackup(p.id, true);
    await _layRefresh(p.id);
    _layMsg('updated "' + p.name + '"' + (when ? ' from the UI file written ' + when : '') +
      (up ? ' · ☁ backed up' : ' · ⚠ cloud backup failed — use ☁ Back up'), up ? 'ok' : 'err');
  });
  _layEl('layoutRename').addEventListener('click', async function(){
    var who = _selectedCharEqDir(), p = _layPicked(); if (!who || !p) return;
    var name = _layEl('layoutName').value;
    if (!name.trim()) { _layMsg('type the new name in the box first', 'err'); return; }
    var r = await window.mimic.uiStudioLayoutRename({ character: who.character, id: p.id, name: name })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg(_layErr(r), 'err'); return; }
    _layEl('layoutName').value = '';
    await _layRefresh(p.id);
    _layMsg('renamed to "' + r.layout.name + '" · ☁ Back up to put the new name on the cloud copy', 'ok');
  });
  _layEl('layoutDelete').addEventListener('click', async function(){
    var who = _selectedCharEqDir(), p = _layPicked(); if (!who || !p) return;
    if (!window.confirm('Delete the layout "' + p.name + '" from this computer?\n\nCloud backups of it stay; the UI files EQ is using now are not touched.')) return;
    var r = await window.mimic.uiStudioLayoutDelete({ character: who.character, id: p.id })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg(_layErr(r), 'err'); return; }
    await _layRefresh(); _showDeferBanner().catch(function(){});
    _layMsg('deleted "' + p.name + '"', 'ok');
  });
  _layEl('layoutBackup').addEventListener('click', async function(){
    var p = _layPicked(); if (!p) return;
    _layMsg('uploading…'); await _layBackup(p.id, false);
  });
  _layEl('layoutSwitch').addEventListener('click', async function(){
    var who = _selectedCharEqDir(), p = _layPicked(); if (!who || !p) return;
    if (p.live && !p.modified && !p.pending) { _layMsg('"' + p.name + '" is already the live layout', 'ok'); return; }
    // Anything on disk that is not a saved layout is replaced (a .bak copy is kept) — say so first.
    var unsaved = LAY.hasCurrent && !LAY.items.some(function(i){ return i.live && !i.modified; });
    if (unsaved && !window.confirm(who.character + '\'s current UI is not saved as a layout (or has changed since you saved it).\n\n' +
        'Switching replaces it with "' + p.name + '". The old file is kept as a .bak copy beside it.\n\nSwitch anyway?')) return;
    var r = await window.mimic.uiStudioLayoutSwitch({ character: who.character, eqDir: who.eqDir, id: p.id })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg(_layErr(r), 'err'); return; }
    await _layRefresh(p.id); _showDeferBanner().catch(function(){});
    if (r.queued) _layMsg('⏳ "' + r.name + '" is queued — it goes in when ' + who.character + ' logs out (EverQuest is running)', 'ok');
    else _layMsg('✅ switched to "' + r.name + '" (' + r.written.length + ' file(s), the old ones kept as .bak) · log in to see it' +
      (STATE.character && STATE.character.toLowerCase() === who.character.toLowerCase() ? ' · click Load + Rescale to see it here' : ''), 'ok');
  });

  // Layouts that were backed up under a name can come back on another computer.
  _layEl('layoutImport').addEventListener('click', async function(){
    var who = _selectedCharEqDir();
    if (!who) { _layMsg('pick a character first', 'err'); return; }
    _layMsg('fetching cloud backups…');
    var r = await window.mimic.uiStudioListSnapshots(who.character).catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok) { _layMsg('could not list backups: ' + _layErr(r), 'err'); return; }
    var seen = {}, snaps = (r.snapshots || []).filter(function(s){
      var l = String(s.label || ''); if (l.indexOf(LAY_PREFIX) !== 0 || seen[l]) return false; seen[l] = 1; return true;
    });

  async function _doCloudRestore(who, id, snapSrcW, snapSrcH){
    setStatus('downloading backup…');
    var r = await window.mimic.uiStudioGetSnapshot({ character: who.character, id: id })
      .catch(function(e){ return { ok: false, error: e && e.message }; });
    if (!r || !r.ok || !r.files) { setStatus('download failed: ' + (r && r.error ? r.error : 'unknown'), 'err'); return; }
    // Establish editor context from the snapshot + the picked character.
    STATE.character = who.character;
    STATE.eqDir     = who.eqDir;
    STATE.bundle    = r.files;
    // Source resolution: prefer the snapshot's captured display size, then the
    // value already in the Source inputs. _renderLoadedBundle's resolution
    // auto-detect will still correct this to whatever block the INI actually
    // contains, so it's just a starting hint.
    var sW = snapSrcW || r.source_width  || parseInt(document.getElementById('srcW').value, 10) || 2560;
    var sH = snapSrcH || r.source_height || parseInt(document.getElementById('srcH').value, 10) || 1440;
    STATE.srcW = sW; STATE.srcH = sH;
    document.getElementById('srcW').value = sW;
    document.getElementById('srcH').value = sH;
    _syncPresetFromInputs('src');
    // Target stays whatever the user set (they should 🖥 Detect their new monitor).
    STATE.tgtW = parseInt(document.getElementById('tgtW').value, 10) || sW;
    STATE.tgtH = parseInt(document.getElementById('tgtH').value, 10) || sH;
    STATE.fromCloud = true;
    STATE.selected = -1;
    _renderLoadedBundle();
  }

  // ── Chat channel names (ChannelMap<N> in UI_<char> [ChatManager]) ────────
  // ⚠ ChannelMap<N> is NOT a USERCOLOR id and NOT a made-up 0..24 list (the
  // table that used to live here named id 4 "Auction" and id 6 "Guild", the
  // opposite of the guild lead's own windows, 2026-10-14). N is the position in
  // the client's chat-filter menu — the same number the context-menu item id
  // carries minus 100. Sources:
  //   0..40   MacroQuest eqlib include/eqlib/game/ChatFilters.h, enum
  //           eChatChannel (CONTEXT_FILTER_* = 100 + N). The standard EQ filter
  //           list is 41 long on the Quarm client: Zeal's chatfilter.cpp has
  //           ChannelMapWnd[0x29], ChannelMap40 = 0x28 and FILTER_OFFSET 0x64.
  //   41..56  Zeal Zeal/chatfilter.cpp Extended_ChannelMaps, saved as
  //           ChannelMap41 + list index ("Keep new entries at the end").
  // Checked against in-game Filters menus (the guild lead's screenshots): the
  // Auction window = 6 + user channels 13..16; "other's melee" = 26, 27 plus
  // Zeal 46, 47, 50, 53, 54, 55. Groups use the in-game menu's own headings;
  // item wording is eqlib's. An id no source confirms stays "Ch N".
  // rows: [id, group, name]   (group '' = a top-level menu item)
  var CHAT_CHANNEL_ROWS = [
    [0,'','Say'], [1,'','Tell'], [2,'','Group'], [3,'','Raid'], [4,'','Guild'],
    [5,'','OOC'], [6,'','Auction'], [7,'','Shout'], [8,'','Emotes'],
    [9,'Melee','Your hits'], [10,'Spells','Mine'], [11,'','Skills'],
    [12,'Chat Channel',''], [13,'Chat Channel',''], [14,'Chat Channel',''], [15,'Chat Channel',''], [16,'Chat Channel',''],
    [17,'Chat Channel',''], [18,'Chat Channel',''], [19,'Chat Channel',''], [20,'Chat Channel',''], [21,'Chat Channel',''],
    [22,'','Other'],
    [23,'Melee','Your misses'], [24,'Melee','Hits on you'], [25,'Melee','Misses on you'],
    [26,'Melee',"Others' hits"], [27,'Melee',"Others' misses"],
    [28,'Melee','Your death'], [29,'Melee',"Others' deaths"], [30,'Melee','Critical hits'],
    [31,'Melee','Disciplines'], [32,'Melee','Warnings'],
    [33,'Melee','NPC rampage'], [34,'Melee','NPC flurry'], [35,'Melee','NPC enrage'],
    [36,'Spells','Others'], [37,'Spells','Failures'], [38,'Spells','Criticals'],
    [39,'Spells','Worn off'], [40,'Spells','Non-melee hits'],
    [41,'Zeal','Random'], [42,'Zeal','Loot'], [43,'Zeal','Money'],
    [44,'Zeal','My Pet Say'], [45,'Zeal','My Pet Damage'],
    [46,'Zeal','Other Pet Say'], [47,'Zeal','Other Pet Damage'],
    [48,'Zeal','/who'], [49,'Zeal','My Melee Special'], [50,'Zeal','Other Melee Special'],
    [51,'Zeal','/mystats'], [52,'Zeal','Item Speech'], [53,'Zeal','Other Melee Critical'],
    [54,'Zeal','Other Damage Shield'], [55,'Zeal','Zeal Spam'], [56,'Zeal','Bandolier'],
  ];
  var CHAT_CHANNEL_BY_ID = {};
  for (var _ccr = 0; _ccr < CHAT_CHANNEL_ROWS.length; _ccr++) CHAT_CHANNEL_BY_ID[CHAT_CHANNEL_ROWS[_ccr][0]] = CHAT_CHANNEL_ROWS[_ccr];
  // `joined` = the character's /join names in slot order (optional). Slot k
  // (id 12 + k) is the (k+1)th entry; without a name it reads "Chat channel k+1".
  function _chatChannelInfo(n, joined) {
    var row = CHAT_CHANNEL_BY_ID[n];
    if (!row) return { id: n, known: false, text: 'Ch ' + n, title: 'unknown channel id (ChannelMap' + n + ')' };
    var group = row[1], name = row[2], text, title;
    if (group === 'Chat Channel') {
      var slot = n - 12;
      var jn = joined && joined[slot] ? String(joined[slot]) : '';
      text = jn ? 'Chat Channel · ' + jn : 'Chat channel ' + (slot + 1);
      title = text + (jn ? ' (slot ' + (slot + 1) + ', from your ChannelAutoJoin order)' : ' (a /join slot; name not known)');
    } else {
      text = group ? group + ' · ' + name : name;
      title = text;
    }
    return { id: n, known: true, group: group, name: name, text: text,
      title: title + ' — ChannelMap' + n + (n >= 41 ? ' (Zeal)' : '') };
  }
  // The chip body: the name, then the id as a small dim suffix. Unknown ids
  // already read "Ch N", so they get no second copy.
  function _chatChipInner(n, joined) {
    var inf = _chatChannelInfo(n, joined);
    return escapeHtml(inf.text) + (inf.known ? ' <span class="chId" style="color:#6e7681;font-size:9px">' + n + '</span>' : '');
  }
  // The "default:" pill. ChatWindow<N>_DefaultChannel is a different list from
  // ChannelMap; only 3 = Tell is sourced (Zeal creates its tell windows with
  // default channel 3). Anything else says so rather than guessing.
  function _defaultChannelInfo(n) {
    if (n == null || isNaN(n)) return { text: '—', title: 'no default channel' };
    if (n === 3) return { text: 'Tell', title: 'default channel 3 = Tell (Zeal creates tell windows with it)' };
    return { text: 'Ch ' + n, title: 'default channel id ' + n + ' — name not confirmed' };
  }
  // ── /Chat channel names ───────────────────────────────────────────────────

  // ── Chat window ↔ layout link ─────────────────────────────────────────────
  // ONE selection state: STATE.selected (the rectangle). A chat card is "selected"
  // exactly when the selected rectangle is that chat window, so selecting from
  // either side is the same assignment and both sides repaint from it.
  // Routing from the layout reuses the card's own reroute (_rerouteChip) through
  // CHAT_ROUTER — the layout has no write path of its own.
  var CHAT_ROUTER = null;   // set by openSocialsInspector: { live(), rowFor(win), reroute(filter, fromWin, toWin, row) }
  function _parseChipDrop(raw) {
    var d; try { d = JSON.parse(raw); } catch (er) { return null; }
    if (!d || !isFinite(d.filter) || !isFinite(d.fromWin)) return null;
    return { filter: d.filter, fromWin: d.fromWin };
  }
  // Shared by the card rows and the layout rectangles. rowFor(toWin) returns the
  // target card's chip row (data-drop="1" for a normal window, "0" for a Tell
  // window, nothing when that window is not in the inspector).
  function _dropChipOnWindow(raw, toWin, rowFor, reroute) {
    var d = _parseChipDrop(raw); if (!d) return false;
    var row = rowFor(toWin);
    if (!row || row.getAttribute('data-drop') !== '1') return false;   // tell windows route by sender
    if (d.fromWin === toWin) return false;
    reroute(d.filter, d.fromWin, toWin, row);
    return true;
  }
  function _chatWinOfRect(windows, i) {
    var w = windows[i];
    return (w && w.kind === 'chat' && w.chatMeta && w.chatMeta.index != null) ? w.chatMeta.index : null;
  }
  function _rectOfChatWin(windows, idx, file) {
    var any = -1;
    for (var i = 0; i < windows.length; i++) {
      if (_chatWinOfRect(windows, i) !== idx) continue;
      if (file == null || windows[i].file === file) return i;
      if (any < 0) any = i;
    }
    return any;
  }
  function _selectChatWindow(idx, file) {
    var i = _rectOfChatWin(STATE.windows, idx, file);
    if (i < 0) return false;
    STATE.selected = i;
    renderStage();
    return true;
  }
  function _clearSelection() {
    if (STATE.selected < 0) return false;
    STATE.selected = -1;
    renderStage();
    return true;
  }
  // Paint the inspector's cards from STATE.selected; scroll + flash only when the
  // selected chat window CHANGES (renderStage runs on every drag tick).
  function _syncChatCardSelection() {
    var sel = _chatWinOfRect(STATE.windows, STATE.selected);
    var cards = document.querySelectorAll('#socialsInspector .chatCard');
    for (var i = 0; i < cards.length; i++) {
      var on = sel != null && parseInt(cards[i].getAttribute('data-win'), 10) === sel;
      cards[i].classList.toggle('chatSel', on);
      if (on && STATE.chatSelShown !== sel) {
        if (cards[i].scrollIntoView) cards[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        cards[i].classList.remove('chatFlash'); void cards[i].offsetWidth; cards[i].classList.add('chatFlash');
      }
    }
    STATE.chatSelShown = sel;
  }
  // Stacked windows (same corner) draw their titles on top of each other. Push a
  // title down a line while it would land on an earlier one. items: [{sx,sy,sw,sh,chars}].
  function _labelDy(items) {

    // ── Tell windows (Zeal) ───────────────────────────────────────────────

      }

      // sections, which is what made the inspector look "incomplete".

      html += '<details style="margin-top:8px;background:#0d1117;border:1px solid #21262d;border-radius:3px;padding:4px 6px">' +
        '<summary style="color:#8b949e;cursor:pointer;font-family:sans-serif;font-size:10px">▸ raw section dump (' + sections.length + ' sections)</summary>';
      for (var s = 0; s < Math.min(sections.length, 60); s++) {
        var sec = sections[s];
        var propKeys = Object.keys(sec.props);
        html += '<details style="margin:3px 0 3px 6px;background:#0d1117;border:1px solid #21262d;border-radius:3px;padding:4px 6px">' +
          '<summary style="color:#79c0ff;cursor:pointer">[' + escapeHtml(sec.name) + '] ' +

      // The ONE reroute. A card-row drop and a layout-rectangle drop both land

      function _rerouteChip(filter, fromWin, toWin, row){

          // If the source row is now empty, restore its placeholder.
          var fromRow = chatBlock.querySelector('.chatChipRow[data-win="' + fromWin + '"]');
          if (fromRow && fromRow.querySelectorAll('.chatChip').length === 0) {
            fromRow.innerHTML = '<span style="color:#6e7681;font-size:10px;font-style:italic">no routed channels</span>';
          }

        live: function(){ return chatBlock.isConnected; },
        rowFor: function(win){ return chatBlock.querySelector('.chatChipRow[data-win="' + win + '"]'); },
        reroute: _rerouteChip,

    _wireChat();

    // ── Macro-suggestion staging ─────────────────────────────────────────
    // 'P|B' → { name, page, btn, edits: [{file,section,key,value}] }. Folded
    // into the same writePages call as field edits + chat routing on Save.
    var _sugStaged = new Map();
    function _sugRefreshSlots(){
      var free = _emptySlots().filter(function(k){ return !_sugStaged.has(k); });
      var sels = dlg.querySelectorAll('.sugSlot');

    function _sugRenderQueued(){
      var qEl = document.getElementById('sugQueued');
      if (!qEl) return;
      if (_sugStaged.size === 0) { qEl.innerHTML = ''; return; }
      var qh = '<div style="color:#f6c365;font-size:10px;font-family:sans-serif;margin-bottom:2px">Queued — written on Save changes:</div>';
      _sugStaged.forEach(function(v, k){
        qh += '<div style="display:flex;align-items:center;gap:6px;font-size:10px;color:#c9d1d9;padding:1px 0">' +
          '<span style="color:#56d364">' + escapeHtml(v.name) + '</span> → Page ' + v.page + ' · Button ' + v.btn +
          ' <button class="sugRemove" data-slot="' + escapeHtml(k) + '" title="Un-queue"' +
          ' style="background:none;border:none;color:#f87171;cursor:pointer;font-size:11px;padding:0 3px;line-height:1">×</button></div>';
      });
      qEl.innerHTML = qh;
      var rms = qEl.querySelectorAll('.sugRemove');
      for (var ri2 = 0; ri2 < rms.length; ri2++) {
        rms[ri2].addEventListener('click', function(){
          _sugStaged.delete(this.getAttribute('data-slot'));
          _sugRenderQueued(); _sugRefreshSlots(); refreshSaveBtn();
        });
      }
    }
    var qBtns = dlg.querySelectorAll('.sugQueue');
    for (var qi = 0; qi < qBtns.length; qi++) {
      qBtns[qi].addEventListener('click', function(){
        var id = this.getAttribute('data-sug');
        var sg = null;
        for (var mi2 = 0; mi2 < MACRO_SUGGESTIONS.length; mi2++) if (MACRO_SUGGESTIONS[mi2].id === id) sg = MACRO_SUGGESTIONS[mi2];
        if (!sg || typeof _sugTargetFile === 'undefined' || !_sugTargetFile) return;
        var sel = dlg.querySelector('.sugSlot[data-sug="' + id + '"]');
        var slot = sel && sel.value;
        if (!slot) { setStatus('no empty social slot left to queue into', 'err'); return; }
        if (_sugStaged.has(slot)) return;
        var pb = slot.split('|');
        var base = 'Page' + pb[0] + 'Button' + pb[1];
        var eds = [
          { file: _sugTargetFile, section: 'Socials', key: base + 'Name',  value: sg.btnName },
          { file: _sugTargetFile, section: 'Socials', key: base + 'Color', value: '0' },
        ];
        for (var li2 = 0; li2 < sg.lines.length; li2++) {
          eds.push({ file: _sugTargetFile, section: 'Socials', key: base + 'Line' + (li2 + 1), value: sg.lines[li2] });
        }
        _sugStaged.set(slot, { name: sg.btnName, page: pb[0], btn: pb[1], edits: eds });
        _sugRenderQueued(); _sugRefreshSlots(); refreshSaveBtn();
        setStatus('queued "' + sg.btnName + '" → Page ' + pb[0] + ' Button ' + pb[1] + ' — remember to replace {PLACEHOLDERS}, then Save changes', 'ok');
      });
    }
    _sugRefreshSlots();

    saveBtn.addEventListener('click', async function(){
      if (saveBtn.disabled) return;
      // EQ rewrites the character INI from memory on /camp — anything we write
      // while the client is up gets clobbered (or half-merged). The layout
      // save path defers around this; for socials/hotbutton/chat edits we
      // simply block and KEEP the staged edits so Save works the moment the
      // character logs out.
      try {
        var eqUp = await window.mimic.uiStudioIsEqRunning();
        if (eqUp) {
          setStatus('EQ is running — log the character out first. EQ rewrites this INI from memory on /camp, which would clobber these edits. Your changes are still staged; hit Save again once logged out.', 'err');
          return;
        }
      } catch (e) { /* detection unavailable → proceed as before */ }
      // Collect dirty edits — for blanked-out Line slots we send value=null so
      // the backend deletes the key. For all other fields we send the new value.
      var edits = [];
      var inputs2 = dlg.querySelectorAll('.uiEdit');
      for (var i = 0; i < inputs2.length; i++) {
        var inp = inputs2[i];
        if (!isDirty(inp)) continue;
        var v = inp.value;
        if (v === '' && inp.dataset.wasSet === '1') v = null;
        edits.push({
          file:    inp.getAttribute('data-file'),
          section: inp.getAttribute('data-section'),
          key:     inp.getAttribute('data-key'),
          value:   v,
        });
      }
      // Fold the staged chat-routing edits (drag-drop, X, ★) into the same
      // writePages call. All ChatManager edits go to the UI_<char> file.
      var chatF = _chatFile();
      if (chatF && _chatEdits.size > 0) {
        for (var ce of _chatEdits.values()) {
          edits.push({ file: chatF, section: ce.section, key: ce.key, value: ce.value });
        }
      }
      // Queued macro suggestions — each expands to Name/Color/Line keys for
      // its (empty) target slot.
      if (_sugStaged.size > 0) {
        _sugStaged.forEach(function(v){
          for (var se = 0; se < v.edits.length; se++) edits.push(v.edits[se]);
        });
      }
      if (edits.length === 0) return;
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      try {
        var res = await window.mimic.uiStudioWritePages(STATE.eqDir, edits);
        if (!res || !res.ok) {
          setStatus('save failed: ' + (res && res.error || 'unknown'), 'err');
          saveBtn.textContent = 'Save changes'; refreshSaveBtn();
          return;
        }
        setStatus(edits.length + ' edit' + (edits.length === 1 ? '' : 's') + ' saved · ' +
          (res.written || []).map(function(w){ return w.file; }).join(', '), 'ok');
        saveBtn.textContent = 'Saved ✓';
        // What is on disk now is what the editor shows: nothing is unsaved any more, so reopening
        // (and clicking elsewhere) must not ask about it.
        _hbMarkSaved();
        // A window added or deleted changed which section is which chat window, so the layout is re-read
        // from the files; otherwise its rectangles would still be the old numbering.
        var reload = _chatStructural && !STATE.fromCloud;
        _chatStructural = false;
        // Re-open the inspector to refresh data-orig from disk so further
        // edits diff against the new baseline.
        setTimeout(async function(){
          try { if (reload) await loadAndRescale(); } catch (e) {}
          try { document.getElementById('inspectSocialsBtn').click(); } catch (e) {}
        }, 600);
      } catch (err) {
        setStatus('save error: ' + (err && err.message), 'err');
        saveBtn.textContent = 'Save changes'; refreshSaveBtn();
      }
    });
  }
</script>
</body></html>
